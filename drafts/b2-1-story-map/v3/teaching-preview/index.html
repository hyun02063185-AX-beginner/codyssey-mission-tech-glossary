<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2-1 Story v3.3 강의 미리보기</title>
<style>
:root{
  --bg:#FBFAF7; --ink:#14161A; --muted:#5E626B; --faint:#8A8D93; --line:#D9D7D0; --chip:#EEECE6; --chip-h:#E4E1D8; --panel:#FFFFFF;
  --accent:#D9480F; --accent-soft:#FDEBE1;
  --py:#1F5FBF; --py-soft:#E3ECFA; --app:#0B7A55; --app-soft:#DDF2E9;
  --real:#6B4E16; --real-soft:#F6EEDC;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"SF Mono","Menlo","Consolas","D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
code{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
svg{display:block}
.app{height:100vh;display:flex;flex-direction:column;padding:22px 48px 8px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ctx{font-size:14px;color:var(--muted);letter-spacing:.02em}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--muted)}
.tag.real{background:var(--real-soft);color:var(--real)}
h1{margin:4px 0 0;font-size:30px;line-height:1.3;font-weight:800;width:100%}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.say{margin:0;min-height:84px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:25px;line-height:1.45;font-weight:600;border-top:2px solid var(--ink);padding:10px 32px 2px}
.say code{font-size:.92em}

/* ---------- 공통 ---------- */
.hit{cursor:pointer}
.hit[aria-disabled="true"]{cursor:default}
.reveal{font-size:15px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px}
.reveal:hover{color:var(--ink);border-color:var(--muted)}
.arrow-h{flex:none;width:44px;height:16px;position:relative}
.arrow-h::before{content:"";position:absolute;left:0;right:12px;top:6px;height:4px;background:var(--ink);border-radius:2px}
.arrow-h::after{content:"";position:absolute;right:0;top:0;border-left:16px solid var(--ink);border-top:8px solid transparent;border-bottom:8px solid transparent}
.arrow-v{flex:none;width:16px;height:30px;position:relative;margin:0 auto}
.arrow-v::before{content:"";position:absolute;top:0;bottom:12px;left:6px;width:4px;background:var(--ink);border-radius:2px}
.arrow-v::after{content:"";position:absolute;bottom:0;left:0;border-top:16px solid var(--ink);border-left:8px solid transparent;border-right:8px solid transparent}

/* ---------- Scene 01 F1: GUI·CLI ---------- */
.f1{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.ask{font-size:22px;font-weight:700;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:8px 22px}
.f1-row{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:100%;max-width:1060px}
.way{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:18px;border:4px solid transparent;background:var(--chip)}
.way[aria-pressed="true"]{border-color:var(--accent);background:var(--panel)}
.way .cap{font-size:24px;font-weight:800}
.way .cap span{font-weight:600;color:var(--muted);font-size:19px}
.way[aria-pressed="true"] .cap{color:var(--accent)}
.win{width:100%;max-width:400px;height:170px;background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.win-bar{height:30px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;color:var(--muted)}
.win-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.win-body{display:flex;align-items:center;justify-content:center;gap:16px;height:136px;font-size:20px}
.fake-btn{background:var(--ink);color:#fff;border-radius:10px;padding:12px 20px;font-weight:700}
.fake-sel{border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.fake-sel b{font-family:var(--mono);margin-left:6px}
.term{width:100%;max-width:440px;height:170px;background:#1C2333;border-radius:12px;display:flex;align-items:center;padding:0 20px;color:#E8ECF3;font-family:var(--mono);font-size:21px;font-weight:700;white-space:nowrap}
.term::before{content:"$ ";color:#7D879A;white-space:pre}

/* ---------- Scene 01 명령 구조 (F2·F3·적용·정리) ---------- */
.cmdfig{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.cmd{display:flex;align-items:flex-start;gap:18px}
.grp{display:flex;flex-direction:column;align-items:stretch}
.glabel{visibility:hidden;text-align:center;padding:4px 10px 10px;margin-bottom:12px;border-bottom:4px solid transparent}
.glabel b{display:block;font-size:22px}
.glabel span{display:block;font-size:16px;color:var(--muted);margin-top:2px}
.parts{display:flex;gap:18px}
.part{display:flex;flex-direction:column;align-items:center;gap:10px}
.part code{display:block;font-size:56px;font-weight:700;line-height:1;padding:22px 24px;border-radius:14px;background:var(--chip);white-space:nowrap}
.part .lbl{font-size:25px;font-weight:800;white-space:nowrap}
.part .mean{visibility:hidden;font-size:19px;white-space:nowrap;min-height:1.4em}
.part .term-chip{visibility:hidden;font-size:15px;font-weight:800;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:1px 10px}
.part:hover code{background:var(--chip-h)}
.part[aria-pressed="true"] code{background:var(--accent);color:#fff}
.part[aria-pressed="true"] .lbl{color:var(--accent)}
.part[aria-pressed="true"] .mean{visibility:visible}
.part.opt .term-chip{visibility:visible}
.handoff{display:none;flex:none;width:150px;flex-direction:column;align-items:center;align-self:center;margin-top:76px}
.handoff .arrow-h{width:100%}
.handoff .arrow-v{display:none}
.handoff .txt{font-size:16px;line-height:1.35;text-align:center;margin-top:8px;font-weight:700}
.cmdfig.who .glabel{visibility:visible}
.cmdfig.who .grp[data-grp="py"] .glabel{border-color:var(--py)}
.cmdfig.who .grp[data-grp="app"] .glabel{border-color:var(--app)}
.cmdfig.who .grp[data-grp="py"] .glabel b{color:var(--py)}
.cmdfig.who .grp[data-grp="app"] .glabel b{color:var(--app)}
.cmdfig.who .grp[data-grp="py"] .part code{background:var(--py-soft);color:var(--py)}
.cmdfig.who .grp[data-grp="app"] .part code{background:var(--app-soft);color:var(--app)}
.cmdfig.who .handoff{display:flex}
.cmdfig.who .cmd{gap:10px}
.cmdfig.who .parts{gap:12px}
.cmdfig.who .part code{font-size:42px;padding:20px 18px}
.cmdfig .after{min-height:40px;display:flex;align-items:center;gap:14px;font-size:19px}
.changed{font-size:17px;font-weight:800;color:var(--accent)}
.recap-note{font-size:17px;color:var(--app);font-weight:700}

/* ---------- Scene 01 F4: argparse ---------- */
.f4{display:flex;align-items:center;gap:10px;width:100%;max-width:1180px;justify-content:center}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:190px;padding:16px;border-radius:16px;background:var(--chip);border:4px solid transparent}
.box .k{font-size:15px;font-weight:700;color:var(--muted)}
.box .v{font-size:30px;font-weight:800}
.box code.v{font-size:26px;white-space:nowrap}
.box .rule{font-size:16px;line-height:1.45;color:var(--ink);text-align:left;background:var(--panel);border-radius:10px;padding:8px 12px}
.box .rule code{font-size:.95em}
.box .res{font-size:22px;font-weight:700;line-height:1.6;text-align:left}
.b-in{width:230px}.b-ap{width:290px}.b-out{width:240px}
.b-next{width:230px;background:transparent;border:3px dashed var(--line);color:var(--muted)}
.b-next .v{font-size:18px;line-height:1.4}
.wall{flex:none;width:6px;align-self:stretch;margin:0 8px;border-radius:3px;background:var(--line);position:relative}
.wall span{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:800;color:var(--muted)}
.f4.flow .b-in,.f4.flow .b-ap,.f4.flow .b-out{border-color:var(--accent);background:var(--panel)}
.f4.flow .b-ap .v{color:var(--accent)}
.f4.edge .wall{background:var(--accent)}
.f4.edge .wall span{color:var(--accent)}
.f4.edge .b-next{border-color:var(--accent);color:var(--ink)}
.f4.edge .b-out{border-color:var(--line);background:var(--panel)}

/* ---------- 이해 확인 ---------- */
.checks{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:12px}
.qa{display:grid;grid-template-columns:110px 1fr;gap:4px 18px;align-items:baseline;background:var(--panel);border-radius:14px;padding:14px 22px;border:2px solid var(--line)}
.qa .kind{font-size:15px;font-weight:800;color:var(--muted)}
.qa .q{font-size:22px;font-weight:700;line-height:1.4}
.qa .a{grid-column:2;font-size:18px;color:var(--app);font-weight:700;display:none}
.shown .qa .a{display:block}
.checks .reveal{align-self:center}

/* ---------- Scene 02 구조도 ---------- */
.s2{display:grid;grid-template-columns:minmax(0,820px) 300px;gap:24px;width:100%;max-width:1150px;align-items:stretch;justify-content:center}
.frame{position:relative;display:flex;flex-direction:column;border-radius:20px;border:3px solid var(--line);background:var(--panel);padding:10px 14px 12px}
.frame.dashed{border-style:dashed}
.frame.real{border-color:var(--real);background:#FFFDF8}
.frame.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fhead{display:flex;align-items:center;gap:10px;height:34px;margin-bottom:8px}
.fname{font-size:18px;font-weight:800;padding:3px 10px;border-radius:8px}
.fname code{font-size:20px}
button.fname:hover{background:var(--chip)}
.badge{font-size:14px;font-weight:800;border-radius:999px;padding:3px 11px;background:var(--ink);color:#fff;white-space:nowrap}
.badge.acc{background:var(--accent)}
.badge.soft{background:var(--chip);color:var(--muted)}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:146px 146px;gap:16px 28px}
.tile{position:relative;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:16px;background:var(--chip);border:4px solid transparent;text-align:left;min-width:0}
.tile:hover{background:var(--chip-h)}
.tile[aria-disabled="true"]:hover{background:var(--chip)}
.tile .ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--panel);display:grid;place-items:center}
.tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .ko{font-size:25px;font-weight:800;line-height:1.28}
.tile .en{font-size:17px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.tile .fn{font-size:28px;font-weight:700}
.tile .kosub{font-size:16px;font-weight:600;color:var(--muted);line-height:1.3}
.tile .need{font-size:21px;font-weight:700;line-height:1.35}
.tile .need small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:2px}
.tile .bd{position:absolute;top:10px;right:12px}
.tile.bubble{background:var(--panel);border:3px dashed var(--line)}
.tile.sel{background:var(--panel);border-color:var(--accent)}
.tile.sel .ko,.tile.sel .fn{color:var(--accent)}
.tile.sel .ic{color:var(--accent);background:var(--accent-soft)}
.tile.soft{border-color:var(--line);background:var(--panel)}
.tile.dim{opacity:.55}
.req{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 20px;text-align:center;z-index:2;box-shadow:0 0 0 8px var(--panel)}
.req code{font-size:24px;font-weight:700;display:block}
.req span{font-size:15px;opacity:.85}
.link{position:absolute;bottom:73px;left:calc(50% - 46px);width:92px;height:0;border-top:4px dashed var(--accent);z-index:2}
.link span{white-space:nowrap;position:absolute;left:50%;top:-17px;transform:translateX(-50%);background:var(--accent);color:#fff;font-family:var(--mono);font-size:15px;font-weight:700;border-radius:8px;padding:3px 8px}
.mainrow{margin-top:12px;height:46px;display:flex;align-items:center;gap:12px;padding:0 18px;border-radius:12px;background:var(--chip);border:3px solid transparent;visibility:hidden}
.mainrow.on{visibility:visible}
.mainrow.capt{visibility:visible;background:none;justify-content:center}
.mainrow.capt span{font-weight:700}
.mainrow.sel{border-color:var(--accent);background:var(--panel)}
.mainrow code{font-size:22px;font-weight:700}
.mainrow.sel code{color:var(--accent)}
.mainrow span{font-size:16px;color:var(--muted)}
.fcap{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:15px;color:var(--muted);font-weight:700}
.side{display:flex;flex-direction:column;gap:12px;justify-content:center}
.side h2{margin:0;font-size:20px;line-height:1.35}
.side h2 b{color:var(--accent)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card .k{font-size:14px;font-weight:800;color:var(--muted)}
.card .v{font-size:19px;font-weight:700;line-height:1.4}
.card .v code{font-size:15px;white-space:nowrap}
.card.on{border-color:var(--accent)}
.card.on .k{color:var(--accent)}
.card.off{opacity:.45}
button.card:hover{border-color:var(--muted)}
button.card[aria-pressed="true"]{border-color:var(--ink);border-width:3px}
.ans{font-size:16px;font-weight:800;color:var(--accent)}
.runflow{display:flex;flex-direction:column;gap:2px}
.runflow .card{padding:9px 14px}
.runflow .card .v{font-size:17px}
.runflow code{font-size:15px}
.extras{display:flex;flex-wrap:wrap;gap:6px}
.extras code{font-size:15px;background:var(--chip);color:var(--muted);border-radius:6px;padding:3px 8px}

/* Scene 02 정리 → Scene 03 연결 버튼 (v3.4) */
.side .next-q{margin:0}
.side .go{font-size:15px;padding:5px 14px;margin-top:6px}

/* ---------- Scene 03 기록 묶음과 네 동작 (v3.4) ---------- */
.s3{display:grid;grid-template-columns:230px 500px 230px;grid-template-areas:"c b r" "u b d" ". n .";grid-template-rows:1fr 1fr auto;gap:16px 24px;align-items:stretch;justify-content:center;width:100%}
.s3.sr{grid-template-columns:290px 440px 290px;grid-template-areas:"s b m";grid-template-rows:auto;align-items:center}
.op{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:16px 14px 10px;border-radius:16px;background:var(--chip);border:4px solid transparent;text-align:center;position:relative}
.op:hover{background:var(--chip-h)}
.op .ko{font-size:27px;font-weight:800;line-height:1.2}
.op .en{font-size:15px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.op .d{font-size:15px;color:var(--muted)}
.op.sel{background:var(--panel);border-color:var(--accent)}
.op.sel .ko{color:var(--accent)}
.op .gb{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap}
.badge.line{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.op-c{grid-area:c}.op-r{grid-area:r}.op-u{grid-area:u}.op-d{grid-area:d}
.s3 .note{grid-area:n;font-size:15px;font-weight:700;color:var(--muted);text-align:center}
.book{grid-area:b;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px}
.book-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 4px}
.book-h b{font-size:17px}
.book-h span{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.book-h span.acc{color:var(--accent)}
.rec{position:relative;display:grid;grid-template-columns:40px 58px 54px 1fr auto;align-items:center;gap:8px;min-height:44px;padding:4px 12px;border-radius:10px;background:var(--chip);font-size:19px;border:3px solid transparent}
.rec .no{font-family:var(--mono);font-size:15px;color:var(--faint);font-weight:700}
.rec .dt{font-family:var(--mono);font-size:16px;color:var(--muted)}
.rec .ct{font-weight:700}
.rec .am{font-family:var(--mono);font-weight:700;text-align:right;white-space:nowrap}
.rec .am s{color:var(--faint);font-weight:400;margin-right:6px;font-size:.8em}
.rec .mm{white-space:nowrap}
.rec .am ins{text-decoration:none;color:var(--accent)}
.rec .rb{position:absolute;top:-11px;right:10px;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--accent);color:#fff;white-space:nowrap}
.rec.new{background:var(--panel);border-color:var(--accent)}
.rec.upd{background:var(--panel);border-color:var(--accent)}
.rec.del{background:transparent;border:3px dashed var(--faint);color:var(--faint)}
.rec.del .mm,.rec.del .ct,.rec.del .am,.rec.del .dt{text-decoration:line-through}
.rec.del .rb{background:var(--muted)}
.rec.hit{background:var(--panel);border-color:var(--accent)}
.rec.hit .rb{background:var(--panel);color:var(--accent);border:2px solid var(--accent)}
.rec.gone{background:transparent;border:3px dashed var(--faint);color:var(--faint)}
.rec.gone .rb{background:var(--muted)}
.rsp{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px 16px;min-height:260px}
.rsp.on{border-color:var(--accent)}
.rsp.off{opacity:.38}
.rsp-s{grid-area:s}.rsp-m{grid-area:m}
.rsp .k{font-size:24px;font-weight:800}
.rsp.on .k{color:var(--accent)}
.rsp .cond{font-size:15px;font-weight:700;background:var(--chip);border-radius:8px;padding:4px 10px;align-self:flex-start}
.rsp .rec{font-size:16px;grid-template-columns:34px 1fr auto;min-height:38px}
.rsp .total{font-family:var(--mono);font-size:40px;font-weight:800;text-align:center;padding:4px 0}
.rsp .cat{display:flex;justify-content:space-between;font-size:17px;padding:2px 6px;border-bottom:1px solid var(--chip)}
.rsp .cat b{font-family:var(--mono)}
.rsp .foot{margin-top:auto;font-size:15px;font-weight:700;color:var(--muted)}
.recap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:1120px}
.recap .card{min-height:150px;justify-content:flex-start}
.recap .card .v{font-size:22px}
.recap .card .t{font-size:16px;color:var(--muted);line-height:1.45}
.recap .card .badge{align-self:flex-start;margin-top:auto}
.sumwrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}

/* ---------- Scene 04 메모리·파일·형식 (v3.4) ---------- */
.s4{display:flex;flex-direction:column;gap:14px;width:100%;max-width:1120px}
.flowbar{display:flex;align-items:stretch;gap:10px;visibility:hidden}
.flowbar.on{visibility:visible}
.fb{flex:1;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:14px;background:var(--panel);border:3px solid var(--line)}
.fb .k{font-size:14px;font-weight:800;color:var(--muted)}
.fb .v{font-size:18px;font-weight:700;line-height:1.35}
.fb .role{align-self:flex-start;margin-top:2px}
.fb.on{border-color:var(--accent)}
.flowbar .arrow-h{align-self:center}
.flowcap{text-align:center;font-size:15px;font-weight:700;color:var(--muted);margin-top:-6px;visibility:hidden}
.flowcap.on{visibility:visible}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pane{display:flex;flex-direction:column;gap:7px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:12px 14px;min-height:300px;text-align:left}
.pane.on{border-color:var(--accent)}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 4px}
.pane-h b{font-size:20px}
.pane-h span{font-size:14px;font-weight:700;color:var(--muted)}
.pane.on .pane-h b{color:var(--accent)}
.pane.filep{background:#FCFCFA;border-style:solid}
.pane .rec{font-size:17px;min-height:38px}

      <span class="k">검색</span><span class="cond">조건: 분류가 ${SEARCH}</span>${hits.map(miniRow).join('')}<span class="foot">조건에 맞는 기록 ${hits.length}개</span></button>`;
    const summ=`<button class="rsp rsp-m hit${s.sr==='summary'?' on':s.sr==='search'?' off':''}" data-go="summary" data-key="res-summary">
      <span class="k">요약</span><span class="cond">계산: 금액 합계</span><span class="total">${won(total)}</span>${cats.map(([c,v])=>`<span class="cat"><span>${c}</span><b>${won(v)}</b></span>`).join('')}<span class="foot">기록 ${REC.length}개를 계산한 결과</span></button>`;
    return `<div class="s3 sr">${search}${book(rows,s.sr==='both'?'원본 4개 그대로':'기록 4개',s.sr==='both')}${summ}</div>`;
  }
  // ops / change
  let rows, head='기록 4개', acc=false;
  if(s.mode==='ops'&&s.op==='create'){rows=REC.map(r=>recRow(r)).join('')+recRow(REC5,{cls:'new',b:'새로 추가'});head='기록 4개에서 5개로';acc=true;}
  else if(s.mode==='ops'&&s.op==='update'){rows=REC.map(r=>r.id===UPD.id?recRow(r,{cls:'upd',b:'수정됨',am:`<s>${won(r.a)}</s><ins>${won(UPD.a)}</ins>`}):recRow(r)).join('');head='기록 4개 · 1곳 바뀜';acc=true;}
  else if(s.mode==='ops'&&s.op==='delete'){rows=REC.map(r=>r.id===DEL?recRow(r,{cls:'del',b:'삭제됨'}):recRow(r)).join('');head='기록 4개에서 3개로';acc=true;}
  else if(s.mode==='ops'&&s.op==='read'){rows=REC.map(r=>recRow(r)).join('');head='기록 4개 그대로 · 원본 변화 없음';acc=true;}
  else {rows=REC.map(r=>recRow(r)).join('');head=s.mode==='change'?'처음 기록 4개 · 각 변화는 여기서 따로 비교':'기록 4개';}
  const op=o=>{
    const sel=s.op===o.id;
    const gb=s.mode==='change'?(o.id==='read'?'<span class="gb badge line">원본 그대로</span>':'<span class="gb badge">원본이 바뀜</span>'):'';
    return `<button class="op hit ${o.cls}${sel?' sel':''}" data-go="${o.id}" data-key="op-${o.id}" aria-pressed="${sel}">${gb}<span class="ko">${o.ko}</span><span class="en">${o.en}</span><span class="d">${o.d}</span></button>`;
  };
  return `<div class="s3">${OPS.map(op).join('')}${book(rows,head,acc)}<div class="note">네 동작의 분류 — 순서가 아닙니다</div></div>`;
}

/* ---------------- 그림: Scene 02 (하나의 구조도) ---------------- */
function figS2(s){
  const m=s.mode, real=m==='ledger', fileish=['files','import','main','ledger','summary'].includes(m);
  const sit=SITS.find(x=>x.id===s.sit);
  const tile=r=>{
    let cls='tile', go='', badge='', disabled=false;
    if(m==='needs'){cls+=' bubble';go=r.id;}
    else if(m==='roles'){go=r.id; if(s.sel===r.id)cls+=' sel';}
    else if(m==='change'){go=r.id; if(sit&&sit.target===r.id){cls+=' sel';badge='<span class="badge acc">먼저 볼 곳</span>';} }
    else if(m==='files'){go='module'; if(s.hl==='module'&&st.file===r.id){cls+=' sel';badge='<span class="badge acc">모듈</span>';}}
    else if(m==='import'){disabled=true; if(r.id==='cli'||r.id==='service')cls+=' soft';}
    else if(m==='main'){disabled=true; if(r.id==='cli')cls+=' soft';}
    else disabled=true;
    let inner;
    if(m==='needs') inner=`<span class="need">${r.need}${r.small?`<small>(${r.small})</small>`:''}</span>`;
    else if(fileish) inner=`<span class="tx"><code class="fn">${r.file}</code><span class="en">${r.en}</span>${m==='summary'?`<span class="kosub">${r.ko}</span>`:''}</span>`;
    else inner=`<span class="tx"><span class="ko">${r.ko}</span><span class="en">${r.en}</span></span>`;
    const attrs=disabled?' aria-disabled="true"':` data-go="${go}"${m==='files'?` data-file="${r.id}"`:''}`;
    const pressed=cls.includes(' sel');
    return `<button class="${cls} hit"${attrs} data-key="tile-${r.id}" aria-pressed="${pressed}"><span class="ic">${I(ICON[r.id])}</span>${inner}${badge?`<span class="bd">${badge}</span>`:''}</button>`;
  };
  // 프레임 머리
  let head;
  if(m==='needs'||m==='roles'||m==='change') head=`<span class="fname">todo 프로그램</span>`;
  else if(real) head=`<span class="fname"><code>ledger/</code></span><span class="badge soft">패키지</span>`;
  else head=`<button class="fname hit" data-go="package" data-key="pkg" ${m==='files'?'':'aria-disabled="true" tabindex="-1"'}><code>todo/</code></button>${(s.hl==='package'||m!=='files')?'<span class="badge'+(s.hl==='package'?' acc':' soft')+'">패키지</span>':''}`;
  const frameCls='frame'+(m==='needs'?' dashed':'')+(real?' real':'')+(s.hl==='package'?' hl':'');
  const mainOn=['main','ledger','summary'].includes(m);
  const main=m==='needs'?`<div class="mainrow capt"><span>필요한 일들 — 순서표가 아닙니다</span></div>`:`<div class="mainrow${mainOn?' on':''}${m==='main'?' sel':''}"><code>__main__.py</code><span>${real?'실행: <code>python -m ledger list --limit 5</code>':'패키지를 실행할 때의 시작 파일'}</span></div>`;
  const req=m==='needs'?`<div class="req"><code>list --limit 5</code><span>할 일 목록을 최대 5개 보여 줘</span></div>`:'';
  const link=m==='import'?`<div class="link" aria-hidden="true"><span>import</span></div>`:'';
  const frame=`<div class="${frameCls}"><div class="fhead">${head}</div><div class="grid" role="group" aria-label="네 가지 역할">${ROLES.map(tile).join('')}${req}${link}</div>${main}</div>`;
  return `<div class="s2">${frame}<div class="side">${side(s)}</div></div>`;

  if(m==='main') return `<div class="runflow" aria-label="실행할 때 일어나는 일">`+[
      ['① 명령','<code>python -m todo list --limit 5</code>'],['② Python','todo 패키지를 찾음'],['③ 시작 파일','<code>todo/__main__.py</code>'],['④ 이어서','CLI 부분이 <code>list --limit 5</code>를 받음']
    ].map((x,i)=>(i?'<span class="arrow-v" aria-hidden="true"></span>':'')+card(x[0],x[1],i===2?'on':'')).join('')+`</div>`;
  if(m==='ledger') return card('같은 자리, 같은 네 역할','<code>models.py</code> · <code>repository.py</code> · <code>services.py</code> · <code>cli.py</code>','on')
      +`<div class="card"><span class="k">이 프로젝트가 따로 둔 파일</span><span class="extras"><code>__init__.py</code><code>errors.py</code><code>validators.py</code><code>decorators.py</code></span></div>`
      +card('참고','실제 사례 · 용돈 기입장 ledger, 커밋 d14e812','off');
  if(m==='summary') return card('역할','기록의 모양 · 읽고 저장하기 · 요청 처리 · 명령과 결과')+card('모듈 · 패키지','역할별 파일 = 모듈, 묶음 <code>todo/</code> = 패키지')+card('함께 쓰기 · 시작','import로 가져다 쓰고, <code>__main__.py</code>에서 시작')
      +`<p class="next-q">다음 장면 · <b>${s.next}</b> ${goBtn(2,'Scene 03으로 ›')}</p>`;
  return '';
}

/* ---------------- 렌더 ---------------- */
function render(focusKey){
  const S=SCENES[st.sc], s=cur();
  $('#ctx').textContent=`${S.ctx}`;
  const real=s.mode==='ledger'||!!s.real;
  $('#tag').textContent=real?'실제 사례 · 용돈 기입장 ledger':(S.tag||'가상 todo 예시');
  $('#tag').className='tag'+(real?' real':'');
  $('#q').textContent=S.q;
  const f={f1:figF1,cmd:figCmd,f4:figF4,check:figCheck,s2:figS2,s3:figS3,s4:figS4}[s.fig];
  $('#stage').innerHTML=f(s);
  $('#say').innerHTML='<span>'+s.say.replace(/__main__\.py/g,'<code>__main__.py</code>')+'</span>';
  const n=S.steps.length;
  $('#pos').textContent=`Scene ${S.num} · ${st.i+1} / ${n} · ${s.t}`;
  $('#barFill').style.width=`${(st.i+1)/n*100}%`;
  $('#prev').disabled=st.sc===0&&st.i===0;
  $('#next').disabled=st.sc===SCENES.length-1&&st.i===n-1;
  renderNote(); renderToc();
  history.replaceState(null,'',`#${st.sc+1}-${st.i+1}`);
  if(focusKey){const el=document.querySelector(`[data-key="${focusKey}"]`); if(el) el.focus();}
}
function renderNote(){
  const S=SCENES[st.sc], s=cur();
  let h=`<h3>이 단계 · ${S.ctx} ${st.i+1}. ${s.t}</h3>`;
  if(s.script) h+=s.script.map(x=>`<blockquote>${x}</blockquote>`).join('');
  if(s.qs) h+=`<h3>기대 답과 흔한 오답</h3><ol>${s.qs.map(q=>`<li><b>${q.q}</b><br>→ ${q.a}<br><span style="color:var(--muted)">${q.miss}</span></li>`).join('')}</ol>`;
  h+=`<details><summary>강사 노트 — 정확성 경계</summary><ul>${S.notes.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
  h+=`<details><summary>선택형 심화</summary><ul>${S.deep.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
  $('#noteBody').innerHTML=h;
}
function renderToc(){
  $('#tocBody').innerHTML=SCENES.map((S,si)=>`<div class="scene-h">Scene ${S.num} · ${S.q}</div>`+S.steps.map((s,i)=>
    `<button data-jump="${si}-${i}"${si===st.sc&&i===st.i?' aria-current="step"':''}><span>${S.num}-${i+1}</span><span><b>${s.t}</b>${s.say}</span></button>`).join('')).join('');
}
function goTo(sc,i,focusKey){st.sc=sc;st.i=i;st.reveal=false;render(focusKey);}
function step(d){
  let {sc,i}=st; i+=d;
  if(i<0){if(sc===0)return; sc--; i=SCENES[sc].steps.length-1;}
  if(i>=SCENES[sc].steps.length){if(sc===SCENES.length-1)return; sc++; i=0;}
  const changed=sc!==st.sc; goTo(sc,i); if(changed) $('#q').focus();
}
function openPanel(id){
  closePanel(false);
  st.panel=id; $('#'+id).classList.add('on'); $('#shade').classList.add('on');
  $(id==='toc'?'#tocBtn':'#noteBtn').setAttribute('aria-expanded','true');
  const c=id==='toc'?$('#tocBody [aria-current]'):$('#note [data-close]'); (c||$('#'+id+' [data-close]')).focus();
}
function closePanel(restore=true){
  if(!st.panel)return; const id=st.panel; st.panel=null;
  $('#'+id).classList.remove('on'); $('#shade').classList.remove('on');
  const b=$(id==='toc'?'#tocBtn':'#noteBtn'); b.setAttribute('aria-expanded','false'); if(restore)b.focus();
}

/* ---------------- 이벤트 ---------------- */
$('#stage').addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-reveal],[data-goscene]'); if(!t||t.getAttribute('aria-disabled')==='true')return;
  const key=t.dataset.key;
  if(t.hasAttribute('data-reveal')){st.reveal=!st.reveal;render(key);return;}
  if(t.dataset.goscene){goTo(+t.dataset.goscene,0);$('#q').focus();return;}
  if(t.dataset.file) st.file=t.dataset.file;
  const s=cur(); let id=t.dataset.go;
  if(s.id===id&&id!=='module'){ // 같은 것을 다시 누르면 그림의 전체 상태로
    id=s.home||SCENES[st.sc].home;
  }
  const j=idx(st.sc,id); if(j>=0){st.i=j;st.reveal=false;render(key);}
});
$('#tocBody').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;const [sc,i]=b.dataset.jump.split('-').map(Number);closePanel(false);goTo(sc,i);$('#q').focus();});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closePanel()));
$('#shade').addEventListener('click',()=>closePanel());
$('#tocBtn').addEventListener('click',()=>st.panel==='toc'?closePanel():openPanel('toc'));
$('#noteBtn').addEventListener('click',()=>st.panel==='note'?closePanel():openPanel('note'));
$('#homeBtn').addEventListener('click',()=>{const s=cur();const j=idx(st.sc,s.home||SCENES[st.sc].home);goTo(st.sc,j);});
$('#prev').addEventListener('click',()=>step(-1));
$('#next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Escape'){if(st.panel){closePanel();e.preventDefault();}return;}
  if(st.panel==='toc')return;
  if(e.target.closest&&e.target.closest('summary'))return;
  const k={ArrowLeft:()=>step(-1),ArrowRight:()=>step(1),PageUp:()=>step(-1),PageDown:()=>step(1),
    Home:()=>goTo(st.sc,0),End:()=>goTo(st.sc,SCENES[st.sc].steps.length-1)}[e.key];
  if(k){e.preventDefault();k();}
});
(function init(){
  const m=location.hash.match(/^#(\d+)-(\d+)$/);
  if(m){const sc=+m[1]-1,i=+m[2]-1; if(SCENES[sc]&&SCENES[sc].steps[i]){st.sc=sc;st.i=i;}}
  render();
})();
</script>
</body>
</html>
