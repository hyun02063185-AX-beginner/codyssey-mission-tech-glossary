    teacher:{open:'“저장 형식만 바꾸고 싶을 때 어느 부분부터 찾으면 좋을까요?”',order:'모델, 저장소, 서비스, CLI를 가리킨 뒤 저장 변경·출력 변경 상황 선택',sentences:['모델은 기록의 모양이고 저장소는 읽기·저장을 맡습니다.','서비스는 요청을 처리하고 CLI는 명령 입력과 결과 표시를 맡습니다.','바꿀 내용에 따라 먼저 살펴볼 책임이 달라집니다.'],caution:'그림의 배치와 강의 단계는 호출·실행·import 순서가 아닙니다. 역할과 파일은 필수 일대일 관계가 아닙니다. ledger d14e812의 models.py/repository.py/services.py/cli.py를 정적 대조한 사례입니다. 저장 변경의 영향은 다른 책임에도 번질 수 있으므로 “저장소만 고치면 된다”고 단정하지 않습니다. 금액 출력 변경은 실제 기존 기능을 수정한 결과가 아니라 어디를 검토할지 고르는 상황입니다. 클래스·객체·self·__init__() 문법은 가르치지 않습니다. 공식 클래스 구조화 구현 요구는 별도 확인합니다.',bridge:'“이 책임을 담은 파일들은 어떻게 묶고 함께 사용할까요？”'}},
   {tab:'B · 파일과 패키지',kind:'package',caption:'같은 구현 사례를 파일과 묶음으로 보기',
    stages:[
     {target:'module',label:'모듈',sentence:'이 예시에서는 Python 코드가 들어 있는 파일 하나를 모듈이라고 봅니다.'},
     {target:'package',label:'패키지',sentence:'패키지는 함께 쓰는 관련 모듈을 묶은 구조입니다.'},
     {target:'import',label:'import',sentence:'import로 다른 모듈의 이름이나 기능을 가져와 사용합니다.'},
     {target:'entry',label:'시작 파일',sentence:'앞 장면의 python -m todo는 todo 패키지의 __main__.py를 시작점으로 실행합니다.'}],
    deeper:'<p><strong>__init__.py</strong>는 일반 패키지의 초기화 파일입니다. 내용이 비어 있을 수도 있습니다.</p><p>기본 화면에서는 모듈·패키지·import를 먼저 이해하면 됩니다.</p><p><a href="../../scene-02/script.md">선택 심화: 패키지와 import</a></p>',
    teacher:{open:'“관련 파일들을 묶고 다른 파일의 기능을 사용하려면 어떻게 할까요?”',order:'모듈 파일 한 개, ledger 묶음 경계, import 설명, 앞 장면 todo의 시작 파일',sentences:['이 예시의 코드 파일은 모듈이고 관련 모듈의 묶음은 패키지입니다.','import로 다른 모듈의 이름이나 기능을 가져와 씁니다.','앞 장면의 python -m todo는 todo의 __main__.py를 시작점으로 실행합니다.'],caution:'ledger 폴더는 실제 사례, todo 시작 파일은 앞 장면의 가상 예시로 표시를 구분합니다. 모듈=.py 파일은 입문 모델이며 내장·확장 모듈도 있습니다. 일반 패키지의 __init__.py 설명은 선택 보충으로 이동했습니다. namespace package에는 그 파일이 없을 수 있고 모든 패키지가 실행 가능하거나 __main__.py를 갖는 것은 아닙니다. import와 함수 호출을 같다고 설명하지 않으며 최상위 실행/의존도 추적도 하지 않습니다. 역할별 파일 구성은 이 구현의 선택입니다.',bridge:'“마지막 질문에 답한 뒤 다음 제작 단계에서 기록의 추가·조회·수정·삭제를 살펴봅니다.”'}}
  ]}
];
const roles=[{id:'model',name:'모델',en:'Model',job:'기록의 모양',file:'models.py'},{id:'repository',name:'저장소',en:'Repository',job:'기록 읽기·저장',file:'repository.py'},{id:'service',name:'서비스',en:'Service',job:'요청 처리',file:'services.py'},{id:'cli',name:'CLI',en:'명령줄',job:'명령 입력·결과 표시',file:'cli.py'}];
const tokens=[{id:'tool',label:'실행 도구',code:'python',tech:'Python 인터프리터'},{id:'program',label:'실행할 프로그램',code:'-m todo',tech:'-m 옵션 · 실행 대상'},{id:'task',label:'할 일',code:'list',tech:'하위 명령'},{id:'condition',label:'조건',code:'--limit 5',tech:'옵션 --limit · 값 5'}];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scene=0,screen=0,stage=0;
const current=()=>lessons[scene].screens[screen];
const total=()=>lessons[scene].screens.reduce((sum,s)=>sum+s.stages.length,0);
const offset=()=>lessons[scene].screens.slice(0,screen).reduce((sum,s)=>sum+s.stages.length,0);
function draw(){
 const lesson=lessons[scene],view=current();
 $('context-label').textContent=lesson.context;$('eyebrow').textContent=`SCENE 0${scene+1}`;$('question').textContent=lesson.question;
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.scene)===scene)));
 $('screens').innerHTML=lesson.screens.map((s,i)=>`<button type="button" data-screen="${i}" aria-pressed="${i===screen}">${s.tab}</button>`).join('');
 let diagram='';
 if(view.kind==='compare')diagram='<div class="compare" role="group" aria-label="같은 목록 요청의 GUI와 CLI 비교"><button type="button" class="compare-card" data-stage="0" aria-pressed="false"><strong>화면에서 누르기 <small>GUI</small></strong><span class="gui-action">목록 보기 · 최대 5개</span><span class="selection-mark"></span></button><button type="button" class="compare-card" data-stage="1" aria-pressed="false"><strong>문자로 입력하기 <small>CLI</small></strong><code><span>python</span> <span>-m todo</span> <span>list</span> <span>--limit 5</span></code><span class="selection-mark"></span></button></div>';
 if(view.kind==='command')diagram=`<div class="command" role="group" aria-label="명령 네 블록">${tokens.map((t,i)=>`<button type="button" class="node" data-stage="${i}" data-token="${t.id}" aria-pressed="false"><span class="label">${t.label}</span><code>${t.code}</code><small>${t.tech}</small><span class="selection-mark"></span></button>`).join('')}</div><div class="parse-row" id="parse-row" hidden><p>프로그램이 읽을 부분: 할 일 + 조건</p><button type="button" data-stage="4" aria-pressed="false">요청 해석 · argparse</button></div>`;
 if(view.kind==='roles')diagram=`<div class="roles" role="group" aria-label="모델·저장소·서비스·CLI 네 책임">${roles.map((r,i)=>`<button type="button" class="role" data-stage="${i}" data-role="${r.id}" aria-pressed="false"><strong>${r.name} <span class="english">${r.en}</span></strong><span class="responsibility">${r.job}</span><code>${r.file}</code><span class="selection-mark"></span></button>`).join('')}</div><div class="situations" role="group" aria-label="변경 상황 선택"><button type="button" data-stage="4" aria-pressed="false">저장 방식을 바꾼다면?</button><button type="button" data-stage="5" aria-pressed="false">출력 방식을 바꾼다면?</button></div>`;
 if(view.kind==='package')diagram=`<div class="package" id="package"><div class="package-title"><code>ledger/</code><span>관련 모듈의 묶음</span></div><div class="modules">${roles.map(r=>`<div class="module"><code>${r.file}</code><span>${r.name}</span></div>`).join('')}</div></div><p class="import-strip" id="import-strip">다른 파일의 기능을 함께 쓰기 <small>· import</small></p><p class="entry" id="entry" hidden>앞 장면의 가상 todo: <code>python -m todo</code>의 시작 파일 <code>todo/__main__.py</code></p><div class="package-tools" role="group" aria-label="파일과 패키지 개념 선택">${view.stages.map((s,i)=>`<button type="button" data-stage="${i}" aria-pressed="false">${s.label}</button>`).join('')}</div>`;
 $('visual').innerHTML=`<p class="caption">${view.caption}</p>${diagram}`;
 $('checks').innerHTML=lesson.checks.map(q=>`<p>${esc(q)}</p>`).join('');$('summary').textContent=lesson.summary;
 $('deeper-content').innerHTML=view.deeper;
 const t=view.teacher;
 $('teacher-content').innerHTML=`<p><strong>첫 질문:</strong> ${esc(t.open)}</p><p><strong>가리킬 순서:</strong> ${esc(t.order)}</p><h3>꼭 설명할 세 문장</h3><ul>${t.sentences.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p><strong>혼동·정확성:</strong> ${esc(t.caution)}</p><p><strong>다음 연결:</strong> ${esc(t.bridge)}</p>`;
 $('deeper').open=false;$('teacher').open=false;updateStage();
}
function updateStage(){
 const view=current(),item=view.stages[stage],last=offset()+stage===total()-1;
 document.querySelectorAll('[data-stage]').forEach(b=>{
  const selected=Number(b.dataset.stage)===stage||(view.kind==='roles'&&b.dataset.role===item.target);
  b.setAttribute('aria-pressed',String(selected));
  const mark=b.querySelector('.selection-mark');if(mark)mark.textContent=selected?'선택한 책임' : '';
  if(mark&&view.kind!=='roles')mark.textContent=selected?'선택' : '';
 });
 document.querySelectorAll('[data-token]').forEach(b=>b.classList.toggle('is-related',stage===4&&['task','condition'].includes(b.dataset.token)));
 if($('parse-row'))$('parse-row').hidden=stage!==4;
 if($('package'))$('package').dataset.pick=String(stage);
 if($('import-strip')){$('import-strip').classList.toggle('is-active',stage===2);$('import-strip').hidden=stage===3;}
 if($('entry'))$('entry').hidden=stage!==3;
 $('note').textContent=item.sentence;$('step').textContent=`강의 단계 ${offset()+stage+1} / ${total()} · ${item.label}`;
 $('previous').disabled=offset()+stage===0;$('next').disabled=last;
 $('recap').hidden=!last;
 let answers=$('answers');if(answers)answers.remove();
 if(last)$('deeper-content').insertAdjacentHTML('beforeend',`<details class="answer-toggle" id="answers"><summary>마지막 질문의 답 확인</summary><p>${esc(lessons[scene].answer)}</p></details>`);
}
function selectScreen(nextScene,nextScreen,nextStage=0,focus=true){scene=nextScene;screen=nextScreen;stage=nextStage;draw();if(focus){$('question').focus({preventScroll:true});if(matchMedia('(max-width:900px)').matches)$('question').scrollIntoView({block:'start'});}}
function move(delta){
 const index=Math.max(0,Math.min(total()-1,offset()+stage+delta));let remaining=index,nextScreen=0;
 while(remaining>=lessons[scene].screens[nextScreen].stages.length)remaining-=lessons[scene].screens[nextScreen++].stages.length;
 if(nextScreen!==screen)selectScreen(scene,nextScreen,remaining);else{stage=remaining;updateStage();}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.scene!==undefined)selectScreen(Number(b.dataset.scene),0);
 else if(b.dataset.screen!==undefined)selectScreen(scene,Number(b.dataset.screen));
 else if(b.dataset.stage!==undefined){stage=Number(b.dataset.stage);updateStage();}
 else if(b.id==='previous')move(-1);else if(b.id==='next')move(1);
});
$('lesson').addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 const delta=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:e.key==='Home'?-total():e.key==='End'?total():null;
 if(delta===null)return;e.preventDefault();move(delta);
});
draw();
</script>
</body>
