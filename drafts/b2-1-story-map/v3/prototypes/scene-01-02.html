        summary:'역할을 나누면 프로그램에서 바꿀 곳과 함께 쓰는 곳을 구분하기 쉽습니다.',
        deeper:'<p><strong>답:</strong> 읽기·저장 역할부터 봅니다. 네 역할과 네 파일이 꼭 일치하지는 않습니다.</p><p>한 파일에서 시작하거나 역할을 다르게 나눌 수도 있습니다. 이 그림은 함수 호출 순서나 import 의존도가 아닙니다.</p><p>공식 미션의 클래스 구조화 요구는 유지합니다. 클래스 문법은 선수 학습에서 보완하고 실제 구현을 별도로 확인합니다.</p><p><a href="../../scene-03a/script.md">선택 선수 자료: 함수·클래스</a></p>',
        teacher:{open:'“저장 방식을 바꿀 때 화면 표시까지 모두 고쳐야 한다면 어떨까요?”',order:'명령 해석 → 요청 처리 → 읽기·저장 → 결과 표시 (설명 순서)',sentences:['네 블록은 서로 다른 역할을 나타냅니다.','역할을 구분하면 수정할 위치를 찾기 쉽습니다.','이것은 설계 예시이며 필수 파일 구조가 아닙니다.'],confusion:'블록 번호는 설명 순서입니다. 실제 호출·의존도 추적으로 읽지 않습니다. 클래스 문법을 복습하지 않습니다.',bridge:'“이 역할들을 파일과 폴더에 담아 함께 사용하려면 어떤 이름을 알면 될까요?”'}

      {

        items:[
          {label:'모듈',title:'모듈 · 코드를 담은 파일',body:'이 예시에서는 Python 코드가 들어 있는 .py 파일 하나를 모듈로 봅니다. cli.py처럼 역할을 알아볼 수 있는 이름을 붙였습니다.'},
          {label:'패키지',title:'패키지 · 관련 모듈 묶음',body:'todo라는 패키지 안에 관련 모듈을 모았습니다. 이 예시는 일반 패키지이며, Python이 네 역할의 파일명을 요구하지는 않습니다.'},
          {label:'import',title:'import · 다른 모듈 함께 쓰기',body:'다른 모듈의 이름이나 기능을 가져와 사용하게 해 줍니다. import 관계만으로 함수가 어떤 순서로 호출되는지 알 수는 없습니다.'},
          {label:'__main__.py',title:'패키지 실행 진입점',body:'python -m todo로 이 패키지를 실행할 때 쓰는 진입점입니다. 모든 패키지가 실행 가능하거나 이 파일을 갖는 것은 아닙니다.'},

        ],
        points:['모듈은 코드 단위, 패키지는 묶음입니다.','import로 다른 모듈을 함께 씁니다.','실행 진입점과 초기화 파일은 다릅니다.'],

        summary:'모듈은 코드를 나누고 패키지는 모듈을 묶으며 import로 함께 사용합니다.',

        teacher:{open:'“역할을 담은 파일들은 어떻게 묶고 함께 사용할까요?”',order:'모듈 파일 → todo 경계 → import → __main__.py → __init__.py',sentences:['이 예시의 모듈은 Python 코드 파일이고 패키지는 관련 모듈의 묶음입니다.','import는 다른 모듈의 이름이나 기능을 가져와 사용하게 합니다.','__main__.py는 패키지 실행의 진입점이고 __init__.py는 일반 패키지 초기화 파일입니다.'],confusion:'일반 패키지 예시라는 범위를 유지합니다. 이 파일명이 모두 필수라고 하거나 함수 호출·초기화 순서를 추적하지 않습니다.',bridge:'“다음 Scene 03에서는 요청 처리 안의 추가·조회·수정·삭제를 살펴봅니다. 이번 시안은 여기까지입니다.”'}

const $ = id => document.getElementById(id);
let scene=0,screen=0,stage=0;
const escapeHtml = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const current = () => lessons[scene].screens[screen];
function node(item,index){return `<button type="button" class="node" data-stage="${index}" aria-pressed="false"><span class="number">${String(index+1).padStart(2,'0')}</span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.small||'')}</small></button>`;}
function draw(){
 const view=current();
 $('eyebrow').textContent=lessons[scene].eyebrow;
 $('question').textContent=lessons[scene].question;
 document.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.scene)===scene)));
 $('screens').innerHTML=lessons[scene].screens.map((item,index)=>`<button type="button" data-screen="${index}" aria-pressed="${index===screen}">${item.tab}</button>`).join('');
 let diagram='';
 if(view.kind==='command') diagram=`<div class="command" role="group" aria-label="명령 네 블록">${view.items.map(node).join('')}</div><div class="boundary"><span>Python을 시작하고 실행 대상을 선택</span><span>todo가 해석할 기능과 조건</span></div>`;
 if(view.kind==='flow') diagram=`<div class="flow" role="group" aria-label="문자에서 요청으로 해석하는 개념 흐름">${view.items.map((item,index)=>(index?'<span class="arrow" aria-hidden="true">→</span>':'')+node(item,index)).join('')}</div><p class="legend">실행 출력이 아닌 개념 설명입니다.</p>`;
 if(view.kind==='roles') diagram=`<div class="roles" role="group" aria-label="프로그램의 네 가지 역할">${view.items.map(node).join('')}</div>`;
 if(view.kind==='package') diagram=`<div class="package" id="package" data-pick="0"><div class="package-label"><code>todo/</code><span>관련 모듈을 묶은 패키지</span></div><div class="modules"><span><code>cli.py</code>명령 해석</span><span><code>actions.py</code>요청 처리</span><span><code>storage.py</code>읽기·저장</span><span><code>display.py</code>결과 표시</span></div><div class="specials"><span class="main-file"><code>__main__.py</code>패키지 실행 진입점</span><span class="init-file"><code>__init__.py</code>일반 패키지 초기화</span></div><p class="import-label">import · 다른 모듈의 이름·기능을 가져와 사용</p></div><div class="package-tools" role="group" aria-label="패키지 그림에서 개념 선택">${view.items.map((item,index)=>`<button type="button" data-stage="${index}" aria-pressed="false">${index+1} ${escapeHtml(item.label)}</button>`).join('')}</div>`;
 $('visual').innerHTML=`<p class="diagram-caption">${escapeHtml(view.caption)}</p>${diagram}`;
 $('points').innerHTML=view.points.map(point=>`<li>${escapeHtml(point)}</li>`).join('');
 $('checks').innerHTML=view.checks.map((check,index)=>`<p>${index+1}. ${escapeHtml(check)}</p>`).join('');
 $('summary').textContent=view.summary;
 $('deeper-content').innerHTML=view.deeper;
 const t=view.teacher;
 $('teacher-content').innerHTML=`<p><strong>첫 질문:</strong> ${escapeHtml(t.open)}</p><p><strong>가리킬 순서:</strong> ${escapeHtml(t.order)}</p><h3>꼭 설명할 세 문장</h3><ul>${t.sentences.map(sentence=>`<li>${escapeHtml(sentence)}</li>`).join('')}</ul><p><strong>혼동:</strong> ${escapeHtml(t.confusion)}</p><p><strong>다음 연결:</strong> ${escapeHtml(t.bridge)}</p>`;
 $('deeper').open=false;$('teacher').open=false;
 updateStage();
}
function updateStage(){
 const view=current(), item=view.items[stage];
 document.querySelectorAll('[data-stage]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.stage)===stage)));
 const pack=$('package');if(pack)pack.dataset.pick=String(stage);
 $('note-label').textContent=`${stage+1} / ${view.items.length} · ${item.label}`;
 $('note-title').textContent=item.title;$('note-body').textContent=item.body;
 $('step').textContent=`강의 단계 ${stage+1} / ${view.items.length}`;
 $('previous').disabled=stage===0;$('next').disabled=stage===view.items.length-1;
}
function selectScreen(nextScene,nextScreen){scene=nextScene;screen=nextScreen;stage=0;draw();$('question').focus({preventScroll:true});if(window.matchMedia('(max-width:900px)').matches)$('question').scrollIntoView({block:'start'});}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.scene!==undefined)selectScreen(Number(button.dataset.scene),0);
 else if(button.dataset.screen!==undefined)selectScreen(scene,Number(button.dataset.screen));
 else if(button.dataset.stage!==undefined){stage=Number(button.dataset.stage);updateStage();}
 else if(button.id==='previous'){stage--;updateStage();}
 else if(button.id==='next'){stage++;updateStage();}
});
$('lesson').addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 const max=current().items.length-1;
 if(event.key==='ArrowRight')stage=Math.min(max,stage+1);
 else if(event.key==='ArrowLeft')stage=Math.max(0,stage-1);
 else if(event.key==='Home')stage=0;
 else if(event.key==='End')stage=max;
 else return;
 event.preventDefault();updateStage();
});
draw();
</script>
</body>
