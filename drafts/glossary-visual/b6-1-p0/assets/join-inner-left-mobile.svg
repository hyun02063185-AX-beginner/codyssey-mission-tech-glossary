<rect x="8.75" y="348.75" width="302.5" height="29.25" rx="7" class="head"/>
<line x1="8" y1="378" x2="312" y2="378" class="rule"/>
<text x="18" y="368" font-size="14" class="t b m">id</text>
<text x="70" y="368" font-size="14" class="t b m">student_id</text>
<text x="200" y="368" font-size="14" class="t b m">course_id</text>
<text x="18" y="397" font-size="14" class="t m">1</text>
<text x="70" y="397" font-size="14" class="t m">1</text>
<text x="200" y="397" font-size="14" class="t m">1</text>
<line x1="8" y1="406" x2="312" y2="406" class="rule"/>
<text x="18" y="425" font-size="14" class="t m">2</text>
<text x="70" y="425" font-size="14" class="t m">1</text>
<text x="200" y="425" font-size="14" class="t m">2</text>
<line x1="8" y1="434" x2="312" y2="434" class="rule"/>
<text x="18" y="453" font-size="14" class="t m">3</text>
<text x="70" y="453" font-size="14" class="t m">2</text>
<text x="200" y="453" font-size="14" class="t m">1</text>
