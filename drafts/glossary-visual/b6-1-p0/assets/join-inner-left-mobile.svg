<text x="18" y="909" font-size="14" class="t">이서연</text>
<text x="168" y="909" font-size="14" class="t m">3</text>
<line x1="8" y1="918" x2="288" y2="918" class="rule"/>
<rect x="11" y="921" width="144" height="22" rx="5" class="kept"/>
<text x="18" y="937" font-size="14" class="t">문태양</text>
<rect x="161" y="921" width="124" height="22" rx="5" class="kept"/>
<text x="168" y="937" font-size="14" class="t b m">NULL</text>
<path d="M292 810 h6 v48 h-6" class="ln"/>
<text x="10" y="972" font-size="14" class="ok b">✓ 왼쪽 행은 모두 남고,</text>
<text x="10" y="992" font-size="14" class="ok b">짝이 없으면 오른쪽 열은 NULL</text>
<text x="10" y="1022" font-size="13" class="s">괄호 ] = 짝이 2건인 학생은</text>
