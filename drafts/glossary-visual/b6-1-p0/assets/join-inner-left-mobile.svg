<text x="18" y="481" font-size="14" class="t m">4</text>
<text x="70" y="481" font-size="14" class="t m">2</text>
<text x="200" y="481" font-size="14" class="t m">3</text>
<text x="10" y="526" font-size="15" class="t b">① INNER JOIN → 4행</text>
