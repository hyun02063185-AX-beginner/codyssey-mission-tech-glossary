<text x="12" y="200" font-size="13" class="s">상자 = 표(엔터티) · 안쪽 = 대표 열</text>
<text x="12" y="220" font-size="13" class="s">선 = 표 사이의 관계 (실행 순서나 데이터 흐름이 아님)</text>
