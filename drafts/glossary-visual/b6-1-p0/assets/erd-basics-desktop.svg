.gvb6 .b{font-weight:700}
.gvb6 .m{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace)}
.gvb6 .box{fill:var(--surface-raised,#fff);stroke:var(--border-strong,#b5c7bd);stroke-width:1.5}
.gvb6 .head{fill:var(--surface-soft,#eef5ef)}
.gvb6 .note{fill:var(--surface-soft,#eef5ef);stroke:var(--border-default,#d5ddd7);stroke-width:1}
.gvb6 .rule{stroke:var(--border-default,#d5ddd7);stroke-width:1}
.gvb6 .ln{fill:none;stroke:var(--text-primary,#18241f);stroke-width:1.6}
.gvb6 .ref{fill:none;stroke:#8a4b00;stroke-width:1.8;stroke-dasharray:6 4}
.gvb6 .refbad{fill:none;stroke:#9b2c22;stroke-width:1.8;stroke-dasharray:3 4}
.gvb6 .hit{fill:none;stroke:#8a4b00;stroke-width:2.2}
.gvb6 .gone{fill:none;stroke:#9b2c22;stroke-width:2;stroke-dasharray:5 4}
.gvb6 .kept{fill:none;stroke:#1a6b43;stroke-width:2.2;stroke-dasharray:5 4}
.gvb6 .pk{fill:#173e35} .gvb6 .fk{fill:#8a4b00} .gvb6 .on{fill:#fff}
.gvb6 .bad{fill:#9b2c22} .gvb6 .ok{fill:#1a6b43} .gvb6 .fkt{fill:#8a4b00}
</style>
