<svg xmlns="http://www.w3.org/2000/svg" class="gvb6" viewBox="0 0 520 536" width="520" height="536" role="img" aria-labelledby="gvb6-erd-d-title gvb6-erd-d-desc">
<title id="gvb6-erd-d-title">ERD 읽기: 상자, 선, 선 끝 기호</title>
<desc id="gvb6-erd-d-desc">B6-1 공부방 데이터베이스의 표 3개를 ERD로 그린 그림이다. 상자는 표(엔터티)이고 안에 대표 열을 적었다. student의 id, enrollment의 id, course의 id가 PK이고 enrollment의 student_id와 course_id가 FK다. 선은 표 사이의 관계다. student와 enrollment를 잇는 선은 student 쪽 끝이 막대 두 개, enrollment 쪽 끝이 동그라미와 세 갈래다. course와 enrollment를 잇는 선도 같은 모양이다. 선 끝 기호는 안쪽이 최대, 바깥쪽이 최소 개수다. 막대 두 개는 최소 1·최대 1, 즉 반드시 하나다. 동그라미와 세 갈래는 최소 0·최대 여럿이다. 읽을 때는 한쪽 표에서 출발해 반대쪽 끝의 기호를 읽는다. 학생 1명은 수강 기록을 0건 이상 가지고, 수강 기록 1건은 학생 정확히 1명에 속한다. B6-1의 문태양 학생은 수강 기록이 0건인데, 동그라미(최소 0)가 이를 허용한다. 선은 관계를 나타낼 뿐 실행 순서나 데이터 흐름이 아니다.</desc>
