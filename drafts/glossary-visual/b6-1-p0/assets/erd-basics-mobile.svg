<rect x="8" y="611" width="304" height="150" rx="8" class="note"/>
<text x="20" y="635" font-size="14" class="t b">선 끝 기호: 안쪽 = 최대, 바깥쪽 = 최소</text>
<line x1="22" y1="663" x2="66" y2="663" class="ln"/>
