<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1024" width="520" height="1024" role="img" aria-labelledby="awsTitle awsDesc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="awsTitle">B3-1 AWS 네트워크 구조도: 인터넷에서 EC2의 Nginx까지</title>
  <desc id="awsDesc">맨 위에 인터넷이 있고 외부 사용자 브라우저와 관리자 PC가 있다. 그 아래 VPC 경계에 Internet Gateway가 걸쳐 있어 VPC와 인터넷을 잇는다. VPC 안에는 Public Subnet이 있고 오른쪽에는 이 서브넷에 연결된 Route Table 규칙표가 있다. Route Table에는 0.0.0.0/0이 Internet Gateway를 가리키는 규칙이 있으며, 이것은 패킷이 지나가는 장비가 아니라 경로 규칙 목록이다. Public Subnet 안에 EC2 인스턴스가 있고, Security Group은 서브넷 전체가 아니라 EC2의 네트워크 인터페이스에 적용되는 점선 테두리로 EC2를 감싼다. Security Group은 HTTP 80은 0.0.0.0/0에서, SSH 22는 내 공인 IP 하나(/32)에서만 허용한다. 브라우저의 HTTP 요청은 실선 화살표로 Internet Gateway, Security Group의 80 허용, 네트워크 인터페이스를 거쳐 Nginx에 닿고, SSH 관리 접속은 점선 화살표로 구분되어 sshd 22번 포트로 간다. 아래 카드는 요청이 Nginx에 닿기 위한 네 가지 조건을 번호로 정리한다.</desc>
  <defs>
    <style>
      .t  { fill: var(--text-primary, #18241f); }
      .s  { fill: var(--text-secondary, #52645a); }
      .m  { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .b  { font-weight: 700; }
      .raised { fill: var(--surface-raised, #ffffff); stroke: var(--border-strong, #b5c7bd); stroke-width: 1.5; }
      .soft   { fill: var(--surface-soft, #eef5ef); stroke: var(--border-strong, #b5c7bd); stroke-width: 1.5; }
      .accent { fill: var(--accent-soft, #e6f1e7); stroke: var(--accent-primary, #1d4d42); stroke-width: 2; }
      .http   { stroke: var(--accent-primary, #1d4d42); stroke-width: 3; fill: none; }
      .ssh    { stroke: var(--text-secondary, #52645a); stroke-width: 3; fill: none; stroke-dasharray: 9 6; }
      .ref    { stroke: var(--text-secondary, #52645a); stroke-width: 2; fill: none; stroke-dasharray: 2 5; stroke-linecap: round; }
      .badge  { fill: var(--accent-primary, #1d4d42); }
      .badgeT { fill: var(--accent-on-primary, #ffffff); font-weight: 700; }
      .head   { fill: var(--accent-primary, #1d4d42); }
      .head2  { fill: var(--text-secondary, #52645a); }
    </style>
    <marker id="arrHttp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
    <marker id="arrSsh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head2"/></marker>
    <marker id="arrRef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head2"/></marker>
  </defs>

  <!-- 인터넷 -->
  <rect x="6" y="6" width="508" height="104" rx="14" class="soft"/>
  <text x="22" y="28" font-size="16" class="t b">인터넷</text>
  <rect x="20" y="42" width="190" height="58" rx="10" class="raised"/>
  <text x="115" y="66" font-size="15" text-anchor="middle" class="t b">외부 사용자 브라우저</text>
  <text x="115" y="88" font-size="13" text-anchor="middle" class="t m">http://&lt;Public IPv4&gt;</text>
  <rect x="230" y="42" width="200" height="58" rx="10" class="raised"/>
  <text x="330" y="66" font-size="15" text-anchor="middle" class="t b">관리자 PC (SSH)</text>
  <text x="330" y="88" font-size="13" text-anchor="middle" class="t m">ssh -i &lt;키&gt;.pem …</text>
  <circle cx="30" cy="52" r="11" class="badge"/><text x="30" y="57" font-size="13" text-anchor="middle" class="badgeT">1</text>

  <!-- 사용자 → IGW (HTTP 실선) / 관리자 → IGW (SSH 점선) -->
  <line x1="114" y1="100" x2="114" y2="124" class="http" marker-end="url(#arrHttp)"/>
  <line x1="238" y1="100" x2="238" y2="124" class="ssh" marker-end="url(#arrSsh)"/>

  <!-- VPC -->
  <rect x="6" y="150" width="508" height="640" rx="14" fill="none" stroke="var(--accent-primary, #1d4d42)" stroke-width="2.5"/>
  <text x="22" y="774" font-size="15" class="t b">VPC</text>
  <text x="62" y="774" font-size="14" class="t m">10.0.0.0/16</text>
  <text x="168" y="774" font-size="13" class="s">≈ 사내 내부망(논리 네트워크)</text>

  <!-- Internet Gateway: VPC 경계에 걸침 -->
  <rect x="60" y="128" width="236" height="44" rx="10" class="accent"/>
  <text x="178" y="147" font-size="15" text-anchor="middle" class="t b">Internet Gateway</text>
  <text x="178" y="164" font-size="13" text-anchor="middle" class="s">≈ 인터넷 경계의 출입구</text>

  <!-- Route Table: Subnet에 연결된 규칙표 (경로상의 장비가 아님) -->
  <rect x="356" y="236" width="150" height="176" rx="10" class="raised" stroke="var(--accent-primary, #1d4d42)"/>
  <text x="368" y="262" font-size="15" class="t b">Route Table</text>
  <text x="368" y="282" font-size="13" class="s">Subnet에 연결된 규칙표</text>
  <text x="368" y="310" font-size="13" class="t m">0.0.0.0/0 → IGW</text>
  <text x="368" y="330" font-size="13" class="t">VPC 내부 → local</text>
  <text x="368" y="356" font-size="13" class="s">≈ 길 안내표</text>
  <text x="368" y="378" font-size="13" class="s">패킷이 지나가는</text>
  <text x="368" y="396" font-size="13" class="s">장비가 아닙니다</text>
  <circle cx="356" cy="236" r="11" class="badge"/><text x="356" y="241" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <!-- 연결선: Route Table ↔ Subnet -->
  <line x1="356" y1="324" x2="330" y2="324" class="ref"/>
  <circle cx="330" cy="324" r="4" fill="var(--text-secondary, #52645a)"/>
  <!-- 참조선: 규칙이 IGW를 가리킴 -->
  <path d="M470 236 V160 H300" class="ref" marker-end="url(#arrRef)"/>
  <text x="462" y="196" font-size="13" text-anchor="end" class="s">이 규칙이 IGW를 가리킴</text>

  <!-- Public Subnet -->
  <rect x="22" y="200" width="308" height="540" rx="12" class="soft"/>
  <text x="38" y="708" font-size="16" class="t b">Public Subnet</text>
  <text x="160" y="708" font-size="14" class="t m">10.0.1.0/24</text>
  <text x="38" y="728" font-size="13" class="s">≈ 주소 대역으로 나눈 구역</text>

  <!-- Security Group: 서브넷 전체가 아니라 EC2(네트워크 인터페이스)를 감싼다 -->
  <rect x="38" y="236" width="276" height="410" rx="12" fill="var(--surface-page, #f7f8f5)" stroke="var(--accent-primary, #1d4d42)" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="62" y="632" width="228" height="28" rx="14" class="raised" stroke="var(--accent-primary, #1d4d42)"/>
  <text x="176" y="651" font-size="14" text-anchor="middle" class="t b">Security Group (ENI에 적용)</text>
  <text x="176" y="622" font-size="13" text-anchor="middle" class="s">≈ 서버 출입 통제 (경계 방화벽 장비 아님)</text>

  <!-- SG 허용 규칙 카드 -->
  <rect x="52" y="262" width="248" height="66" rx="8" class="raised" stroke="var(--accent-primary, #1d4d42)"/>
  <line x1="176" y1="262" x2="176" y2="328" stroke="var(--border-strong, #b5c7bd)" stroke-width="1.5"/>
  <text x="114" y="285" font-size="14" text-anchor="middle" class="t b">HTTP 80</text>
  <text x="114" y="307" font-size="13" text-anchor="middle" class="t m">← 0.0.0.0/0</text>
  <text x="238" y="285" font-size="14" text-anchor="middle" class="t b">SSH 22</text>
  <text x="238" y="307" font-size="13" text-anchor="middle" class="t">← 내 IP/32</text>
  <circle cx="52" cy="262" r="11" class="badge"/><text x="52" y="267" font-size="13" text-anchor="middle" class="badgeT">3</text>

  <!-- IGW → SG 카드 (HTTP 실선, SSH 점선) -->
  <line x1="114" y1="172" x2="114" y2="258" class="http" marker-end="url(#arrHttp)"/>
  <line x1="238" y1="172" x2="238" y2="258" class="ssh" marker-end="url(#arrSsh)"/>

  <!-- EC2 -->
  <rect x="56" y="352" width="240" height="258" rx="10" class="raised" stroke="var(--text-primary, #18241f)" stroke-width="2"/>
  <text x="70" y="596" font-size="15" class="t b">EC2 인스턴스</text>
  <text x="180" y="596" font-size="13" class="s">≈ 웹 서버 컴퓨터</text>
  <rect x="70" y="388" width="212" height="46" rx="6" class="accent"/>
  <text x="176" y="408" font-size="13" text-anchor="middle" class="t b">네트워크 인터페이스(ENI)</text>
  <text x="176" y="426" font-size="13" text-anchor="middle" class="t m">사설 IP 10.0.1.x</text>
  <line x1="114" y1="328" x2="114" y2="384" class="http" marker-end="url(#arrHttp)"/>
  <line x1="238" y1="328" x2="238" y2="384" class="ssh" marker-end="url(#arrSsh)"/>

  <rect x="66" y="462" width="96" height="52" rx="8" class="soft"/>
  <text x="114" y="485" font-size="14" text-anchor="middle" class="t b">Nginx</text>
  <text x="114" y="503" font-size="13" text-anchor="middle" class="t">포트 80</text>
  <circle cx="66" cy="462" r="11" class="badge"/><text x="66" y="467" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <rect x="190" y="462" width="96" height="52" rx="8" class="soft"/>
  <text x="238" y="485" font-size="14" text-anchor="middle" class="t b">sshd</text>
  <text x="238" y="503" font-size="13" text-anchor="middle" class="t">포트 22</text>
  <line x1="114" y1="434" x2="114" y2="458" class="http" marker-end="url(#arrHttp)"/>
  <line x1="238" y1="434" x2="238" y2="458" class="ssh" marker-end="url(#arrSsh)"/>

  <!-- Public IPv4 -->
  <rect x="66" y="522" width="220" height="52" rx="8" fill="none" stroke="var(--text-secondary, #52645a)" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="176" y="542" font-size="13" text-anchor="middle" class="t m">Public IPv4 203.0.113.10</text>
  <text x="176" y="562" font-size="13" text-anchor="middle" class="s">(예시) IGW가 사설 IP와 1:1 변환</text>

  <!-- 조건 카드 -->
  <rect x="6" y="806" width="508" height="210" rx="12" class="raised" stroke="var(--accent-primary, #1d4d42)"/>
  <text x="22" y="832" font-size="15" class="t b">브라우저 요청이 Nginx에 닿으려면 (번호 = 위 그림)</text>
  <circle cx="30" cy="852" r="10" class="badge"/><text x="30" y="857" font-size="13" text-anchor="middle" class="badgeT">1</text>
  <text x="48" y="857" font-size="14" class="t">EC2에 붙은 Public IPv4로 요청을 보낸다</text>
  <circle cx="30" cy="878" r="10" class="badge"/><text x="30" y="883" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <text x="48" y="883" font-size="14" class="t">Subnet의 Route Table에 0.0.0.0/0 → IGW 가 있다</text>
  <circle cx="30" cy="904" r="10" class="badge"/><text x="30" y="909" font-size="13" text-anchor="middle" class="badgeT">3</text>
  <text x="48" y="909" font-size="14" class="t">Security Group이 포트 80 요청을 허용한다</text>
  <circle cx="30" cy="930" r="10" class="badge"/><text x="30" y="935" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <text x="48" y="935" font-size="14" class="t">Nginx가 80번에서 실제로 응답한다</text>
  <line x1="22" y1="960" x2="62" y2="960" class="http"/><text x="70" y="965" font-size="13" class="s">HTTP(웹 요청)</text>
  <line x1="170" y1="960" x2="210" y2="960" class="ssh"/><text x="218" y="965" font-size="13" class="s">SSH(관리 접속, 별도)</text>
  <line x1="372" y1="960" x2="412" y2="960" class="ref"/><text x="420" y="965" font-size="13" class="s">연결·참조</text>
  <text x="22" y="990" font-size="13" class="s">≈ 는 “역할이 비슷하다”는 뜻입니다. 사내망 장비와 1:1로 같다는 뜻이 아닙니다.</text>
  <text x="22" y="1008" font-size="13" class="s">Public Subnet이라는 이름만으로는 외부 접속이 보장되지 않습니다.</text>
</svg>
