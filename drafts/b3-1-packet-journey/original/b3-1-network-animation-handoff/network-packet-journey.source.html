<div id="network-packet-journey">
  <style>
    #network-packet-journey { color: var(--foreground); }
    #network-packet-journey .nw-top { padding-right: 96px; }
    #network-packet-journey .nw-top h3 { margin-bottom: 8px; }
    #network-packet-journey .nw-controls { margin: 12px 0; }
    #network-packet-journey .nw-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0 4px; }
    #network-packet-journey .nw-legend span { display: inline-flex; align-items: center; gap: 6px; }
    #network-packet-journey .nw-swatch { display: inline-block; width: 18px; height: 3px; }
    #network-packet-journey .nw-current { font-weight: 500; }
    #network-packet-journey .nw-stage { margin: 10px 0; min-height: 2.8em; }
    #network-packet-journey .nw-diagram { display: block; width: 100%; overflow: visible; }
    #network-packet-journey .nw-diagram text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #network-packet-journey .nw-diagram .nw-zone-label { fill: var(--muted-foreground); }
    #network-packet-journey .nw-zone { fill: var(--muted); fill-opacity: .34; stroke: var(--border); stroke-width: 1; }
    #network-packet-journey .nw-edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
    #network-packet-journey .nw-node rect { fill: var(--background); stroke: var(--border); stroke-width: 1; }
    #network-packet-journey .nw-node .nw-active { fill-opacity: .12; }
    #network-packet-journey .nw-information { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 22px; margin-top: 12px; }
    #network-packet-journey .nw-information h3 { margin: 0 0 8px; }
    #network-packet-journey .nw-information code { overflow-wrap: anywhere; }
    #network-packet-journey .nw-packet-table th { width: 64px; }
    #network-packet-journey .nw-match { background: color-mix(in srgb,var(--nw-current-color) 10%, transparent); }
    #network-packet-journey .nw-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--muted-foreground); }
    @media (max-width: 580px) {
      #network-packet-journey .nw-information { grid-template-columns: minmax(0,1fr); gap: 16px; }
    }
  </style>
  <div class="nw-top">
    <h3>패킷의 여행</h3>
    <div class="text-small">접속 대상 <code>http://example.com/</code></div>
  </div>
  <div class="viz-controls nw-controls">
    <button type="button" class="btn btn-primary" id="nw-play">재생</button>
    <button type="button" class="btn" id="nw-next">다음 단계</button>
    <span class="text-small tabular-nums" id="nw-progress">1 / 26</span>
  </div>
  <div class="nw-legend" aria-label="패킷 종류">
    <span id="nw-legend-dns"><i class="nw-swatch" style="background:var(--viz-series-1)" aria-hidden="true"></i>DNS 조회·응답</span>
    <span id="nw-legend-request"><i class="nw-swatch" style="background:var(--viz-series-2)" aria-hidden="true"></i>웹 요청</span>
    <span id="nw-legend-response"><i class="nw-swatch" style="background:var(--viz-series-3)" aria-hidden="true"></i>웹 응답</span>
  </div>
  <div class="nw-stage" id="nw-stage" aria-live="polite"></div>
  <svg class="nw-diagram" id="nw-map" role="img" aria-labelledby="nw-map-title nw-map-description">
    <title id="nw-map-title">DNS 조회 후 웹 서버에 접속하고 다른 인터넷 경로로 응답받는 예시</title>
    <desc id="nw-map-description">PC와 공유기, 인터넷 라우터 R1부터 R4, DNS 서버, 회사 경계 라우터, NAT를 수행하는 방화벽, DMZ 웹 서버. 웹 요청은 R1·R2·R4를, 응답은 R4·R3·R1을 거친다. 양쪽 NAT와 방화벽은 요청과 응답이 모두 거친다.</desc>
    <g id="nw-zones"></g><g id="nw-edges"></g><g id="nw-traces"></g><g id="nw-nodes"></g><g id="nw-marker" aria-hidden="true"></g>
  </svg>
  <div class="nw-information">
    <div>
      <h3>처리 후 패킷 <span class="text-small">IP:포트</span></h3>
      <table class="table table-sm nw-packet-table" aria-label="현재 패킷 정보">
        <tbody>
          <tr><th scope="row">출발지</th><td><code id="nw-source"></code></td></tr>
          <tr><th scope="row">목적지</th><td><code id="nw-destination"></code></td></tr>
          <tr><th scope="row">통신</th><td id="nw-protocol"></td></tr>
          <tr><th scope="row">내용</th><td id="nw-payload"></td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <h3 id="nw-decision-title">PC의 처리</h3>
      <table class="table table-sm" aria-labelledby="nw-decision-title">
        <thead><tr><th scope="col">판단 기준</th><th scope="col">다음 전달·처리</th></tr></thead>
        <tbody id="nw-decision"></tbody>
      </table>
    </div>
  </div>
  <div class="nw-foot text-small">
    <span>주소·경로표는 설명용 예시</span><span>DNS 캐시 응답</span><span>TCP 연결 과정 생략</span>
  </div>
  <script>
  (() => {
    const root = document.getElementById('network-packet-journey');
    const $ = id => root.querySelector('#' + id);
    const ns = 'http://www.w3.org/2000/svg';
    const map = $('nw-map');
    const nodeLayer = $('nw-nodes'), edgeLayer = $('nw-edges'), traceLayer = $('nw-traces'), marker = $('nw-marker');
    const make = (name, attrs = {}, text) => {
      const el = document.createElementNS(ns, name);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      if (text !== undefined) el.textContent = text;
      return el;
    };
    const definitions = {
      pc: { label: '내 PC', sub: '192.168.0.20', width: 126 },
      home: { label: '공유기', sub: '라우팅 · NAT', width: 124 },
      r1: { label: '라우터 R1', sub: '다음 경로 선택', width: 108 },
      r2: { label: '라우터 R2', sub: '다음 경로 선택', width: 108 },
      r3: { label: '라우터 R3', sub: '다음 경로 선택', width: 108 },
      r4: { label: '라우터 R4', sub: '다음 경로 선택', width: 108 },
      dns: { label: 'DNS 서버', sub: '192.0.2.53', width: 116 },
      edge: { label: '회사 경계 라우터', sub: '경로 선택', width: 142 },
      firewall: { label: '방화벽 · NAT', sub: 'HTTP 80 허용', width: 142 },
      web: { label: 'DMZ 웹 서버', sub: '10.20.10.20', width: 142 }
    };
    const links = [['pc','home'],['home','r1'],['r1','r2'],['r1','r3'],['r2','r3'],['r2','r4'],['r3','r4'],['r2','dns'],['r4','edge'],['edge','firewall'],['firewall','web']];
    const phases = [
      { name:'DNS 조회', kind:'dns', route:['pc','home','r1','r2','dns'], protocol:'UDP · DNS', payload:'example.com의 A 레코드 조회' },
      { name:'DNS 응답', kind:'dns', route:['dns','r2','r1','home','pc'], protocol:'UDP · DNS', payload:'example.com → 198.51.100.80' },
      { name:'웹 요청', kind:'request', route:['pc','home','r1','r2','r4','edge','firewall','web'], protocol:'TCP · HTTP', payload:'GET / (대표 데이터 패킷)' },
      { name:'웹 응답', kind:'response', route:['web','firewall','edge','r4','r3','r1','home','pc'], protocol:'TCP · HTTP', payload:'200 OK (대표 데이터 패킷)' }
    ];
    const colors = { dns:'var(--viz-series-1)', request:'var(--viz-series-2)', response:'var(--viz-series-3)' };
    const steps = [];
    phases.forEach((phase, p) => phase.route.forEach((node, hop) => steps.push({ p, node, hop, kind:phase.kind })));
    let index = 0, playing = false, timer = null, frame = null, flight = null, positions = {}, width = 0;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

    function packet(step) {
      const { p, hop } = step;
      if (p === 0) return { source:hop >= 1 ? '203.0.113.10:61000' : '192.168.0.20:53000', destination:'192.0.2.53:53' };
      if (p === 1) return { source:'192.0.2.53:53', destination:hop >= 3 ? '192.168.0.20:53000' : '203.0.113.10:61000' };
      if (p === 2) return { source:hop >= 1 ? '203.0.113.10:62000' : '192.168.0.20:50000', destination:hop >= 6 ? '10.20.10.20:80' : '198.51.100.80:80' };
      return { source:hop >= 1 ? '198.51.100.80:80' : '10.20.10.20:80', destination:hop >= 6 ? '192.168.0.20:50000' : '203.0.113.10:62000' };
    }

    function description(s) {
      const { p, node, hop } = s;
      const next = phases[p].route[hop + 1];
      if (node === 'pc') return ['PC가 설정된 DNS 서버로 도메인 조회를 보냅니다.','PC가 서버 IP를 확인했습니다. 다음은 별도의 웹 접속입니다.','PC가 확인한 IP로 웹 접속을 시작합니다.','웹 응답 도착 · 인터넷에서는 요청과 다른 경로를 거쳤습니다.'][p];
      if (node === 'home') return p === 0 || p === 2 ? '공유기 NAT · 출발지 사설 IP·포트를 공인 IP·포트로 변환합니다.' : '공유기 NAT · 기록된 매핑으로 목적지 IP·포트를 PC 주소로 복원합니다.';
      if (node === 'dns') return p === 0 ? 'DNS가 캐시에서 도메인에 대응하는 IP를 찾습니다.' : 'DNS가 IP 정보를 응답합니다. 웹 요청을 대신 보내지는 않습니다.';
      if (node === 'firewall') return p === 2 ? '방화벽이 HTTP를 허용하고 목적지를 DMZ 사설 IP로 변환합니다.' : '방화벽이 기존 연결의 응답을 허용하고 출발지 공인 IP를 복원합니다.';
      if (node === 'web') return p === 2 ? 'DMZ 웹 서버가 HTTP 요청을 받았습니다.' : '웹 서버가 PC를 향해 HTTP 응답 데이터를 보냅니다.';
      if (node === 'edge') return p === 2 ? '회사 경계 라우터가 방화벽 쪽으로 전달합니다. 주소 변환은 하지 않습니다.' : '회사 경계 라우터가 외부 목적지의 응답을 R4로 전달합니다.';
      if (node === 'r4' && p === 3) return 'R4는 PC 쪽 목적지 경로를 R3로 선택합니다. 요청 때와 다른 경로입니다.';
      return definitions[node].label + '가 목적지 IP의 경로표를 보고 ' + (next ? definitions[next].label : '수신 장비') + '로 전달합니다.';
    }

    function decision(s) {
      const { p, node } = s;
      const target = packet(s).destination.split(':')[0];
      const rows = [];
      if (/^r[1-4]$/.test(node)) {
        const routes = {
          r1:[['192.0.2.0/24','R2'],['198.51.100.0/24','R2'],['203.0.113.0/24','공유기']],
          r2:[['192.0.2.0/24','DNS 서버'],['198.51.100.0/24','R4'],['203.0.113.0/24','R1']],
          r3:[['198.51.100.0/24','R4'],['203.0.113.0/24','R1']],
          r4:[['198.51.100.0/24','회사 경계'],['203.0.113.0/24','R3'],['192.0.2.0/24','R2']]
        };
        routes[node].forEach(([prefix, next]) => rows.push([prefix, next, target.startsWith(prefix.split('.').slice(0,3).join('.') + '.')]));
        return {title:definitions[node].label + '의 경로표',rows};
      }
      if (node === 'edge') return {title:'회사 경계 라우터의 경로표',rows:[['198.51.100.0/24','방화벽',p===2],['203.0.113.0/24','R4',p===3]]};
      if (node === 'home') return {title:'공유기의 처리',rows:[[p===0||p===2 ? '출발지 사설 주소' : '기존 NAT 매핑',p===0||p===2 ? '출발지 공인 주소로 변환' : '목적지 PC 주소로 복원',true],[p===0||p===2 ? '인터넷 목적지' : '집 내부 목적지',p===0||p===2 ? '다음 경로: R1' : '다음 전달: PC',false]]};
      if (node === 'firewall') return {title:'방화벽의 처리',rows:[[p===2?'신규 TCP 80 요청':'허용된 연결의 응답','허용',true],[p===2?'목적지 공인 주소':'출발지 사설 주소',p===2?'10.20.10.20으로 변환':'198.51.100.80으로 복원',false]]};
      if (node === 'dns') return {title:'DNS 서버의 처리',rows:[['도메인 example.com','캐시에서 A 레코드 확인',true],['IP 조회 결과','198.51.100.80',false]]};
      if (node === 'web') return {title:'웹 서버의 처리',rows:[['수신 TCP 포트','80 · 웹 서버',true],['HTTP 요청','페이지 데이터 응답',false]]};
      return {title:'PC의 처리',rows:p===0 ? [['도메인의 IP 미확인','DNS 조회 생성',true],['설정된 DNS 서버','192.0.2.53',false]] : p===1 ? [['DNS 조회 결과','198.51.100.80',true],['다음 통신','해당 IP로 HTTP 요청',false]] : p===2 ? [['웹 서버 주소','198.51.100.80:80',true],['게이트웨이','공유기로 전달',false]] : [['HTTP 응답','200 OK · 페이지 데이터',true],['인터넷 구간','요청 R2 / 응답 R3',false]]};
    }

    function zone(x,y,w,h,label) {
      const layer = $('nw-zones');
      layer.append(make('rect',{x,y,width:w,height:h,rx:12,class:'nw-zone'}));
      layer.append(make('text',{x:x+12,y:y+16,class:'nw-zone-label'},label));
    }

    function draw() {
      const w = Math.max(288, Math.round(root.getBoundingClientRect().width));
      width = w;
      const compact = w < 680;
      const h = compact ? 752 : 480;
      map.setAttribute('viewBox',`0 0 ${w} ${h}`);
      map.setAttribute('width',w); map.setAttribute('height',h);
      $('nw-zones').replaceChildren(); edgeLayer.replaceChildren(); nodeLayer.replaceChildren();
      if (compact) {
        positions = {pc:[w*.25,70],home:[w*.75,70],r1:[w*.5,206],r2:[w*.23,306],r3:[w*.77,306],dns:[w*.23,409],r4:[w*.77,409],edge:[w*.65,535],firewall:[w*.65,617],web:[w*.65,705]};
        zone(8,16,w-16,100,'방문자 네트워크');
        zone(8,151,w-16,300,'인터넷 · 여러 경로');
        zone(8,478,w-16,264,'회사 네트워크');
        zone(w*.65-80,660,160,76,'DMZ');
      } else {
        const sx = x => x*w/736;
        positions = {pc:[sx(78),96],home:[sx(222),96],r1:[sx(362),96],r2:[sx(506),96],dns:[sx(654),96],r3:[sx(424),235],r4:[sx(654),235],edge:[sx(654),395],firewall:[sx(440),395],web:[sx(210),395]};
        zone(8,36,sx(286)-8,110,'방문자 네트워크');
        zone(sx(298),36,w-sx(298)-8,260,'인터넷 · 여러 경로');
        zone(sx(98),328,w-sx(98)-8,130,'회사 네트워크');
        zone(sx(210)-85,350,170,92,'DMZ');
      }
      links.forEach(([a,b]) => {
        const [x1,y1] = positions[a], [x2,y2] = positions[b];
        edgeLayer.append(make('line',{x1,y1,x2,y2,class:'nw-edge','data-edge':a+'-'+b}));
      });
      Object.entries(definitions).forEach(([id,d]) => {
        const [x,y] = positions[id];
        const g = make('g',{class:'nw-node','data-node':id,transform:`translate(${x},${y})`});
        g.append(make('rect',{x:-d.width/2,y:-24,width:d.width,height:48,rx:8}));
        g.append(make('text',{'text-anchor':'middle',y:-3},d.label));
        g.append(make('text',{'text-anchor':'middle',y:15},d.sub));
        nodeLayer.append(g);
      });
      render();
    }

    function drawTraces() {
      traceLayer.replaceChildren();
      phases.forEach((phase,p) => {
        const last = steps[index];
        const count = p < last.p ? phase.route.length : p === last.p ? last.hop+1 : 0;
        for(let i=1;i<count;i++) {
          const [x1,y1] = positions[phase.route[i-1]], [x2,y2] = positions[phase.route[i]];
          traceLayer.append(make('line',{x1,y1,x2,y2,stroke:colors[phase.kind],'stroke-width':p===last.p ? 3.5 : 2.5,opacity:p===last.p ? 1 : .55,'stroke-linecap':'round'}));
        }
      });
    }

    function drawMarker(progress) {
      marker.replaceChildren();
      const s = steps[index];
      const c = colors[s.kind];
      let x,y;
      if (flight) {
        const a = positions[steps[flight.from].node], b = positions[steps[flight.to].node];
        x = a[0]+(b[0]-a[0])*progress; y=a[1]+(b[1]-a[1])*progress;
      } else {
        const a = positions[s.node]; x=a[0]+definitions[s.node].width/2-10; y=a[1]-15;
      }
      if(s.kind==='dns') marker.append(make('rect',{x:x-5,y:y-5,width:10,height:10,rx:1,fill:c}));
      else if(s.kind==='request') marker.append(make('polygon',{points:`${x},${y-7} ${x+7},${y} ${x},${y+7} ${x-7},${y}`,fill:c}));
      else marker.append(make('circle',{cx:x,cy:y,r:6,fill:c}));
    }

    function render() {
      const s = steps[index], phase = phases[s.p], info = packet(s);
      root.style.setProperty('--nw-current-color',colors[s.kind]);
      root.dataset.step = String(index); root.dataset.phase = phase.name;
      $('nw-progress').textContent = `${index+1} / ${steps.length}`;
      $('nw-stage').textContent = phase.name + ' · ' + description(s);
      $('nw-source').textContent=info.source; $('nw-destination').textContent=info.destination;
      $('nw-protocol').textContent=phase.protocol; $('nw-payload').textContent=phase.payload;
      const d=decision(s); $('nw-decision-title').textContent=d.title; $('nw-decision').replaceChildren();
      d.rows.forEach(([a,b,match]) => {
        const row=document.createElement('tr'); if(match) row.className='nw-match';
        [a,b].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});
        $('nw-decision').append(row);
      });
      ['dns','request','response'].forEach(kind=>{
        const el=$('nw-legend-'+kind); el.classList.toggle('nw-current',kind===s.kind);
        if(kind===s.kind) el.setAttribute('aria-current','step'); else el.removeAttribute('aria-current');
      });
      nodeLayer.querySelectorAll('.nw-node').forEach(g=>{
        const rect=g.querySelector('rect'); const active=g.dataset.node===s.node;
        rect.style.stroke=active ? colors[s.kind] : 'var(--border)';
        rect.style.strokeWidth=active ? '2' : '1';
        rect.style.fill=active ? colors[s.kind] : 'var(--background)';
        rect.classList.toggle('nw-active',active);
      });
      drawTraces(); drawMarker(flight ? flight.progress : 0);
      controls();
    }

    function controls() {
      $('nw-play').textContent=playing ? '일시정지' : index===steps.length-1 ? '처음부터 재생' : flight ? '계속 재생' : '재생';
      $('nw-play').setAttribute('aria-pressed',String(playing));
      $('nw-next').disabled=index===steps.length-1 || frame!==null;
    }

    function finish() {
      index=flight.to; flight=null; frame=null; render();
      if(index===steps.length-1) {playing=false;controls();return;}
      if(playing) timer=setTimeout(advance,900);
    }

    function animate() {
      if(!flight) return;
      let previous=null;
      const tick = now => {
        if(previous!==null) flight.progress=Math.min(1,flight.progress+(now-previous)/800);
        previous=now; drawMarker(flight.progress);
        if(flight.progress>=1) finish(); else frame=requestAnimationFrame(tick);
      };
      frame=requestAnimationFrame(tick); controls();
    }

    function advance() {
      clearTimeout(timer); timer=null;
      if(index===steps.length-1) return;
      if(flight) {if(reduced.matches) finish();else animate();return;}
      const next=index+1;
      flight={from:index,to:next,progress:0};
      if(steps[next].p!==steps[index].p || reduced.matches) {finish();return;}
      animate();
    }

    $('nw-play').addEventListener('click',()=>{
      if(playing) {
        playing=false;clearTimeout(timer);timer=null;
        if(frame!==null) {cancelAnimationFrame(frame);frame=null;}
        controls();return;
      }
      if(index===steps.length-1) {index=0;flight=null;render();}
      playing=true;advance();controls();
    });
    $('nw-next').addEventListener('click',()=>{
      playing=false;clearTimeout(timer);timer=null;advance();controls();
    });
    new ResizeObserver(()=>{
      const measured=Math.max(288,Math.round(root.getBoundingClientRect().width));
      if(measured!==width) draw();
    }).observe(root);
    draw();
  })();
  </script>
</div>
