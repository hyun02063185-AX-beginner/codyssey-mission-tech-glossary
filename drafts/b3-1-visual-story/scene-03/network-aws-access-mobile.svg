  <text x="12" y="1616" font-size="14" class="s">응답은 같은 연결의 반대 방향 (Scene 02)</text>
  <text x="12" y="1638" font-size="14" class="s">B3-1은 HTTP 80만 설정 (HTTPS 443 없음)</text>
  <text x="12" y="1660" font-size="14" class="s">2026-10-14 기록 기준, 현재 AWS 상태 아님</text>
</svg>
