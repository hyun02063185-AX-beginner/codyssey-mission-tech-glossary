  <path d="M22 146H60" class="assoc"/>
  <text x="72" y="151" font-size="15" class="t">회색 점선 = 설정이 연결·적용된 곳</text>
  <circle cx="41" cy="174" r="12" class="step" data-cond-mark="3"/>
