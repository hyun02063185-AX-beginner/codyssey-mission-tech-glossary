  <text x="24" y="1386" font-size="14" class="t">SG를 EC2의 ENI에 적용</text>
  <text x="24" y="1406" font-size="14" class="t">inbound HTTP 80 허용 · 상태 추적</text>
  <text x="24" y="1426" font-size="14" class="t">NACL은 기본값 유지</text>
  </g>
  <g data-cond="6">
  <rect x="12" y="1450" width="336" height="88" rx="12" class="info"/>
