  <text x="224" y="531.04" font-size="14" class="stepT" text-anchor="middle">5</text>
  <circle cx="64" cy="780" r="12" class="step" data-cond-mark="6"/>
  <text x="64" y="785.04" font-size="14" class="stepT" text-anchor="middle">6</text>
  <g data-cond="1">
  <rect x="12" y="930" width="336" height="88" rx="12" class="info"/>
  <circle cx="36" cy="952" r="12" class="step" data-cond-mark="1"/>
  <text x="36" y="957.04" font-size="14" class="stepT" text-anchor="middle">1</text>
  <text x="56" y="957" font-size="15" class="t b">요청 보내기</text>
  <text x="24" y="982" font-size="14" class="t">브라우저 → EC2의 Public IPv4</text>
  <text x="24" y="1002" font-size="14" class="t">HTTP 80 요청</text>
  </g>
  <g data-cond="2">
  <rect x="12" y="1026" width="336" height="88" rx="12" class="info"/>
  <circle cx="36" cy="1048" r="12" class="step" data-cond-mark="2"/>
  <text x="36" y="1053.04" font-size="14" class="stepT" text-anchor="middle">2</text>
  <text x="56" y="1053" font-size="15" class="t b">IGW 연결</text>
  <text x="24" y="1078" font-size="14" class="t">IGW를 VPC에 연결해야</text>
  <text x="24" y="1098" font-size="14" class="t">VPC와 인터넷이 통신</text>
