<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1688" width="360" height="1688" role="img" aria-labelledby="m3bT m3bD" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="m3bT">AWS에서 웹사이트에 접속하려면? · 휴대전화용</title>
  <desc id="m3bD">Scene 03-B. 실제 B3-1(2026-10-14 기록)에서 방문자의 웹 요청이 Nginx에 닿으려면 무엇이 필요한지, 요청이 이동하는 길과 설정을 나눠 보여 준다. 요청은 방문자에서 인터넷, VPC 경계의 IGW, EC2의 ENI, EC2 안의 Nginx로 간다(초록 화살표). Route Table과 Security Group은 요청이 지나가는 장비가 아니라 설정이다: Route Table은 Public Subnet에 연결되고, Security Group은 ENI에 적용된다(회색 점선). 필요한 설정: 1 브라우저가 EC2의 Public IPv4로 HTTP 80 요청, 2 IGW를 VPC에 연결, 3 Route Table에 0.0.0.0/0 → IGW 경로를 두고 Subnet에 연결(그래야 Public Subnet), 4 EC2는 Private IPv4만 알고 IGW가 자동 할당 Public IPv4와 1:1로 변환, 5 Security Group을 ENI에 적용해 inbound HTTP 80 허용(상태 추적, NACL 기본값), 6 Nginx가 HTTP 80으로 받아 dist 정적 파일 제공. Public Subnet이라는 이름만으로는 접속되지 않는다. 응답은 같은 연결의 반대 방향으로 돌아간다(Scene 02). B3-1은 HTTP 80만 설정했고 HTTPS 443은 설정하지 않았다.</desc>
