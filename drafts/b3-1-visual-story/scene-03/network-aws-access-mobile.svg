  <text x="12" y="56" font-size="20" class="t b">접속하려면?</text>
  <text x="12" y="80" font-size="14" class="s">Scene 03-B · 실제 B3-1 (2026-10-14 기록)</text>
  <rect x="12" y="94" width="336" height="98" rx="12" class="info"/>
