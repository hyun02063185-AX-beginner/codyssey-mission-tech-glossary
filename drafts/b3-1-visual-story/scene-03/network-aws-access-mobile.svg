  <text x="24" y="1214" font-size="14" class="t">(그래야 Public Subnet)</text>
  </g>
  <g data-cond="4">
  <rect x="12" y="1238" width="336" height="88" rx="12" class="info"/>
  <circle cx="36" cy="1260" r="12" class="step" data-cond-mark="4"/>
