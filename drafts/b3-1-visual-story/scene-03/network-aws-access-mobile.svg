  <circle cx="36" cy="1144" r="12" class="step" data-cond-mark="3"/>
  <text x="36" y="1149.04" font-size="14" class="stepT" text-anchor="middle">3</text>
  <text x="56" y="1149" font-size="15" class="t b">경로와 Subnet 연결</text>
  <text x="24" y="1174" font-size="14" class="t">Route Table: 0.0.0.0/0 → IGW</text>
