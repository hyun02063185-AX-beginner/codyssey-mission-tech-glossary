  <text x="170" y="1814.68" font-size="13" class="chipT" text-anchor="middle">≈ 주소 구역 분리</text>
  <rect x="12" y="1874" width="336" height="54" rx="12" class="info"/>
  <g opacity="0.45" data-faded="true">
  <text x="24" y="1896" font-size="14" class="t b">4 자료 저장 구역 · 5 내부 업무망</text>
  </g>
  <rect x="32.7" y="1904" width="94.7" height="20" rx="10" class="missing"/>
  <text x="80" y="1918.68" font-size="13" class="s b" text-anchor="middle">B3-1에 없음</text>

  <!-- 같다고 보면 틀리는 점 -->
  <text x="12" y="1960" font-size="16" class="t b">같다고 보면 틀리는 점</text>
  <g data-caution="1">
  <rect x="12" y="1972" width="336" height="104" rx="12" class="info"/>
  <text x="24" y="1996" font-size="15" class="t b">경계 라우터 ≠ IGW</text>
  <text x="24" y="2018" font-size="14" class="t">IGW는 VPC를 인터넷과</text>
  <text x="24" y="2038" font-size="14" class="t">연결하는 VPC 구성요소.</text>
  <text x="24" y="2058" font-size="14" class="t">경로는 Route Table이 정함</text>
  </g>
  <g data-caution="2">
  <rect x="12" y="2084" width="336" height="124" rx="12" class="info"/>
  <text x="24" y="2108" font-size="15" class="t b">DMZ ≠ Public Subnet</text>
  <text x="24" y="2130" font-size="14" class="t">DMZ: 공개 서비스와 내부망을</text>
  <text x="24" y="2150" font-size="14" class="t">나누는 설계 개념</text>
  <text x="24" y="2170" font-size="14" class="t">Public Subnet: IGW 경로가 있는</text>
  <text x="24" y="2190" font-size="14" class="t">Route Table에 연결된 Subnet</text>
  </g>
  <g data-caution="3">
  <rect x="12" y="2216" width="336" height="104" rx="12" class="info"/>
  <text x="24" y="2240" font-size="15" class="t b">Route Table ≠ Security Group</text>
  <text x="24" y="2262" font-size="14" class="t">Route Table: 어디로 보낼지(경로)</text>
  <text x="24" y="2282" font-size="14" class="t">Security Group: 들어와도</text>
  <text x="24" y="2302" font-size="14" class="t">되는지(허용) · ENI에 적용</text>
  </g>
  <g data-caution="4">
  <rect x="12" y="2328" width="336" height="124" rx="12" class="info"/>
  <text x="24" y="2352" font-size="15" class="t b">1:1 변환 ≠ NAT Gateway</text>
  <text x="24" y="2374" font-size="14" class="t">IGW가 Public ↔ Private IPv4를</text>
  <text x="24" y="2394" font-size="14" class="t">1:1로 바꿈</text>
  <text x="24" y="2414" font-size="14" class="t">B3-1은 NAT Gateway를</text>
  <text x="24" y="2434" font-size="14" class="t">만들지 않음</text>
  </g>
  <text x="12" y="2474" font-size="14" class="s">실제 B3-1은 2026-10-14 기록 기준이며</text>
  <text x="12" y="2496" font-size="14" class="s">현재 AWS 상태가 아닙니다.</text>
  <text x="12" y="2518" font-size="14" class="s">웹 접속에 필요한 설정은 Scene 03-B에서 봅니다.</text>
</svg>
