<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2546" width="360" height="2546" role="img" aria-labelledby="m3aT m3aD" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="m3aT">일반 기업망에서 하던 일을 AWS에서는 무엇이 맡을까? · 휴대전화용</title>
  <desc id="m3aD">Scene 03-A. 설명용 일반 기업 네트워크(Scene 01 요약)와 실제 B3-1 AWS 구성(2026-10-14 배포 기록)의 역할을 비교한다. 비슷한 역할일 뿐 같은 장비나 서비스가 아니다. 왼쪽은 구역 1~5(회사 밖·인터넷, 경계, DMZ 172.16.10.0/24, 자료 저장 구역 10.20.30.0/24, 내부 업무망 192.168.10.0/24)와 경계 라우터, 방화벽(NAT, 구역 사이 길 안내, 허용·차단 판단), 스위치, 공개 웹 서버다. 오른쪽은 서울 리전의 VPC 10.0.0.0/16, VPC 경계의 인터넷 게이트웨이(IGW, VPC를 인터넷과 연결, 1:1 IPv4 변환), Route Table(0.0.0.0/0 → IGW, Subnet에 연결), Security Group(HTTP 80 허용, SSH 22는 지정 IP, ENI에 적용), Public Subnet 10.0.1.0/24, 그 안의 EC2(Amazon Linux 2023, t3.micro)와 ENI, Nginx다. 보라 점선 비교선 6개: 회사 네트워크와 VPC(네트워크 영역), 방화벽의 NAT와 IGW의 1:1 IPv4 변환(주소 변환), 구역 사이 길 안내와 Route Table(경로 결정), 방화벽의 허용·차단 판단과 Security Group(접근 통제), 공개 웹 서버와 EC2 + Nginx(웹 서버), 구역마다 있는 서브넷과 Subnet(주소 구역 분리). 경계 라우터와 IGW, DMZ와 Public Subnet은 비교선으로 잇지 않고 주의 카드로 설명한다: 경계 라우터 ≠ IGW, DMZ ≠ Public Subnet, Route Table ≠ Security Group, 1:1 변환 ≠ NAT Gateway. B3-1에서 구현하지 않음: 직원 업무망·관리 화면 서버, DB 서버·파일 저장 서비스, 별도 DMZ, NAT Gateway·로드 밸런서(AWS에서 불가능하다는 뜻 아님). 리소스 ID와 공인 주소는 표시하지 않았다.</desc>
