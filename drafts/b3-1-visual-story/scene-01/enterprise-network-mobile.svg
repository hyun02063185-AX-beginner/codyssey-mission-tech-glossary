<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2274" width="360" height="2274" role="img" aria-labelledby="m1T m1D" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="m1T">일반 기업 네트워크는 어떻게 구성될까? (설명용 예시) · 휴대전화용</title>
  <desc id="m1D">설명용 일반 기업 네트워크 예시이며 모든 기업의 표준 배치가 아니고 실제 B3-1(AWS) 구성도 아니다. 구역은 다섯 개다. 1 회사 밖 인터넷에는 외부 방문자(PC·스마트폰)와 인터넷이 있다. 굵은 테두리 안이 회사 네트워크이며, 2 경계 구역에는 경계 라우터와 방화벽이 있다. 경계 라우터는 인터넷과 회사망을 잇고 경로를 선택한다. 방화벽은 허용·차단을 판단하고 이 예시에서는 구역 사이의 길 안내(라우팅)도 맡는다. NAT는 방화벽의 인터넷 쪽에서 주소를 바꾸는 기능이다. 들어올 때 공인 주소 203.0.113.10을 웹 서버의 사설 주소 172.16.10.10으로, 나갈 때 직원 PC의 사설 주소를 회사의 공인 주소로 바꾼다. 내부 구역끼리는 바꾸지 않으며, NAT는 허용·차단을 하지 않는다. 방화벽에는 인터넷 쪽, DMZ 쪽, 저장 쪽, 업무망 쪽 연결 지점이 있고 회사 안 세 구역은 각각 방화벽의 자기 연결 지점에만 연결된다. 3 공개 서비스 구역(DMZ, 172.16.10.0/24)에는 스위치와 공개 웹 서버, 4 자료 저장 구역(10.20.30.0/24)에는 스위치와 DB 서버·파일 저장소, 5 내부 업무망(192.168.10.0/24)에는 스위치와 내부 관리 서버·직원 PC가 있다. 스위치는 같은 구역 안 장비를 연결한다. 회색 선은 장비 사이의 실제 연결이며 통신 허용 여부는 방화벽 규칙이 정한다. 초록 실선 화살표는 방문자의 요청 하나만 보여 준다. A1 방문자에서 인터넷, A2 인터넷에서 경계 라우터, A3 경계 라우터에서 방화벽, A4 방화벽에서 DMZ 스위치, A5 스위치에서 공개 웹 서버로 간다. 방화벽 규칙 예시: 인터넷에서 웹 서버로 웹 80·443만 허용, 인터넷에서 저장 구역, 인터넷에서 업무망, DMZ에서 업무망으로 먼저 연결하는 것은 차단. 응답과 직원 게시, 웹 서버의 DB 조회는 이후 그림에서 다룬다. IP 주소는 문서용 예시 주소와 사설 주소이다.</desc>
