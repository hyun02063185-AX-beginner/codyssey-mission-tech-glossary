  <text x="242" y="882" font-size="14" class="s b" text-anchor="end">DMZ 쪽</text>
  <text x="66" y="906" font-size="13" class="s b">← 왼쪽 두 선: 업무망 쪽 · 저장 쪽</text>

  <!-- 방문자의 요청(초록 실선 화살표) A1~A5 -->
