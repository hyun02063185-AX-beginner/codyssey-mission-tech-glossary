  <path d="M270 656 L270 690" class="flowA" marker-end="url(#arrA)" data-flow="A3" data-from="router" data-to="fw"/>
  <circle cx="296" cy="673" r="13" class="badgeA"/>
  <text x="296" y="678.04" font-size="14" class="badgeT" text-anchor="middle">A3</text>
  <path d="M270 892 L270 1046" class="flowA" marker-end="url(#arrA)" data-flow="A4" data-from="fw" data-to="sw_dmz"/>
  <circle cx="296" cy="1020" r="13" class="badgeA"/>
  <text x="296" y="1025.04" font-size="14" class="badgeT" text-anchor="middle">A4</text>
  <path d="M270 1110 L270 1130" class="flowA" marker-end="url(#arrA)" data-flow="A5" data-from="sw_dmz" data-to="web"/>
  <circle cx="296" cy="1120" r="13" class="badgeA"/>
  <text x="296" y="1125.04" font-size="14" class="badgeT" text-anchor="middle">A5</text>

  <!-- 자세히: NAT -->
  <rect x="12" y="1726" width="336" height="176" rx="12" class="info"/>
  <rect x="24" y="1738" width="42.4" height="24" rx="12" class="tag"/>
  <text x="45.18" y="1755.04" font-size="14" class="tagT" text-anchor="middle">NAT</text>
  <text x="80" y="1756" font-size="15" class="t b">주소 바꾸기 · 방화벽의 인터넷 쪽</text>
  <text x="24" y="1786" font-size="15" class="t b">들어올 때 (웹 방문)</text>
  <text x="24" y="1808" font-size="14" class="t m">203.0.113.10 → 172.16.10.10</text>
  <text x="24" y="1836" font-size="14" class="t">나갈 때: 직원 PC 주소 → 회사 공인 주소</text>
  <text x="24" y="1860" font-size="14" class="t">내부 구역끼리는 바꾸지 않습니다</text>
  <text x="24" y="1884" font-size="14" class="s b">허용·차단은 하지 않습니다</text>

  <!-- 자세히: 방화벽 규칙 -->
  <rect x="12" y="1918" width="336" height="186" rx="12" class="info"/>
  <rect x="24" y="1930" width="109.6" height="24" rx="12" class="tag"/>
  <text x="78.78" y="1947.04" font-size="14" class="tagT" text-anchor="middle">허용·차단 판단</text>
  <text x="160" y="1948" font-size="15" class="t b">규칙 예시</text>
  <rect x="24" y="1966" width="56" height="24" rx="12" class="allowP"/>
  <path d="M33 1978 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="49" y="1983.04" font-size="14" class="allowT">허용</text>
  <text x="90" y="1983" font-size="14" class="t">인터넷 → 웹 서버 (웹 80·443만)</text>
  <rect x="24" y="2004" width="56" height="24" rx="12" class="denyP"/>
  <path d="M34 2012 l7 8 M41 2012 l-7 8" stroke="#9a2f2f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="49" y="2021.04" font-size="14" class="denyT">차단</text>
  <text x="90" y="2021" font-size="14" class="t">인터넷 → 저장 구역</text>
  <text x="90" y="2043" font-size="14" class="t">인터넷 → 업무망</text>
  <text x="90" y="2065" font-size="14" class="t">DMZ → 업무망</text>
  <text x="24" y="2092" font-size="14" class="s">필요한 다른 연결은 이후 그림에서 봅니다</text>

  <!-- 단순화와 범위 안내 -->
  <text x="12" y="2138" font-size="14" class="s">장비 수와 배치는 기업마다 다릅니다.</text>
  <text x="12" y="2160" font-size="14" class="s">라우터·방화벽·NAT를 한 장비가 맡기도 하고</text>
  <text x="12" y="2182" font-size="14" class="s">스위치 한 대를 구역별로 나눠 쓰기도 합니다.</text>
  <text x="12" y="2212" font-size="14" class="s">IP는 문서용 예시·사설 주소입니다.</text>
  <text x="12" y="2234" font-size="14" class="s">실제 B3-1(AWS) 구성이 아닙니다.</text>
