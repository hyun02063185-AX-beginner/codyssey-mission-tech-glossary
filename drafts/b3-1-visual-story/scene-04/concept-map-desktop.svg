<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" role="img" aria-labelledby="d4T d4D" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="d4T">B3-1 웹사이트는 무엇이 연결되어 인터넷에서 열렸을까? · 노트북용</title>
  <desc id="d4D">B3-1에서 내가 만든 웹사이트는 어떤 기술들이 서로 연결되었기 때문에 인터넷에서 열릴 수 있었을까? Scene 01~03에서 설명한 기술만 모은 핵심 개념지도다. 2026-10-14 배포 기록 기준이며 현재 AWS 상태가 아니다. 노드: 외부 방문자(브라우저로 웹사이트를 여는 사람), VPC(AWS 안에서 논리적으로 격리된 가상 네트워크 (B3-1: 10.0.0.0/16)), Subnet(VPC 주소 범위를 나눈 구역. B3-1은 Public Subnet 10.0.1.0/24 하나), Route Table(Subnet에 연결하는 경로 규칙표 (0.0.0.0/0 → IGW). 패킷이 통과하는 장비가 아니다), IGW(인터넷 게이트웨이. VPC를 인터넷과 연결하고 IPv4 1:1 주소 변환을 한다), Public IPv4(EC2에 자동 할당된 공인 주소 (기록 당시 값은 표시하지 않음)), Private IPv4(ENI에 할당된 Subnet 범위의 사설 주소. EC2는 이 주소만 안다), Security Group(ENI에 적용되는 상태 추적 허용 규칙 (inbound HTTP 80)), ENI(EC2에 연결된 네트워크 인터페이스(VPC 안의 논리적 구성요소)), EC2(웹 서버 프로그램을 실행하는 가상 서버 (Amazon Linux 2023, t3.micro)), Nginx(HTTP 80으로 dist 정적 파일을 제공하는 웹 서버 프로그램), 경로 선택(목적지에 따라 다음 길을 고르는 역할 (일반망: 경계 라우터·방화벽의 구역 사이 길 안내)), 접근 통제(규칙에 맞는 연결만 허용하는 역할 (일반망: 방화벽의 허용·차단 판단)), 주소 변환(공인·사설 주소를 대응시키는 역할 (일반망: NAT)). C1 VPC — Subnet: 포함, 포함. Subnet은 VPC 주소 범위 안의 IP 주소 범위다. C2 Subnet — EC2: 포함, 포함. B3-1의 EC2는 Public Subnet 안에서 실행되었다. C3 EC2 — ENI: 연관, 연결. 연결(attach). ENI는 VPC 안의 논리적 네트워크 구성요소로 EC2에 연결된다. B3-1은 기본(주) ENI만 썼고, 주 ENI는 분리할 수 없다. EC2 안에 들어 있는 부품이 아니므로 '포함'으로 두지 않는다. C4 EC2 — Nginx: 포함, 포함 · 실행. Nginx는 EC2 안에서 실행되는 웹 서버 프로그램이다. C5 IGW — VPC: 연관, VPC에 연결. 연결. IGW를 VPC에 연결해야 VPC와 인터넷이 통신한다. C6 Route Table — Subnet: 연관, Subnet에 연결. 연결(association). Route Table을 Subnet에 연결한다. C7 Route Table — IGW: 연관, 경로 대상. 경로 대상. 0.0.0.0/0 경로의 대상이 IGW다. 이 Route Table에 연결된 Subnet이 Public Subnet이다. C8 Security Group — ENI: 연관, 적용. 적용. SG는 ENI에 적용되는 상태 추적 허용 규칙이다. C9 ENI — Private IPv4: 연관, 할당. 할당. ENI에는 Subnet 범위의 주 사설 IPv4가 있다. EC2는 이 사설 주소만 안다. C10 IGW — Public IPv4: 연관, 주소 변환. 변환 주체. IGW는 Public IPv4로 오는 트래픽의 목적지를 Private IPv4로 바꿔 VPC로 전달한다. 나가는 트래픽은 출발 주소를 Public IPv4로 바꾼다. C11 Public IPv4 — Private IPv4: 연관, 1:1 짝. IGW의 1:1 변환으로 짝지어진 주소 쌍. 비슷한 역할의 '대응'이 아니라, 변환 주체(C10의 IGW)에 의해 맺어지는 관계다. C12 외부 방문자 — Nginx: 흐름, HTTP 80 요청. HTTP 80 요청이 인터넷 → IGW → ENI → Nginx로 간다(03-B W1~W4). 연결 가능 ID: http-request-response, port-80-http. C13 경로 선택 — Route Table: 대응, ≈. 목적지에 따라 다음 대상을 정하는 역할이 비슷하다. Route Table은 장비가 아닌 규칙표다. C14 접근 통제 — Security Group: 대응, ≈. 규칙에 맞는 연결만 허용하고 상태를 추적하는 역할이 비슷하다. 적용 위치가 다르다(구역 경계 / ENI). C15 주소 변환 — IGW: 대응, ≈. 공인 ↔ 사설 주소 대응이라는 역할이 비슷하다. B3-1에서는 IGW가 IPv4 1:1 변환을 제공했다. NAT Gateway가 아니다. 인터넷은 노드가 아니라 요청 경로의 표시다. 학습 순서(지도 밖): L1 Scene 01 구조 → Scene 02 흐름 다음 Scene 03 대응 / L2 공인 주소와 사설 주소의 구분 다음 IGW의 1:1 변환 / L3 경로 선택 ≠ 허용 판단 다음 Route Table과 Security Group이 모두 필요한 이유.</desc>
