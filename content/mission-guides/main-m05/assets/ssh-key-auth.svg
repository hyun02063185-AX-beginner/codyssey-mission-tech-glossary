<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img" aria-labelledby="sshTitle sshDesc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="sshTitle">SSH 키 인증 흐름: 서버 확인과 사용자 확인은 서로 다른 키를 쓴다</title>
  <desc id="sshDesc">왼쪽은 내 컴퓨터(클라이언트), 오른쪽은 EC2 서버다. 내 컴퓨터에는 개인키 파일과 서버 호스트 공개키를 기록한 known_hosts가 있다. 지문은 이 공개키에서 계산해 비교한다. 서버에는 서버 자신의 신분을 나타내는 호스트 키와, 로그인을 허용할 사용자의 공개키 목록이 있다. 첫 번째 단계는 서버 확인이다. 서버가 호스트 공개키를 보내면 클라이언트는 그 공개키에서 지문을 계산해 known_hosts와 비교한다. 두 번째 단계는 사용자 확인이다. 클라이언트는 개인키로 서명을 만들어 공개키와 함께 보내고, 서버는 등록된 공개키로 서명을 검증한 뒤 접속을 허용한다. 개인키 파일 자체는 서버로 전송되지 않는다는 점을 가로줄 친 화살표로 표시한다.</desc>
  <defs>
    <style>
      .t  { fill: var(--text-primary, #18241f); }
      .s  { fill: var(--text-secondary, #52645a); }
      .m  { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .b  { font-weight: 700; }
      .raised { fill: var(--surface-raised, #ffffff); stroke: var(--border-strong, #b5c7bd); stroke-width: 1.5; }
      .soft   { fill: var(--surface-soft, #eef5ef); stroke: var(--border-strong, #b5c7bd); stroke-width: 1.5; }
      .accent { fill: var(--accent-soft, #e6f1e7); stroke: var(--accent-primary, #1d4d42); stroke-width: 2; }
      .life   { stroke: var(--border-strong, #b5c7bd); stroke-width: 2; stroke-dasharray: 4 6; }
      .msg    { stroke: var(--accent-primary, #1d4d42); stroke-width: 3; fill: none; }
      .no     { stroke: #b3261e; stroke-width: 3; fill: none; stroke-dasharray: 9 6; }
      .noT    { fill: #b3261e; font-weight: 700; }
      .head   { fill: var(--accent-primary, #1d4d42); }
      .badge  { fill: var(--accent-primary, #1d4d42); }
      .badgeT { fill: var(--accent-on-primary, #ffffff); font-weight: 700; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
  </defs>

  <!-- 머리말 -->
  <rect x="10" y="8" width="220" height="40" rx="10" class="accent"/>
  <text x="120" y="34" font-size="16" text-anchor="middle" class="t b">내 컴퓨터 (클라이언트)</text>
  <rect x="290" y="8" width="220" height="40" rx="10" class="accent"/>
  <text x="400" y="34" font-size="16" text-anchor="middle" class="t b">EC2 서버</text>

  <!-- 보관 중인 것 -->
  <rect x="10" y="60" width="220" height="74" rx="8" class="raised"/>
  <text x="22" y="82" font-size="14" class="t b">개인키 파일 (.pem)</text>
  <text x="22" y="102" font-size="13" class="s">서명을 만드는 데만 씀</text>
  <text x="22" y="120" font-size="13" class="noT">이 컴퓨터 밖으로 나가지 않음</text>
  <rect x="10" y="144" width="220" height="62" rx="8" class="raised"/>
  <text x="22" y="166" font-size="14" class="t b m">known_hosts</text>
  <text x="22" y="186" font-size="13" class="s">서버 호스트 공개키 기록</text>

  <rect x="290" y="60" width="220" height="74" rx="8" class="raised"/>
  <text x="302" y="82" font-size="14" class="t b">호스트 키 (서버의 신분증)</text>
  <text x="302" y="102" font-size="13" class="s">서버가 “내가 그 서버”임을</text>
  <text x="302" y="120" font-size="13" class="s">증명할 때 씀</text>
  <rect x="290" y="144" width="220" height="62" rx="8" class="raised"/>
  <text x="302" y="166" font-size="14" class="t b">등록된 사용자 공개키</text>
  <text x="302" y="186" font-size="13" class="s">EC2 Key Pair의 공개키</text>

  <!-- 생명선 -->
  <line x1="120" y1="212" x2="120" y2="800" class="life"/>
  <line x1="400" y1="212" x2="400" y2="800" class="life"/>

  <!-- 1단계: 서버 확인 -->
  <rect x="10" y="222" width="500" height="34" rx="8" class="soft"/>
  <circle cx="30" cy="239" r="11" class="badge"/><text x="30" y="244" font-size="13" text-anchor="middle" class="badgeT">1</text>
  <text x="50" y="245" font-size="15" class="t b">서버가 진짜인지 확인 (호스트 인증)</text>

  <text x="260" y="286" font-size="13" text-anchor="middle" class="t">서버의 호스트 공개키</text>
  <line x1="396" y1="296" x2="124" y2="296" class="msg" marker-end="url(#arr)"/>
  <rect x="24" y="316" width="190" height="64" rx="8" class="raised"/>
  <text x="34" y="338" font-size="13" class="t">지문 계산 후 비교</text>
  <text x="34" y="357" font-size="13" class="s">처음: 공개키를 확인 후 저장</text>
  <text x="34" y="374" font-size="13" class="s">달라짐: 경고 → 이유 확인</text>

  <!-- 2단계: 사용자 확인 -->
  <rect x="10" y="404" width="500" height="34" rx="8" class="soft"/>
  <circle cx="30" cy="421" r="11" class="badge"/><text x="30" y="426" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <text x="50" y="427" font-size="15" class="t b">내가 그 사용자인지 확인 (사용자 인증)</text>

  <rect x="24" y="450" width="190" height="64" rx="8" class="raised"/>
  <text x="34" y="472" font-size="13" class="t">개인키로 서명을 만든다</text>
  <text x="34" y="491" font-size="13" class="s">이 연결의 세션 ID와</text>
  <text x="34" y="508" font-size="13" class="s">사용자 이름 등을 서명</text>

  <text x="260" y="552" font-size="13" text-anchor="middle" class="t">내 공개키 + 서명 (개인키는 안 보냄)</text>
  <line x1="124" y1="562" x2="396" y2="562" class="msg" marker-end="url(#arr)"/>

  <rect x="306" y="580" width="196" height="64" rx="8" class="raised"/>
  <text x="316" y="602" font-size="13" class="t">등록된 공개키로 서명 검증</text>
  <text x="316" y="621" font-size="13" class="s">맞으면 “그 개인키를 가진</text>
  <text x="316" y="638" font-size="13" class="s">사람”으로 인정</text>

  <text x="260" y="676" font-size="13" text-anchor="middle" class="t">인증 성공 → 셸 접속 허용</text>
  <line x1="396" y1="686" x2="124" y2="686" class="msg" marker-end="url(#arr)"/>

  <!-- 보내지 않는 것 -->
  <text x="260" y="724" font-size="13" text-anchor="middle" class="noT">개인키 파일 자체</text>
  <line x1="124" y1="734" x2="396" y2="734" class="no"/>
  <path d="M250 724 l20 20 m0 -20 l-20 20" stroke="#b3261e" stroke-width="3" fill="none" transform="translate(0,4)"/>
  <text x="260" y="772" font-size="13" text-anchor="middle" class="s">✕ 어느 단계에서도 전송되지 않는다</text>
  <text x="260" y="794" font-size="13" text-anchor="middle" class="s">서버로 가는 것: 공개키 · 서명 · 사용자 이름</text>
</svg>
