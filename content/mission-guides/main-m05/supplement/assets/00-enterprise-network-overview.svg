<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 800" width="1144" height="800" role="img" aria-labelledby="f0T f0D" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="f0T">그림 0 기업 홈페이지 전체 구성도 (설명용 예시)</title>
  <desc id="f0D">가로로 넓은 기업 홈페이지 전체 구성도이며 설명용 예시이다. 실제 B3-1에 직원 업무망, 게시 시스템, DB가 있다는 뜻이 아니다. 왼쪽에서 오른쪽으로 인터넷 구역의 방문자, 경계 구역의 경계 라우터와 방화벽·NAT, 오른쪽의 세 구역이 놓여 있다. 오른쪽 세 구역은 위에서 아래로 공개 서비스 구역(DMZ), 자료 저장 구역, 내부 업무망이다. 각 구역 안에는 스위치와 해당 서버 또는 PC가 있다. DMZ에는 공개 웹 서버, 저장 구역에는 DB와 파일 저장소, 내부 업무망에는 관리 화면 서버와 직원 PC가 있다. 색 면은 구역 경계이고 회색 선은 실제 연결이다. 방화벽·NAT는 DMZ 쪽, 저장 쪽, 업무망 쪽 세 연결 지점을 가지며 모든 구역 사이 연결은 이 장비를 거친다. 방문자 접속(A)은 실선이며 A1 방문자에서 경계 라우터, A2 방화벽·NAT, A3 DMZ 스위치, A4 공개 웹 서버로 가고 웹 80·443만 허용한다. 웹 서버의 자료 조회(C)는 점선이며 방문자 요청 때 C1 웹 서버에서 DMZ 스위치, C2 방화벽·NAT, C3 저장 구역 스위치, C4 DB로 가고 조회용 포트만 허용한다. 직원 게시(B)는 긴 점선이며 B1 직원 PC에서 업무망 스위치, B2 관리 화면 서버로 가고, B3 관리 화면 서버가 저장 연결을 시작해 다시 스위치로 보내고, B4 방화벽·NAT, B5 저장 구역 스위치, B6 DB와 B7 파일 저장소로 가며 저장용 포트만 허용한다. 직원 PC와 관리 화면 서버는 같은 업무망이라 스위치만 거친다. 화살표는 연결을 먼저 시작하는 방향이고 허용된 연결의 응답은 반대 방향으로 가지만 실제 경로와 장비 순서는 기업마다 다르다. 인터넷에서 저장 구역과 업무망으로 먼저 연결하는 것과 DMZ에서 업무망으로 먼저 연결하는 것은 기본 차단한다. 선 모양은 흐름을 구분하는 표시이며 응답과 무관하다. 장비 배치와 수는 기업마다 다르고 IP는 모두 설명용 예시이다.</desc>
