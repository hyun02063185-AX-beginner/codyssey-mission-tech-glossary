<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1308" width="360" height="1308" role="img" aria-labelledby="f1T f1D" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="f1T">그림 1 기업 홈페이지 예시의 전체 네트워크 구역도</title>
  <desc id="f1D">설명용 기업망 예시이며 모든 회사의 표준 배치가 아니다. 위에서 아래로 인터넷, 방화벽·라우터 경계 장비, 공개 서비스 구역(DMZ), 서비스·자료 저장 구역, 내부 업무망이 있다. 인터넷의 방문자 브라우저는 공인 IP를 가진다. 경계 장비는 방화벽의 허용 판단, 라우터의 경로 선택, NAT의 주소 대응을 맡되 놓이는 위치와 장비 수는 기업마다 다르다. DMZ에는 공개 웹 서버와 스위치가 있고 인터넷에서 웹 80·443만 허용하며 DMZ에서 업무망으로 먼저 연결하는 것은 기본 차단한다. 저장 구역에는 DB와 파일 저장소가 있고 웹 서버의 조회용 포트와 업무망 관리 서버의 저장용 포트만 허용하며 인터넷에서의 직접 접속은 차단한다. 내부 업무망에는 직원 PC, 관리 화면 서버, 스위치가 있고 인터넷에서 먼저 연결하는 것은 차단하며 직원의 인터넷 웹 이용은 NAT를 거쳐 허용한다. 선은 연결된 통로일 뿐 이동 방향이 아니며, 실제 이동 순서는 그림 2와 3에서 본다.</desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .t  { fill: #18241f; }
      .s  { fill: #4a5c52; }
      .m  { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .b  { font-weight: 700; }
      .raised { fill: #ffffff; stroke: #8fa89b; stroke-width: 1.5; }
      .soft   { fill: #eef5ef; stroke: #8fa89b; stroke-width: 1.5; }
      .dmz    { fill: #fff6e0; stroke: #a8741a; stroke-width: 1.5; }
      .store  { fill: #e9eefb; stroke: #4a5fa8; stroke-width: 1.5; }
      .accent { fill: #e0efe3; stroke: #1d4d42; stroke-width: 2; }
      .gray   { fill: #f2f2f2; stroke: #8a8a8a; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .req    { stroke: #1d4d42; stroke-width: 3; fill: none; }
      .res    { stroke: #7a4a00; stroke-width: 3; fill: none; stroke-dasharray: 8 5; }
      .link   { stroke: #6b7d73; stroke-width: 2; fill: none; }
      .note   { stroke: #6b7d73; stroke-width: 1.5; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
      .badge  { fill: #1d4d42; }
      .badgeT { fill: #ffffff; font-weight: 700; }
      .allowP { fill: #1d4d42; }
      .allowT { fill: #ffffff; font-weight: 700; }
      .denyP  { fill: #ffffff; stroke: #9a2f2f; stroke-width: 1.8; stroke-dasharray: 3 2; }
      .denyT  { fill: #9a2f2f; font-weight: 700; }
      .hReq { fill: #1d4d42; }
      .hRes { fill: #7a4a00; }
      .hLink { fill: #6b7d73; }
    </style>
    <marker id="hReq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="hReq"/></marker>
    <marker id="hRes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="hRes"/></marker>
    <marker id="hLink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="hLink"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="1308"/>
  <text x="12" y="26" font-size="16" class="t b">그림 1 · 기업 홈페이지 예시: 전체 구역도</text>
  <text x="12" y="47" font-size="13" class="s">설명용 예시입니다. 모든 회사의 표준 배치가 아닙니다.</text>
  <rect x="12" y="60" width="336" height="92" rx="12" class="soft"/>
  <text x="24" y="82" font-size="15" class="t b">인터넷 (회사 밖)</text>
  <rect x="24" y="92" width="312" height="50" rx="8" class="raised"/>
  <text x="36" y="113" font-size="14" class="t b">방문자의 PC·휴대폰 브라우저</text>
  <text x="36" y="133" font-size="13" class="s">공인 IP 198.51.100.7 (예시)</text>
  <path d="M180 152 V172" class="link"/>
  <rect x="12" y="172" width="336" height="128" rx="12" class="accent"/>
  <text x="24" y="195" font-size="15" class="t b">방화벽 · 라우터 (구역 사이 출입구)</text>
  <text x="24" y="218" font-size="13" class="t">방화벽: 규칙에 맞는 연결만 허용</text>
  <text x="24" y="238" font-size="13" class="t">라우터: 경로표로 다음 길을 고름</text>
  <text x="24" y="258" font-size="13" class="t">NAT: 공인 IP ↔ 사설 IP를 대응</text>
  <text x="24" y="284" font-size="13" class="s">놓이는 위치와 장비 수는 기업마다 다름</text>
  <path d="M24 300 V898" class="link"/>
  <path d="M24 342 H40" class="link"/>
  <path d="M24 628 H40" class="link"/>
  <path d="M24 898 H40" class="link"/>
  <rect x="40" y="322" width="308" height="270" rx="12" class="dmz"/>
  <text x="52" y="345" font-size="15" class="t b">공개 서비스 구역 (DMZ)</text>
  <text x="52" y="365" font-size="13" class="s">서브넷 172.16.10.0/24 (예시)</text>
  <rect x="52" y="376" width="284" height="90" rx="8" class="raised"/>
  <text x="64" y="397" font-size="14" class="t b">공개 웹 서버</text>
  <text x="64" y="417" font-size="13" class="t">역할: 홈페이지 요청에 응답</text>
  <text x="64" y="435" font-size="13" class="t">NIC의 사설 IP 172.16.10.10</text>
  <text x="64" y="453" font-size="13" class="t">밖에서는 공인 203.0.113.10 으로 보임</text>
  <rect x="52" y="474" width="284" height="28" rx="8" class="raised"/>
  <text x="64" y="493" font-size="13" class="t">스위치: 같은 구역 안 장비를 연결</text>
  <rect x="52" y="512" width="54" height="22" rx="11" class="allowP"/>
  <path d="M60 523 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="528" font-size="13" class="allowT">허용</text>
  <text x="114" y="527" font-size="13" class="t">인터넷 → 웹 서버</text>
  <text x="114" y="545" font-size="13" class="s">웹(TCP 80·443)만</text>
  <rect x="52" y="552" width="54" height="22" rx="11" class="denyP"/>
  <path d="M61 559 l7 8 M68 559 l-7 8" stroke="#9a2f2f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="77" y="568" font-size="13" class="denyT">차단</text>
  <text x="114" y="567" font-size="13" class="t">DMZ → 내부 업무망</text>
  <text x="114" y="585" font-size="13" class="s">먼저 연결 시작 기본 차단</text>
  <rect x="40" y="610" width="308" height="256" rx="12" class="store"/>
  <text x="52" y="633" font-size="15" class="t b">서비스·자료 저장 구역</text>
  <text x="52" y="653" font-size="13" class="s">서브넷 10.20.30.0/24 (예시)</text>
  <rect x="52" y="664" width="140" height="72" rx="8" class="raised"/>
  <text x="62" y="685" font-size="14" class="t b">DB</text>
  <text x="62" y="705" font-size="13" class="t">공지 글과</text>
  <text x="62" y="723" font-size="13" class="t">게시 상태 저장</text>
  <rect x="200" y="664" width="136" height="72" rx="8" class="raised"/>
  <text x="210" y="685" font-size="14" class="t b">파일 저장소</text>
  <text x="210" y="705" font-size="13" class="t">공지에 붙는</text>
  <text x="210" y="723" font-size="13" class="t">이미지 파일 저장</text>
  <rect x="52" y="746" width="54" height="22" rx="11" class="allowP"/>
  <path d="M60 757 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="762" font-size="13" class="allowT">허용</text>
  <text x="114" y="761" font-size="13" class="t">웹 서버 → 저장 구역</text>
  <text x="114" y="779" font-size="13" class="s">조회용 포트만</text>
  <rect x="52" y="786" width="54" height="22" rx="11" class="allowP"/>
  <path d="M60 797 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="802" font-size="13" class="allowT">허용</text>
  <text x="114" y="801" font-size="13" class="t">업무망 관리 서버 → 저장</text>
  <text x="114" y="819" font-size="13" class="s">저장용 포트만</text>
  <rect x="52" y="826" width="54" height="22" rx="11" class="denyP"/>
  <path d="M61 833 l7 8 M68 833 l-7 8" stroke="#9a2f2f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="77" y="842" font-size="13" class="denyT">차단</text>
  <text x="114" y="841" font-size="13" class="t">인터넷 → 저장 구역</text>
  <text x="114" y="859" font-size="13" class="s">직접 접속 불가</text>
  <rect x="40" y="880" width="308" height="258" rx="12" class="soft"/>
  <text x="52" y="903" font-size="15" class="t b">내부 업무망</text>
  <text x="52" y="923" font-size="13" class="s">서브넷 192.168.10.0/24 (예시)</text>
  <rect x="52" y="934" width="136" height="78" rx="8" class="raised"/>
  <text x="62" y="955" font-size="14" class="t b">직원 PC</text>
  <text x="62" y="975" font-size="13" class="t">192.168.10.25</text>
  <text x="62" y="993" font-size="13" class="t">공지·이미지 작성</text>
  <rect x="200" y="934" width="136" height="78" rx="8" class="raised"/>
  <text x="210" y="955" font-size="14" class="t b">관리 화면 서버</text>
  <text x="210" y="975" font-size="13" class="t">192.168.10.50</text>
  <text x="210" y="993" font-size="13" class="t">게시 화면 제공</text>
  <rect x="52" y="1022" width="284" height="28" rx="8" class="raised"/>
  <text x="64" y="1041" font-size="13" class="t">스위치: 같은 업무망 안 장비를 연결</text>
  <rect x="52" y="1060" width="54" height="22" rx="11" class="denyP"/>
  <path d="M61 1067 l7 8 M68 1067 l-7 8" stroke="#9a2f2f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="77" y="1076" font-size="13" class="denyT">차단</text>
  <text x="114" y="1075" font-size="13" class="t">인터넷 → 업무망</text>
  <text x="114" y="1093" font-size="13" class="s">밖에서 먼저 연결 불가</text>
  <rect x="52" y="1100" width="54" height="22" rx="11" class="allowP"/>
  <path d="M60 1111 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="77" y="1116" font-size="13" class="allowT">허용</text>
  <text x="114" y="1115" font-size="13" class="t">업무망 → 인터넷</text>
  <text x="114" y="1133" font-size="13" class="s">직원의 웹 이용 (NAT 거침)</text>
  <rect x="12" y="1150" width="336" height="148" rx="12" class="raised"/>
  <text x="24" y="1174" font-size="14" class="t b">읽는 법</text>
  <text x="24" y="1194" font-size="13" class="t">색 구역 = 위치 · 상자 속 글 = 역할</text>
  <text x="24" y="1212" font-size="13" class="t">허용/차단 = 그 방향으로 먼저 연결을</text>
  <text x="24" y="1230" font-size="13" class="t">시작할 수 있는가 (응답은 되돌아옴)</text>
  <text x="24" y="1250" font-size="13" class="t">가는 선 = 연결된 통로 (방향 없음)</text>
  <text x="24" y="1270" font-size="13" class="t">실제 이동 순서는 그림 2·3의 번호 화살표</text>
  <text x="24" y="1288" font-size="13" class="t">로 봅니다. IP 값은 모두 설명용 예시입니다.</text>
</svg>
