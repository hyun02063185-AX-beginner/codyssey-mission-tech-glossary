<svg xmlns="http://www.w3.org/2000/svg" class="v01" viewBox="0 0 480 890" width="480" height="890" role="img" aria-labelledby="v01Title v01Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v01Title">V01 웹페이지를 만드는 세 가지 역할: HTML 내용, CSS 모양, JavaScript 동작</title>
  <desc id="v01Desc">세 부분으로 이루어진 구조도. 첫째, 프로젝트 폴더 안의 파일. index.html이 가장 먼저 읽히는 문서이고, 점선 화살표로 css/style.css를 link로, js/main.js를 defer가 붙은 script로, images 폴더의 그림을 img로 불러온다. 둘째, 브라우저가 읽는 순서. 1번 HTML을 읽고 구조(DOM)를 만든다, 2번 CSS 모양 규칙을 적용한다, 3번 HTML을 다 읽은 뒤 JavaScript를 실행해 동작을 연결한다, 4번 화면에 표시한다. 셋째, 모바일 화면 하나를 세 역할로 나눈다. 햄버거 메뉴를 누르면 메뉴가 열리는 것은 JavaScript의 동작, 제목과 문장은 HTML의 내용, 배경색과 글자 크기와 카드 모양은 CSS의 모양이다. 일반화한 구성 예이며 실제 프로젝트의 파일 이름은 다를 수 있다.</desc>
  <defs>
    <style>
      .v01 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff;
             --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
        .v01 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15;
               --g-h:#74d6b8; --g-hs:#1b3b32; --g-c:#f2b862; --g-cs:#3b2c12; --g-j:#bdb0ff; --g-js:#2c2655; }
      }
      .v01 .bg     { fill: var(--surface-page, var(--g-page)); }
      .v01 .t      { fill: var(--text-primary, var(--g-text)); }
      .v01 .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v01 .b      { font-weight: 700; }
      .v01 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v01 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v01 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v01 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v01 .refH   { fill: var(--text-secondary, var(--g-sub)); }
      .v01 .lead   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v01 .step   { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v01 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .num    { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .numT   { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v01 .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
      .v01 .fC     { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v01 .fJ     { fill: var(--g-js); stroke: var(--g-j); stroke-width: 2; }
      .v01 .bH     { fill: var(--g-h); }
      .v01 .bC     { fill: var(--g-c); }
      .v01 .bJ     { fill: var(--g-j); }
      .v01 .bT     { fill: var(--g-page); font-weight: 700; }
      .v01 .tH     { fill: var(--g-h); }
      .v01 .tC     { fill: var(--g-c); }
      .v01 .tJ     { fill: var(--g-j); }
    </style>
    <marker id="v01ArrRef" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="refH"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="480" height="890"/>
  <text x="16" y="26" font-size="17" class="t b">V01 · 웹페이지를 만드는 세 가지 역할</text>
  <text x="16" y="46" font-size="14" class="s">일반화한 구성 예입니다. 내 프로젝트의 파일 이름은 다를 수 있습니다.</text>

  <!-- ① 파일 -->
  <rect x="6" y="60" width="468" height="254" rx="12" class="soft"/>
  <text x="18" y="84" font-size="15" class="t b">① 프로젝트 폴더 안의 파일들</text>

  <rect x="130" y="96" width="220" height="66" rx="10" class="fH"/>
  <text x="240" y="120" font-size="15" text-anchor="middle" class="t m b">index.html</text>
  <text x="240" y="139" font-size="13" text-anchor="middle" class="t">내용과 구조를 적은 문서</text>
  <text x="240" y="155" font-size="13" text-anchor="middle" class="s">브라우저가 가장 먼저 읽음</text>
  <rect x="118" y="117" width="24" height="24" rx="5" class="bH"/><text x="130" y="134" font-size="15" text-anchor="middle" class="bT">H</text>

  <!-- 불러옴(점선 = 참조 관계) -->
  <line x1="240" y1="162" x2="240" y2="178" class="ref"/>
  <path d="M84 178 H396" class="ref"/>
  <line x1="84"  y1="178" x2="84"  y2="204" class="ref" marker-end="url(#v01ArrRef)"/>
  <line x1="240" y1="178" x2="240" y2="204" class="ref" marker-end="url(#v01ArrRef)"/>
  <line x1="396" y1="178" x2="396" y2="204" class="ref" marker-end="url(#v01ArrRef)"/>
  <text x="94"  y="197" font-size="13" class="t m">&lt;link&gt;</text>
  <text x="250" y="197" font-size="13" class="t m">&lt;script defer&gt;</text>
  <text x="406" y="197" font-size="13" class="t m">&lt;img&gt;</text>

  <rect x="12" y="208" width="144" height="92" rx="10" class="fC"/>
  <text x="84" y="234" font-size="14" text-anchor="middle" class="t m b">css/style.css</text>
  <text x="84" y="255" font-size="13" text-anchor="middle" class="t">모양을 정한 파일</text>
  <text x="84" y="273" font-size="13" text-anchor="middle" class="s">색·크기·배치 규칙</text>
  <circle cx="26" cy="212" r="13" class="bC"/><text x="26" y="217" font-size="15" text-anchor="middle" class="bT">C</text>

  <rect x="168" y="208" width="144" height="92" rx="10" class="fJ"/>
  <text x="240" y="234" font-size="14" text-anchor="middle" class="t m b">js/main.js</text>
  <text x="240" y="255" font-size="13" text-anchor="middle" class="t">동작을 적은 파일</text>
  <text x="240" y="273" font-size="13" text-anchor="middle" class="s">클릭·스크롤에 반응</text>
  <polygon points="182,198 195,212 182,226 169,212" class="bJ"/><text x="182" y="217" font-size="14" text-anchor="middle" class="bT">J</text>

  <rect x="324" y="208" width="144" height="92" rx="10" class="raised"/>
  <text x="396" y="234" font-size="14" text-anchor="middle" class="t m b">images/</text>
  <text x="396" y="255" font-size="13" text-anchor="middle" class="t">사진·그림 파일</text>
  <text x="396" y="273" font-size="13" text-anchor="middle" class="s">내용에 끼워 넣는 자료</text>

  <!-- ② 순서 -->
  <text x="16" y="342" font-size="15" class="t b">② 브라우저가 읽고 실행하는 순서 (단순화)</text>
  <rect x="9"   y="354" width="102" height="94" rx="10" class="step"/>
  <rect x="129" y="354" width="102" height="94" rx="10" class="step"/>
  <rect x="249" y="354" width="102" height="94" rx="10" class="step"/>
  <rect x="369" y="354" width="102" height="94" rx="10" class="step"/>
  <text x="60"  y="386" font-size="14" text-anchor="middle" class="t b">HTML</text>
  <text x="60"  y="406" font-size="13" text-anchor="middle" class="t">읽고 구조를</text>
  <text x="60"  y="424" font-size="13" text-anchor="middle" class="t">만든다(DOM)</text>
  <text x="180" y="386" font-size="14" text-anchor="middle" class="t b">CSS</text>
  <text x="180" y="406" font-size="13" text-anchor="middle" class="t">모양 규칙을</text>
  <text x="180" y="424" font-size="13" text-anchor="middle" class="t">적용한다</text>
  <text x="300" y="386" font-size="14" text-anchor="middle" class="t b">JavaScript</text>
  <text x="300" y="406" font-size="13" text-anchor="middle" class="t">다 읽은 뒤 실행</text>
  <text x="300" y="424" font-size="13" text-anchor="middle" class="t">동작을 연결</text>
  <text x="420" y="386" font-size="14" text-anchor="middle" class="t b">화면</text>
  <text x="420" y="406" font-size="13" text-anchor="middle" class="t">사용자가 보는</text>
  <text x="420" y="424" font-size="13" text-anchor="middle" class="t">결과</text>
  <circle cx="22"  cy="354" r="11" class="num"/><text x="22"  y="359" font-size="13" text-anchor="middle" class="numT">1</text>
  <circle cx="142" cy="354" r="11" class="num"/><text x="142" y="359" font-size="13" text-anchor="middle" class="numT">2</text>
  <circle cx="262" cy="354" r="11" class="num"/><text x="262" y="359" font-size="13" text-anchor="middle" class="numT">3</text>
  <circle cx="382" cy="354" r="11" class="num"/><text x="382" y="359" font-size="13" text-anchor="middle" class="numT">4</text>
  <polygon points="113,392 127,401 113,410" class="tri"/>
  <polygon points="233,392 247,401 233,410" class="tri"/>
  <polygon points="353,392 367,401 353,410" class="tri"/>
  <text x="16" y="470" font-size="13" class="s">▶ 는 읽고 실행하는 순서입니다. 실제 브라우저는 더 많은 일을 합니다.</text>

  <!-- ③ 화면 분해 -->
  <text x="16" y="506" font-size="15" class="t b">③ 화면 한 장을 세 역할로 나눠 보기</text>
  <rect x="16" y="518" width="176" height="316" rx="20" class="raised" stroke-width="2.5"/>
  <rect x="26" y="530" width="156" height="34" rx="7" class="soft"/>
  <text x="36" y="552" font-size="14" class="t b">김코디</text>
  <rect x="150" y="538" width="20" height="3.5" rx="1.5" class="tri"/>
  <rect x="150" y="545" width="20" height="3.5" rx="1.5" class="tri"/>
  <rect x="150" y="552" width="20" height="3.5" rx="1.5" class="tri"/>
  <text x="36" y="598" font-size="16" class="t b">안녕하세요,</text>
  <text x="36" y="618" font-size="13" class="s">저는 김코디입니다</text>
  <rect x="36" y="630" width="88" height="26" rx="13" class="step"/>
  <text x="80" y="648" font-size="13" text-anchor="middle" class="t b">더 보기</text>
  <rect x="26" y="672" width="156" height="68" rx="9" class="soft"/>
  <text x="38" y="696" font-size="13" class="t b">Project 1</text>
  <text x="38" y="716" font-size="13" class="s">설명 한 줄</text>
  <rect x="26" y="750" width="156" height="68" rx="9" class="soft"/>
  <text x="38" y="774" font-size="13" class="t b">Project 2</text>
  <text x="38" y="794" font-size="13" class="s">설명 한 줄</text>

  <!-- 표식 + 지시선 -->
  <polygon points="192,532 205,545 192,558 179,545" class="bJ"/><text x="192" y="550" font-size="13" text-anchor="middle" class="bT">J</text>
  <line x1="206" y1="545" x2="236" y2="545" class="lead"/>
  <rect x="236" y="518" width="238" height="54" rx="9" class="fJ"/>
  <text x="248" y="540" font-size="14" class="tJ b">동작 — JavaScript</text>
  <text x="248" y="560" font-size="13" class="t">☰를 누르면 메뉴가 열림</text>

  <rect x="180" y="586" width="24" height="24" rx="5" class="bH"/><text x="192" y="603" font-size="15" text-anchor="middle" class="bT">H</text>
  <line x1="204" y1="598" x2="236" y2="598" class="lead"/>
  <rect x="236" y="578" width="238" height="54" rx="9" class="fH"/>
  <text x="248" y="600" font-size="14" class="tH b">내용 — HTML</text>
  <text x="248" y="620" font-size="13" class="t">제목·문장·메뉴 글씨</text>

  <circle cx="192" cy="706" r="13" class="bC"/><text x="192" y="711" font-size="15" text-anchor="middle" class="bT">C</text>
  <line x1="205" y1="706" x2="236" y2="706" class="lead"/>
  <rect x="236" y="668" width="238" height="76" rx="9" class="fC"/>
  <text x="248" y="690" font-size="14" class="tC b">모양 — CSS</text>
  <text x="248" y="710" font-size="13" class="t">배경색·글자 크기·카드 모양</text>
  <text x="248" y="728" font-size="13" class="t">메뉴·카드를 놓는 위치</text>

  <!-- 읽는 법 -->
  <rect x="236" y="758" width="238" height="76" rx="9" class="raised"/>
  <text x="248" y="780" font-size="13" class="t b">그림 읽는 법</text>
  <line x1="248" y1="796" x2="282" y2="796" class="ref"/><text x="290" y="801" font-size="13" class="s">파일이 파일을 불러옴</text>
  <polygon points="248,808 262,816 248,824" class="tri"/><text x="290" y="822" font-size="13" class="s">읽고 실행하는 순서</text>

  <text x="16" y="862" font-size="13" class="s">H·C·J는 색뿐 아니라 모양(네모·동그라미·마름모)과 글자로도 구분됩니다.</text>
  <text x="16" y="880" font-size="13" class="s">같은 화면이라도 세 파일이 서로 다른 일을 맡아 협력합니다.</text>
</svg>
