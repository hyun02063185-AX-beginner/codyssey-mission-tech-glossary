      .v01 .bH     { fill: var(--g-h); } .v01 .bC { fill: var(--g-c); } .v01 .bJ { fill: var(--g-j); }
      .v01 .bT     { fill: var(--g-page); font-weight: 700; }
      .v01 .tH     { fill: var(--g-h); } .v01 .tC { fill: var(--g-c); } .v01 .tJ { fill: var(--g-j); }
      .v01 .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v01 .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v01 .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
    </style>
