<svg xmlns="http://www.w3.org/2000/svg" class="v01" viewBox="0 0 360 1142" width="540" height="1713" role="img" aria-labelledby="v01Title v01Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v01Title">V01 웹페이지를 만드는 세 가지 역할: HTML 내용, CSS 모양, JavaScript 동작</title>
  <desc id="v01Desc">세 부분으로 이루어진 구조도. 첫째, 프로젝트 폴더 안의 파일. index.html이 가장 먼저 읽히는 문서이고, 점선 화살표로 style.css를 link로, main.js를 defer가 붙은 script로, images 폴더의 그림을 img로 불러온다. 둘째, 브라우저가 읽는 순서. 1번 HTML을 읽고 구조(DOM)를 만든다, 2번 CSS를 적용해 모양 규칙을 정한다, 3번 JavaScript로 동작을 연결하며 defer 덕분에 HTML을 다 읽은 뒤 실행된다, 4번 화면에 표시한다. 셋째, 모바일 화면 하나를 세 역할로 나눈다. 햄버거 메뉴를 누르면 메뉴가 열리는 것은 JavaScript의 동작, 제목과 문장은 HTML의 내용, 배경색과 글자 크기와 카드 모양은 CSS의 모양이다. 일반화한 구성 예이며 실제 프로젝트의 파일 이름은 다를 수 있다.</desc>
  <defs>
    <style>
      .v01 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a3a2e; --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
