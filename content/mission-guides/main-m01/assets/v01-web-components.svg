      .v01 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v01 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v01 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v01 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v01 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v01 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v01 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v01 .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v01 .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v01 .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v01 .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v01 .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v01 .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v01 .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v01 .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
