      .v07 .w      { fill: var(--g-warn); }
      .v07 .b      { font-weight: 700; }
      .v07 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v07 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v07 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v07 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v07 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v07 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v07 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v07 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v07 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v07 .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v07 .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v07 .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v07 .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v07 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v07 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v07 .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v07 .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v07 .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v07 .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
      .v07 .chip   { fill: var(--surface-page, var(--g-page)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; }
      .v07 .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
      .v07 .fC     { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v07 .fJ     { fill: var(--g-js); stroke: var(--g-j); stroke-width: 2; }
      .v07 .bH     { fill: var(--g-h); } .v07 .bC { fill: var(--g-c); } .v07 .bJ { fill: var(--g-j); }
      .v07 .bT     { fill: var(--g-page); font-weight: 700; }
      .v07 .tH     { fill: var(--g-h); } .v07 .tC { fill: var(--g-c); } .v07 .tJ { fill: var(--g-j); }
      .v07 .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v07 .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v07 .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
      .v07 .store  { fill: var(--surface-raised, var(--g-raised)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; stroke-dasharray: 6 4; }
      .v07 .errBox { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .v07 .okBox  { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; }
      .v07 .wT     { fill: var(--g-warn); font-weight: 700; }
      .v07 .dim    { fill: none; stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 4; }
      .v07 .dimT   { fill: var(--text-secondary, var(--g-sub)); opacity: .75; }
      .v07 .solid  { fill: var(--accent-primary, var(--g-accent)); }
      .v07 .solidT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v07 .warnSolid { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; }
      .v07 .wline  { stroke: var(--g-warn); stroke-width: 2.5; fill: none; }
      .v07 .twoway { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
    </style>
    <marker id="v07ArrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
    <marker id="v07ArrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headP"/></marker>
    <marker id="v07ArrRS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="1192"/>
  <text x="16" y="26" font-size="16" class="t b">V07 · GitHub 데이터가 화면에 오기까지</text>
  <text x="16" y="46" font-size="13" class="s">브라우저와 GitHub API의 요청·응답</text>
  <text x="16" y="63" font-size="13" class="s">(교육용 단순화 모델)</text>
  <rect x="8" y="74" width="104" height="48" rx="10" class="accent"/>
  <text x="60" y="95" font-size="14" text-anchor="middle" class="t b">JavaScript</text>
  <text x="60" y="113" font-size="13" text-anchor="middle" class="s">내 코드</text>
  <rect x="128" y="74" width="104" height="48" rx="10" class="raised"/>
  <text x="180" y="95" font-size="14" text-anchor="middle" class="t b">브라우저</text>
  <text x="180" y="113" font-size="13" text-anchor="middle" class="s">fetch가 요청</text>
  <rect x="248" y="74" width="104" height="48" rx="10" class="raised"/>
  <text x="300" y="95" font-size="14" text-anchor="middle" class="t b">GitHub API</text>
  <text x="300" y="113" font-size="13" text-anchor="middle" class="s">외부 서비스</text>
  <line x1="60" y1="126" x2="60" y2="900" class="life"/>
  <line x1="180" y1="126" x2="180" y2="900" class="life"/>
  <line x1="300" y1="126" x2="300" y2="900" class="life"/>
  <circle cx="60" cy="142" r="11" class="badge"/>
  <text x="60" y="147" font-size="13" text-anchor="middle" class="badgeT">1</text>
  <path d="M71 142 H98 V164 H73" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="170" width="348" height="46" rx="0" class="bg"/>
  <text x="16" y="188" font-size="14" class="t b">① 로딩 상태를 먼저 보여 준다</text>
  <text x="16" y="206" font-size="13" class="s">“불러오는 중…” 안내를 화면에 표시</text>
  <circle cx="60" cy="248" r="11" class="badge"/>
  <text x="60" y="253" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <line x1="71" y1="248" x2="170" y2="248" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="276" width="348" height="46" rx="0" class="bg"/>
  <text x="16" y="294" font-size="14" class="t b">② fetch(주소)를 호출한다</text>
  <text x="16" y="312" font-size="13" class="s">await로 응답을 기다리기 시작함</text>
  <circle cx="180" cy="354" r="11" class="badge"/>
  <text x="180" y="359" font-size="13" text-anchor="middle" class="badgeT">3</text>
  <line x1="191" y1="354" x2="290" y2="354" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="382" width="348" height="46" rx="0" class="bg"/>
  <text x="16" y="400" font-size="14" class="t b">③ HTTP 요청(GET)을 보낸다</text>
  <text x="16" y="418" font-size="13" class="s">예: api.github.com/users/이름/repos</text>
  <circle cx="300" cy="460" r="11" class="badge"/>
  <text x="300" y="465" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <line x1="289" y1="460" x2="190" y2="460" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="488" width="348" height="64" rx="0" class="bg"/>
  <text x="16" y="506" font-size="14" class="t b">④ 상태 코드와 JSON으로 응답한다</text>
  <text x="16" y="524" font-size="13" class="s">200 성공, 403·404 등도 모두</text>
  <text x="16" y="542" font-size="13" class="s">‘도착한 응답’입니다.</text>
  <circle cx="180" cy="584" r="11" class="badge"/>
  <text x="180" y="589" font-size="13" text-anchor="middle" class="badgeT">5</text>
  <line x1="169" y1="584" x2="70" y2="584" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="612" width="348" height="46" rx="0" class="bg"/>
  <text x="16" y="630" font-size="14" class="t b">⑤ 응답을 JavaScript에 넘긴다</text>
  <text x="16" y="648" font-size="13" class="s">await가 끝나고 Response를 받음</text>
  <circle cx="60" cy="690" r="11" class="badge"/>
  <text x="60" y="695" font-size="13" text-anchor="middle" class="badgeT">6</text>
  <path d="M71 690 H98 V712 H73" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="718" width="348" height="64" rx="0" class="bg"/>
  <text x="16" y="736" font-size="14" class="t b">⑥ 확인하고 데이터를 가공한다</text>
  <text x="16" y="754" font-size="13" class="s">response.ok 확인 → json() 풀기</text>
  <text x="16" y="772" font-size="13" class="s">→ filter·map으로 카드 데이터 만들기</text>
  <circle cx="60" cy="814" r="11" class="badge"/>
  <text x="60" y="819" font-size="13" text-anchor="middle" class="badgeT">7</text>
  <path d="M71 814 H98 V836 H73" class="run" marker-end="url(#v07ArrR)"/>
  <rect x="6" y="842" width="348" height="46" rx="0" class="bg"/>
  <text x="16" y="860" font-size="14" class="t b">⑦ 상태에 맞는 화면을 그린다</text>
  <text x="16" y="878" font-size="13" class="s">성공·오류·빈 결과 중 하나 (보조 그림)</text>
  <rect x="6" y="924" width="348" height="218" rx="12" class="accent"/>
  <text x="16" y="948" font-size="14" class="t b">이 흐름에서 놓치기 쉬운 점</text>
  <text x="16" y="972" font-size="13" class="t">· 응답이 도착했다고 성공은 아닙니다.</text>
  <text x="16" y="992" font-size="13" class="t">  403·404도 도착한 응답이라 ok를 확인합니다.</text>
  <text x="16" y="1012" font-size="13" class="t">· 네트워크가 끊기면 응답 자체가 없어</text>
  <text x="16" y="1032" font-size="13" class="t">  try/catch의 catch로 갑니다.</text>
  <text x="16" y="1052" font-size="13" class="t">· 비인증 요청은 시간당 60회 한도가 있고,</text>
  <text x="16" y="1072" font-size="13" class="t">  넘으면 403 등이 올 수 있습니다.</text>
  <text x="16" y="1092" font-size="13" class="t">· GitHub API는 데이터를 주는 서비스,</text>
  <text x="16" y="1112" font-size="13" class="t">  fetch는 요청을 보내는 도구입니다.</text>
  <line x1="16" y1="1164" x2="56" y2="1164" class="run" marker-end="url(#v07ArrR)"/>
  <text x="66" y="1169" font-size="13" class="s">실행 순서 (요청·응답 방향)</text>
</svg>
