<svg xmlns="http://www.w3.org/2000/svg" class="v07" viewBox="0 0 360 1192" width="540" height="1788" role="img" aria-labelledby="v07Title v07Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v07Title">V07 GitHub 데이터가 웹사이트에 나타나는 과정: 브라우저와 GitHub API의 요청과 응답</title>
  <desc id="v07Desc">내 JavaScript, 브라우저의 fetch, 외부 서비스인 GitHub API 세 참여자의 세로 흐름도. 1번 JavaScript가 먼저 로딩 상태를 화면에 보여 준다. 2번 JavaScript가 fetch로 주소를 호출한다. 3번 브라우저가 HTTP GET 요청을 GitHub API로 보낸다. 4번 GitHub API가 상태 코드와 JSON 본문으로 응답한다. 상태 코드는 200 성공일 수도 있고 403이나 404일 수도 있으며 모두 도착한 응답이다. 5번 브라우저가 응답을 JavaScript에 넘기고 await가 끝난다. 6번 JavaScript가 response.ok를 확인하고 JSON을 풀어 filter와 map으로 가공한다. 7번 상태에 맞는 화면을 그린다. 아래 상자는 응답이 도착해도 성공은 아니라는 점, 네트워크 자체가 끊기면 응답이 없어 catch로 간다는 점, 비인증 요청은 시간당 60회 한도가 있고 넘으면 403 등이 올 수 있다는 점, GitHub API는 서비스이고 fetch는 요청 도구라는 점을 정리한다. 교육용 단순화 모델이다.</desc>
  <defs>
    <style>
      .v07 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a3a2e; --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
        .v07 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-warn:#f2a79b; --g-h:#74d6b8; --g-hs:#1b3b32; --g-c:#f2b862; --g-cs:#3b2c12; --g-j:#bdb0ff; --g-js:#2c2655; }
      }
