<svg xmlns="http://www.w3.org/2000/svg" class="v03" viewBox="0 0 480 818" width="480" height="818" role="img" aria-labelledby="v03Title v03Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v03Title">V03 화면 폭에 따라 달라지는 배치: 모바일, 태블릿, 데스크톱 비교</title>
  <desc id="v03Desc">위쪽에는 CSS 규칙이 쌓이는 방식을 보여 주는 막대 세 개가 있다. 기본 규칙은 모든 화면 폭에 적용되고, 768px 이상에서 규칙이 덧붙고, 1024px 이상에서 다시 규칙이 덧붙는다. 가운데에는 같은 웹페이지를 세 가지 폭으로 비교한 화면이 있다. 모바일에서는 메뉴가 햄버거 버튼 뒤에 접히고 프로젝트 카드 세 장이 한 열로 쌓인다. 태블릿에서는 메뉴가 가로 한 줄로 펼쳐지고 카드는 두 열이다. 데스크톱에서는 메뉴가 가로 한 줄이고 카드는 세 열이다. HTML 구조는 세 화면에서 같고 CSS 규칙만 달라진다. 메뉴 정렬에는 Flexbox, 카드 배치에는 Grid가 쓰이는 일반화한 예다. 열 개수와 메뉴 방식은 실제 프로젝트와 다를 수 있다.</desc>
  <defs>
    <style>
      .v03 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-c:#8f5200; --g-cs:#fbecd2; }
      @media (prefers-color-scheme: dark) {
        .v03 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-c:#f2b862; --g-cs:#3b2c12; }
      }
      .v03 .bg     { fill: var(--surface-page, var(--g-page)); }
      .v03 .t      { fill: var(--text-primary, var(--g-text)); }
      .v03 .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v03 .b      { font-weight: 700; }
      .v03 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v03 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v03 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v03 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v03 .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v03 .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v03 .ink    { fill: var(--accent-primary, var(--g-accent)); }
      .v03 .tick   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; }
      .v03 .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
    </style>
    <marker id="v03Arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="480" height="818"/>
  <text x="16" y="26" font-size="17" class="t b">V03 · 같은 HTML, 화면 폭마다 다른 배치</text>
  <text x="16" y="46" font-size="14" class="s">일반화한 예입니다. 열 개수·메뉴 방식은 내 프로젝트와 다를 수 있습니다.</text>

  <!-- 규칙이 쌓이는 방식 -->
  <text x="16" y="72" font-size="15" class="t b">① CSS 규칙은 작은 화면 기준 위에 쌓입니다 (모바일 퍼스트)</text>
  <line x1="180" y1="84" x2="180" y2="186" class="guide"/>
  <line x1="300" y1="84" x2="300" y2="186" class="guide"/>
  <rect x="20"  y="88"  width="440" height="26" rx="6" class="accent"/>
  <text x="28"  y="106" font-size="13" class="t b">기본 규칙 — 모든 폭에 적용 (작은 화면 기준)</text>
  <rect x="180" y="118" width="280" height="26" rx="6" class="accent"/>
  <text x="188" y="136" font-size="13" class="t b">768px 이상일 때 덧붙는 규칙</text>
  <rect x="300" y="148" width="160" height="26" rx="6" class="accent"/>
  <text x="308" y="166" font-size="13" class="t b">1024px 이상 추가</text>
  <line x1="20" y1="190" x2="456" y2="190" class="axis" marker-end="url(#v03Arr)"/>
  <line x1="20" y1="184" x2="20" y2="196" class="tick"/>
  <line x1="180" y1="184" x2="180" y2="196" class="tick"/>
  <line x1="300" y1="184" x2="300" y2="196" class="tick"/>
  <text x="20"  y="214" font-size="13" text-anchor="middle" class="t m">0</text>
  <text x="180" y="214" font-size="13" text-anchor="middle" class="t m">768px</text>
  <text x="300" y="214" font-size="13" text-anchor="middle" class="t m">1024px</text>
  <text x="460" y="214" font-size="13" text-anchor="end" class="s">눈금은 비례가 아님</text>

  <!-- 세 화면 -->
  <text x="16" y="246" font-size="15" class="t b">② 같은 웹페이지를 세 가지 폭으로 본 모습</text>
  <text x="8"   y="268" font-size="14" class="t b">모바일</text><text x="8"   y="284" font-size="13" class="s">~767px</text>
  <text x="144" y="268" font-size="14" class="t b">태블릿</text><text x="144" y="284" font-size="13" class="s">768px 이상</text>
  <text x="304" y="268" font-size="14" class="t b">데스크톱</text><text x="304" y="284" font-size="13" class="s">1024px 이상</text>

  <!-- 모바일 -->
  <rect x="8" y="290" width="124" height="236" rx="14" class="raised" stroke-width="2.5"/>
  <rect x="14" y="298" width="112" height="26" rx="6" class="soft"/>
  <text x="20" y="316" font-size="13" class="t b">김코디</text>
  <rect x="102" y="304" width="18" height="3" rx="1.5" class="ink"/><rect x="102" y="310" width="18" height="3" rx="1.5" class="ink"/><rect x="102" y="316" width="18" height="3" rx="1.5" class="ink"/>
  <rect x="14" y="332" width="112" height="44" rx="6" class="soft"/>
  <text x="22" y="352" font-size="13" class="t b">안녕하세요</text>
  <rect x="14" y="384" width="112" height="40" rx="6" class="css"/><text x="70" y="410" font-size="15" text-anchor="middle" class="t b">1</text>
  <rect x="14" y="430" width="112" height="40" rx="6" class="css"/><text x="70" y="456" font-size="15" text-anchor="middle" class="t b">2</text>
  <rect x="14" y="476" width="112" height="40" rx="6" class="css"/><text x="70" y="502" font-size="15" text-anchor="middle" class="t b">3</text>

  <!-- 태블릿 -->
  <rect x="144" y="290" width="148" height="236" rx="14" class="raised" stroke-width="2.5"/>
  <rect x="150" y="298" width="136" height="26" rx="6" class="soft"/>
  <text x="156" y="316" font-size="13" class="t b">김코디</text>
  <rect x="208" y="305" width="24" height="12" rx="6" class="accent"/><rect x="236" y="305" width="24" height="12" rx="6" class="accent"/><rect x="264" y="305" width="18" height="12" rx="6" class="accent"/>
  <rect x="150" y="332" width="136" height="44" rx="6" class="soft"/>
  <text x="158" y="352" font-size="13" class="t b">안녕하세요</text>
  <rect x="150" y="384" width="65" height="64" rx="6" class="css"/><text x="182" y="422" font-size="15" text-anchor="middle" class="t b">1</text>
  <rect x="221" y="384" width="65" height="64" rx="6" class="css"/><text x="253" y="422" font-size="15" text-anchor="middle" class="t b">2</text>
  <rect x="150" y="454" width="65" height="64" rx="6" class="css"/><text x="182" y="492" font-size="15" text-anchor="middle" class="t b">3</text>

  <!-- 데스크톱 -->
  <rect x="304" y="290" width="168" height="236" rx="14" class="raised" stroke-width="2.5"/>
  <rect x="310" y="298" width="156" height="26" rx="6" class="soft"/>
  <text x="316" y="316" font-size="13" class="t b">김코디</text>
  <rect x="372" y="305" width="26" height="12" rx="6" class="accent"/><rect x="404" y="305" width="26" height="12" rx="6" class="accent"/><rect x="436" y="305" width="24" height="12" rx="6" class="accent"/>
  <rect x="310" y="332" width="156" height="44" rx="6" class="soft"/>
  <text x="318" y="352" font-size="13" class="t b">안녕하세요</text>
  <rect x="310" y="384" width="48" height="88" rx="6" class="css"/><text x="334" y="433" font-size="15" text-anchor="middle" class="t b">1</text>
  <rect x="364" y="384" width="48" height="88" rx="6" class="css"/><text x="388" y="433" font-size="15" text-anchor="middle" class="t b">2</text>
  <rect x="418" y="384" width="48" height="88" rx="6" class="css"/><text x="442" y="433" font-size="15" text-anchor="middle" class="t b">3</text>

  <!-- 같은 HTML -->
  <rect x="8" y="542" width="464" height="50" rx="10" class="accent"/>
  <text x="18" y="563" font-size="14" class="t b">HTML 구조는 세 화면에서 똑같습니다</text>
  <text x="18" y="582" font-size="13" class="t">같은 header·nav·카드 3장을 CSS가 다르게 늘어놓을 뿐입니다.</text>

  <!-- 달라지는 것 -->
  <text x="8" y="618" font-size="14" class="t b">메뉴 — Flexbox (한 줄 정렬)</text>
  <text x="8"   y="638" font-size="13" class="t">☰ 버튼 뒤에</text><text x="8"   y="654" font-size="13" class="t">접혀 있음</text>
  <text x="144" y="638" font-size="13" class="t">가로 한 줄로</text><text x="144" y="654" font-size="13" class="t">펼쳐 보임</text>
  <text x="304" y="638" font-size="13" class="t">가로 한 줄,</text><text x="304" y="654" font-size="13" class="t">간격이 넓어짐</text>

  <text x="8" y="684" font-size="14" class="t b">프로젝트 카드 — Grid (행·열 배치)</text>
  <text x="8"   y="704" font-size="13" class="t">1열</text><text x="8"   y="720" font-size="13" class="s">세로로 쌓임</text>
  <text x="144" y="704" font-size="13" class="t">2열</text><text x="144" y="720" font-size="13" class="s">두 장씩 나란히</text>
  <text x="304" y="704" font-size="13" class="t">3열</text><text x="304" y="720" font-size="13" class="s">세 장이 한 줄에</text>

  <rect x="8" y="738" width="464" height="72" rx="10" class="soft"/>
  <text x="18" y="758" font-size="13" class="t">이 변화를 만드는 코드는 CSS 안의</text>
  <text x="18" y="776" font-size="13" class="t m">@media (min-width: 768px) { … }</text>
  <text x="18" y="794" font-size="13" class="t m">@media (min-width: 1024px) { … }</text>
</svg>
