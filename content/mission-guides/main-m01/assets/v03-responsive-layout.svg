      .v03 .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v03 .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v03 .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v03 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v03 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v03 .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v03 .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v03 .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v03 .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
      .v03 .chip   { fill: var(--surface-page, var(--g-page)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; }
      .v03 .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
