      .v03 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v03 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v03 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v03 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v03 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v03 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v03 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
