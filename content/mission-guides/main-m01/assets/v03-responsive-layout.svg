<svg xmlns="http://www.w3.org/2000/svg" class="v03" viewBox="0 0 360 1404" width="540" height="2106" role="img" aria-labelledby="v03Title v03Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v03Title">V03 화면 폭에 따라 달라지는 배치: 모바일, 태블릿, 데스크톱 비교</title>
  <desc id="v03Desc">위쪽에는 CSS 규칙이 쌓이는 방식을 보여 주는 막대 세 개가 있다. 기본 규칙은 모든 화면 폭에 적용되고, 768px 이상에서 규칙이 덧붙고, 1024px 이상에서 다시 규칙이 덧붙는다. 아래에는 같은 웹페이지를 세 가지 폭으로 위에서 아래로 비교한 화면이 있다. 모바일에서는 메뉴가 햄버거 버튼 뒤에 접히고 프로젝트 카드 세 장이 한 열로 쌓인다. 태블릿에서는 메뉴가 가로 한 줄로 펼쳐지고 카드는 두 열이다. 데스크톱에서는 메뉴가 가로 한 줄이고 카드는 세 열이다. HTML 구조는 세 화면에서 같고 CSS 규칙만 달라진다. 메뉴 정렬에는 Flexbox, 카드 배치에는 Grid가 쓰이는 일반화한 예다. 열 개수와 메뉴 방식은 실제 프로젝트와 다를 수 있다.</desc>
