<svg xmlns="http://www.w3.org/2000/svg" class="v07s" viewBox="0 0 360 1048" width="540" height="1572" role="img" aria-labelledby="v07sTitle v07sDesc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v07sTitle">V07 보조 자료 로딩·성공·오류·빈 결과 네 가지 화면 상태 비교</title>
  <desc id="v07sDesc">GitHub 데이터 영역이 가질 수 있는 네 가지 화면 상태를 비교한 그림. 한 번에 하나만 보인다. 요청을 시작하면 로딩, 응답이 정상이고 데이터가 하나 이상이면 성공, 응답이 정상이지만 데이터가 0개면 빈 결과, HTTP 오류나 네트워크 실패면 오류다. 로딩은 요청을 보내고 응답을 기다리는 동안 불러오는 중 안내를 보여 준다. 성공은 저장소 카드 목록을 보여 준다. 오류는 무엇이 문제인지와 다음 행동을 알려 주고 이전 성공 카드를 남기지 않는다. 빈 결과는 표시할 저장소가 없다고 알려 준다. 네 상태는 아이콘 모양과 테두리 모양으로도 구분된다.</desc>
  <defs>
    <style>
      .v07s { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a3a2e; --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
        .v07s { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-warn:#f2a79b; --g-h:#74d6b8; --g-hs:#1b3b32; --g-c:#f2b862; --g-cs:#3b2c12; --g-j:#bdb0ff; --g-js:#2c2655; }
      }
      .v07s .bg     { fill: var(--surface-page, var(--g-page)); }
      .v07s .t      { fill: var(--text-primary, var(--g-text)); }
      .v07s .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v07s .w      { fill: var(--g-warn); }
      .v07s .b      { font-weight: 700; }
      .v07s .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v07s .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v07s .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v07s .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v07s .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v07s .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v07s .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v07s .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v07s .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v07s .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v07s .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v07s .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v07s .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v07s .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v07s .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v07s .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v07s .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v07s .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v07s .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
      .v07s .chip   { fill: var(--surface-page, var(--g-page)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; }
      .v07s .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
      .v07s .fC     { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v07s .fJ     { fill: var(--g-js); stroke: var(--g-j); stroke-width: 2; }
      .v07s .bH     { fill: var(--g-h); } .v07s .bC { fill: var(--g-c); } .v07s .bJ { fill: var(--g-j); }
      .v07s .bT     { fill: var(--g-page); font-weight: 700; }
      .v07s .tH     { fill: var(--g-h); } .v07s .tC { fill: var(--g-c); } .v07s .tJ { fill: var(--g-j); }
      .v07s .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v07s .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v07s .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
      .v07s .store  { fill: var(--surface-raised, var(--g-raised)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; stroke-dasharray: 6 4; }
      .v07s .errBox { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .v07s .okBox  { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; }
      .v07s .wT     { fill: var(--g-warn); font-weight: 700; }
      .v07s .dim    { fill: none; stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 4; }
      .v07s .dimT   { fill: var(--text-secondary, var(--g-sub)); opacity: .75; }
      .v07s .solid  { fill: var(--accent-primary, var(--g-accent)); }
      .v07s .solidT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v07s .warnSolid { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; }
      .v07s .wline  { stroke: var(--g-warn); stroke-width: 2.5; fill: none; }
      .v07s .twoway { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
    </style>
    <marker id="v07sArrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
    <marker id="v07sArrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headP"/></marker>
    <marker id="v07sArrRS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="1048"/>
  <text x="16" y="26" font-size="16" class="t b">V07 보조 · 네 가지 화면 상태</text>
  <text x="16" y="46" font-size="13" class="s">GitHub 데이터 영역은 한 번에 하나의 상태만 보입니다.</text>
  <text x="16" y="63" font-size="13" class="s">(일반화한 예)</text>
  <rect x="8" y="80" width="344" height="112" rx="10" class="soft"/>
  <text x="18" y="102" font-size="14" class="t b">어떤 상태가 될까?</text>
  <text x="18" y="124" font-size="13" class="t">· 요청을 시작하면 → 로딩</text>
  <text x="18" y="142" font-size="13" class="t">· 응답이 정상이고 데이터가 1개 이상 → 성공</text>
  <text x="18" y="160" font-size="13" class="t">· 응답은 정상인데 데이터가 0개 → 빈 결과</text>
  <text x="18" y="178" font-size="13" class="t">· HTTP 오류나 네트워크 실패 → 오류</text>
  <rect x="8" y="210" width="344" height="188" rx="12" class="okBox"/>
  <circle cx="34" cy="238" r="12" fill="none" stroke="var(--accent-primary, var(--g-accent))" stroke-width="3" stroke-dasharray="14 8"/>
  <text x="58" y="236" font-size="15" class="t b">로딩</text>
  <text x="58" y="254" font-size="13" class="s m">loading</text>
  <rect x="18" y="268" width="130" height="118" rx="8" class="raised"/>
  <circle cx="83" cy="312" r="16" fill="none" stroke="var(--accent-primary, var(--g-accent))" stroke-width="3.5" stroke-dasharray="20 10"/>
  <text x="83" y="358" font-size="13" text-anchor="middle" class="t">불러오는 중…</text>
  <text x="160" y="284" font-size="13" class="t">요청을 보내고</text>
  <text x="160" y="302" font-size="13" class="t">응답을 기다리는 동안</text>
  <text x="160" y="320" font-size="13" class="t">‘불러오는 중’을 보여</text>
  <text x="160" y="338" font-size="13" class="t">줍니다.</text>
  <text x="160" y="356" font-size="13" class="s">끝나면 반드시 해제</text>
  <rect x="8" y="412" width="344" height="188" rx="12" class="okBox"/>
  <circle cx="34" cy="440" r="13" class="solid"/>
  <path d="M28 440 L33 445 L41 434" fill="none" stroke="var(--accent-on-primary, var(--g-on))" stroke-width="3"/>
  <text x="58" y="438" font-size="15" class="t b">성공</text>
  <text x="58" y="456" font-size="13" class="s m">success</text>
  <rect x="18" y="470" width="130" height="118" rx="8" class="raised"/>
  <rect x="28" y="482" width="110" height="28" rx="5" class="soft"/>
  <text x="36" y="501" font-size="13" class="t b">저장소 1</text>
  <rect x="28" y="516" width="110" height="28" rx="5" class="soft"/>
  <text x="36" y="535" font-size="13" class="t b">저장소 2</text>
  <rect x="28" y="550" width="110" height="28" rx="5" class="soft"/>
  <text x="36" y="569" font-size="13" class="t b">저장소 3</text>
  <text x="160" y="486" font-size="13" class="t">응답이 정상이고</text>
  <text x="160" y="504" font-size="13" class="t">데이터가 1개 이상</text>
  <text x="160" y="522" font-size="13" class="t">→ map으로 카드를</text>
  <text x="160" y="540" font-size="13" class="t">만들어 보여 줍니다.</text>
  <rect x="8" y="614" width="344" height="188" rx="12" class="errBox"/>
  <polygon points="34,628 48,653 20,653" fill="none" stroke="var(--g-warn)" stroke-width="3"/>
  <text x="34" y="650" font-size="14" text-anchor="middle" class="wT">!</text>
  <text x="58" y="640" font-size="15" class="t b">오류</text>
  <text x="58" y="658" font-size="13" class="s m">error</text>
  <rect x="18" y="672" width="130" height="118" rx="8" class="warnSolid"/>
  <polygon points="83,688 103,724 63,724" fill="none" stroke="var(--g-warn)" stroke-width="3"/>
  <text x="83" y="718" font-size="15" text-anchor="middle" class="wT">!</text>
  <text x="83" y="744" font-size="13" text-anchor="middle" class="w">불러오지 못했어요</text>
  <text x="83" y="762" font-size="13" text-anchor="middle" class="t">잠시 후 다시 시도</text>
  <text x="160" y="688" font-size="13" class="t">HTTP 오류(403·404)나</text>
  <text x="160" y="706" font-size="13" class="t">네트워크 실패면</text>
  <text x="160" y="724" font-size="13" class="t">이유와 다음 행동을</text>
  <text x="160" y="742" font-size="13" class="t">알리고, 이전 성공</text>
  <text x="160" y="760" font-size="13" class="t">카드는 지웁니다.</text>
  <rect x="8" y="816" width="344" height="188" rx="12" class="store"/>
  <rect x="21" y="833" width="26" height="22" rx="3" fill="none" stroke="var(--text-secondary, var(--g-sub))" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="58" y="842" font-size="15" class="t b">빈 결과</text>
  <text x="58" y="860" font-size="13" class="s m">empty</text>
  <rect x="18" y="874" width="130" height="118" rx="8" class="raised"/>
  <rect x="34" y="892" width="98" height="52" rx="6" class="dim"/>
  <text x="83" y="964" font-size="13" text-anchor="middle" class="t">표시할 저장소가</text>
  <text x="83" y="980" font-size="13" text-anchor="middle" class="t">없습니다</text>
  <text x="160" y="890" font-size="13" class="t">응답은 정상인데</text>
  <text x="160" y="908" font-size="13" class="t">보여 줄 데이터가</text>
  <text x="160" y="926" font-size="13" class="t">0개일 때(배열 길이 0)</text>
  <text x="160" y="944" font-size="13" class="t">오류와 다른 문구로</text>
  <text x="160" y="962" font-size="13" class="t">안내합니다.</text>
  <text x="16" y="1028" font-size="13" class="s">아이콘 모양과 테두리 모양으로도 구분됩니다.</text>
</svg>
