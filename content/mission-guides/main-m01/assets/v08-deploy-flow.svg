<svg xmlns="http://www.w3.org/2000/svg" class="v08" viewBox="0 0 360 994" width="540" height="1491" role="img" aria-labelledby="v08Title v08Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v08Title">V08 내 컴퓨터의 프로젝트가 인터넷에 공개되는 과정: 로컬에서 GitHub Pages 공개 URL까지</title>
  <desc id="v08Desc">다섯 단계의 세로 흐름도. 1번 내 컴퓨터의 프로젝트 폴더(index.html, css, js, images, README). 2번 git add와 commit으로 내 컴퓨터 안의 Git 저장소에 변경을 기록한다. 3번 git push로 GitHub 원격 저장소에 올린다. 이 저장소의 URL과 README가 제출물이다. 4번 저장소 설정의 Pages에서 공개할 branch와 폴더를 고르면 GitHub Pages가 정적 파일을 웹사이트로 공개한다. 5번 방문자의 브라우저가 공개 URL로 요청해 사이트를 본다. 배포 URL과 데스크톱·모바일·다크모드 스크린샷이 제출물이다. 아래 상자는 로컬에서는 되는데 배포하면 달라질 수 있는 네 가지, 즉 경로, 대소문자, localStorage의 주소별 분리, 반영 지연과 캐시를 정리한다. 점선 표식은 제출물을 뜻한다. 교육용 단순화 모델이다.</desc>
  <defs>
    <style>
      .v08 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a3a2e; --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
        .v08 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-warn:#f2a79b; --g-h:#74d6b8; --g-hs:#1b3b32; --g-c:#f2b862; --g-cs:#3b2c12; --g-j:#bdb0ff; --g-js:#2c2655; }
      }
      .v08 .bg     { fill: var(--surface-page, var(--g-page)); }
      .v08 .t      { fill: var(--text-primary, var(--g-text)); }
      .v08 .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v08 .w      { fill: var(--g-warn); }
      .v08 .b      { font-weight: 700; }
      .v08 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v08 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v08 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v08 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v08 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v08 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v08 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v08 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v08 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v08 .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v08 .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v08 .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v08 .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v08 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v08 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v08 .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v08 .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v08 .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v08 .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
      .v08 .chip   { fill: var(--surface-page, var(--g-page)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; }
      .v08 .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
      .v08 .fC     { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v08 .fJ     { fill: var(--g-js); stroke: var(--g-j); stroke-width: 2; }
      .v08 .bH     { fill: var(--g-h); } .v08 .bC { fill: var(--g-c); } .v08 .bJ { fill: var(--g-j); }
      .v08 .bT     { fill: var(--g-page); font-weight: 700; }
      .v08 .tH     { fill: var(--g-h); } .v08 .tC { fill: var(--g-c); } .v08 .tJ { fill: var(--g-j); }
      .v08 .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v08 .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v08 .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
      .v08 .store  { fill: var(--surface-raised, var(--g-raised)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; stroke-dasharray: 6 4; }
      .v08 .errBox { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .v08 .okBox  { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; }
      .v08 .wT     { fill: var(--g-warn); font-weight: 700; }
      .v08 .dim    { fill: none; stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 4; }
      .v08 .dimT   { fill: var(--text-secondary, var(--g-sub)); opacity: .75; }
      .v08 .solid  { fill: var(--accent-primary, var(--g-accent)); }
      .v08 .solidT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v08 .warnSolid { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2.5; }
      .v08 .wline  { stroke: var(--g-warn); stroke-width: 2.5; fill: none; }
      .v08 .twoway { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
    </style>
    <marker id="v08ArrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
    <marker id="v08ArrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headP"/></marker>
    <marker id="v08ArrRS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="994"/>
  <text x="16" y="26" font-size="16" class="t b">V08 · 내 컴퓨터에서 공개 URL까지</text>
  <text x="16" y="46" font-size="13" class="s">로컬 프로젝트 → Git → GitHub → GitHub Pages</text>
  <text x="16" y="63" font-size="13" class="s">(교육용 단순화 모델)</text>
  <rect x="8" y="82" width="344" height="92" rx="10" class="soft"/>
  <circle cx="30" cy="110" r="11" class="badge"/>
  <text x="30" y="115" font-size="13" text-anchor="middle" class="badgeT">1</text>
  <text x="52" y="102" font-size="13" class="s">내 컴퓨터</text>
  <text x="52" y="122" font-size="14" class="t b">프로젝트 폴더</text>
  <text x="52" y="140" font-size="13" class="t">index.html · css/ · js/ · images/</text>
  <text x="52" y="158" font-size="13" class="t">README.md</text>
  <line x1="30" y1="176" x2="30" y2="216" class="run" marker-end="url(#v08ArrR)"/>
  <text x="44" y="194" font-size="13" class="t b">변경을 기록한다 (내 컴퓨터 안)</text>
  <text x="44" y="211" font-size="13" class="s m">git add → git commit</text>
  <rect x="8" y="222" width="344" height="74" rx="10" class="soft"/>
  <circle cx="30" cy="250" r="11" class="badge"/>
  <text x="30" y="255" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <text x="52" y="242" font-size="13" class="s">내 컴퓨터</text>
  <text x="52" y="262" font-size="14" class="t b">Git 저장소</text>
  <text x="52" y="280" font-size="13" class="t">커밋으로 쌓인 변경 기록(.git)</text>
  <line x1="30" y1="298" x2="30" y2="338" class="run" marker-end="url(#v08ArrR)"/>
  <text x="44" y="316" font-size="13" class="t b">GitHub로 올린다</text>
  <text x="44" y="333" font-size="13" class="s m">git push</text>
  <rect x="8" y="344" width="344" height="122" rx="10" class="accent"/>
  <circle cx="30" cy="372" r="11" class="badge"/>
  <text x="30" y="377" font-size="13" text-anchor="middle" class="badgeT">3</text>
  <text x="52" y="364" font-size="13" class="s">GitHub</text>
  <text x="52" y="384" font-size="14" class="t b">원격 저장소 (공개)</text>
  <text x="52" y="402" font-size="13" class="t">README가 저장소 첫 화면에 표시됨</text>
  <text x="52" y="420" font-size="13" class="t">아직은 코드 보관소일 뿐 웹사이트가 아님</text>
  <rect x="52" y="434" width="113" height="22" rx="11" class="chip" stroke-dasharray="3 3"/>
  <text x="62" y="450" font-size="13" class="t b">저장소 URL</text>
  <rect x="173" y="434" width="100" height="22" rx="11" class="chip" stroke-dasharray="3 3"/>
  <text x="183" y="450" font-size="13" class="t b">README</text>
  <line x1="30" y1="468" x2="30" y2="508" class="run" marker-end="url(#v08ArrR)"/>
  <text x="44" y="486" font-size="13" class="t b">Pages 설정: 공개할 branch·폴더 선택</text>
  <text x="44" y="503" font-size="13" class="s m">Settings → Pages</text>
  <rect x="8" y="514" width="344" height="74" rx="10" class="accent"/>
  <circle cx="30" cy="542" r="11" class="badge"/>
  <text x="30" y="547" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <text x="52" y="534" font-size="13" class="s">GitHub Pages</text>
  <text x="52" y="554" font-size="14" class="t b">정적 파일을 웹사이트로 공개</text>
  <text x="52" y="572" font-size="13" class="t">파일을 그대로 제공 (서버 코드 실행 없음)</text>
  <line x1="30" y1="590" x2="30" y2="630" class="run" marker-end="url(#v08ArrR)"/>
  <text x="44" y="608" font-size="13" class="t b">방문자의 브라우저가 URL로 요청한다</text>
  <rect x="8" y="636" width="344" height="122" rx="10" class="accent"/>
  <circle cx="30" cy="664" r="11" class="badge"/>
  <text x="30" y="669" font-size="13" text-anchor="middle" class="badgeT">5</text>
  <text x="52" y="656" font-size="13" class="s">인터넷</text>
  <text x="52" y="676" font-size="14" class="t b">공개 URL의 사이트</text>
  <text x="52" y="694" font-size="13" class="t">https://사용자.github.io/저장소/</text>
  <text x="52" y="712" font-size="13" class="t">누구나 열어 볼 수 있음</text>
  <rect x="52" y="726" width="100" height="22" rx="11" class="chip" stroke-dasharray="3 3"/>
  <text x="62" y="742" font-size="13" class="t b">배포 URL</text>
  <rect x="160" y="726" width="74" height="22" rx="11" class="chip" stroke-dasharray="3 3"/>
  <text x="170" y="742" font-size="13" class="t b">스크린샷</text>
  <rect x="8" y="778" width="344" height="168" rx="10" class="raised"/>
  <text x="18" y="802" font-size="14" class="t b">로컬에서는 되는데 배포하면 달라지는 것</text>
  <text x="18" y="828" font-size="13" class="t">· 경로: /css/style.css 가 깨질 수 있음</text>
  <text x="18" y="850" font-size="13" class="t">· 대소문자: Images/ 와 images/ 는 다른 폴더</text>
  <text x="18" y="872" font-size="13" class="t">· localStorage: 주소가 다르면 저장값도 따로</text>
  <text x="18" y="894" font-size="13" class="t">· 반영 지연·캐시: 새 버전이 늦게 보일 수 있음</text>
  <text x="18" y="926" font-size="13" class="s">(점선 표식은 제출물을 뜻합니다)</text>
  <line x1="16" y1="968" x2="56" y2="968" class="run" marker-end="url(#v08ArrR)"/>
  <text x="66" y="973" font-size="13" class="s">단계 순서</text>
</svg>
