<svg xmlns="http://www.w3.org/2000/svg" class="v09" viewBox="0 0 360 1594" width="540" height="2391" role="img" aria-labelledby="v09Title v09Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v09Title">V09 하나의 웹사이트를 한눈에 보기: 기술들이 협력하는 전체 구조</title>
  <desc id="v09Desc">위에서 아래로 보는 통합 구조도. 맨 위 GitHub Pages가 내 파일을 인터넷 주소로 공개하고, 방문자의 브라우저가 파일을 받아 간다. 내 파일은 HTML, CSS, JavaScript 세 가지로 각각 내용과 구조, 모양과 반응형 배치, 동작을 맡는다. 브라우저는 이 파일을 읽고 실행해 화면을 만든다. 브라우저 안에는 화면(HTML 구조에 CSS 모양을 입힌 것)과 JavaScript가 불러 쓰는 브라우저 기능이 있다. 브라우저 기능은 DOM과 이벤트, Intersection Observer, localStorage, fetch다. JavaScript가 이 기능을 불러 써서 화면을 바꾼다. fetch는 외부 서비스인 GitHub API에 요청하고 JSON으로 응답을 받는다. 아래에는 2장부터 8장까지 기능별로 HTML, CSS, JavaScript, 브라우저 기능, GitHub 중 누가 일하는지를 카드로 정리했다. 일하는 항목은 채워진 칸으로, 아닌 항목은 점선 칸으로 구분한다.</desc>
