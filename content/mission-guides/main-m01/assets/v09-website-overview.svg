  <text x="180" y="1060" font-size="13" text-anchor="middle" class="solidT">JS</text>
  <rect x="216" y="1044" width="60" height="22" rx="6" class="solid"/>
  <text x="246" y="1060" font-size="13" text-anchor="middle" class="solidT">브라우저</text>
  <rect x="282" y="1044" width="60" height="22" rx="6" class="dim"/>
  <text x="312" y="1060" font-size="13" text-anchor="middle" class="dimT">GitHub</text>
  <rect x="8" y="1080" width="344" height="104" rx="10" class="raised"/>
  <circle cx="30" cy="1102" r="11" class="badge"/>
  <text x="30" y="1107" font-size="13" text-anchor="middle" class="badgeT">5</text>
  <text x="50" y="1107" font-size="14" class="t b">다크모드</text>
  <text x="18" y="1130" font-size="13" class="t">JS가 테마를 바꾸고 CSS 변수가 모양을 정합니다.</text>
  <text x="18" y="1147" font-size="13" class="t">선택은 localStorage가 기억합니다.</text>
  <rect x="18" y="1156" width="60" height="22" rx="6" class="dim"/>
  <text x="48" y="1172" font-size="13" text-anchor="middle" class="dimT">HTML</text>
  <rect x="84" y="1156" width="60" height="22" rx="6" class="solid"/>
  <text x="114" y="1172" font-size="13" text-anchor="middle" class="solidT">CSS</text>
  <rect x="150" y="1156" width="60" height="22" rx="6" class="solid"/>
  <text x="180" y="1172" font-size="13" text-anchor="middle" class="solidT">JS</text>
  <rect x="216" y="1156" width="60" height="22" rx="6" class="solid"/>
  <text x="246" y="1172" font-size="13" text-anchor="middle" class="solidT">브라우저</text>
  <rect x="282" y="1156" width="60" height="22" rx="6" class="dim"/>
  <text x="312" y="1172" font-size="13" text-anchor="middle" class="dimT">GitHub</text>
  <rect x="8" y="1192" width="344" height="104" rx="10" class="raised"/>
  <circle cx="30" cy="1214" r="11" class="badge"/>
  <text x="30" y="1219" font-size="13" text-anchor="middle" class="badgeT">6</text>
  <text x="50" y="1219" font-size="14" class="t b">폼 검증</text>
  <text x="18" y="1242" font-size="13" class="t">form(HTML)의 제출을 JS가 검사하고</text>
  <text x="18" y="1259" font-size="13" class="t">오류를 CSS로 보여 줍니다.</text>
  <rect x="18" y="1268" width="60" height="22" rx="6" class="solid"/>
  <text x="48" y="1284" font-size="13" text-anchor="middle" class="solidT">HTML</text>
  <rect x="84" y="1268" width="60" height="22" rx="6" class="solid"/>
  <text x="114" y="1284" font-size="13" text-anchor="middle" class="solidT">CSS</text>
  <rect x="150" y="1268" width="60" height="22" rx="6" class="solid"/>
  <text x="180" y="1284" font-size="13" text-anchor="middle" class="solidT">JS</text>
  <rect x="216" y="1268" width="60" height="22" rx="6" class="solid"/>
