  <rect class="bg" x="0" y="0" width="360" height="1594"/>
  <text x="16" y="26" font-size="16" class="t b">V09 · 하나의 웹사이트를 한눈에</text>
  <text x="16" y="46" font-size="13" class="s">기술들이 어떻게 협력하는지 (교육용 단순화 모델)</text>
  <text x="16" y="63" font-size="13" class="s">숫자는 해당 내용을 다룬 장입니다.</text>
  <rect x="8" y="82" width="344" height="58" rx="10" class="accent"/>
  <circle cx="30" cy="111" r="11" class="badge"/>
  <text x="30" y="116" font-size="13" text-anchor="middle" class="badgeT">8</text>
  <text x="52" y="106" font-size="14" class="t b">GitHub Pages</text>
  <text x="52" y="126" font-size="13" class="s">내 파일을 인터넷 주소로 공개</text>
  <line x1="36" y1="142" x2="36" y2="178" class="run" marker-end="url(#v09ArrR)"/>
  <text x="50" y="164" font-size="13" class="t">방문자의 브라우저가 파일을 받아 감</text>
  <text x="16" y="198" font-size="14" class="t b">내 파일</text>
  <rect x="8" y="206" width="108" height="76" rx="10" class="fH"/>
  <text x="62" y="234" font-size="14" text-anchor="middle" class="t b">HTML</text>
  <text x="62" y="254" font-size="13" text-anchor="middle" class="t">내용·구조</text>
  <text x="62" y="271" font-size="13" text-anchor="middle" class="s">(1·2장)</text>
  <rect x="126" y="206" width="108" height="76" rx="10" class="fC"/>
  <text x="180" y="234" font-size="14" text-anchor="middle" class="t b">CSS</text>
  <text x="180" y="254" font-size="13" text-anchor="middle" class="t">모양·반응형</text>
  <text x="180" y="271" font-size="13" text-anchor="middle" class="s">(1·3장)</text>
  <rect x="244" y="206" width="108" height="76" rx="10" class="fJ"/>
  <text x="298" y="234" font-size="14" text-anchor="middle" class="t b">JavaScript</text>
  <text x="298" y="254" font-size="13" text-anchor="middle" class="t">동작·상태</text>
  <text x="298" y="271" font-size="13" text-anchor="middle" class="s">(1·4~7장)</text>
  <line x1="180" y1="284" x2="180" y2="320" class="run" marker-end="url(#v09ArrR)"/>
  <text x="192" y="306" font-size="13" class="t">브라우저가 읽고 실행</text>
  <rect x="8" y="326" width="344" height="250" rx="12" class="soft"/>
  <text x="18" y="350" font-size="14" class="t b">브라우저 안에서</text>
  <rect x="18" y="364" width="124" height="138" rx="10" class="fH"/>
  <text x="80" y="388" font-size="14" text-anchor="middle" class="t b">웹사이트 화면</text>
  <text x="80" y="412" font-size="13" text-anchor="middle" class="t">HTML 구조 위에</text>
  <text x="80" y="430" font-size="13" text-anchor="middle" class="t">CSS 모양을 입혀</text>
  <text x="80" y="448" font-size="13" text-anchor="middle" class="t">사용자가 보고</text>
  <text x="80" y="466" font-size="13" text-anchor="middle" class="t">누르는 것</text>
  <text x="80" y="484" font-size="13" text-anchor="middle" class="s">(2·3장)</text>
  <rect x="166" y="364" width="176" height="196" rx="10" class="raised"/>
  <text x="254" y="386" font-size="14" text-anchor="middle" class="t b">브라우저 기능</text>
  <text x="254" y="402" font-size="13" text-anchor="middle" class="s">(JS가 불러 씀)</text>
  <rect x="176" y="414" width="156" height="30" rx="8" class="chip"/>
  <text x="254" y="434" font-size="13" text-anchor="middle" class="t">DOM·이벤트 (4·6장)</text>
  <rect x="176" y="450" width="156" height="30" rx="8" class="chip"/>
  <text x="254" y="470" font-size="13" text-anchor="middle" class="t">Intersection Observer</text>
  <rect x="176" y="486" width="156" height="30" rx="8" class="chip"/>
  <text x="254" y="506" font-size="13" text-anchor="middle" class="t">localStorage (5장)</text>
  <rect x="176" y="522" width="156" height="30" rx="8" class="chip"/>
  <text x="254" y="542" font-size="13" text-anchor="middle" class="t">fetch (7장)</text>
  <line x1="166" y1="436" x2="146" y2="436" class="run" marker-end="url(#v09ArrR)"/>
  <text x="18" y="522" font-size="13" class="t">JS가 오른쪽 기능을</text>
  <text x="18" y="540" font-size="13" class="t">불러 써서 왼쪽 화면을</text>
  <text x="18" y="558" font-size="13" class="t">바꿉니다.</text>
  <line x1="254" y1="576" x2="254" y2="630" class="twoway" marker-end="url(#v09ArrR)" marker-start="url(#v09ArrRS)"/>
  <text x="244" y="606" font-size="13" text-anchor="end" class="t">fetch 요청 ↔ JSON 응답</text>
  <rect x="8" y="636" width="344" height="58" rx="10" class="accent"/>
  <circle cx="30" cy="665" r="11" class="badge"/>
  <text x="30" y="670" font-size="13" text-anchor="middle" class="badgeT">7</text>
  <text x="52" y="660" font-size="14" class="t b">GitHub API (외부 서비스)</text>
  <text x="52" y="680" font-size="13" class="s">저장소 정보를 JSON으로 제공</text>
  <text x="16" y="724" font-size="15" class="t b">기능별로 보면 누가 일할까?</text>
  <rect x="8" y="744" width="344" height="104" rx="10" class="raised"/>
  <circle cx="30" cy="766" r="11" class="badge"/>
  <text x="30" y="771" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <text x="50" y="771" font-size="14" class="t b">구역·구조</text>
  <text x="18" y="794" font-size="13" class="t">의미 있는 태그로 구역을 나눕니다.</text>
  <text x="18" y="811" font-size="13" class="t">HTML이 중심, CSS가 모양을 입힙니다.</text>
  <rect x="18" y="820" width="60" height="22" rx="6" class="solid"/>
