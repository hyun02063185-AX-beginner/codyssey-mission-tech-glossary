  <rect x="216" y="820" width="60" height="22" rx="6" class="dim"/>
  <text x="246" y="836" font-size="13" text-anchor="middle" class="dimT">브라우저</text>
  <rect x="282" y="820" width="60" height="22" rx="6" class="dim"/>
  <text x="312" y="836" font-size="13" text-anchor="middle" class="dimT">GitHub</text>
  <rect x="8" y="856" width="344" height="104" rx="10" class="raised"/>
  <circle cx="30" cy="878" r="11" class="badge"/>
  <text x="30" y="883" font-size="13" text-anchor="middle" class="badgeT">3</text>
  <text x="50" y="883" font-size="14" class="t b">반응형 배치</text>
  <text x="18" y="906" font-size="13" class="t">화면 폭 조건에 따라 CSS 규칙이 켜집니다.</text>
  <text x="18" y="923" font-size="13" class="t">HTML은 그대로입니다.</text>
  <rect x="18" y="932" width="60" height="22" rx="6" class="dim"/>
  <text x="48" y="948" font-size="13" text-anchor="middle" class="dimT">HTML</text>
  <rect x="84" y="932" width="60" height="22" rx="6" class="solid"/>
  <text x="114" y="948" font-size="13" text-anchor="middle" class="solidT">CSS</text>
  <rect x="150" y="932" width="60" height="22" rx="6" class="dim"/>
  <text x="180" y="948" font-size="13" text-anchor="middle" class="dimT">JS</text>
  <rect x="216" y="932" width="60" height="22" rx="6" class="dim"/>
  <text x="246" y="948" font-size="13" text-anchor="middle" class="dimT">브라우저</text>
  <rect x="282" y="932" width="60" height="22" rx="6" class="dim"/>
  <text x="312" y="948" font-size="13" text-anchor="middle" class="dimT">GitHub</text>
  <rect x="8" y="968" width="344" height="104" rx="10" class="raised"/>
  <circle cx="30" cy="990" r="11" class="badge"/>
  <text x="30" y="995" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <text x="50" y="995" font-size="14" class="t b">메뉴·스크롤·등장</text>
  <text x="18" y="1018" font-size="13" class="t">이벤트를 받아 JS가 DOM을 바꿉니다.</text>
  <text x="18" y="1035" font-size="13" class="t">화면 진입은 브라우저가 알려 줍니다.</text>
  <rect x="18" y="1044" width="60" height="22" rx="6" class="solid"/>
  <text x="48" y="1060" font-size="13" text-anchor="middle" class="solidT">HTML</text>
  <rect x="84" y="1044" width="60" height="22" rx="6" class="solid"/>
  <text x="114" y="1060" font-size="13" text-anchor="middle" class="solidT">CSS</text>
