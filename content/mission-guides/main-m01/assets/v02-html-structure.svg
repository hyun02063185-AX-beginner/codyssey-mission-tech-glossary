  <text x="150" y="120" font-size="13" class="t m b">&lt;header&gt;</text>
  <text x="228" y="120" font-size="13" class="s">머리말 영역</text>
  <text x="160" y="138" font-size="13" class="t m">&lt;nav&gt; 메뉴 링크들</text>
