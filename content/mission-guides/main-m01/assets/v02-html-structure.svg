  <text x="164" y="380" font-size="13" class="t m">&lt;h2&gt;Skills&lt;/h2&gt; &lt;ul&gt;…</text>
  <rect x="148" y="406" width="198" height="76" rx="8" class="accent"/>
  <text x="156" y="427" font-size="13" class="t m b">&lt;section id="projects"&gt;</text>
