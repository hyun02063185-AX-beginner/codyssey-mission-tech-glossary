  <text x="16" y="696" font-size="15" class="t b">같은 모양, 다른 의미</text>
  <rect x="14" y="708" width="332" height="50" rx="8" class="bad"/>
  <text x="24" y="729" font-size="13" class="t m">&lt;div class="header"&gt;</text>
  <text x="24" y="748" font-size="13" class="w">이름표(class)만 header인 일반 상자</text>
  <rect x="14" y="766" width="332" height="50" rx="8" class="accent"/>
  <text x="24" y="787" font-size="13" class="t m b">&lt;header&gt;</text>
  <text x="24" y="806" font-size="13" class="t">태그 자체가 ‘머리말 영역’이라는 뜻</text>
  <text x="16" y="838" font-size="13" class="s">화면은 같아도 브라우저·검색 도구·화면 낭독기·</text>
  <text x="16" y="856" font-size="13" class="s">AI가 읽는 구조가 다릅니다.</text>
  <rect x="6" y="886" width="348" height="128" rx="12" class="raised"/>
  <text x="16" y="910" font-size="14" class="t b">대응이 항상 1:1은 아닙니다</text>
  <text x="16" y="932" font-size="13" class="t">· 한 구역이 여러 요소로 나뉘기도 하고,</text>
  <text x="16" y="951" font-size="13" class="t">· 요소 하나가 여러 구역을 감싸기도 하며,</text>
  <text x="16" y="970" font-size="13" class="t">· 같은 구역을 div로 한 번 더 감싸기도 합니다.</text>
  <text x="16" y="989" font-size="13" class="t">  (예: Hero를 header 안에 두는 구조)</text>
