<svg xmlns="http://www.w3.org/2000/svg" class="v02" viewBox="0 0 360 1082" width="540" height="1623" role="img" aria-labelledby="v02Title v02Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v02Title">V02 화면의 구역과 HTML 요소의 대응도</title>
  <desc id="v02Desc">왼쪽은 자기소개 웹페이지 화면을 위에서 아래로 나눈 구역이고 오른쪽은 각 구역을 만드는 HTML 요소다. 맨 위 메뉴 영역은 header 안의 nav에 대응한다. Hero, About, Skills, Projects, Contact 다섯 구역은 main 안에 들어 있는 section 다섯 개에 각각 대응하고, 각 section에는 제목 태그가 있다. 프로젝트 카드는 article에, 문의 폼은 form에 대응한다. 맨 아래 바닥글은 footer에 대응한다. 연결선은 대응 관계이며 실행 순서가 아니다. 아래에는 이름만 header인 div와 header 태그의 차이, 그리고 구역과 요소가 항상 일대일로 대응하지는 않는다는 주의가 있다. 일반화한 구성 예이며 실제 프로젝트의 구조는 다를 수 있다.</desc>
  <defs>
    <style>
      .v02 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a3a2e; --g-h:#17624e; --g-hs:#dff0e9; --g-c:#8f5200; --g-cs:#fbecd2; --g-j:#5340b0; --g-js:#e9e4fa; }
      @media (prefers-color-scheme: dark) {
        .v02 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-warn:#f2a79b; --g-h:#74d6b8; --g-hs:#1b3b32; --g-c:#f2b862; --g-cs:#3b2c12; --g-j:#bdb0ff; --g-js:#2c2655; }
      }
      .v02 .bg     { fill: var(--surface-page, var(--g-page)); }
      .v02 .t      { fill: var(--text-primary, var(--g-text)); }
      .v02 .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v02 .w      { fill: var(--g-warn); }
      .v02 .b      { font-weight: 700; }
      .v02 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v02 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v02 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v02 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v02 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v02 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v02 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v02 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v02 .ref    { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2.5; fill: none; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v02 .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v02 .lead   { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; fill: none; }
      .v02 .leadG  { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; fill: none; }
      .v02 .dot    { fill: var(--accent-primary, var(--g-accent)); }
      .v02 .tri    { fill: var(--accent-primary, var(--g-accent)); }
      .v02 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v02 .headP  { fill: var(--text-secondary, var(--g-sub)); }
      .v02 .main   { fill: none; stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2.5; stroke-dasharray: 9 6; }
      .v02 .bad    { fill: var(--surface-raised, var(--g-raised)); stroke: var(--g-warn); stroke-width: 2; stroke-dasharray: 5 4; }
      .v02 .bar    { fill: var(--border-strong, var(--g-border)); opacity: .55; }
      .v02 .chip   { fill: var(--surface-page, var(--g-page)); stroke: var(--text-secondary, var(--g-sub)); stroke-width: 1.5; }
      .v02 .fH     { fill: var(--g-hs); stroke: var(--g-h); stroke-width: 2; }
      .v02 .fC     { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v02 .fJ     { fill: var(--g-js); stroke: var(--g-j); stroke-width: 2; }
      .v02 .bH     { fill: var(--g-h); } .v02 .bC { fill: var(--g-c); } .v02 .bJ { fill: var(--g-j); }
      .v02 .bT     { fill: var(--g-page); font-weight: 700; }
      .v02 .tH     { fill: var(--g-h); } .v02 .tC { fill: var(--g-c); } .v02 .tJ { fill: var(--g-j); }
      .v02 .css    { fill: var(--g-cs); stroke: var(--g-c); stroke-width: 2; }
      .v02 .guide  { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; }
      .v02 .axis   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 2; fill: none; }
    </style>
    <marker id="v02ArrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
    <marker id="v02ArrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headP"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="360" height="1082"/>
  <text x="16" y="26" font-size="16" class="t b">V02 · 화면의 구역 ↔ HTML 요소</text>
  <text x="16" y="46" font-size="13" class="s">일반화한 구성 예입니다.</text>
  <text x="16" y="63" font-size="13" class="s">실제 프로젝트의 구조는 다를 수 있습니다.</text>
  <text x="62" y="86" font-size="13" text-anchor="middle" class="t b">눈에 보이는 화면</text>
  <text x="247" y="86" font-size="13" text-anchor="middle" class="t b">그것을 만드는 HTML</text>
