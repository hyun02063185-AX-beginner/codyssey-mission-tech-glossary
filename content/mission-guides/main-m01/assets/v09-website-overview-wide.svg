<svg xmlns="http://www.w3.org/2000/svg" class="v09w" viewBox="0 0 960 626" width="1440" height="939" role="img" aria-labelledby="v09wTitle v09wDesc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v09wTitle">V09 PC용 전체 구조도: 하나의 웹사이트에서 HTML, CSS, JavaScript, 브라우저 기능, GitHub API, GitHub Pages의 관계</title>
  <desc id="v09wDesc">가운데에 웹사이트 화면이 있다. 왼쪽에는 내 파일 세 가지가 있다. JavaScript는 동작과 상태, CSS는 모양과 반응형 규칙과 변수, HTML은 내용과 구조를 맡고, 각각 화면에 DOM 변경, 모양 적용, 구조 생성이라는 실선 화살표로 연결된다. 오른쪽에는 JavaScript가 불러 쓰는 브라우저 기능 네 가지, 즉 이벤트, Intersection Observer, localStorage, fetch가 있다. JavaScript에서 점선이 위쪽을 돌아 이 기능들로 이어지고, 화면과 브라우저 기능은 양방향 화살표로 이어진다. fetch는 오른쪽 아래의 GitHub API와 요청과 응답으로 연결된다. 왼쪽 아래의 GitHub Pages는 점선으로 내 파일 세 가지를 인터넷에 공개한다. 각 상자에는 해당 내용을 다룬 장 번호가 있다.</desc>
