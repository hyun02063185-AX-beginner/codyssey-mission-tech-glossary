<svg xmlns="http://www.w3.org/2000/svg" class="v04" viewBox="0 0 480 950" width="480" height="950" role="img" aria-labelledby="v04Title v04Desc" font-family="var(--font-body, 'Pretendard VF', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', system-ui, sans-serif)">
  <title id="v04Title">V04 버튼을 누르면 화면이 바뀌는 과정: 이벤트에서 DOM과 화면까지</title>
  <desc id="v04Desc">사용자, 브라우저, 내 JavaScript, DOM 네 참여자의 세로 흐름도. 준비 단계에서 페이지가 열릴 때 JavaScript가 브라우저에 '이 버튼에서 click이 오면 이 함수를 불러 달라'고 한 번 등록한다(점선 화살표). 실행 단계는 번호 순서의 실선 화살표다. 1번 사용자가 버튼을 클릭한다. 2번 브라우저가 click 이벤트를 만들어 등록된 handler를 호출한다. 3번 handler가 현재 상태를 보고 새 상태를 정한다. 4번 handler가 DOM의 클래스나 속성을 바꾼다. 5번 브라우저가 바뀐 DOM과 CSS로 화면을 다시 그린다. 6번 사용자가 바뀐 화면을 본다. 같은 흐름이 햄버거 메뉴, 맨 위로 버튼, 섹션 등장 애니메이션에 적용된다. 섹션 등장은 1번이 클릭이 아니라 요소가 화면에 들어옴이다. 교육용 단순화 모델이며 실제 브라우저 내부에는 이벤트 큐 등 더 많은 단계가 있다.</desc>
  <defs>
    <style>
      .v04 { --g-text:#1c2721; --g-sub:#46564d; --g-page:#ffffff; --g-soft:#eef5ef; --g-raised:#ffffff; --g-border:#8fa699; --g-accent:#1d4d42; --g-accent-soft:#dcece3; --g-on:#ffffff; --g-warn:#8a4b00; }
      @media (prefers-color-scheme: dark) {
        .v04 { --g-text:#e8efe9; --g-sub:#b4c3ba; --g-page:#14201b; --g-soft:#1b2b24; --g-raised:#1f322a; --g-border:#5d7a6b; --g-accent:#7fd3b3; --g-accent-soft:#24433a; --g-on:#0f1a15; --g-warn:#f0b45a; }
      }
      .v04 .bg     { fill: var(--surface-page, var(--g-page)); }
      .v04 .t      { fill: var(--text-primary, var(--g-text)); }
      .v04 .s      { fill: var(--text-secondary, var(--g-sub)); }
      .v04 .b      { font-weight: 700; }
      .v04 .m      { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace); }
      .v04 .soft   { fill: var(--surface-soft, var(--g-soft)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v04 .raised { fill: var(--surface-raised, var(--g-raised)); stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; }
      .v04 .accent { fill: var(--accent-soft, var(--g-accent-soft)); stroke: var(--accent-primary, var(--g-accent)); stroke-width: 2; }
      .v04 .life   { stroke: var(--border-strong, var(--g-border)); stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
      .v04 .run    { stroke: var(--accent-primary, var(--g-accent)); stroke-width: 3; fill: none; }
      .v04 .prep   { stroke: var(--text-secondary, var(--g-sub)); stroke-width: 3; fill: none; stroke-dasharray: 3 6; stroke-linecap: round; }
      .v04 .badge  { fill: var(--accent-primary, var(--g-accent)); }
      .v04 .badgeT { fill: var(--accent-on-primary, var(--g-on)); font-weight: 700; }
      .v04 .prepB  { fill: var(--text-secondary, var(--g-sub)); }
      .v04 .headR  { fill: var(--accent-primary, var(--g-accent)); }
      .v04 .headP  { fill: var(--text-secondary, var(--g-sub)); }
    </style>
    <marker id="v04ArrRun" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headR"/></marker>
    <marker id="v04ArrPrep" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="headP"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="480" height="950"/>
  <text x="16" y="26" font-size="17" class="t b">V04 · 버튼을 누르면 화면이 바뀌는 과정</text>
  <text x="16" y="46" font-size="14" class="s">예시: 모바일 햄버거 메뉴 ☰ (교육용 단순화 모델)</text>

  <!-- 참여자 머리 -->
  <rect x="4"   y="62" width="112" height="52" rx="10" class="raised"/>
  <text x="60"  y="84"  font-size="15" text-anchor="middle" class="t b">사용자</text>
  <text x="60"  y="104" font-size="13" text-anchor="middle" class="s">화면 앞의 사람</text>
  <rect x="124" y="62" width="112" height="52" rx="10" class="raised"/>
  <text x="180" y="84"  font-size="15" text-anchor="middle" class="t b">브라우저</text>
  <text x="180" y="104" font-size="13" text-anchor="middle" class="s">이벤트·화면 담당</text>
  <rect x="244" y="62" width="112" height="52" rx="10" class="accent"/>
  <text x="300" y="84"  font-size="15" text-anchor="middle" class="t b">내 JavaScript</text>
  <text x="300" y="104" font-size="13" text-anchor="middle" class="s">js/ 안의 코드</text>
  <rect x="364" y="62" width="112" height="52" rx="10" class="raised"/>
  <text x="420" y="84"  font-size="15" text-anchor="middle" class="t b">DOM</text>
  <text x="420" y="104" font-size="13" text-anchor="middle" class="s">문서 구조 객체</text>

  <!-- 생명선 -->
  <line x1="60"  y1="118" x2="60"  y2="760" class="life"/>
  <line x1="180" y1="118" x2="180" y2="760" class="life"/>
  <line x1="300" y1="118" x2="300" y2="760" class="life"/>
  <line x1="420" y1="118" x2="420" y2="760" class="life"/>

  <!-- ⓪ 준비 단계 -->
  <rect x="6" y="128" width="468" height="116" rx="12" class="soft"/>
  <text x="18" y="152" font-size="15" class="t b">⓪ 준비 — 페이지가 열릴 때 한 번만</text>
  <circle cx="300" cy="184" r="11" class="prepB"/><text x="300" y="189" font-size="13" text-anchor="middle" class="badgeT">0</text>
  <line x1="289" y1="184" x2="190" y2="184" class="prep" marker-end="url(#v04ArrPrep)"/>
  <text x="240" y="169" font-size="14" text-anchor="middle" class="t m b">addEventListener</text>
  <text x="18" y="214" font-size="14" class="t">“이 버튼에서 click이 오면 이 함수(handler)를 불러 주세요”</text>
  <text x="18" y="233" font-size="13" class="s">defer 덕분에 HTML을 다 읽은 뒤 실행되어 버튼을 찾을 수 있습니다.</text>

  <!-- 실행 단계 제목 -->
  <text x="16" y="270" font-size="15" class="t b">실행 — 사용자가 버튼을 누를 때마다 번호 순서로</text>

  <!-- ① 사용자 → 브라우저 -->
  <circle cx="60" cy="298" r="11" class="badge"/><text x="60" y="303" font-size="13" text-anchor="middle" class="badgeT">1</text>
  <line x1="71" y1="298" x2="170" y2="298" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="314" width="468" height="38"/>
  <text x="16" y="332" font-size="14" class="t b">① 사용자가 버튼을 클릭한다</text>
  <text x="16" y="350" font-size="13" class="s">사람의 행동이 브라우저에 입력 신호로 들어옵니다.</text>

  <!-- ② 브라우저 → JS -->
  <circle cx="180" cy="386" r="11" class="badge"/><text x="180" y="391" font-size="13" text-anchor="middle" class="badgeT">2</text>
  <line x1="191" y1="386" x2="290" y2="386" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="402" width="468" height="38"/>
  <text x="16" y="420" font-size="14" class="t b">② 브라우저가 click 이벤트를 만들어 handler를 부른다</text>
  <text x="16" y="438" font-size="13" class="s">⓪에서 등록해 둔 함수만 호출됩니다. 등록이 없으면 아무 일도 없습니다.</text>

  <!-- ③ JS 자기 자신 -->
  <circle cx="300" cy="474" r="11" class="badge"/><text x="300" y="479" font-size="13" text-anchor="middle" class="badgeT">3</text>
  <path d="M311 474 H340 V494 H311" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="502" width="468" height="38"/>
  <text x="16" y="520" font-size="14" class="t b">③ handler가 지금 상태를 보고 새 상태를 정한다</text>
  <text x="16" y="538" font-size="13" class="s">예: 메뉴가 닫혀 있다 → 이제 열려야 한다.</text>

  <!-- ④ JS → DOM -->
  <circle cx="300" cy="574" r="11" class="badge"/><text x="300" y="579" font-size="13" text-anchor="middle" class="badgeT">4</text>
  <line x1="311" y1="574" x2="410" y2="574" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="590" width="468" height="38"/>
  <text x="16" y="608" font-size="14" class="t b">④ DOM을 바꾼다 (클래스·속성 변경)</text>
  <text x="16" y="626" font-size="13" class="s">예: 메뉴 요소에 is-open 클래스를 붙인다. HTML 파일은 그대로입니다.</text>

  <!-- ⑤ DOM → 브라우저 -->
  <circle cx="420" cy="662" r="11" class="badge"/><text x="420" y="667" font-size="13" text-anchor="middle" class="badgeT">5</text>
  <line x1="409" y1="662" x2="190" y2="662" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="678" width="468" height="38"/>
  <text x="16" y="696" font-size="14" class="t b">⑤ 브라우저가 바뀐 DOM과 CSS로 화면을 다시 그린다</text>
  <text x="16" y="714" font-size="13" class="s">CSS의 .is-open 규칙이 이제 적용되어 메뉴가 보이게 됩니다.</text>

  <!-- ⑥ 브라우저 → 사용자 -->
  <circle cx="180" cy="750" r="11" class="badge"/><text x="180" y="755" font-size="13" text-anchor="middle" class="badgeT">6</text>
  <line x1="169" y1="750" x2="70" y2="750" class="run" marker-end="url(#v04ArrRun)"/>
  <rect class="bg" x="6" y="766" width="468" height="38"/>
  <text x="16" y="784" font-size="14" class="t b">⑥ 사용자는 열린 메뉴를 본다</text>
  <text x="16" y="802" font-size="13" class="s">눈에 보이는 결과입니다. 이때 사람은 다시 ①로 돌아갈 수 있습니다.</text>

  <!-- 같은 흐름 다른 기능 -->
  <rect x="6" y="820" width="468" height="94" rx="12" class="accent"/>
  <text x="18" y="842" font-size="14" class="t b">같은 흐름을 쓰는 세 가지 기능 (②~⑥ 구조는 같음)</text>
  <text x="18" y="862" font-size="13" class="t">☰ 메뉴 열기 — ④ 메뉴 요소에 클래스를 붙인다</text>
  <text x="18" y="880" font-size="13" class="t">↑ 맨 위로 — ④ 스크롤 위치를 맨 위로 옮긴다</text>
  <text x="18" y="898" font-size="13" class="t">섹션 등장 — ①이 클릭이 아니라 ‘요소가 화면에 들어옴’</text>

  <line x1="22" y1="934" x2="62" y2="934" class="run" marker-end="url(#v04ArrRun)"/><text x="72" y="939" font-size="13" class="s">실행 순서</text>
  <line x1="170" y1="934" x2="210" y2="934" class="prep" marker-end="url(#v04ArrPrep)"/><text x="220" y="939" font-size="13" class="s">준비·등록(미리 연결)</text>
</svg>
