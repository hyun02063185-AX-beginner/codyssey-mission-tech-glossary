<rect x="13" y="593" width="334" height="40" rx="8" fill="#e7eee9"/>
<text x="22" y="617" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#345347" font-weight="700" text-anchor="start">CRUD는 데이터에 하는 네 가지 기본 행동입니다.</text>
