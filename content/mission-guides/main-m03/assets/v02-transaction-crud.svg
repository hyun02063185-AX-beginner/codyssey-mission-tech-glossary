<path d="M180 245 L180 266" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="485" width="320" height="83" rx="12" fill="#fff" stroke="#d5e5da" stroke-width="1"/>
