<rect x="29" y="540" width="942" height="44" rx="8" fill="#e7eee9"/>
<text x="46" y="567" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="16" fill="#345347" font-weight="700" text-anchor="start">굵은 흐름 = 대표 동작   ·   보조 상자 = 필요할 때 쓰는 기술  /  M03를 바탕으로 일반화한 그림</text>
