<text x="366" y="511" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">실제 검증과는 다름</text>
<rect x="670" y="442" width="300" height="83" rx="12" fill="#fff1e3" stroke="#d5e5da" stroke-width="1"/>
