<svg xmlns="http://www.w3.org/2000/svg" width="360" height="673" viewBox="0 0 360 673" role="img" aria-label="파일을 고칠 때 원본 지키기">
<title>파일을 고칠 때 원본 지키기</title>
<rect width="360" height="673" rx="20" fill="#f7faf8"/>
<defs><filter id="shadow" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#345447" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#657e70"/></marker></defs>
<rect x="0" y="0" width="360" height="100" rx="18" fill="#173e35"/>
<rect x="0" y="79" width="360" height="21" rx="0" fill="#173e35"/>
<text x="20" y="30" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#b5e7ce" font-weight="700" text-anchor="start">V06  |  Update · Delete · Replace</text>
<text x="20" y="58" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="17" fill="#fff" font-weight="800" text-anchor="start">파일을 고칠 때 원본 지키기</text>
<rect x="20" y="125" width="320" height="74" rx="12" fill="#eaf0ff" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="150" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">① 원본 파일 읽기</text>
<text x="33" y="173" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">거래 중 무엇을 수정·삭제할지 결정</text>
<path d="M180 199 L180 224" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="234" width="320" height="75" rx="12" fill="#fff" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="259" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">② 변경된 목록 만들기</text>
<text x="33" y="282" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">M03은 결과 레코드를 리스트로 보관</text>
<path d="M180 309 L180 334" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="344" width="320" height="74" rx="12" fill="#fff1e3" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="369" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">③ 임시 파일에 기록</text>
<text x="33" y="392" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">완성되기 전까지 원본을 유지</text>
<path d="M180 418 L180 445" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="455" width="320" height="73" rx="12" fill="#e3f5ea" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="480" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">④ os.replace로 파일 교체</text>
<text x="33" y="503" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">준비된 내용을 원본 위치에 반영</text>
<rect x="20" y="541" width="320" height="62" rx="12" fill="#f3ebff" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="566" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">한계도 있습니다</text>
<text x="33" y="589" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">백업과 동시 수정 문제까지 해결하지는 않음</text>
<rect x="13" y="620" width="334" height="40" rx="8" fill="#e7eee9"/>
<text x="22" y="644" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#345347" font-weight="700" text-anchor="start">중간에 실패해도 원본을 지키려는 설계입니다.</text>
</svg>