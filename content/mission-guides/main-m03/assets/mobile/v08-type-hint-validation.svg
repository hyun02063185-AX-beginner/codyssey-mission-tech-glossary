<rect x="20" y="458.41999999999996" width="320" height="97.94000000000005" rx="12" fill="#f3ebff" stroke="#d5e5da" stroke-width="1"></rect>
<text x="33" y="487.91999999999996" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#1d2d29" font-weight="700" text-anchor="start"><tspan x="33" y="487.91999999999996">Type Hint는 안내</tspan></text>
<text x="33" y="515.06" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="515.06">: int = 정수 형태를 기대한다는 표시</tspan></text>
<text x="33" y="539.8399999999999" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="539.8399999999999">-&gt; None = 반환값이 없다는 뜻</tspan></text>
<path d="M180 556.36 L180 590.5799999999999" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"></path>
