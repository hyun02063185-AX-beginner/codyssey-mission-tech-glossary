<text x="33" y="374.64" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="374.64">show_amount(5000)</tspan></text>
<text x="33" y="399.41999999999996" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="399.41999999999996">5000 = 실제 전달한 값</tspan></text>
