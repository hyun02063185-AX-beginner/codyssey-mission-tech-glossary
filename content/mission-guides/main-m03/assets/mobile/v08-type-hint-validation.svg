<text x="33" y="659.02" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="659.02">문자인지? / 숫자인지? / 양수인지?</tspan></text>
<text x="33" y="683.8" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="683.8">규칙에 맞지 않으면 오류 처리</tspan></text>
<rect x="13" y="795.9" width="334" height="70.19999999999993" rx="8" fill="#e7eee9"></rect>
<text x="22" y="824.2199999999999" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#345347" font-weight="700" text-anchor="start"><tspan x="22" y="824.2199999999999">Type Hint만으로 잘못된 값이 </tspan><tspan x="22" y="847.2199999999999">차단되진 않습니다.</tspan></text>
