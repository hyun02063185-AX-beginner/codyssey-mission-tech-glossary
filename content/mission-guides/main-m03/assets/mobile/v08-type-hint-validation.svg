<text x="20" y="91.44" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#fff" font-weight="800" text-anchor="start"><tspan x="20" y="91.44">값을 받는 자리와 실제 값</tspan></text>
