<text x="33" y="222.42" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="222.42">def show_amount(amount: int)</tspan></text>
<text x="33" y="247.2" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="33" y="247.2">amount = 값을 받을 자리</tspan></text>
