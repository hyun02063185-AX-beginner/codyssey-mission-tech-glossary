<svg xmlns="http://www.w3.org/2000/svg" width="360" height="831" viewBox="0 0 360 831" role="img" aria-label="프로그램을 꺼도 남는 이유">
<title>프로그램을 꺼도 남는 이유</title>
<rect width="360" height="830.12" rx="20" fill="#f7faf8" y="0"></rect>
