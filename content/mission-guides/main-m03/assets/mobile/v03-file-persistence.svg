<text x="20" y="68.44" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#fff" font-weight="800" text-anchor="start"><tspan x="20" y="68.44">프로그램을 꺼도 남는 이유</tspan></text>
