<text x="37" y="363.44" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="37" y="363.44">거래 · 카테고리 · 예산 기록</tspan></text>
