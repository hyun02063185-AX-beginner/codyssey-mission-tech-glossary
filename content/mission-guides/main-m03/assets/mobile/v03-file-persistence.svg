<text x="37" y="199.42" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="37" y="199.42">메모리에서 거래를 만들고 처리</tspan></text>
