<text x="37" y="494.41999999999996" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="37" y="494.41999999999996">실행은 끝나도 파일은 남음</tspan></text>
<path d="M180 523.92 L180 556.9599999999999" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"></path>
