<text x="37" y="726.88" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="18" fill="#526761" font-weight="500" text-anchor="start"><tspan x="37" y="726.88">표 형식으로 다른 프로그램과 교환</tspan></text>
