<svg xmlns="http://www.w3.org/2000/svg" width="360" height="630" viewBox="0 0 360 630" role="img" aria-label="명령 한 줄, 두 명의 해석자">
<title>명령 한 줄, 두 명의 해석자</title>
<rect width="360" height="630" rx="20" fill="#f7faf8"/>
<defs><filter id="shadow" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#345447" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#657e70"/></marker></defs>
<rect x="0" y="0" width="360" height="100" rx="18" fill="#173e35"/>
<rect x="0" y="79" width="360" height="21" rx="0" fill="#173e35"/>
<text x="20" y="30" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#b5e7ce" font-weight="700" text-anchor="start">V01  |  CLI · Python · argparse</text>
<text x="20" y="58" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="17" fill="#fff" font-weight="800" text-anchor="start">명령 한 줄, 두 명의 해석자</text>
<rect x="18" y="118" width="324" height="54" rx="9" fill="#173e35"/>
<text x="180" y="150" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">python  -m  ledger  list  --limit  5</text>
<rect x="20" y="188" width="153" height="28" rx="8" fill="#e0f2e9"/>
<text x="96.5" y="207" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#176c58" font-weight="700" text-anchor="middle">Python이 이해</text>
<rect x="185" y="188" width="155" height="28" rx="8" fill="#e8edff"/>
<text x="262.5" y="207" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#3a53a2" font-weight="700" text-anchor="middle">내 프로그램이 이해</text>
<rect x="20" y="232" width="155" height="105" rx="12" fill="#fff" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="257" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">① 실행 대상 찾기</text>
<text x="33" y="280" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">python  -m</text>
<text x="33" y="301" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">ledger 패키지</text>
<rect x="186" y="232" width="154" height="105" rx="12" fill="#fff" stroke="#d5e5da" stroke-width="1"/>
<text x="199" y="257" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">② 명령 해석</text>
<text x="199" y="280" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">list = 목록 조회</text>
<text x="199" y="301" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">--limit 5 = 개수</text>
<path d="M93 336 L93 375" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M263 336 L263 375" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="384" width="320" height="75" rx="12" fill="#e9f5ed" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="409" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">③ 프로그램 실행</text>
<text x="33" y="432" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">패키지 안의 진입점에서 시작합니다.</text>
<path d="M180 459 L180 485" fill="none" stroke="#657e70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="493" width="320" height="73" rx="12" fill="#e9efff" stroke="#d5e5da" stroke-width="1"/>
<text x="33" y="518" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="15" fill="#1d2d29" font-weight="700" text-anchor="start">④ argparse가 명령과 값을 구분</text>
<text x="33" y="541" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="13" fill="#526761" font-weight="500" text-anchor="start">프로그램은 해석 결과로 기능을 실행합니다.</text>
<rect x="13" y="577" width="334" height="40" rx="8" fill="#e7eee9"/>
<text x="22" y="601" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif" font-size="12" fill="#345347" font-weight="700" text-anchor="start">핵심: -m과 --limit은 소속이 다릅니다.</text>
