<svg xmlns="http://www.w3.org/2000/svg" width="360" height="718" viewBox="0 0 360 718" data-state="all" data-states="all s1 s2 s3 s4 return" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Python이 현재 폴더의 Git을 실행해 변경을 읽는다. 검사한 문맥은 Python에서 외부 AI API로 HTTPS 요청을 통해 나간다. 응답 JSON은 반대 방향으로 Python에 돌아온다. Python은 초안을 검증해 터미널에 출력하고, 사람이 확인한 뒤 사용한다. 외부 경계는 API를 둘러싸며 모델 실행 위치는 미확인이다."><title>로컬 Python과 외부 AI API</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="all"] [class*="b32s-in-"]:not(.b32s-in-all){display:none}svg[data-state="s1"] [class*="b32s-in-"]:not(.b32s-in-s1){display:none}svg[data-state="s1"] .b32s-g:not(.b32s-k-s1){opacity:.32}svg[data-state="s1"] .b32s-k-s1 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s2"] [class*="b32s-in-"]:not(.b32s-in-s2){display:none}svg[data-state="s2"] .b32s-g:not(.b32s-k-s2){opacity:.32}svg[data-state="s2"] .b32s-k-s2 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s3"] [class*="b32s-in-"]:not(.b32s-in-s3){display:none}svg[data-state="s3"] .b32s-g:not(.b32s-k-s3){opacity:.32}svg[data-state="s3"] .b32s-k-s3 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s4"] [class*="b32s-in-"]:not(.b32s-in-s4){display:none}svg[data-state="s4"] .b32s-g:not(.b32s-k-s4){opacity:.32}svg[data-state="s4"] .b32s-k-s4 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="return"] [class*="b32s-in-"]:not(.b32s-in-return){displa