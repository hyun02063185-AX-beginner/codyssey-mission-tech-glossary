="b32s-ln" marker-end="url(#b32s-a)"/></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="16" y="184" width="124" height="92" rx="12" class="b32s-box b32s-node"/><text x="32" y="220" font-size="19" class="b32s-ink b32s-b">사용자</text><text x="32" y="258" font-size="16" class="b32s-muted">내용 확인</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="170" y="184" width="111" height="92" rx="12" class="b32s-box-r b32s-node"/><rect x="181" y="195" width="48" height="28" rx="16" class="b32s-sr"/><text x="205" y="215" font-size="16" class="b32s-on" text-anchor="middle">초안</text><text x="240" y="216" font-size="19" class="b32s-ink b32s-b"></text><text x="186" y="250" font-size="16" class="b32s-muted">터미널 출력</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><path d="M223 154V181" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M168 228H143" class="b32s-ln" marker-end="url(#b32s-a)"/></g><rect x="4" y="351" width="352" height="147" rx="14" class="b32s-zone-ext"/><text x="16" y="377" font-size="16" class="b32s-muted b32s-b">외부 서비스</text><g class="b32s-g b32s-k-s1 b32s-k-s3"><rect x="16" y="391" width="328" height="95" rx="12" class="b32s-box-a b32s-node"/><path d="M44 395L66 417L44 439L22 417Z" class="b32s-si"/><text x="44" y="423" font-size="16" class="b32s-on" text-anchor="middle">AI</text><text x="74" y="424" font-size="19" class="b32s-ink b32s-b">코디세이 AI API</text><text x="32" y="459" font-size="16" class="b32s-muted">모델 실행 위치 미확인</text></g><g class="b32s-g b32s-k-s1 b32s-k-s3"><path d="M299 154V388" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)" data-transfer="request"/><path d="M326 389V156" class="b32s-ln" marker-end="url(#b32s-a)" data-transfer="response"/><text x="202" y="313" font-size="16" class="b32s-acc">요청 → API</text><text x="177" y="338" font-size="16" class="b32s-ink">응답 → Python</text></g><g class="b32s-in-all b32s-in-s1 b32s-in-s2 b32s-in-s3 b32s-in-s4"><text x="16" y="537" font-size="16" class="b32s-ink">Python이 검사한 변경을 API에 보낸다.</text><text x="16" y="566" font-size="16" class="b32s-ink">응답은 Python이 읽고 검증한다.</text><text x="16" y="595" font-size="16" class="b32s-ink">사용자는 출력된 초안을 확인한다.</text><text x="16" y="643" font-size="16" class="b32s-muted">실선 = 실행·데이터 전달</text><text x="16" y="669" font-size="16" class="b32s-muted">점선 테두리 = 외부 서비스 경계</text></g><g class="b32s-in-return"><rect x="4" y="508" width="352" height="62" rx="12" class="b32s-box-r"/><circle cx="27" cy="528" r="13" class="b32s-sacc"/><text x="27" y="534" font-size="16" class="b32s-on" text-anchor="middle">1</text><text x="49" y="534" font-size="17" class="b32s-ink b32s-b">프로그램 · 형식을 검사</text><text x="17" y="559" font-size="16" class="b32s-muted">제목 길이 · 필수 섹션 · 테스트 주장</text><rect x="4" y="576" width="352" height="62" rx="12" class="b32s-box-acc"/><circle cx="27" cy="596" r="13" class="b32s-sacc"/><text x="27" y="602" font-size="16" class="b32s-on" text-anchor="middle">2</text><text x="49" y="602" font-size="17" class="b32s-ink b32s-b">사람 · 내용과 이유를 확인</text><text x="17" y="627" font-size="16" class="b32s-muted">실제 diff와 비교 · 빠진 것 찾기</text><rect x="4" y="644" width="352" height="62" rx="12" class="b32s-box-acc"/><circle cx="27" cy="664" r="13" class="b32s-sacc"/><text x="27" y="670" font-size="16" class="b32s-on" text-anchor="middle">3</text><text x="49" y="670" font-size="17" class="b32s-ink b32s-b">사람 · 직접 사용</text><text x="17" y="695" font-size="16" class="b32s-muted">git commit · GitHub에서 PR 작성</text></g></svg>
