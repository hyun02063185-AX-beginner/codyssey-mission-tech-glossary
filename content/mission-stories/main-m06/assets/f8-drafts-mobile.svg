><text x="16" y="594" font-size="16" class="b32s-ink" xml:space="preserve">  명시해 혼동을 줄이기 위해</text><text x="16" y="622" font-size="16" class="b32s-ink b32s-mono b32s-b">## What</text><text x="16" y="650" font-size="16" class="b32s-ink">- docs/learning/02-python-ai-api.md</text><text x="16" y="678" font-size="16" class="b32s-ink" xml:space="preserve">  파일 끝에 … 문구를 추가함</text><text x="16" y="706" font-size="16" class="b32s-ink b32s-mono b32s-b">## How to Test</text><rect x="10" y="714" width="340" height="28" rx="4" class="b32s-box-acc"/><text x="16" y="734" font-size="16" class="b32s-acc">- 실행 권장: python -m</text><rect x="10" y="742" width="340" height="28" rx="4" class="b32s-box-acc"/><text x="16" y="762" font-size="16" class="b32s-acc" xml:space="preserve">  unittest discover -s tests</text><text x="16" y="790" font-size="16" class="b32s-muted b32s-mono" xml:space="preserve">=== 끝 ===  · 요청 횟수 1</text><text x="8" y="840" font-size="16" class="b32s-muted">모두 실제 출력</text><text x="8" y="866" font-size="16" class="b32s-muted">… = 화면에 맞춰 줄인 부분 (전문은 노트)</text><text x="8" y="892" font-size="16" class="b32s-muted">주황 = 프로그램이 넣은 고정 문구</text></svg>
