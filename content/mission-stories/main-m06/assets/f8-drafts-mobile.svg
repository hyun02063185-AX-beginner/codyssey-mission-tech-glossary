<svg xmlns="http://www.w3.org/2000/svg" width="360" height="910" viewBox="0 0 360 910" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="같은 변경으로 실행한 두 명령의 실제 출력(2026-10-20 사용자 실행, ChatGPT 대화 공유 원문). 왼쪽 python main.py commit: '=== 검토용 초안: COMMIT ===' 다음에 제목 '학습 문서에 실습 메모 추가: AI 생성 커밋 메시지 검토 필요'(35자), 빈 줄, 본문 두 줄 'docs/learning/02-python-ai-api.md 파일 끝에 실습 메모를 추가하여 / AI가 생성한 커밋 메시지는 사용자가 검토한 후 적용해야 함을 명시함.', 끝 표시와 stderr의 'AI API 요청 횟수: 1'. 오른쪽 python main.py pr: 'Title: docs(learning): AI 생성 커밋 메시지 검토 안내 추가'(37자), ## Why '- 학습 문서에 … 실습 메모를 명시해 혼동을 줄이기 위해', ## What '- docs/learning/02-python-ai-api.md 파일 끝에 … 추가함'(긴 줄은 …로 줄임), ## How to Test는 프로그램이 넣은 고정 문구 '- 실행 권장: python -m unittest discover -s tests'(강조), 끝 표시와 요청 횟수 1. 아래 범례: 굵은 글자 = 실제 출력의 제목, … = 화면에 맞춰 줄인 부분(전문은 발표자 노트), 주황 = 프로그램이 넣은 고정 문구."><title>commit 초안과 PR 초안</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7