<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="실제 B3-2 실행에서 AI가 설명한 변경을 연습 저장소에서 다시 만든 터미널 화면(재현). git status --short는 ' M docs/learning/02-python-ai-api.md'를 보여 준다. M은 고친 파일이고 아직 git add 전이라 오른쪽 칸에 있다. git diff의 @@ -26,6 +26,8 @@ 줄은 26번째 줄 근처에서 6줄이 8줄이 되었다는 위치 표시다. 앞이 빈칸인 줄은 그대로인 주변 문맥이고, +로 시작하는 두 줄 '실습 메모: AI가 생성한 커밋 메시지는 사용자가 검토한 후 적용한다.'와 빈 줄이 새로 생긴 줄이다. -로 시작하는 지워진 줄은 이번 변경에 없다. git diff --cached는 git add한 변경을 보여 주며 이번에는 출력이 없다. Git은 이 정보를 GitHub가 아니라 내 컴퓨터의 저장소에서 읽는다. 긴 줄과 머리 줄 일부는 줄여서 표시했다."><title>Git은 무엇이 변경됐는지 알고 있다</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="520" class="b32s-bg"/><rect x="16" y="12" width="780" height="496" rx="12" class="b32s-box-term"/><path d="M16 24a12 12 0 0 1 12-12h756a12 12 0 0 1 12 12v24H16Z" class="b32s-bar"/><text x="36" y="38" font-size="19" class="b32s-muted">터미널 · 연습 저장소 (재현 · 긴 줄은 …로 줄임)</text><text x="36" y="90" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git status --short</text><text x="36" y="120" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> M docs/learning/02-python-ai-api.md</text><text x="36" y="150" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git diff</text><text x="36" y="180" font-size="19" class="b32s-ink b32s-mono">diff --git a/docs/learning/02-python-ai-api.md …</text><text x="36" y="210" font-size="19" class="b32s-muted">··· index · --- · +++ 3줄 생략 ···</text><text x="36" y="240" font-size="19" class="b32s-acc b32s-mono">@@ -26,6 +26,8 @@ API는 프로그램끼리 …</text><text x="36" y="300" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> 키 없이 Windows: … 을 실행한다.</text><rect x="24" y="338" width="764" height="30" rx="4" class="b32s-hlrow"/><text x="36" y="360" font-size="19" class="b32s-add b32s-mono b32s-b">+실습 메모: AI가 생성한 커밋 메시지는 사용자가 검토한 후 적용한다.</text><rect x="24" y="368" width="764" height="30" rx="4" class="b32s-hlrow"/><text x="36" y="390" font-size="19" class="b32s-add b32s-mono b32s-b">+</text><text x="36" y="420" font-size="19" class="b32s-muted">··· 뒤쪽 문맥 3줄 생략 ···</text><text x="36" y="450" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git diff --cached</text><text x="36" y="480" font-size="19" class="b32s-muted">(출력 없음)</text><rect x="836" y="64" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="90" font-size="21" class="b32s-acc b32s-mono">M</text><text x="886" y="90" font-size="19" class="b32s-ink b32s-b">고친 파일</text><text x="852" y="118" font-size="19" class="b32s-muted">아직 git add 전</text><path d="M834 95L800 113" class="b32s-lead"/><rect x="836" y="134" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="160" font-size="21" class="b32s-acc b32s-mono">@@</text><text x="904" y="160" font-size="19" class="b32s-ink b32s-b">위치 표시</text><text x="852" y="188" font-size="19" class="b32s-muted">26번째 줄 근처 · 6줄 → 8줄</text><path d="M834 165L800 233" class="b32s-lead"/><rect x="836" y="204" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="230" font-size="21" class="b32s-acc b32s-mono">빈칸</text><text x="912" y="230" font-size="19" class="b32s-ink b32s-b">그대로인 주변 줄</text><text x="852" y="258" font-size="19" class="b32s-muted">(앞뒤 3줄씩 문맥)</text><path d="M834 235L800 293" class="b32s-lead"/><rect x="836" y="274" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="300" font-size="21" class="b32s-acc b32s-mono">+</text><text x="886" y="300" font-size="19" class="b32s-ink b32s-b">새로 생긴 줄</text><text x="852" y="328" font-size="19" class="b32s-muted">이번 변경은 2줄 (빈 줄 포함)</text><path d="M834 305L800 353" class="b32s-lead"/><rect x="836" y="344" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="370" font-size="21" class="b32s-acc b32s-mono">-</text><text x="886" y="370" font-size="19" class="b32s-ink b32s-b">지워진 줄</text><text x="852" y="398" font-size="19" class="b32s-muted">이번 변경에는 없다</text><rect x="836" y="414" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="440" font-size="21" class="b32s-acc b32s-mono">--cached</text><text x="960" y="440" font-size="19" class="b32s-ink b32s-b">git add한 변경</text><text x="852" y="468" font-size="19" class="b32s-muted">이번에는 없다</text><path d="M834 445L800 473" class="b32s-lead"/></svg>
