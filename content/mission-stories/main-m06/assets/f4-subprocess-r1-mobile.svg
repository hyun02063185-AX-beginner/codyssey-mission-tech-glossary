<svg xmlns="http://www.w3.org/2000/svg" width="360" height="808" viewBox="0 0 360 808" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="사용자가 python main.py commit을 입력한다. argparse는 입력을 읽고, subprocess.run()은 로컬 Git을 실행한다. Git은 상태와 바뀐 줄을 읽어 Python에 돌려준다. commit은 만들 초안의 종류다."><title>Python이 Git을 실행하는 길</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="808" class="b32s-bg"/><rect x="4" y="8" width="352" height="48" rx="10" class="b32s-box-term"/><text x="18" y="39" font-size="18" class="b32s-ink b32s-mono b32s-b">&gt; python main.py commit</text><rect x="4" y="76" width="352" height="116" rx="12" class="b32s-box-p"/><circle cx="28" cy="102" r="13" class="b32s-sacc"/><text x="28" y="108" font-size="16" class="b32s-on" text-anchor="middle">1</text><text x="50" y="109" font-size="19" class="b32s-ink b32s-b">argparse</text><text x="18" y="138" font-size="16" class="b32s-muted">사람 → 프로그램</text><text x="18" y="162" font-size="16" class="b32s-muted">입력을 읽고 초안을 선택</text><path d="M180 194V208" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="4" y="210" width="352" height="116" rx="12" class="b32s-box-p"/><circle cx="28" cy="236" r="13" class="b32s-sacc"/><text x="28" y="242" font-size="16" class="b32s-on" text-anchor="middle">2</text><text x="50" y="243" font-size="19" class="b32s-ink b32s-b b32s-mono">subprocess.run()</text><text x="18" y="272" font-size="16" class="b32s-muted">프로그램 → Git</text><text x="18" y="296" font-size="16" class="b32s-muted">Git 명령을 실행</text><path d="M180 328V342" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="4" y="344" width="352" height="116" rx="12" class="b32s-box-g"/><circle cx="28" cy="370" r="13" class="b32s-sacc"/><text x="28" y="376" font-size="16" class="b32s-on" text-anchor="middle">3</text><text x="50" y="377" font-size="19" class="b32s-ink b32s-b">로컬 Git</text><text x="18" y="406" font-size="16" class="b32s-muted">내 컴퓨터의 저장소에서</text><text x="18" y="430" font-size="16" class="b32s-muted">상태와 바뀐 줄을 읽는다</text><path d="M180 462V476" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="4" y="478" width="352" height="116" rx="12" class="b32s-box-p"/><circle cx="28" cy="504" r="13" class="b32s-sacc"/><text x="28" y="510" font-size="16" class="b32s-on" text-anchor="middle">4</text><text x="50" y="511" font-size="19" class="b32s-ink b32s-b">Python</text><text x="18" y="540" font-size="16" class="b32s-muted">Git이 돌려준 결과를 받는다</text><text x="18" y="564" font-size="16" class="b32s-muted">다음 화면에서 결과 확인</text><rect x="4" y="618" width="352" height="62" rx="10" class="b32s-box-acc"/><text x="18" y="643" font-size="17" class="b32s-ink b32s-b">commit은 초안의 종류다</text><text x="18" y="667" font-size="17" class="b32s-ink b32s-b">git commit을 실행하지 않는다</text><text x="16" y="708" font-size="16" class="b32s-muted">실행하는 Git 명령 6번 (commit·push 없음)</text><text x="16" y="734" font-size="16" class="b32s-muted">rev-parse · branch · status ×2 · diff ×2</text></svg>
