<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="python main.py commit을 입력했을 때의 흐름. 1 argparse가 명령줄 입력을 읽어 commit이면 커밋 메시지 초안, pr이면 PR 초안을 만들기로 정한다. 2 subprocess.run이 ['git', 'diff', …] 같은 목록을 그대로 넘긴다. 셸을 거치지 않는다. 3 운영체제가 git 프로그램을 새 프로세스로 실행한다. 4 Git이 저장소를 읽고 결과를 돌려준다. 강조 이름표: 여기서 commit은 만들 초안의 종류이며 git commit을 실행하지 않는다. 아래 띠: 실제로 실행하는 Git 명령은 rev-parse, branch, status 두 번, diff, diff --cached의 여섯 번이고 commit·push는 없다."><title>Python이 Git을 실행하는 길</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="500" class="b32s-bg"/><rect x="16" y="16" width="420" height="58" rx="10" class="b32s-box-term"/><text x="36" y="54" font-size="24" class="b32s-ink b32s-mono b32s-b">&gt; python main.py commit</text><path d="M226 76V122" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="16" y="126" width="266" height="196" rx="12" class="b32s-box-p"/><circle cx="46" cy="158" r="16" class="b32s-sacc"/><text x="46" y="165" font-size="19" class="b32s-on" text-anchor="middle">1</text><text x="72" y="166" font-size="22" class="b32s-ink b32s-b">argparse</text><text x="34" y="214" font-size="19" class="b32s-muted">명령줄 입력을 읽는다</text><text x="34" y="248" font-size="19" class="b32s-muted">commit → 커밋 메시지 초안</text><text x="34" y="282" font-size="19" class="b32s-muted">pr → PR 초안</text><path d="M284 224H306" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="308" y="126" width="266" height="196" rx="12" class="b32s-box-p"/><circle cx="338" cy="158" r="16" class="b32s-sacc"/><text x="338" y="165" font-size="19" class="b32s-on" text-anchor="middle">2</text><text x="364" y="166" font-size="22" class="b32s-ink b32s-b b32s-mono">subprocess.run</text><text x="326" y="214" font-size="19" class="b32s-ink b32s-mono">[&quot;git&quot;, &quot;diff&quot;, …]</text><text x="326" y="248" font-size="19" class="b32s-muted">목록 그대로 넘긴다</text><text x="326" y="282" font-size="19" class="b32s-muted">셸을 거치지 않는다</text><path d="M576 224H598" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="600" y="126" width="266" height="196" rx="12" class="b32s-box"/><circle cx="630" cy="158" r="16" class="b32s-sacc"/><text x="630" y="165" font-size="19" class="b32s-on" text-anchor="middle">3</text><text x="656" y="166" font-size="22" class="b32s-ink b32s-b">운영체제</text><text x="618" y="214" font-size="19" class="b32s-muted">git 프로그램을</text><text x="618" y="248" font-size="19" class="b32s-muted">새 프로세스로 실행</text><text x="618" y="282" font-size="19" class="b32s-muted">(Windows · macOS)</text><path d="M868 224H890" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="892" y="126" width="266" height="196" rx="12" class="b32s-box-g"/><circle cx="922" cy="158" r="16" class="b32s-sacc"/><text x="922" y="165" font-size="19" class="b32s-on" text-anchor="middle">4</text><text x="948" y="166" font-size="22" class="b32s-ink b32s-b">Git</text><text x="910" y="214" font-size="19" class="b32s-muted">저장소를 읽고</text><text x="910" y="248" font-size="19" class="b32s-muted">결과를 돌려준다</text><text x="910" y="282" font-size="19" class="b32s-muted">→ 다음 화면</text><rect x="16" y="346" width="600" height="56" rx="10" class="b32s-box-acc"/><text x="36" y="382" font-size="21" class="b32s-ink b32s-b">commit은 초안의 종류다 · git commit을 실행하지 않는다</text><path d="M150 324V344" class="b32s-ln-acc"/><rect x="16" y="422" width="1168" height="62" rx="10" class="b32s-box"/><text x="36" y="449" font-size="19" class="b32s-ink">실제로 실행하는 Git 명령 6번: rev-parse · branch · status ×2 · diff · diff --cached</text><text x="36" y="474" font-size="19" class="b32s-muted">변경을 기록하거나(commit) 보내는(push) 명령은 없다.</text></svg>
