<svg xmlns="http://www.w3.org/2000/svg" width="360" height="636" viewBox="0 0 360 636" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="로컬 Python에서 외부 코디세이 AI API로 향하는 첫 번째 실선 화살표는 HTTPS POST 요청이다. 인증 헤더와 JSON 본문이 함께 간다. 본문은 모델 ID와 메시지 두 개를 담고, system은 작성 규칙, user는 검사한 Git 문맥이다. 외부 API에서 Python으로 돌아오는 두 번째 실선 화살표는 응답 JSON이다. Python은 choices[0].message.content의 초안 텍스트를 읽어 다음 검증으로 넘긴다. 요청 구조는 재현이며 모델은 2026-10-20의 실행 설정이다. 모델 실행 위치는 미확인이다."><title>Python과 외부 AI API의 요청·응답</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="636" class="b32s-bg"/><rect x="4" y="8" width="352" height="379" rx="14" class="b32s-zone"/><text x="16" y="34" font-size="17" class="b32s-tp">내 컴퓨터 · Python</text><rect x="12" y="47" width="336" height="185" rx="12" class="b32s-box-p"/><text x="25" y="73" font-size="18" class="b32s-tp">요청 구성 · HTTPS POST</text><text x="25" y="102" font-size="16" class="b32s-ink b32s-mono">Authorization: Bearer ••••</text><text x="25" y="126" font-size="16" class="b32s-muted">인증 헤더에 환경변수의 API 키</text><text x="25" y="154" font-size="16" class="b32s-ink">JSON 본문 · model: gpt-5-mini</text><text x="25" y="181" font-size="16" class="b32s-ink" xml:space="preserve">messages  system · 작성 규칙</text><text x="106" y="207" font-size="16" class="b32s-ink">user · 검사한 Git 문맥</text><rect x="12" y="246" width="336" height="123" rx="12" class="b32s-box-r"/><text x="25" y="274" font-size="18" class="b32s-tr">응답에서 초안 읽기</text><text x="25" y="305" font-size="16" class="b32s-ink b32s-mono">choices[0].message.content</text><text x="25" y="338" font-size="16" class="b32s-muted">초안 텍스트 → 다음 장면의 형식 검증</text><rect x="4" y="461" width="352" height="113" rx="14" class="b32s-zone-ext"/><text x="16" y="487" font-size="17" class="b32s-ink b32s-b">외부 서비스 · 코디세이 AI API</text><text x="16" y="514" font-size="16" class="b32s-ink">HTTPS 요청 수신 · JSON 응답 반환</text><text x="16" y="548" font-size="16" class="b32s-muted">모델 실행 위치 미확인</text><path d="M63 389V458" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)" data-transfer="request"/><path d="M288 459V391" class="b32s-ln" marker-end="url(#b32s-a)" data-transfer="response"/><text x="78" y="427" font-size="17" class="b32s-acc">① 요청</text><text x="273" y="427" font-size="17" class="b32s-ink b32s-b" text-anchor="end">② 응답 JSON</text><text x="16" y="600" font-size="16" class="b32s-muted">요청 구조 재현</text><text x="16" y="623" font-size="16" class="b32s-muted">모델 ID는 2026-10-20 실제 실행 설정</text></svg>
