<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="브랜치, 상태와 바뀐 파일 이름, 새 파일 이름, 바뀐 줄을 보낼 글에 담는다. 새 파일 내용, 바뀌지 않은 파일, API 키는 이 글에 넣지 않는다. 기본 검사는 이메일과 토큰처럼 보이는 값을 가린 뒤 계속하고, 비밀 파일로 보이는 경로가 있으면 전송을 멈춘다. 검사를 마친 글이 다음 요청의 user 메시지가 된다. 재현 예시에서는 806자이며 가릴 값은 없었다."><title>외부 AI에 보내기 전에 검사할 글</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="560" class="b32s-bg"/><text x="16" y="29" font-size="22" class="b32s-ink b32s-b">내 컴퓨터 밖으로 나갈 글</text><rect x="4" y="42" width="352" height="104" rx="12" class="b32s-box-p"/><text x="16" y="68" font-size="17" class="b32s-tp">보낼 글에 담는 것</text><text x="16" y="93" font-size="16" class="b32s-ink">브랜치 · 상태 · 바뀐 파일 이름</text><text x="16" y="117" font-size="16" class="b32s-ink">새 파일 이름 · 바뀐 줄(diff)</text><g data-topic="excluded-context"><rect x="4" y="152" width="352" height="79" rx="12" class="b32s-box"/><text x="16" y="175" font-size="16" class="b32s-muted b32s-b">넣지 않는 것</text><text x="16" y="197" font-size="16" class="b32s-ink">새 파일 내용 · 바뀌지 않은 파일</text><text x="16" y="218" font-size="16" class="b32s-ink">API 키 → 다음 화면의 인증 헤더</text></g><path d="M22 234V253" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="4" y="256" width="352" height="127" rx="12" class="b32s-box-acc"/><text x="16" y="280" font-size="16" class="b32s-acc">보내기 전 검사 · 기본으로 켜짐</text><text x="16" y="305" font-size="16" class="b32s-ink">가리고 계속 · 이메일·토큰 → [REDACTED]</text><text x="16" y="327" font-size="16" class="b32s-ink">전송 멈춤 · 비밀 파일 경로 등</text><text x="16" y="349" font-size="16" class="b32s-ink">멈추면 AI 요청 0회</text><path d="M22 386V405" class="b32s-ln" marker-end="url(#b32s-a)"/><g data-topic="prepared-context"><rect x="4" y="408" width="352" height="96" rx="12" class="b32s-box-r"/><text x="16" y="435" font-size="18" class="b32s-tr">검사를 마친 글</text><text x="16" y="460" font-size="16" class="b32s-muted">재현 · 806자 · 이번 예는 가릴 값 없음</text><text x="16" y="486" font-size="16" class="b32s-ink b32s-b">→ 다음 요청의 user 메시지가 된다</text></g><text x="16" y="535" font-size="16" class="b32s-muted">글자 수 한도와 검사 옵션 · 학습가이드 05</text></svg>
