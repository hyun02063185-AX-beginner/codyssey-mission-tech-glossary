<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="subprocess.run()을 실행하면 CompletedProcess 실행 결과 객체가 반환된다. stdout(표준 출력), stderr(표준 오류 출력), returncode(종료 코드)는 이 객체의 속성이다. stdout의 실제 값은 저장소 안에서 ' M docs/learning/02-python-ai-api.md', stderr의 실제 값은 저장소 밖에서 'fatal: not a git repository …'다. returncode는 안 0, 밖 128이다. Python의 처리 로직: returncode가 0인지 먼저 검사한다. 0이 아니면 오류를 알리고 멈춘다. 성공하면 stdout을 읽어 변경 여부를 판단한다. 변경이 없으면 종료, 있으면 다음 Scene의 데이터를 만든다. stderr의 내용만으로 실패를 판단하지 않는다. 기본 check=False에서는 0이 아닌 종료 코드에 대해 자동으로 예외를 내지 않으므로 B3-2가 직접 검사한다."><title>subprocess.run() 실행 결과와 Python의 처리 로직</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="500" class="b32s-bg"/><g class="b32s-g"><rect x="16" y="166" width="150" height="104" rx="12" class="b32s-box-g b32s-node"/><rect x="28" y="176" width="38" height="38" rx="3" class="b32s-sg"/><text x="47" y="203" font-size="22" class="b32s-on" text-anchor="middle">G</text><text x="80" y="204" font-size="24" class="b32s-ink b32s-b">Git</text><text x="32" y="243" font-size="19" class="b32s-muted">명령 끝</text></g><text x="214" y="25" font-size="19" class="b32s-ink b32s-b">실행 결과 객체 · CompletedProcess</text><rect x="214" y="42" width="440" height="128" rx="12" class="b32s-box"/><text x="232" y="78" font-size="22" class="b32s-ink b32s-mono b32s-b">stdout</text><text x="324" y="78" font-size="19" class="b32s-muted">표준 출력</text><text x="232" y="118" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> M docs/learning/02-python-ai-api.md</text><text x="232" y="152" font-size="19" class="b32s-muted">저장소 안 · 실제 값</text><path d="M168 218C190 218 190 106 210 106" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="214" y="188" width="440" height="128" rx="12" class="b32s-box"/><text x="232" y="224" font-size="22" class="b32s-ink b32s-mono b32s-b">stderr</text><text x="324" y="224" font-size="19" class="b32s-muted">표준 오류 출력</text><text x="232" y="264" font-size="19" class="b32s-ink b32s-mono">fatal: not a git repository …</text><text x="232" y="298" font-size="19" class="b32s-muted">저장소 밖 · 실제 값</text><path d="M168 218C190 218 190 252 210 252" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="214" y="334" width="440" height="128" rx="12" class="b32s-box-acc"/><text x="232" y="370" font-size="22" class="b32s-acc b32s-mono">returncode</text><text x="380" y="370" font-size="19" class="b32s-muted">종료 코드</text><text x="232" y="410" font-size="19" class="b32s-ink">0 = 성공 · 0이 아님 = 실패</text><text x="232" y="444" font-size="19" class="b32s-muted">실제: 안 0 · 밖 128</text><path d="M168 218C190 218 190 398 210 398" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M656 416H680V58H700" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)"/><rect x="704" y="16" width="236" height="84" rx="42" class="b32s-box-acc"/><circle cx="734" cy="58" r="16" class="b32s-sacc"/><text x="734" y="65" font-size="19" class="b32s-on" text-anchor="middle">1</text><text x="760" y="52" font-size="19" class="b32s-ink b32s-b">returncode가</text><text x="760" y="78" font-size="19" class="b32s-ink b32s-b">0인가?</text><rect x="704" y="152" width="236" height="84" rx="42" class="b32s-box-acc"/><circle cx="734" cy="194" r="16" class="b32s-sacc"/><text x="734" y="201" font-size="19" class="b32s-on" text-anchor="middle">2</text><text x="760" y="201" font-size="19" class="b32s-ink b32s-b">변경이 있나?</text><rect x="960" y="16" width="224" height="100" rx="12" class="b32s-box"/><text x="976" y="48" font-size="20" class="b32s-ink b32s-b">아니요 · 멈춘다</text><text x="976" y="78" font-size="19" class="b32s-muted">오류를 알리고 종료</text><text x="976" y="104" font-size="19" class="b32s-muted">AI 요청 0회</text><rect x="960" y="152" width="224" height="100" rx="12" class="b32s-box"/><text x="976" y="184" font-size="20" class="b32s-ink b32s-b">없음 · 끝낸다</text><text x="976" y="214" font-size="19" class="b32s-muted">변경 사항이 없습니다</text><text x="976" y="240" font-size="19" class="b32s-muted">AI 요청 0회</text><rect x="704" y="288" width="480" height="84" rx="12" class="b32s-box-p"/><text x="720" y="320" font-size="20" class="b32s-ink b32s-b">있음 · 다음으로</text><text x="720" y="350" font-size="19" class="b32s-muted">보낼 데이터를 만든다 (Scene 3)</text><path d="M942 58H956" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M942 194H956" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M814 102V148" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="826" y="132" font-size="19" class="b32s-ink b32s-b">예</text><path d="M814 238V284" class="b32s-ln" marker-end="url(#b32s-a)"/><rect x="704" y="392" width="480" height="70" rx="10" class="b32s-box"/><text x="720" y="420" font-size="19" class="b32s-ink">기본 check=False: 종료 코드를 직접 확인</text><text x="720" y="448" font-size="19" class="b32s-ink">0이 아니면 B3-2가 오류를 알리고 멈춘다.</text></svg>
