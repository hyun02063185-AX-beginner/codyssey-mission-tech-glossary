<svg xmlns="http://www.w3.org/2000/svg" width="360" height="634" viewBox="0 0 360 634" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Python은 API 주소에 POST로 요청한다. 인증 헤더에는 자격 증명인 API 키를, JSON 본문에는 모델 ID와 system 작성 규칙, user Git 문맥을 담는다. Python 딕셔너리를 JSON으로 바꿔 보내고, 성공 응답의 JSON을 Python 데이터로 읽는다. 401 또는 403이면 인증 또는 권한 오류를 알리고 멈춘다. 교육용 예시의 choices 첫 항목에서 message의 content가 초안이다. 요청 구조는 재현이며 원본 응답은 확보하지 않았다."><title>Python과 외부 AI API의 요청·응답</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="634" class="b32s-bg"/><rect x="4" y="4" width="352" height="202" rx="12" class="b32s-box-p"/><text x="16" y="29" font-size="17" class="b32s-tp">내 컴퓨터 · Python이 요청 만들기</text><text x="16" y="54" font-size="16" class="b32s-acc b32s-mono">POST …/v1/chat/completions</text><text x="16" y="77" font-size="16" class="b32s-muted">주소 · 환경변수 또는 실행 옵션</text><text x="16" y="102" font-size="16" class="b32s-ink b32s-b">인증 헤더 · 요청 인증과 권한 확인</text><text x="16" y="124" font-size="16" class="b32s-ink b32s-mono">Authorization: Bearer ••••</text><text x="16" y="149" font-size="16" class="b32s-ink b32s-b">JSON 본문 · model: gpt-5-mini</text><text x="16" y="172" font-size="16" class="b32s-ink">messages · system: 작성 규칙</text><text x="16" y="194" font-size="16" class="b32s-ink">user: 앞 화면에서 준비한 Git 문맥</text><path d="M25 208V242" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)" data-transfer="request"/><text x="45" y="229" font-size="16" class="b32s-acc">① 요청 · 딕셔너리 → JSON 글</text><rect x="4" y="245" width="352" height="45" rx="12" class="b32s-box-a"/><text x="16" y="274" font-size="17" class="b32s-ink b32s-b">외부 서비스 · 코디세이 AI API</text><path d="M25 292V326" class="b32s-ln" marker-end="url(#b32s-a)" data-transfer="response"/><text x="45" y="313" font-size="16" class="b32s-ink b32s-b">② 응답 · Python으로 전달</text><rect x="4" y="329" width="352" height="243" rx="12" class="b32s-box-p"/><text x="16" y="355" font-size="17" class="b32s-tp">내 컴퓨터 · Python이 응답 읽기</text><g data-topic="response-status"><text x="16" y="382" font-size="16" class="b32s-ink b32s-b">성공 · JSON 글 → Python 데이터</text><text x="16" y="404" font-size="16" class="b32s-ink b32s-b">401·403 · 인증·권한 오류로 멈춤</text></g><rect x="9" y="416" width="342" height="146" rx="12" class="b32s-box-r"/><g data-topic="response-example"><text x="20" y="436" font-size="16" class="b32s-tr">교육용 예시 · 원본 응답 미확보</text><g data-response-example="true"><text x="20" y="460" font-size="16" class="b32s-mono b32s-ink" xml:space="preserve">{&quot;<tspan class="b32s-tr">choices</tspan>&quot;:[{&quot;<tspan class="b32s-tr">message</tspan>&quot;:{</text><text x="20" y="480" font-size="16" class="b32s-mono b32s-ink" xml:space="preserve">  &quot;<tspan class="b32s-tr">content</tspan>&quot;:&quot;커밋 메시지 초안 …&quot;</text><text x="20" y="500" font-size="16" class="b32s-mono b32s-ink" xml:space="preserve">}}]}</text></g><text x="20" y="528" font-size="16" class="b32s-tr b32s-mono">choices[0].message.content</text><text x="20" y="552" font-size="16" class="b32s-muted">꺼낸 초안 → 다음 장면의 형식 검사</text></g><text x="16" y="597" font-size="16" class="b32s-muted">요청 구조 · 재현</text><text x="16" y="619" font-size="16" class="b32s-muted">모델 ID · 2026-10-20 실제 실행 설정</text></svg>
