<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Python은 API 주소에 POST로 요청한다. 인증 헤더에는 자격 증명인 API 키를, JSON 본문에는 모델 ID와 system 작성 규칙, user Git 문맥을 담는다. Python 딕셔너리를 JSON으로 바꿔 보내고, 성공 응답의 JSON을 Python 데이터로 읽는다. 401 또는 403이면 인증 또는 권한 오류를 알리고 멈춘다. 교육용 예시의 choices 첫 항목에서 message의 content가 초안이다. 요청 구조는 재현이며 원본 응답은 확보하지 않았다. 이번 실행 Git 문맥은 535자. 400 같은 그 밖의 HTTP 오류는 응답 오류로 알린다. 답을 꺼내는 경로는 별도의 실제 최소 연결 테스트 응답으로 확인했다."><title>Python과 외부 AI API의 요청·응답</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="296" class="b32s-bg"/><rect x="6" y="4" width="820" height="223" rx="12" class="b32s-zone"/><text x="20" y="29" font-size="21" class="b32s-tp">내 컴퓨터 · Python</text><text x="225" y="29" font-size="19" class="b32s-acc b32s-mono">POST https://copa.codyssey.kr/v1/chat/completions</text><rect x="16" y="40" width="400" height="177" rx="12" class="b32s-box-p"/><text x="30" y="65" font-size="20" class="b32s-tp">요청 만들기</text><text x="160" y="65" font-size="19" class="b32s-muted">주소 · 환경변수 또는 실행 옵션</text><text x="30" y="88" font-size="19" class="b32s-ink b32s-b">인증 헤더 · 요청 인증과 권한 확인</text><text x="30" y="111" font-size="19" class="b32s-ink b32s-mono">Authorization: Bearer ••••</text><text x="30" y="134" font-size="19" class="b32s-ink b32s-b">JSON 본문 · model: gpt-5-mini</text><text x="30" y="157" font-size="19" class="b32s-ink">messages · system: 작성 규칙</text><text x="30" y="180" font-size="19" class="b32s-ink">user: 앞 화면의 Git 문맥 (535자)</text><rect x="427" y="40" width="388" height="177" rx="12" class="b32s-box-r"/><text x="442" y="65" font-size="20" class="b32s-tr">응답에서 초안 꺼내기</text><g data-topic="response-example"><text x="442" y="88" font-size="19" class="b32s-tr">교육용 예시 · 원본 응답 미확보</text><g data-response-example="true"><text x="442" y="110" font-size="19" class="b32s-mono b32s-ink" xml:space="preserve">{&quot;<tspan class="b32s-tr">choices</tspan>&quot;:[{&quot;<tspan class="b32s-tr">message</tspan>&quot;:{</text><text x="442" y="131" font-size="19" class="b32s-mono b32s-ink" xml:space="preserve">  &quot;<tspan class="b32s-tr">content</tspan>&quot;:&quot;커밋 메시지 초안 …&quot;</text><text x="442" y="152" font-size="19" class="b32s-mono b32s-ink" xml:space="preserve">}}]}</text></g><text x="442" y="176" font-size="19" class="b32s-tr b32s-mono">choices[0].message.content</text></g><text x="442" y="203" font-size="19" class="b32s-muted">꺼낸 초안 → 다음 장면의 형식 검사</text><rect x="979" y="40" width="213" height="171" rx="12" class="b32s-box-a"/><text x="994" y="67" font-size="20" class="b32s-muted b32s-b">외부 서비스</text><text x="994" y="93" font-size="21" class="b32s-ink b32s-b">코디세이 AI API</text><g data-topic="response-status"><text x="994" y="119" font-size="19" class="b32s-tr">성공 · JSON 반환</text><text x="994" y="143" font-size="19" class="b32s-acc">401·403 · 인증/권한</text><text x="994" y="168" font-size="19" class="b32s-acc">그 밖의 오류 (예: 400)</text><text x="994" y="193" font-size="19" class="b32s-acc">→ 응답 오류</text></g><path d="M828 104H976" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)" data-transfer="request"/><text x="840" y="89" font-size="19" class="b32s-acc">① 요청 · POST</text><text x="841" y="129" font-size="19" class="b32s-muted">딕셔너리 → JSON</text><path d="M976 158H828" class="b32s-ln" marker-end="url(#b32s-a)" data-transfer="response"/><text x="840" y="181" font-size="19" class="b32s-ink b32s-b">② 응답 · JSON</text><text x="840" y="207" font-size="19" class="b32s-muted">JSON → Python</text><text x="16" y="251" font-size="19" class="b32s-muted" xml:space="preserve">요청 구조 · 재현    모델 ID · 2026-11-25 실제 실행 설정    응답 JSON 모양 · 교육용 예시</text><text x="16" y="278" font-size="19" class="b32s-muted">응답 경로 choices[0].message.content · 실제 최소 연결 테스트 응답에서 확인</text></svg>
