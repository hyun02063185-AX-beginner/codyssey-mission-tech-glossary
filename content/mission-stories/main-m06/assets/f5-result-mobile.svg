<svg xmlns="http://www.w3.org/2000/svg" width="360" height="910" viewBox="0 0 360 910" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="subprocess.run()을 실행하면 CompletedProcess 실행 결과 객체가 반환된다. stdout(표준 출력), stderr(표준 오류 출력), returncode(종료 코드)는 이 객체의 속성이다. stdout의 실제 값은 저장소 안에서 ' M docs/learning/02-python-ai-api.md', stderr의 실제 값은 저장소 밖에서 'fatal: not a git repository …'다. returncode는 안 0, 밖 128이다. Python의 처리 로직: returncode가 0인지 먼저 검사한다. 0이 아니면 오류를 알리고 멈춘다. 성공하면 stdout을 읽어 변경 여부를 판단한다. 변경이 없으면 종료, 있으면 다음 Scene의 데이터를 만든다. stderr의 내용만으로 실패를 판단하지 않는다. 기본 check=False에서는 0이 아닌 종료 코드에 대해 자동으로 예외를 내지 않으므로 B3-2가 직접 검사한다."><title>subprocess.run() 실행 결과와 Python의 처리 로직</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="910" class="b32s-bg"/><rect x="4" y="8" width="352" height="70" rx="12" class="b32s-box-p"/><text x="18" y="37" font-size="19" class="b32s-ink b32s-b">subprocess.run() 반환값</text><text x="18" y="63" font-size="16" class="b32s-muted">실행 결과 객체의 세 속성</text><rect x="4" y="96" width="352" height="108" rx="12" class="b32s-box"/><text x="18" y="126" font-size="19" class="b32s-ink b32s-mono b32s-b">stdout</text><text x="98" y="126" font-size="16" class="b32s-muted">표준 출력</text><text x="18" y="158" font-size="16" class="b32s-ink b32s-mono" xml:space="preserve"> M docs/…/02-python-ai-api.md</text><text x="18" y="186" font-size="16" class="b32s-muted">저장소 안 · 실제 값</text><rect x="4" y="216" width="352" height="108" rx="12" class="b32s-box"/><text x="18" y="246" font-size="19" class="b32s-ink b32s-mono b32s-b">stderr</text><text x="98" y="246" font-size="16" class="b32s-muted">표준 오류 출력</text><text x="18" y="278" font-size="16" class="b32s-ink b32s-mono">fatal: not a git repository …</text><text x="18" y="306" font-size="16" class="b32s-muted">저장소 밖 · 실제 값</text><rect x="4" y="336" width="352" height="108" rx="12" class="b32s-box-acc"/><text x="18" y="366" font-size="19" class="b32s-acc b32s-mono">returncode</text><text x="140" y="366" font-size="16" class="b32s-muted">종료 코드</text><text x="18" y="398" font-size="16" class="b32s-ink">0 = 성공 · 0이 아님 = 실패</text><text x="18" y="426" font-size="16" class="b32s-muted">실제: 안 0 · 밖 128</text><rect x="4" y="470" width="352" height="92" rx="12" class="b32s-box-acc"/><text x="18" y="502" font-size="18" class="b32s-ink b32s-b">① returncode가 0인가?</text><text x="18" y="530" font-size="16" class="b32s-muted">아니요 → 오류를 알리고 멈춘다</text><text x="18" y="554" font-size="16" class="b32s-muted">AI 요청 0회</text><path d="M60 564V594" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="74" y="586" font-size="16" class="b32s-ink b32s-b">예</text><rect x="4" y="598" width="352" height="92" rx="12" class="b32s-box-acc"/><text x="18" y="630" font-size="18" class="b32s-ink b32s-b">② 변경이 있나?</text><text x="18" y="658" font-size="16" class="b32s-muted">없음 → 변경 사항이 없습니다</text><text x="18" y="682" font-size="16" class="b32s-muted">AI 요청 0회</text><path d="M60 692V722" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="74" y="714" font-size="16" class="b32s-ink b32s-b">있음</text><rect x="4" y="726" width="352" height="92" rx="12" class="b32s-box-p"/><text x="18" y="758" font-size="18" class="b32s-ink b32s-b">있음 → 보낼 데이터를 만든다</text><text x="18" y="786" font-size="16" class="b32s-muted">다음: Scene 3</text><text x="16" y="872" font-size="16" class="b32s-ink">기본 check=False: 종료 코드를 직접 확인</text><text x="16" y="896" font-size="16" class="b32s-ink">0이 아니면 B3-2가 오류를 알리고 멈춘다.</text></svg>
