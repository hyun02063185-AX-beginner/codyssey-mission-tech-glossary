<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="내 컴퓨터의 Python(AIClient)과 외부 서비스 사이의 요청과 응답. 왼쪽 위 요청 카드: POST https://copa.codyssey.kr/v1/chat/completions, Authorization: Bearer 뒤의 키는 가림(환경변수 CODYSSEY_API_KEY에서 읽음), JSON 본문은 model gpt-5-mini와 messages 두 개 — system(작성 규칙)과 user(검사한 Git 문맥 806자). ② 요청이 경계를 넘어 코디세이 API(요청을 받는 HTTPS 창구)로 간다. 코디세이 API와 AI 모델 사이 내부 연결은 공개되지 않았고(점선), 모델의 실행 위치는 확인 범위 밖이다. ③ 응답 JSON의 choices[0].message.content에서 글만 꺼낸다. 예: '학습 문서에 실습 메모 추가: …'. 명령 1번에 요청 1번, 자동 재시도 없음, 30초 안에 답이 없으면 오류, 401·403은 키·권한 오류."><title>AI API 요청과 응답</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="540" class="b32s-bg"/><rect x="8" y="8" width="716" height="524" rx="14" class="b32s-zone"/><text x="24" y="36" font-size="19" class="b32s-muted b32s-b">내 컴퓨터 · Python (AIClient)</text><rect x="764" y="8" width="428" height="524" rx="14" class="b32s-zone-ext"/><text x="780" y="36" font-size="19" class="b32s-muted b32s-b">인터넷 너머 (외부 서비스)</text><rect x="24" y="52" width="684" height="316" rx="12" class="b32s-box-p"/><text x="44" y="84" font-size="21" class="b32s-tp">요청 · HTTPS POST + JSON</text><text x="44" y="120" font-size="19" class="b32s-ink b32s-mono b32s-b">POST https://copa.codyssey.kr/v1/chat/completions</text><text x="44" y="148" font-size="19" class="b32s-ink b32s-mono">Authorization: Bearer ••••••••</text><text x="44" y="176" font-size="19" class="b32s-ink b32s-mono">{</text><text x="44" y="204" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">  &quot;model&quot;: &quot;gpt-5-mini&quot;,</text><text x="44" y="232" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">  &quot;messages&quot;: [</text><text x="44" y="260" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">    {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: 작성 규칙},</text><text x="44" y="288" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">    {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: Git 문맥 806자}</text><text x="44" y="316" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">  ]</text><text x="44" y="344" font-size="19" class="b32s-ink b32s-mono">}</text><text x="398" y="148" font-size="19" class="b32s-muted">← 키: 환경변수에서 · 화면에 안 보임</text><rect x="24" y="388" width="684" height="132" rx="12" class="b32s-box-r"/><text x="44" y="420" font-size="21" class="b32s-tr">응답 · JSON</text><text x="44" y="454" font-size="19" class="b32s-ink b32s-mono">{&quot;choices&quot;: [{&quot;message&quot;: {&quot;content&quot;:</text><text x="44" y="482" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve">   &quot;학습 문서에 실습 메모 추가: …&quot;}}]}</text><text x="44" y="510" font-size="19" class="b32s-muted">→ choices[0].message.content의 글만 꺼낸다</text><g class="b32s-g"><rect x="784" y="52" width="388" height="132" rx="12" class="b32s-box-a b32s-node"/><path d="M815 56L840 81L815 106L790 81Z" class="b32s-si"/><text x="815" y="88" font-size="19" class="b32s-on" text-anchor="middle">AI</text><text x="848" y="90" font-size="24" class="b32s-ink b32s-b">코디세이 API</text><text x="800" y="129" font-size="19" class="b32s-muted">요청을 받는 HTTPS 창구</text><text x="800" y="155" font-size="19" class="b32s-muted">명령 1번 = 요청 1번 · 재시도 없음</text></g><g class="b32s-g"><rect x="784" y="284" width="388" height="132" rx="12" class="b32s-box-a b32s-node"/><path d="M815 288L840 313L815 338L790 313Z" class="b32s-si"/><text x="815" y="320" font-size="19" class="b32s-on" text-anchor="middle">AI</text><text x="848" y="322" font-size="24" class="b32s-ink b32s-b">AI 모델 · gpt-5-mini</text><text x="800" y="361" font-size="19" class="b32s-muted">글을 만든다</text><text x="800" y="387" font-size="19" class="b32s-muted">실행 위치는 확인 범위 밖</text></g><path d="M978 186V280" class="b32s-dash"/><text x="992" y="226" font-size="19" class="b32s-muted">내부 연결은</text><text x="992" y="252" font-size="19" class="b32s-muted">공개되지 않음</text><path d="M710 110H780" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="744" cy="90" r="16" class="b32s-sacc"/><text x="744" y="97" font-size="19" class="b32s-on" text-anchor="middle">2</text><path d="M782 160H744V440H712" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="744" cy="300" r="16" class="b32s-sacc"/><text x="744" y="307" font-size="19" class="b32s-on" text-anchor="middle">3</text><text x="784" y="466" font-size="19" class="b32s-muted">30초 안에 답이 없으면 오류</text><text x="784" y="496" font-size="19" class="b32s-muted">401·403 = 키·권한 오류</text></svg>
