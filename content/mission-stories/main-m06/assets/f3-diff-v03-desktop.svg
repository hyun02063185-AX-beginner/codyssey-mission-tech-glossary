<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="2026-11-25 README.md 변경 재현. git status --short는 ' M README.md'를 보여 준다. M은 add 전이라 오른쪽 칸에 있다. @@ -76,3 +76,5 @@는 76번째 줄부터 3줄이 5줄로 바뀌었음을 표시한다. 앞 문맥 세 줄에 이어 빈 줄과 '실습 메모: AI가 작성한 초안은 사람이 검토한다.'가 추가되었고 뒤 문맥은 없다. git diff --cached는 이번에는 출력이 없다."><title>Git은 무엇이 변경됐는지 알고 있다</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="520" class="b32s-bg"/><rect x="16" y="12" width="780" height="496" rx="12" class="b32s-box-term"/><path d="M16 24a12 12 0 0 1 12-12h756a12 12 0 0 1 12 12v24H16Z" class="b32s-bar"/><text x="36" y="38" font-size="19" class="b32s-muted">터미널 · 재현 2026-11-25 · Owner 실행과 같은 변경</text><text x="36" y="90" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git status --short</text><text x="36" y="120" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> M README.md</text><text x="36" y="150" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git diff</text><text x="36" y="180" font-size="19" class="b32s-ink b32s-mono">diff --git a/README.md b/README.md</text><text x="36" y="210" font-size="19" class="b32s-muted">··· index · --- · +++ 3줄 생략 ···</text><text x="36" y="240" font-size="19" class="b32s-acc b32s-mono">@@ -76,3 +76,5 @@ python -m unittest …</text><text x="36" y="270" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> ```</text><text x="36" y="330" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> macOS에서는 `python3`를 사용하세요. …</text><rect x="24" y="338" width="764" height="30" rx="4" class="b32s-hlrow"/><text x="36" y="360" font-size="19" class="b32s-add b32s-mono b32s-b">+</text><rect x="24" y="368" width="764" height="30" rx="4" class="b32s-hlrow"/><text x="36" y="390" font-size="19" class="b32s-add b32s-mono b32s-b">+실습 메모: AI가 작성한 초안은 사람이 검토한다.</text><path d="M36 394H435" class="b32s-ln-acc"/><text x="36" y="420" font-size="19" class="b32s-muted">(파일 끝 · 뒤쪽 주변 줄 없음)</text><text x="36" y="450" font-size="19" class="b32s-muted b32s-mono b32s-b">$ git diff --cached</text><text x="36" y="480" font-size="19" class="b32s-muted">(출력 없음)</text><rect x="836" y="64" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="90" font-size="21" class="b32s-acc b32s-mono">M</text><text x="886" y="90" font-size="19" class="b32s-ink b32s-b">고친 파일</text><text x="852" y="118" font-size="19" class="b32s-muted">add 전 · 오른쪽 칸</text><path d="M834 95L800 113" class="b32s-lead"/><rect x="836" y="134" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="160" font-size="21" class="b32s-acc b32s-mono">@@</text><text x="904" y="160" font-size="19" class="b32s-ink b32s-b">위치 표시</text><text x="852" y="188" font-size="19" class="b32s-muted">76번째 줄부터 · 3줄 → 5줄</text><path d="M834 165L800 233" class="b32s-lead"/><rect x="836" y="204" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="230" font-size="21" class="b32s-acc b32s-mono">빈칸</text><text x="912" y="230" font-size="19" class="b32s-ink b32s-b">그대로인 주변 줄</text><text x="852" y="258" font-size="19" class="b32s-muted">앞 3줄 · 뒤쪽은 없음</text><path d="M834 235L800 293" class="b32s-lead"/><rect x="836" y="274" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="300" font-size="21" class="b32s-acc b32s-mono">+</text><text x="886" y="300" font-size="19" class="b32s-ink b32s-b">새로 생긴 줄</text><text x="852" y="328" font-size="19" class="b32s-muted">이번 변경은 2줄 (빈 줄 먼저)</text><path d="M834 305L800 353" class="b32s-lead"/><rect x="836" y="344" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="370" font-size="21" class="b32s-acc b32s-mono">-</text><text x="886" y="370" font-size="19" class="b32s-ink b32s-b">지워진 줄</text><text x="852" y="398" font-size="19" class="b32s-muted">이번 변경에는 없다</text><rect x="836" y="414" width="348" height="62" rx="10" class="b32s-box"/><text x="852" y="440" font-size="21" class="b32s-acc b32s-mono">--cached</text><text x="960" y="440" font-size="19" class="b32s-ink b32s-b">git add한 변경</text><text x="852" y="468" font-size="19" class="b32s-muted">이번에는 없다 · Lab 03에서 비교</text><path d="M834 445L800 473" class="b32s-lead"/></svg>
