19" class="b32s-muted">API 요청 · 응답 읽기</text></g><g class="b32s-g b32s-k-s1 b32s-k-s3"><rect x="852" y="53" width="320" height="126" rx="12" class="b32s-box-a b32s-node"/><path d="M883 57L908 82L883 107L858 82Z" class="b32s-si"/><text x="883" y="89" font-size="19" class="b32s-on" text-anchor="middle">AI</text><text x="916" y="91" font-size="24" class="b32s-ink b32s-b">코디세이 AI API</text><text x="868" y="130" font-size="19" class="b32s-muted">HTTPS 요청을 받는 창구</text><text x="868" y="156" font-size="19" class="b32s-muted">응답 JSON을 반환</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="373" y="215" width="323" height="110" rx="12" class="b32s-box-r b32s-node"/><rect x="385" y="227" width="54" height="34" rx="19" class="b32s-sr"/><text x="412" y="251" font-size="19" class="b32s-on" text-anchor="middle">초안</text><text x="451" y="253" font-size="24" class="b32s-ink b32s-b">검토용 초안</text><text x="389" y="292" font-size="19" class="b32s-muted">검증 뒤 터미널에 출력</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="30" y="215" width="227" height="110" rx="12" class="b32s-box b32s-node"/><text x="46" y="253" font-size="24" class="b32s-ink b32s-b">사용자</text><text x="46" y="292" font-size="19" class="b32s-muted">내용을 확인하고 활용</text></g><g class="b32s-g b32s-k-s1 b32s-k-s2"><path d="M371 83H260" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M259 128H369" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="276" y="75" font-size="19" class="b32s-ink">Git 실행</text><text x="276" y="151" font-size="19" class="b32s-muted">변경 결과</text></g><g class="b32s-g b32s-k-s1 b32s-k-s3"><path d="M698 83H849" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)" data-transfer="request"/><path d="M850 134H700" class="b32s-ln" marker-end="url(#b32s-a)" data-transfer="response"/><text x="729" y="73" font-size="20" class="b32s-acc">요청</text><text x="723" y="160" font-size="19" class="b32s-ink">응답 JSON</text><text x="855" y="223" font-size="19" class="b32s-muted">모델 실행 위치 미확인</text></g><g class="