<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" data-state="all" data-states="all s1 s2 s3 s4 return" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Python이 현재 폴더의 Git을 실행해 변경을 읽는다. 검사한 문맥은 Python에서 외부 AI API로 HTTPS 요청을 통해 나간다. 응답 JSON은 반대 방향으로 Python에 돌아온다. Python은 초안을 검증해 터미널에 출력하고, 사람이 확인한 뒤 사용한다. 외부 경계는 API를 둘러싸며 모델 실행 위치는 미확인이다."><title>로컬 Python과 외부 AI API</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(-