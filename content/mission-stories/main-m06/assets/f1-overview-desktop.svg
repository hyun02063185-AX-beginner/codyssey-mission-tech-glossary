<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" data-state="all" data-states="all s1 s2 s3 s4 return" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="B3-2 전체 동작 구조도. 왼쪽 실선 영역은 내 컴퓨터(로컬), 오른쪽 점선 영역은 인터넷 너머의 외부 서비스다. 로컬에서 Python 프로그램(python main.py commit 또는 pr)이 ① Git을 실행해 변경 내용을 받고, ② 검사한 내용을 코디세이 API에 요청으로 보내고, ③ 응답을 받는다. 코디세이 API와 AI 모델 사이의 내부 연결과 모델의 실행 위치는 공개되지 않았다(점선). Python은 ④ 응답을 검증해 검토용 초안으로 터미널에 출력하고, ⑤ 사람이 읽고 확인한 뒤 직접 커밋하거나 PR을 쓴다. 프로그램은 커밋이나 PR을 자동으로 만들지 않는다. 마지막 상태에서는 결과 쪽이 강조되고 아래에 세 단계가 나온다: ① 프로그램이 형식을 검사한다(제목 길이·필수 섹션·테스트 주장), ② 사람이 실제 변경·이유와 비교한다, ③ 사람이 직접 git commit을 하고 GitHub에서 PR을 쓴다."><title>Git의 변경 내용을 AI가 설명하기까지</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="all"] [class*="b32s-in-"]:not(.b32s-in-all){display:none}svg[data-state="s1"] [class*="b32s-in-"]:not(.b32s-in-s1){display:none}svg[data-state="s1"] .b32s-g:not(.b32s-k-s1){opacity:.32}svg[data-state="s1"] .b32s-k-s1 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s2"] [class*="b32s-in-"]:not(.b32s-in-s2){display:none}svg[data-state="s2"] .b32s-g:not(.b32s-k-s2){opacity:.32}svg[data-state="s2"] .b32s-k-s2 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s3"] [class*="b32s-in-"]:not(.b32s-in-s3){display:none}svg[data-state="s3"] .b32s-g:not(.b32s-k-s3){opacity:.32}svg[data-state="s3"] .b32s-k-s3 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s4"] [class*="b32s-in-"]:not(.b32s-in-s4){display:none}svg[data-state="s4"] .b32s-g:not(.b32s-k-s4){opacity:.32}svg[data-state="s4"] .b32s-k-s4 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="return"] [class*="b32s-in-"]:not(.b32s-in-return){display:none}svg[data-state="return"] .b32s-g:not(.b32s-k-return){opacity:.32}svg[data-state="return"] .b32s-k-return .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="540" class="b32s-bg"/><rect x="16" y="12" width="700" height="424" rx="16" class="b32s-zone"/><text x="36" y="44" font-size="20" class="b32s-muted b32s-b">내 컴퓨터 (로컬)</text><rect x="804" y="12" width="380" height="424" rx="16" class="b32s-zone-ext"/><text x="824" y="44" font-size="20" class="b32s-muted b32s-b">인터넷 너머 (외부 서비스)</text><g class="b32s-g b32s-k-s1 b32s-k-s2"><rect x="36" y="64" width="220" height="120" rx="12" class="b32s-box-g b32s-node"/><rect x="48" y="74" width="38" height="38" rx="3" class="b32s-sg"/><text x="67" y="101" font-size="22" class="b32s-on" text-anchor="middle">G</text><text x="100" y="102" font-size="24" class="b32s-ink b32s-b">Git 저장소</text><text x="52" y="141" font-size="19" class="b32s-muted">바뀐 줄을</text><text x="52" y="167" font-size="19" class="b32s-muted">알고 있다</text></g><g class="b32s-g b32s-k-s2 b32s-k-s3"><rect x="380" y="64" width="320" height="120" rx="12" class="b32s-box-p b32s-node"/><circle cx="411" cy="93" r="20" class="b32s-sp"/><text x="411" y="100" font-size="19" class="b32s-on" text-anchor="middle">Py</text><text x="444" y="102" font-size="24" class="b32s-ink b32s-b">Python 프로그램</text><text x="396" y="141" font-size="19" class="b32s-muted">main.py commit | pr</text><text x="396" y="167" font-size="19" class="b32s-muted">실행 · 검사 · 요청 · 검증</text></g><g class="b32s-g b32s-k-s3"><rect x="836" y="64" width="328" height="120" rx="12" class="b32s-box-a b32s-node"/><path d="M867 68L892 93L867 118L842 93Z" class="b32s-si"/><text x="867" y="100" font-size="19" class="b32s-on" text-anchor="middle">AI</text><text x="900" y="102" font-size="24" class="b32s-ink b32s-b">코디세이 API</text><text x="852" y="141" font-size="19" class="b32s-muted">요청을 받는 HTTPS 창구</text><text x="852" y="167" font-size="19" class="b32s-muted">키 확인 · 응답 반환</text></g><g class="b32s-g b32s-k-s3"><rect x="836" y="284" width="328" height="132" rx="12" class="b32s-box-a b32s-node"/><path d="M867 288L892 313L867 338L842 313Z" class="b32s-si"/><text x="867" y="320" font-size="19" class="b32s-on" text-anchor="middle">AI</text><text x="900" y="322" font-size="24" class="b32s-ink b32s-b">AI 모델</text><text x="852" y="361" font-size="19" class="b32s-muted">글을 만들어 돌려준다</text><text x="852" y="387" font-size="19" class="b32s-muted">실행 위치는 확인 범위 밖</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="380" y="284" width="320" height="132" rx="12" class="b32s-box-r b32s-node"/><rect x="392" y="296" width="54" height="34" rx="19" class="b32s-sr"/><text x="419" y="320" font-size="19" class="b32s-on" text-anchor="middle">초안</text><text x="458" y="322" font-size="24" class="b32s-ink b32s-b">검토용 초안</text><text x="396" y="361" font-size="19" class="b32s-muted">터미널에 출력만 한다</text><text x="396" y="387" font-size="19" class="b32s-muted">커밋 · PR을 만들지 않는다</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="36" y="284" width="220" height="132" rx="12" class="b32s-box b32s-node"/><text x="52" y="322" font-size="24" class="b32s-ink b32s-b">사람</text><text x="52" y="361" font-size="19" class="b32s-muted">읽고 고친 뒤</text><text x="52" y="387" font-size="19" class="b32s-muted">직접 커밋 · PR</text></g><g class="b32s-g b32s-k-s2"><path d="M378 104H260" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M258 148H376" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="290" cy="84" r="16" class="b32s-sacc"/><text x="290" y="91" font-size="19" class="b32s-on" text-anchor="middle">1</text><text x="310" y="91" font-size="19" class="b32s-ink">Git 실행</text><text x="276" y="176" font-size="19" class="b32s-muted">결과</text></g><g class="b32s-g b32s-k-s3"><path d="M702 104H832" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M834 148H704" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="738" cy="84" r="16" class="b32s-sacc"/><text x="738" y="91" font-size="19" class="b32s-on" text-anchor="middle">2</text><text x="758" y="91" font-size="19" class="b32s-ink">요청</text><circle cx="738" cy="174" r="16" class="b32s-sacc"/><text x="738" y="181" font-size="19" class="b32s-on" text-anchor="middle">3</text><text x="758" y="181" font-size="19" class="b32s-ink">응답</text><path d="M1000 188V280" class="b32s-dash"/><text x="1014" y="226" font-size="19" class="b32s-muted">내부 연결은</text><text x="1014" y="252" font-size="19" class="b32s-muted">공개되지 않음</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><path d="M540 186V280" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="566" cy="226" r="16" class="b32s-sacc"/><text x="566" y="233" font-size="19" class="b32s-on" text-anchor="middle">4</text><text x="586" y="233" font-size="19" class="b32s-ink">검증 후 출력</text><path d="M378 350H260" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="286" cy="330" r="16" class="b32s-sacc"/><text x="286" y="337" font-size="19" class="b32s-on" text-anchor="middle">5</text><text x="306" y="337" font-size="19" class="b32s-ink">확인</text></g><g class="b32s-in-all b32s-in-s1 b32s-in-s2 b32s-in-s3 b32s-in-s4"><text x="36" y="478" font-size="19" class="b32s-muted">실선 화살표 = 실제로 오가는 명령·데이터 · 점선 = 공개되지 않은 내부 · 번호 = 순서</text><text x="36" y="512" font-size="19" class="b32s-ink b32s-b">프로그램은 커밋도 PR도 자동으로 만들지 않는다. 마지막 판단은 사람이 한다.</text></g><g class="b32s-in-return"><rect x="16" y="452" width="360" height="80" rx="12" class="b32s-box-r"/><circle cx="44" cy="480" r="16" class="b32s-sacc"/><text x="44" y="487" font-size="19" class="b32s-on" text-anchor="middle">1</text><text x="68" y="487" font-size="20" class="b32s-ink b32s-b">프로그램 · 형식을 검사</text><text x="36" y="518" font-size="19" class="b32s-muted">제목 길이 · 필수 섹션 · 테스트 주장</text><path d="M378 492H410" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)"/><rect x="412" y="452" width="360" height="80" rx="12" class="b32s-box-acc"/><circle cx="440" cy="480" r="16" class="b32s-sacc"/><text x="440" y="487" font-size="19" class="b32s-on" text-anchor="middle">2</text><text x="464" y="487" font-size="20" class="b32s-ink b32s-b">사람 · 내용과 이유를 확인</text><text x="432" y="518" font-size="19" class="b32s-muted">실제 diff와 비교 · 빠진 것 찾기</text><path d="M774 492H806" class="b32s-ln-acc" marker-end="url(#b32s-a-acc)"/><rect x="808" y="452" width="360" height="80" rx="12" class="b32s-box-acc"/><circle cx="836" cy="480" r="16" class="b32s-sacc"/><text x="836" y="487" font-size="19" class="b32s-on" text-anchor="middle">3</text><text x="860" y="487" font-size="20" class="b32s-ink b32s-b">사람 · 직접 사용</text><text x="828" y="518" font-size="19" class="b32s-muted">git commit · GitHub에서 PR 작성</text></g></svg>
