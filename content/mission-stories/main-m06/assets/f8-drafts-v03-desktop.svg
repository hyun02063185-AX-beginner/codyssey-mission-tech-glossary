<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="README.md 변경으로 생성한 2026-11-25 실제 초안. COMMIT 제목은 'README에 실습 메모 문장 추가', PR 제목은 &quot;Title: README에 'AI 초안은 사람이 검토' 실습 메모 추가&quot;. 두 글은 같은 Git 문맥에 서로 다른 작성 규칙을 적용했다. PR의 How to Test는 Python이 넣은 실행 권장 문구이며, 요청 횟수 1은 stderr로 나왔다. 프로그램은 같은 Git 문맥이면 user를 그대로 쓰고, 명령에 따라 system 작성 규칙을 바꾼다."><title>commit 초안과 PR 초안</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="1200" height="512" class="b32s-bg"/><rect x="8" y="8" width="1184" height="44" rx="10" class="b32s-box-p"/><text x="24" y="39" font-size="20" class="b32s-tp">프로그램 동작 · 같은 Git 문맥이면 user는 같다</text><rect x="8" y="60" width="612" height="400" rx="12" class="b32s-box-term"/><path d="M8 72a12 12 0 0 1 12-12h588a12 12 0 0 1 12 12v30H8Z" class="b32s-bar"/><text x="24" y="92" font-size="20" class="b32s-ink b32s-mono b32s-b">&gt; python main.py commit</text><text x="604" y="92" font-size="19" class="b32s-tp" text-anchor="end">system · 커밋 작성 규칙</text><text x="24" y="156" font-size="19" class="b32s-muted b32s-mono">=== 검토용 초안: COMMIT ===</text><text x="24" y="188" font-size="19" class="b32s-ink b32s-b">README에 실습 메모 문장 추가</text><text x="24" y="252" font-size="19" class="b32s-ink">README.md 마지막에 &quot;실습 메모: AI가 작성한 초안은</text><path d="M222 256H457" class="b32s-ln-acc"/><text x="24" y="284" font-size="19" class="b32s-ink">사람이 검토한다.&quot; 문장을 새 줄로 추가함.</text><path d="M24 288H142" class="b32s-ln-acc"/><text x="24" y="316" font-size="19" class="b32s-muted">↑ 본문은 실제로 한 줄 · 화면 폭에 맞춰 나눔</text><text x="24" y="348" font-size="19" class="b32s-muted b32s-mono">=== 끝: 내용을 확인한 뒤 사용하세요 ===</text><text x="24" y="380" font-size="19" class="b32s-muted" xml:space="preserve">AI API 요청 횟수: 1   ← stderr</text><rect x="632" y="60" width="560" height="400" rx="12" class="b32s-box-term"/><path d="M632 72a12 12 0 0 1 12-12h536a12 12 0 0 1 12 12v30H632Z" class="b32s-bar"/><text x="648" y="92" font-size="20" class="b32s-ink b32s-mono b32s-b">&gt; python main.py pr</text><text x="1176" y="92" font-size="19" class="b32s-tp" text-anchor="end">system · PR 작성 규칙</text><text x="648" y="156" font-size="19" class="b32s-muted b32s-mono">=== 검토용 초안: PR ===</text><text x="648" y="188" font-size="19" class="b32s-ink b32s-b">Title: README에 'AI 초안은 사람이 검토' 실습 메모 추가</text><text x="648" y="220" font-size="19" class="b32s-ink b32s-mono b32s-b">## Why</text><text x="648" y="252" font-size="19" class="b32s-ink">- AI가 작성한 초안에 대해 … 알리기 위해 변경했습니다.</text><text x="648" y="284" font-size="19" class="b32s-ink b32s-mono b32s-b">## What</text><text x="648" y="316" font-size="19" class="b32s-ink">- README.md 파일 끝에 … 문구를 추가했습니다.</text><text x="648" y="348" font-size="19" class="b32s-ink b32s-mono b32s-b">## How to Test</text><rect x="640" y="358" width="544" height="32" rx="6" class="b32s-box-acc"/><text x="648" y="378" font-size="19" class="b32s-acc">- 실행 권장: python -m unittest discover -s tests</text><text x="648" y="412" font-size="19" class="b32s-muted b32s-mono">=== 끝: 내용을 확인한 뒤 사용하세요 ===</text><text x="648" y="444" font-size="19" class="b32s-muted" xml:space="preserve">AI API 요청 횟수: 1   ← stderr</text><text x="8" y="488" font-size="19" class="b32s-muted">모두 실제 출력 · 2026-11-25 · … = 화면에 맞춰 줄인 부분 (전문은 발표자 노트) · 주황 = 프로그램이 넣은 고정 문구</text></svg>
