<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="2026-11-25 README.md 변경 재현. git status --short는 ' M README.md'를 보여 준다. M은 add 전이라 오른쪽 칸에 있다. @@ -76,3 +76,5 @@는 76번째 줄부터 3줄이 5줄로 바뀌었음을 표시한다. 앞 문맥 세 줄에 이어 빈 줄과 '실습 메모: AI가 작성한 초안은 사람이 검토한다.'가 추가되었고 뒤 문맥은 없다. git diff --cached는 이번에는 출력이 없다."><title>Git은 무엇이 변경됐는지 알고 있다</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="920" class="b32s-bg"/><rect x="4" y="8" width="352" height="512" rx="12" class="b32s-box-term"/><path d="M4 20a12 12 0 0 1 12-12h328a12 12 0 0 1 12 12v22H4Z" class="b32s-bar"/><text x="16" y="32" font-size="16" class="b32s-muted">터미널 · 재현 (화면 폭에 맞춰 줄임)</text><text x="16" y="72" font-size="16" class="b32s-muted b32s-mono b32s-b">$ git status --short</text><text x="16" y="102" font-size="16" class="b32s-ink b32s-mono" xml:space="preserve"> M README.md</text><text x="16" y="132" font-size="16" class="b32s-muted b32s-mono b32s-b">$ git diff</text><text x="16" y="162" font-size="16" class="b32s-ink b32s-mono">diff --git a/README.md b/README.md</text><text x="16" y="192" font-size="16" class="b32s-muted">··· index · --- · +++ 생략 ···</text><text x="16" y="222" font-size="16" class="b32s-acc b32s-mono">@@ -76,3 +76,5 @@ …</text><text x="16" y="252" font-size="16" class="b32s-ink b32s-mono" xml:space="preserve"> ```</text><text x="16" y="312" font-size="16" class="b32s-ink b32s-mono" xml:space="preserve"> macOS에서는 … 않습니다.</text><rect x="10" y="322" width="340" height="30" rx="4" class="b32s-hlrow"/><text x="16" y="342" font-size="16" class="b32s-add b32s-mono b32s-b">+</text><rect x="10" y="352" width="340" height="30" rx="4" class="b32s-hlrow"/><text x="16" y="372" font-size="16" class="b32s-add b32s-mono b32s-b">+실습 메모: AI가 작성한</text><path d="M16 376H215" class="b32s-ln-acc"/><rect x="10" y="382" width="340" height="30" rx="4" class="b32s-hlrow"/><text x="16" y="402" font-size="16" class="b32s-add b32s-mono b32s-b" xml:space="preserve">  초안은 사람이 검토한다.</text><path d="M16 406H215" class="b32s-ln-acc"/><text x="16" y="432" font-size="16" class="b32s-muted">↑ 실제로는 한 줄 · 파일 끝</text><text x="16" y="462" font-size="16" class="b32s-muted b32s-mono b32s-b">$ git diff --cached</text><text x="16" y="492" font-size="16" class="b32s-muted">(출력 없음)</text><text x="16" y="556" font-size="18" class="b32s-ink b32s-b">읽는 법</text><text x="16" y="592" font-size="17" class="b32s-acc b32s-mono">M</text><text x="104" y="592" font-size="16" class="b32s-ink b32s-b">고친 파일</text><text x="104" y="615" font-size="16" class="b32s-muted">add 전 · 오른쪽 칸</text><text x="16" y="644" font-size="17" class="b32s-acc b32s-mono">@@</text><text x="104" y="644" font-size="16" class="b32s-ink b32s-b">위치 표시</text><text x="104" y="667" font-size="16" class="b32s-muted">76번째 줄부터 · 3줄 → 5줄</text><text x="16" y="696" font-size="17" class="b32s-acc b32s-mono">빈칸</text><text x="104" y="696" font-size="16" class="b32s-ink b32s-b">그대로인 주변 줄</text><text x="104" y="719" font-size="16" class="b32s-muted">앞 3줄 · 뒤쪽은 없음</text><text x="16" y="748" font-size="17" class="b32s-acc b32s-mono">+</text><text x="104" y="748" font-size="16" class="b32s-ink b32s-b">새로 생긴 줄</text><text x="104" y="771" font-size="16" class="b32s-muted">이번 변경은 2줄 (빈 줄 먼저)</text><text x="16" y="800" font-size="17" class="b32s-acc b32s-mono">-</text><text x="104" y="800" font-size="16" class="b32s-ink b32s-b">지워진 줄</text><text x="104" y="823" font-size="16" class="b32s-muted">이번 변경에는 없다</text><text x="16" y="852" font-size="17" class="b32s-acc b32s-mono">--cached</text><text x="104" y="852" font-size="16" class="b32s-ink b32s-b">git add한 변경</text><text x="104" y="875" font-size="16" class="b32s-muted">이번에는 없다 · Lab 03에서 비교</text><text x="16" y="903" font-size="16" class="b32s-muted">재현 · 2026-11-25 · Owner 실행과 같은 변경</text></svg>
