<svg xmlns="http://www.w3.org/2000/svg" width="360" height="834" viewBox="0 0 360 834" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Git이 돌려준 종료 코드, 표준 출력, 표준 오류 출력의 재현 예시. Python은 먼저 종료 코드가 0인지 확인한다. 실패했거나 성공해도 변경이 없으면 AI에 보내지 않는다. 변경이 있을 때만 내 컴퓨터 밖으로 보낼 글을 만든다. 저장소 안 상태 B의 stdout은 ' M README.md'이다."><title>Git이 돌려준 결과와 Python의 판단</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="834" class="b32s-bg"/><text x="16" y="30" font-size="22" class="b32s-ink b32s-b">Git이 돌려준 결과 세 가지</text><rect x="4" y="46" width="352" height="98" rx="12" class="b32s-box-acc"/><text x="18" y="73" font-size="19" class="b32s-acc">returncode · 종료 코드</text><text x="18" y="101" font-size="19" class="b32s-ink">0 = 성공 · 0이 아님 = 실패</text><text x="18" y="127" font-size="19" class="b32s-muted">재현: 안 0 · 밖 128</text><rect x="4" y="158" width="352" height="98" rx="12" class="b32s-box"/><text x="18" y="185" font-size="19" class="b32s-ink b32s-b">stdout · 표준 출력</text><text x="18" y="213" font-size="19" class="b32s-ink b32s-mono" xml:space="preserve"> M README.md</text><text x="18" y="239" font-size="19" class="b32s-muted">저장소 안 · 재현 (상태 B)</text><rect x="4" y="270" width="352" height="98" rx="12" class="b32s-box"/><text x="18" y="297" font-size="19" class="b32s-ink b32s-b">stderr · 표준 오류 출력</text><text x="18" y="325" font-size="19" class="b32s-ink b32s-mono">fatal: not a git repository …</text><text x="18" y="351" font-size="19" class="b32s-muted">저장소 밖 · 재현</text><rect x="4" y="394" width="352" height="98" rx="12" class="b32s-box-acc"/><text x="18" y="422" font-size="20" class="b32s-ink b32s-b">① 종료 코드가 0인가?</text><text x="18" y="450" font-size="19" class="b32s-muted">아니요 → 오류를 알리고 종료</text><text x="18" y="475" font-size="19" class="b32s-muted">AI 요청 0회</text><path d="M32 494V517" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="48" y="513" font-size="16" class="b32s-ink b32s-b">예</text><rect x="4" y="520" width="352" height="98" rx="12" class="b32s-box-acc"/><text x="18" y="548" font-size="20" class="b32s-ink b32s-b">② 변경이 있나?</text><text x="18" y="576" font-size="19" class="b32s-muted">없음 → 변경 사항이 없습니다</text><text x="18" y="601" font-size="19" class="b32s-muted">AI 요청 0회</text><path d="M32 620V643" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="48" y="639" font-size="16" class="b32s-ink b32s-b">있음</text><rect x="4" y="646" width="352" height="98" rx="12" class="b32s-box-p"/><text x="18" y="674" font-size="20" class="b32s-ink b32s-b">있음 → 다음으로</text><text x="18" y="702" font-size="19" class="b32s-muted">내 컴퓨터 밖으로 보낼 글을 만든다</text><text x="18" y="727" font-size="19" class="b32s-muted">다음 · Scene 3</text><path d="M32 370V391" class="b32s-ln" marker-end="url(#b32s-a)"/><text x="16" y="781" font-size="17" class="b32s-muted">값 · 연습 저장소에서 재현</text><text x="16" y="806" font-size="17" class="b32s-muted">판단 순서 · B3-2 프로그램 구현</text></svg>
