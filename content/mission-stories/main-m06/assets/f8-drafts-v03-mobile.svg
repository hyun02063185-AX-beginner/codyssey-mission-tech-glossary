<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="README.md 변경으로 생성한 2026-11-25 실제 초안. COMMIT 제목은 'README에 실습 메모 문장 추가', PR 제목은 &quot;Title: README에 'AI 초안은 사람이 검토' 실습 메모 추가&quot;. 두 글은 같은 Git 문맥에 서로 다른 작성 규칙을 적용했다. PR의 How to Test는 Python이 넣은 실행 권장 문구이며, 요청 횟수 1은 stderr로 나왔다. 프로그램은 같은 Git 문맥이면 user를 그대로 쓰고, 명령에 따라 system 작성 규칙을 바꾼다."><title>commit 초안과 PR 초안</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="1036" class="b32s-bg"/><rect x="4" y="8" width="352" height="58" rx="10" class="b32s-box-p"/><text x="16" y="31" font-size="16" class="b32s-tp">프로그램 동작</text><text x="16" y="54" font-size="16" class="b32s-tp">같은 Git 문맥이면 user는 같다</text><text x="16" y="96" font-size="16" class="b32s-tp">system · 커밋 작성 규칙</text><rect x="4" y="106" width="352" height="308" rx="12" class="b32s-box-term"/><path d="M4 118a12 12 0 0 1 12-12h328a12 12 0 0 1 12 12v24H4Z" class="b32s-bar"/><text x="16" y="133" font-size="17" class="b32s-ink b32s-mono b32s-b">&gt; python main.py commit</text><text x="16" y="172" font-size="16" class="b32s-muted b32s-mono">=== 검토용 초안: COMMIT ===</text><text x="16" y="200" font-size="16" class="b32s-ink b32s-b">README에 실습 메모 문장 추가</text><text x="16" y="228" font-size="16" class="b32s-ink">README.md 마지막에</text><text x="16" y="256" font-size="16" class="b32s-ink">&quot;실습 메모: AI가 작성한 초안은</text><path d="M16 260H234" class="b32s-ln-acc"/><text x="16" y="284" font-size="16" class="b32s-ink">사람이 검토한다.&quot; 문장을</text><path d="M16 288H137" class="b32s-ln-acc"/><text x="16" y="312" font-size="16" class="b32s-ink">새 줄로 추가함.</text><text x="16" y="340" font-size="16" class="b32s-muted">↑ 본문은 실제로 한 줄</text><text x="16" y="368" font-size="16" class="b32s-muted b32s-mono">=== 끝: 내용을 확인한 뒤 사용하세요 ===</text><text x="16" y="396" font-size="16" class="b32s-muted" xml:space="preserve">AI API 요청 횟수: 1   ← stderr</text><text x="16" y="448" font-size="16" class="b32s-tp">system · PR 작성 규칙</text><rect x="4" y="458" width="352" height="476" rx="12" class="b32s-box-term"/><path d="M4 470a12 12 0 0 1 12-12h328a12 12 0 0 1 12 12v24H4Z" class="b32s-bar"/><text x="16" y="485" font-size="17" class="b32s-ink b32s-mono b32s-b">&gt; python main.py pr</text><text x="16" y="524" font-size="16" class="b32s-muted b32s-mono">=== 검토용 초안: PR ===</text><text x="16" y="552" font-size="16" class="b32s-ink b32s-b">Title: README에 'AI 초안은</text><text x="16" y="580" font-size="16" class="b32s-ink b32s-b">사람이 검토' 실습 메모 추가</text><text x="16" y="608" font-size="16" class="b32s-muted">↑ 실제로는 한 줄 · 32자</text><text x="16" y="636" font-size="16" class="b32s-ink b32s-mono b32s-b">## Why</text><text x="16" y="664" font-size="16" class="b32s-ink">- AI가 작성한 초안에 대해 …</text><text x="16" y="692" font-size="16" class="b32s-ink">알리기 위해 변경했습니다.</text><text x="16" y="720" font-size="16" class="b32s-ink b32s-mono b32s-b">## What</text><text x="16" y="748" font-size="16" class="b32s-ink">- README.md 파일 끝에 …</text><text x="16" y="776" font-size="16" class="b32s-ink">문구를 추가했습니다.</text><text x="16" y="804" font-size="16" class="b32s-ink b32s-mono b32s-b">## How to Test</text><rect x="10" y="812" width="340" height="28" rx="4" class="b32s-box-acc"/><text x="16" y="832" font-size="16" class="b32s-acc">- 실행 권장: python -m</text><rect x="10" y="840" width="340" height="28" rx="4" class="b32s-box-acc"/><text x="16" y="860" font-size="16" class="b32s-acc" xml:space="preserve">  unittest discover -s tests</text><text x="16" y="888" font-size="16" class="b32s-muted b32s-mono">=== 끝: 내용을 확인한 뒤 사용하세요 ===</text><text x="16" y="916" font-size="16" class="b32s-muted" xml:space="preserve">AI API 요청 횟수: 1   ← stderr</text><text x="8" y="966" font-size="16" class="b32s-muted">모두 실제 출력 · 2026-11-25</text><text x="8" y="992" font-size="16" class="b32s-muted">… = 화면에 맞춰 줄인 부분 (전문은 노트)</text><text x="8" y="1018" font-size="16" class="b32s-muted">주황 = 프로그램이 넣은 고정 문구</text></svg>
