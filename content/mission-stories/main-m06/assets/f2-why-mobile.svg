<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="두 가지 작성 방식 비교. 왼쪽 '직접 쓸 때'는 1 바뀐 줄을 다시 읽고 2 무엇을 왜 바꿨는지 정리해 3 짧은 문장으로 쓴다. 흔한 결과 예(보충)는 '수정' 한 단어로, 무엇을 고쳤는지 알 수 없고 B3-2 검증기도 이 제목을 거절한다. 오른쪽 'B3-2를 쓸 때'는 1 Git이 바뀐 줄을 알려 주고 2 AI가 초안을 쓰고 3 사람이 확인하고 고친다(강조). 실제 B3-2 출력(2026-10-20) 제목은 '학습 문서에 실습 메모 추가: AI 생성 커밋 메시지 검토 필요'로, 무엇이 바뀌었는지 드러난다."><title>변경 설명을 직접 쓸 때와 AI 초안을 쓸 때</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="main"] [class*="b32s-in-"]:not(.b32s-in-main){display:none}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="720" class="b32s-bg"/><rect x="4" y="8" width="352" height="344" rx="14" class="b32s-box"/><text x="20" y="42" font-size="20" class="b32s-ink b32s-b">직접 쓸 때</text><circle cx="32" cy="77" r="13" class="b32s-sacc"/><text x="32" y="83" font-size="16" class="b32s-on" text-anchor="middle">1</text><text x="52" y="83" font-size="17" class="b32s-ink">바뀐 줄을 다시 읽는다</text><circle cx="32" cy="121" r="13" class="b32s-sacc"/><text x="32" y="127" font-size="16" class="b32s-on" text-anchor="middle">2</text><text x="52" y="127" font-size="17" class="b32s-ink">무엇을, 왜 바꿨는지 정리한다</text><circle cx="32" cy="165" r="13" class="b32s-sacc"/><text x="32" y="171" font-size="16" class="b32s-on" text-anchor="middle">3</text><text x="52" y="171" font-size="17" class="b32s-ink">짧은 문장으로 쓴다</text><rect x="12" y="204" width="336" height="136" rx="12" class="b32s-box"/><text x="26" y="230" font-size="16" class="b32s-muted">흔한 결과 [보충 예]</text><text x="26" y="270" font-size="28" class="b32s-ink b32s-b">수정</text><text x="26" y="300" font-size="16" class="b32s-muted">무엇을 고쳤는지 알 수 없다</text><text x="26" y="324" font-size="16" class="b32s-muted">B3-2 검증기도 이 제목은 거절한다</text><rect x="4" y="368" width="352" height="344" rx="14" class="b32s-box-p"/><text x="20" y="402" font-size="20" class="b32s-ink b32s-b">B3-2를 쓸 때</text><circle cx="32" cy="437" r="13" class="b32s-sacc"/><text x="32" y="443" font-size="16" class="b32s-on" text-anchor="middle">1</text><text x="52" y="443" font-size="17" class="b32s-ink">Git이 바뀐 줄을 알려 준다</text><circle cx="32" cy="481" r="13" class="b32s-sacc"/><text x="32" y="487" font-size="16" class="b32s-on" text-anchor="middle">2</text><text x="52" y="487" font-size="17" class="b32s-ink">AI가 초안을 쓴다</text><rect x="12" y="506" width="336" height="40" rx="10" class="b32s-box-acc"/><circle cx="32" cy="525" r="13" class="b32s-sacc"/><text x="32" y="531" font-size="16" class="b32s-on" text-anchor="middle">3</text><text x="52" y="531" font-size="17" class="b32s-ink b32s-b">사람이 확인하고 고친다</text><rect x="12" y="564" width="336" height="136" rx="12" class="b32s-box-r"/><text x="26" y="590" font-size="16" class="b32s-muted">실제 B3-2 출력 · 2026-10-20</text><text x="26" y="620" font-size="18" class="b32s-ink b32s-b">학습 문서에 실습 메모 추가:</text><text x="26" y="646" font-size="18" class="b32s-ink b32s-b">AI 생성 커밋 메시지 검토 필요</text><text x="26" y="682" font-size="16" class="b32s-muted">무엇이 바뀌었는지 드러난다</text></svg>
