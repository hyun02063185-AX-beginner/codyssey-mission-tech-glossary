<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" data-state="all" data-states="all s1 s2 s3 s4 return" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="B3-2 전체 동작 구조도. 왼쪽 실선 영역은 내 컴퓨터(로컬), 오른쪽 점선 영역은 인터넷 너머의 외부 서비스다. 로컬에서 Python 프로그램(python main.py commit 또는 pr)이 ① Git을 실행해 변경 내용을 받고, ② 검사한 내용을 코디세이 API에 요청으로 보내고, ③ 응답을 받는다. 코디세이 API와 AI 모델 사이의 내부 연결과 모델의 실행 위치는 공개되지 않았다(점선). Python은 ④ 응답을 검증해 검토용 초안으로 터미널에 출력하고, ⑤ 사람이 읽고 확인한 뒤 직접 커밋하거나 PR을 쓴다. 프로그램은 커밋이나 PR을 자동으로 만들지 않는다. 마지막 상태에서는 결과 쪽이 강조되고 아래에 세 단계가 나온다: ① 프로그램이 형식을 검사한다(제목 길이·필수 섹션·테스트 주장), ② 사람이 실제 변경·이유와 비교한다, ③ 사람이 직접 git commit을 하고 GitHub에서 PR을 쓴다."><title>Git의 변경 내용을 AI가 설명하기까지</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',monospace}.b32s-tg{fill:var(--presentation-real,#edcf8e);font-weight:700}.b32s-tp{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b32s-tr{fill:var(--presentation-app,#86dfb0);font-weight:700}.b32s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b32s-add{fill:var(--presentation-app,#86dfb0)}.b32s-sg{fill:var(--presentation-real,#edcf8e)}.b32s-sp{fill:var(--presentation-python,#9cc8ff)}.b32s-sr{fill:var(--presentation-app,#86dfb0)}.b32s-si{fill:var(--presentation-ink,#eef2f7)}.b32s-sacc{fill:var(--presentation-accent,#ffad86)}.b32s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b32s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b32s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b32s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b32s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b32s-mk{fill:var(--presentation-ink,#eef2f7)}.b32s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b32s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b32s-hlrow{fill:var(--presentation-app-soft,#183f32)}svg[data-state="all"] [class*="b32s-in-"]:not(.b32s-in-all){display:none}svg[data-state="s1"] [class*="b32s-in-"]:not(.b32s-in-s1){display:none}svg[data-state="s1"] .b32s-g:not(.b32s-k-s1){opacity:.32}svg[data-state="s1"] .b32s-k-s1 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s2"] [class*="b32s-in-"]:not(.b32s-in-s2){display:none}svg[data-state="s2"] .b32s-g:not(.b32s-k-s2){opacity:.32}svg[data-state="s2"] .b32s-k-s2 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s3"] [class*="b32s-in-"]:not(.b32s-in-s3){display:none}svg[data-state="s3"] .b32s-g:not(.b32s-k-s3){opacity:.32}svg[data-state="s3"] .b32s-k-s3 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="s4"] [class*="b32s-in-"]:not(.b32s-in-s4){display:none}svg[data-state="s4"] .b32s-g:not(.b32s-k-s4){opacity:.32}svg[data-state="s4"] .b32s-k-s4 .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}svg[data-state="return"] [class*="b32s-in-"]:not(.b32s-in-return){display:none}svg[data-state="return"] .b32s-g:not(.b32s-k-return){opacity:.32}svg[data-state="return"] .b32s-k-return .b32s-node{stroke:var(--presentation-accent,#ffad86);stroke-width:4.5}</style><defs><marker id="b32s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk"/></marker><marker id="b32s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-acc"/></marker><marker id="b32s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b32s-mk-m"/></marker></defs><rect width="360" height="820" class="b32s-bg"/><rect x="4" y="8" width="352" height="288" rx="14" class="b32s-zone"/><text x="16" y="34" font-size="16" class="b32s-muted b32s-b">내 컴퓨터 (로컬)</text><g class="b32s-g b32s-k-s1 b32s-k-s2"><rect x="16" y="48" width="140" height="104" rx="12" class="b32s-box-g b32s-node"/><rect x="28" y="58" width="32" height="32" rx="3" class="b32s-sg"/><text x="44" y="80" font-size="18" class="b32s-on" text-anchor="middle">G</text><text x="74" y="81" font-size="19" class="b32s-ink b32s-b">Git</text><text x="32" y="116" font-size="16" class="b32s-muted">바뀐 줄을</text><text x="32" y="138" font-size="16" class="b32s-muted">알고 있다</text></g><g class="b32s-g b32s-k-s2 b32s-k-s3"><rect x="192" y="48" width="152" height="104" rx="12" class="b32s-box-p b32s-node"/><circle cx="220" cy="74" r="17" class="b32s-sp"/><text x="220" y="80" font-size="16" class="b32s-on" text-anchor="middle">Py</text><text x="250" y="81" font-size="19" class="b32s-ink b32s-b">Python</text><text x="208" y="116" font-size="16" class="b32s-muted">main.py</text><text x="208" y="138" font-size="16" class="b32s-muted">commit | pr</text></g><g class="b32s-g b32s-k-s2"><path d="M190 80H160" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M158 120H188" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="174" cy="100" r="13" class="b32s-sacc"/><text x="174" y="106" font-size="16" class="b32s-on" text-anchor="middle">1</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="192" y="182" width="116" height="104" rx="12" class="b32s-box-r b32s-node"/><rect x="203" y="193" width="48" height="28" rx="16" class="b32s-sr"/><text x="227" y="213" font-size="16" class="b32s-on" text-anchor="middle">초안</text><text x="262" y="214" font-size="19" class="b32s-ink b32s-b"></text><text x="208" y="248" font-size="16" class="b32s-muted">터미널 출력만</text><text x="208" y="270" font-size="16" class="b32s-muted">커밋·PR 없음</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><rect x="16" y="182" width="140" height="104" rx="12" class="b32s-box b32s-node"/><text x="32" y="218" font-size="19" class="b32s-ink b32s-b">사람</text><text x="32" y="256" font-size="16" class="b32s-muted">읽고 고친 뒤</text><text x="32" y="278" font-size="16" class="b32s-muted">직접 커밋·PR</text></g><g class="b32s-g b32s-k-s4 b32s-k-return"><path d="M222 154V178" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="250" cy="166" r="13" class="b32s-sacc"/><text x="250" y="172" font-size="16" class="b32s-on" text-anchor="middle">4</text><path d="M190 250H160" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="174" cy="222" r="13" class="b32s-sacc"/><text x="174" y="228" font-size="16" class="b32s-on" text-anchor="middle">5</text></g><rect x="4" y="320" width="352" height="236" rx="14" class="b32s-zone-ext"/><text x="16" y="346" font-size="16" class="b32s-muted b32s-b">인터넷 너머 (외부 서비스)</text><g class="b32s-g b32s-k-s3"><rect x="16" y="360" width="328" height="82" rx="12" class="b32s-box-a b32s-node"/><path d="M44 364L66 386L44 408L22 386Z" class="b32s-si"/><text x="44" y="392" font-size="16" class="b32s-on" text-anchor="middle">AI</text><text x="74" y="393" font-size="19" class="b32s-ink b32s-b">코디세이 API</text><text x="32" y="428" font-size="16" class="b32s-muted">요청을 받는 HTTPS 창구</text></g><g class="b32s-g b32s-k-s3"><rect x="16" y="460" width="328" height="84" rx="12" class="b32s-box-a b32s-node"/><path d="M44 464L66 486L44 508L22 486Z" class="b32s-si"/><text x="44" y="492" font-size="16" class="b32s-on" text-anchor="middle">AI</text><text x="74" y="493" font-size="19" class="b32s-ink b32s-b">AI 모델</text><text x="32" y="528" font-size="16" class="b32s-muted">실행 위치는 공급자 소관</text></g><g class="b32s-g b32s-k-s3"><path d="M322 154V356" class="b32s-ln" marker-end="url(#b32s-a)"/><path d="M342 358V156" class="b32s-ln" marker-end="url(#b32s-a)"/><circle cx="300" cy="308" r="13" class="b32s-sacc"/><text x="300" y="314" font-size="16" class="b32s-on" text-anchor="middle">2</text><circle cx="300" cy="340" r="13" class="b32s-sacc"/><text x="300" y="346" font-size="16" class="b32s-on" text-anchor="middle">3</text><path d="M180 444V456" class="b32s-dash"/></g><g class="b32s-in-all b32s-in-s1 b32s-in-s2 b32s-in-s3 b32s-in-s4"><text x="16" y="590" font-size="16" class="b32s-ink">① Python이 Git을 실행하고 결과를 받는다</text><text x="16" y="616" font-size="16" class="b32s-ink">② 검사한 내용을 API에 요청한다</text><text x="16" y="642" font-size="16" class="b32s-ink">③ 응답(JSON)을 받는다</text><text x="16" y="668" font-size="16" class="b32s-ink">④ 검증해 초안으로 출력한다</text><text x="16" y="694" font-size="16" class="b32s-ink">⑤ 사람이 확인하고 직접 쓴다</text><text x="16" y="732" font-size="16" class="b32s-muted">실선 = 실제로 오가는 명령·데이터</text><text x="16" y="758" font-size="16" class="b32s-muted">점선 = 외부 · 공개되지 않은 내부</text><text x="16" y="784" font-size="16" class="b32s-muted">프로그램은 커밋·PR을 만들지 않는다</text></g><g class="b32s-in-return"><rect x="4" y="572" width="352" height="68" rx="12" class="b32s-box-r"/><circle cx="28" cy="596" r="13" class="b32s-sacc"/><text x="28" y="602" font-size="16" class="b32s-on" text-anchor="middle">1</text><text x="50" y="602" font-size="17" class="b32s-ink b32s-b">프로그램 · 형식을 검사</text><text x="20" y="628" font-size="16" class="b32s-muted">제목 길이 · 필수 섹션 · 테스트 주장</text><rect x="4" y="654" width="352" height="68" rx="12" class="b32s-box-acc"/><circle cx="28" cy="678" r="13" class="b32s-sacc"/><text x="28" y="684" font-size="16" class="b32s-on" text-anchor="middle">2</text><text x="50" y="684" font-size="17" class="b32s-ink b32s-b">사람 · 내용과 이유를 확인</text><text x="20" y="710" font-size="16" class="b32s-muted">실제 diff와 비교 · 빠진 것 찾기</text><rect x="4" y="736" width="352" height="68" rx="12" class="b32s-box-acc"/><circle cx="28" cy="760" r="13" class="b32s-sacc"/><text x="28" y="766" font-size="16" class="b32s-on" text-anchor="middle">3</text><text x="50" y="766" font-size="17" class="b32s-ink b32s-b">사람 · 직접 사용</text><text x="20" y="792" font-size="16" class="b32s-muted">git commit · GitHub에서 PR 작성</text></g></svg>
