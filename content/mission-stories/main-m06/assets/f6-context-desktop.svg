<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="B3-2가 AI에게 보내는 Git 문맥 6칸(실제 순서, 재현). Branch: main / Status: ' M docs/…/02-python-ai-api.md' / Changed files: 파일 이름 / Untracked files: 새 파일은 이름만(강조) / Staged diff: git add한 변경, 이번에는 비어 있음 / Unstaged diff: 아직 add하지 않은 변경, 실습 메모 2줄 추가. 가운데 안전 검사(기본으로 켜짐): ① .env · .pem · id_rsa 같은 비밀 파일 경로가 있으면 보내지 않고 멈춘다 ② 이메일·토큰·비밀번호 값은 [REDACTED]로 가린다 ③ 16,000자를 넘으면 요청하지 않는다. 오른쪽: 이번 예에서 보낼 문맥은 806자. 보내지 않는 것: 새 파일의 내용, 바뀌지 않은 파일, API 키."><title>AI에게 보내는 데이터와 안전 검사</title><style>.b32s-bg{fill:var(--presentation-bg,#111827)}.b32s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-box-g{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b32s-box-p{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b32s-box-r{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b32s-box-a{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;stroke-dasharray:10 6}.b32s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b32s-box-term{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-bar{fill:var(--presentation-chip,#293549)}.b32s-zone{fill:none;stroke:var(--presentation-line,#64748b);stroke-width:2}.b32s-zone-ext{fill:none;stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:12 8}.b32s-ink{fill:var(--presentation-ink,#eef2f7)}.b32s-muted{fill:var(--presentation-muted,#bdc8d7)}.b32s-b{font-weight:700}.b32s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding','Malgun Gothic',