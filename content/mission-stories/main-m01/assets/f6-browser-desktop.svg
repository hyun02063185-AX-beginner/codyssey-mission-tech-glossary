<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="브라우저 통합 구조도(교육용 단순화). 파일 세 개: js/menu.js(J), index.html(H), css/style.css(C). index.html이 link로 style.css를, script defer로 menu.js를 불러온다(점선). 브라우저 안에서 index.html은 해석되어 DOM(문서 구조)이 된다. style.css의 규칙은 스타일 계산 단계에서 DOM 요소를 고르기만 하고(점선, 읽기만) 요소마다 적용할 값을 계산한다. menu.js는 JavaScript 실행 단계에서 DOM을 읽고 바꾼다(양쪽 화살표). 화면 표시 단계는 DOM과 계산된 스타일로 화면을 그린다. 사용자는 화면을 보고, 누르면 이벤트가 JavaScript로 전달된다. CSS 화살표는 DOM에 닿지 않는다."><title>브라우저 안에서 세 파일이 하나의 화면이 되는 구조</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="1200" height="660" class="b11s-bg"/><rect x="40" y="60" width="250" height="110" rx="12" class="b11s-box-j"/><path d="M70 74L90 94L70 114L50 94Z" class="b11s-sj"/><text x="70" y="100" font-size="19" class="b11s-on" text-anchor="middle">J</text><text x="96" y="101" font-size="20" class="b11s-mono b11s-ink b11s-b">js/menu.js</text><text x="54" y="134" font-size="19" class="b11s-muted">기능·동작</text><text x="54" y="160" font-size="19" class="b11s-mono b11s-muted">← script defer</text><rect x="40" y="250" width="250" height="110" rx="12" class="b11s-box-h"/><rect x="55" y="269" width="30" height="30" rx="4" class="b11s-sh"/><text x="70" y="290" font-size="19" class="b11s-on" text-anchor="middle">H</text><text x="96" y="291" font-size="20" class="b11s-mono b11s-ink b11s-b">index.html</text><text x="54" y="324" font-size="19" class="b11s-muted">문서·의미</text><text x="54" y="350" font-size="19" class="b11s-muted">시작 문서</text><rect x="40" y="440" width="250" height="110" rx="12" class="b11s-box-c"/><circle cx="70" cy="474" r="16" class="b11s-sc"/><text x="70" y="480" font-size="19" class="b11s-on" text-anchor="middle">C</text><text x="96" y="481" font-size="20" class="b11s-mono b11s-ink b11s-b">css/style.css</text><text x="54" y="514" font-size="19" class="b11s-muted">표현·규칙</text><text x="54" y="540" font-size="19" class="b11s-mono b11s-muted">← link</text><path d="M40 290H24V122H40" class="b11s-dash" marker-end="url(#b11s-a-m)"/><path d="M40 320H24V488H40" class="b11s-dash" marker-end="url(#b11s-a-m)"/><rect x="340" y="20" width="680" height="590" rx="16" class="b11s-box-br"/><text x="364" y="52" font-size="22" class="b11s-ink b11s-b">브라우저 (실행 환경)</text><rect x="380" y="70" width="270" height="110" rx="12" class="b11s-box-j"/><path d="M410 84L430 104L410 124L390 104Z" class="b11s-sj"/><text x="410" y="110" font-size="19" class="b11s-on" text-anchor="middle">J</text><text x="436" y="111" font-size="21" class="b11s-ink b11s-b">JavaScript 실행</text><text x="400" y="152" font-size="19" class="b11s-muted">DOM을 읽고 바꾼다</text><rect x="380" y="250" width="270" height="110" rx="12" class="b11s-box-h"/><rect x="395" y="269" width="30" height="30" rx="4" class="b11s-sh"/><text x="410" y="290" font-size="19" class="b11s-on" text-anchor="middle">H</text><text x="436" y="291" font-size="21" class="b11s-ink b11s-b">DOM</text><text x="400" y="332" font-size="19" class="b11s-muted">해석해 만든 문서 구조</text><rect x="380" y="430" width="270" height="110" rx="12" class="b11s-box-c"/><circle cx="410" cy="464" r="16" class="b11s-sc"/><text x="410" y="470" font-size="19" class="b11s-on" text-anchor="middle">C</text><text x="436" y="471" font-size="21" class="b11s-ink b11s-b">스타일 계산</text><text x="400" y="512" font-size="19" class="b11s-muted">요소마다 값을 계산</text><path d="M290 115H372" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="300" y="105" font-size="19" class="b11s-muted">실행</text><path d="M290 305H372" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="300" y="295" font-size="19" class="b11s-muted">해석</text><path d="M290 485H372" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="300" y="475" font-size="19" class="b11s-muted">규칙</text><path d="M515 182V246" class="b11s-ln-acc" marker-start="url(#b11s-a-accs)" marker-end="url(#b11s-a-acc)"/><text x="528" y="220" font-size="19" class="b11s-acc">읽고 바꾼다</text><path d="M515 362V424" class="b11s-dot" marker-end="url(#b11s-a-m)"/><text x="528" y="400" font-size="19" class="b11s-muted">요소를 고른다 (읽기만)</text><rect x="780" y="250" width="220" height="170" rx="12" class="b11s-box"/><text x="890" y="300" font-size="23" class="b11s-ink b11s-b" text-anchor="middle">화면 표시</text><text x="890" y="340" font-size="19" class="b11s-muted" text-anchor="middle">DOM과 계산된</text><text x="890" y="368" font-size="19" class="b11s-muted" text-anchor="middle">스타일로 그린다</text><path d="M652 300H772" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="664" y="290" font-size="19" class="b11s-muted">바탕 구조</text><path d="M652 480L772 410" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="664" y="512" font-size="19" class="b11s-muted">계산된 모습</text><rect x="1050" y="250" width="130" height="170" rx="12" class="b11s-box"/><text x="1115" y="300" font-size="21" class="b11s-ink b11s-b" text-anchor="middle">사용자</text><text x="1115" y="340" font-size="19" class="b11s-muted" text-anchor="middle">보고</text><text x="1115" y="368" font-size="19" class="b11s-muted" text-anchor="middle">누른다</text><path d="M1002 335H1042" class="b11s-ln" marker-end="url(#b11s-a)"/><path d="M1115 250V120H658" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="800" y="108" font-size="19" class="b11s-muted">누르면 → 이벤트</text><text x="40" y="640" font-size="19" class="b11s-muted">실선 = 만든다·바꾼다·그린다 · 점선 = 불러옴·참고 · 교육용 단순화: 실제 브라우저는 여러 일을 동시에 한다</text></svg>
