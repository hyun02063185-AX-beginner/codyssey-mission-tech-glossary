<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1150" viewBox="0 0 360 1150" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="브라우저 통합 구조도(교육용 단순화). 파일 세 개: js/menu.js(J), index.html(H), css/style.css(C). index.html이 link로 style.css를, script defer로 menu.js를 불러온다(점선). 브라우저 안에서 index.html은 해석되어 DOM(문서 구조)이 된다. style.css의 규칙은 스타일 계산 단계에서 DOM 요소를 고르기만 하고(점선, 읽기만) 요소마다 적용할 값을 계산한다. menu.js는 JavaScript 실행 단계에서 DOM을 읽고 바꾼다(양쪽 화살표). 화면 표시 단계는 DOM과 계산된 스타일로 화면을 그린다. 사용자는 화면을 보고, 누르면 이벤트가 JavaScript로 전달된다. CSS 화살표는 DOM에 닿지 않는다."><title>브라우저 안에서 세 파일이 하나의 화면이 되는 구조</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="360" height="1150" class="b11s-bg"/><text x="16" y="34" font-size="18" class="b11s-ink b11s-b">파일 (내 폴더)</text><rect x="16" y="48" width="328" height="54" rx="10" class="b11s-box-j"/><path d="M40 58L57 75L40 92L23 75Z" class="b11s-sj"/><text x="40" y="80" font-size="16" class="b11s-on" text-anchor="middle">J</text><text x="64" y="81" font-size="16" class="b11s-mono b11s-ink b11s-b">js/menu.js</text><text x="328" y="81" font-size="16" class="b11s-muted" text-anchor="end">기능·동작</text><rect x="16" y="112" width="328" height="54" rx="10" class="b11s-box-h"/><rect x="28" y="127" width="24" height="24" rx="4" class="b11s-sh"/><text x="40" y="144" font-size="16" class="b11s-on" text-anchor="middle">H</text><text x="64" y="145" font-size="16" class="b11s-mono b11s-ink b11s-b">index.html</text><text x="328" y="145" font-size="16" class="b11s-muted" text-anchor="end">문서·의미</text><rect x="16" y="176" width="328" height="54" rx="10" class="b11s-box-c"/><circle cx="40" cy="203" r="13" class="b11s-sc"/><text x="40" y="208" font-size="16" class="b11s-on" text-anchor="middle">C</text><text x="64" y="209" font-size="16" class="b11s-mono b11s-ink b11s-b">css/style.css</text><text x="328" y="209" font-size="16" class="b11s-muted" text-anchor="end">표현·규칙</text><text x="16" y="266" font-size="16" class="b11s-muted">index.html이 link·script defer로 불러온다</text><path d="M180 276V300" class="b11s-dash" marker-end="url(#b11s-a-m)"/><rect x="16" y="306" width="328" height="650" rx="14" class="b11s-box-br"/><text x="32" y="338" font-size="18" class="b11s-ink b11s-b">브라우저 (실행 환경)</text><rect x="32" y="356" width="260" height="104" rx="12" class="b11s-box-j"/><path d="M56 369L73 386L56 403L39 386Z" class="b11s-sj"/><text x="56" y="391" font-size="16" class="b11s-on" text-anchor="middle">J</text><text x="80" y="393" font-size="18" class="b11s-ink b11s-b">JavaScript 실행</text><text x="48" y="434" font-size="16" class="b11s-muted">menu.js를 실행</text><rect x="32" y="512" width="260" height="104" rx="12" class="b11s-box-h"/><rect x="44" y="530" width="24" height="24" rx="4" class="b11s-sh"/><text x="56" y="547" font-size="16" class="b11s-on" text-anchor="middle">H</text><text x="80" y="549" font-size="18" class="b11s-ink b11s-b">DOM</text><text x="48" y="590" font-size="16" class="b11s-muted">index.html을 해석해 만든 구조</text><rect x="32" y="668" width="260" height="104" rx="12" class="b11s-box-c"/><circle cx="56" cy="698" r="13" class="b11s-sc"/><text x="56" y="703" font-size="16" class="b11s-on" text-anchor="middle">C</text><text x="80" y="705" font-size="18" class="b11s-ink b11s-b">스타일 계산</text><text x="48" y="746" font-size="16" class="b11s-muted">style.css 규칙을 요소에 맞춰 계산</text><rect x="32" y="824" width="260" height="104" rx="12" class="b11s-box"/><text x="48" y="861" font-size="18" class="b11s-ink b11s-b">화면 표시</text><text x="48" y="902" font-size="16" class="b11s-muted">DOM + 계산된 스타일로 그림</text><path d="M120 462V506" class="b11s-ln-acc" marker-start="url(#b11s-a-accs)" marker-end="url(#b11s-a-acc)"/><text x="132" y="490" font-size="16" class="b11s-acc">읽고 바꾼다</text><path d="M120 618V662" class="b11s-dot" marker-end="url(#b11s-a-m)"/><text x="132" y="646" font-size="16" class="b11s-muted">요소를 고른다(읽기만)</text><path d="M120 774V818" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="132" y="802" font-size="16" class="b11s-muted">계산된 모습</text><path d="M292 564H320V876H300" class="b11s-ln" marker-end="url(#b11s-a)"/><text x="16" y="984" font-size="16" class="b11s-muted">DOM → 화면 표시: 그리기의 바탕 (오른쪽 선)</text><rect x="16" y="1000" width="328" height="80" rx="12" class="b11s-box"/><text x="32" y="1034" font-size="18" class="b11s-ink b11s-b">사용자 · 보고 누른다</text><text x="32" y="1064" font-size="16" class="b11s-muted">누르면 이벤트 → JavaScript 실행</text><text x="16" y="1112" font-size="16" class="b11s-muted">실선 = 만든다·바꾼다 · 점선 = 불러옴·참고</text><text x="16" y="1138" font-size="16" class="b11s-muted">교육용 단순화 (실제로는 동시에 일함)</text></svg>
