<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="웹페이지 한 장을 세 가지 역할로 나눈 구조도. HTML(네모 H)은 문서·의미로 무엇이 있고 그것이 무엇인지 적는다. CSS(동그라미 C)는 표현·규칙으로 어떻게 보일지를 조건에 따라 정한다. JavaScript(마름모 J)는 기능·동작으로 행동에 어떻게 반응할지 판단하고 실행한다. 세 역할 아래에 브라우저가 있고, 브라우저가 세 파일을 읽고 합쳐 하나의 화면으로 보여 준다."><title>웹페이지를 이루는 세 가지 역할</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="1200" height="560" class="b11s-bg"/><rect x="440" y="20" width="320" height="84" rx="12" class="b11s-box"/><text x="600" y="56" font-size="28" class="b11s-ink b11s-b" text-anchor="middle">웹페이지 한 장</text><text x="600" y="88" font-size="19" class="b11s-muted" text-anchor="middle">김코디의 자기소개 (교육용 예시)</text><path d="M600 104V126M200 126H1000M200 126V150M600 126V150M1000 126V150" class="b11s-ln"/><text x="780" y="70" font-size="19" class="b11s-muted">역할을 나눠 맡는다</text><rect x="40" y="150" width="320" height="270" rx="12" class="b11s-box-h"/><rect x="64" y="174" width="44" height="44" rx="4" class="b11s-sh"/><text x="86" y="205" font-size="25" class="b11s-on" text-anchor="middle">H</text><text x="126" y="188" font-size="19" class="b11s-muted">문서·의미</text><text x="126" y="220" font-size="30" class="b11s-th">HTML</text><text x="66" y="280" font-size="22" class="b11s-ink b11s-b">무엇이 있고,</text><text x="66" y="312" font-size="22" class="b11s-ink b11s-b">그것이 무엇인지</text><text x="66" y="366" font-size="19" class="b11s-muted">제목 · 문단 · 그림</text><text x="66" y="394" font-size="19" class="b11s-muted">목록 · 링크 · 버튼</text><path d="M200 420V452" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="440" y="150" width="320" height="270" rx="12" class="b11s-box-c"/><circle cx="486" cy="196" r="23" class="b11s-sc"/><text x="486" y="205" font-size="25" class="b11s-on" text-anchor="middle">C</text><text x="526" y="188" font-size="19" class="b11s-muted">표현·규칙</text><text x="526" y="220" font-size="30" class="b11s-tc">CSS</text><text x="466" y="280" font-size="22" class="b11s-ink b11s-b">어떻게 보일지</text><text x="466" y="312" font-size="22" class="b11s-ink b11s-b">(조건에 따라 다르게)</text><text x="466" y="366" font-size="19" class="b11s-muted">색 · 글꼴 · 여백</text><text x="466" y="394" font-size="19" class="b11s-muted">배치 · 화면 폭 조건</text><path d="M600 420V452" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="840" y="150" width="320" height="270" rx="12" class="b11s-box-j"/><path d="M886 169L913 196L886 223L859 196Z" class="b11s-sj"/><text x="886" y="205" font-size="25" class="b11s-on" text-anchor="middle">J</text><text x="926" y="188" font-size="19" class="b11s-muted">기능·동작</text><text x="926" y="220" font-size="30" class="b11s-tj">JavaScript</text><text x="866" y="280" font-size="22" class="b11s-ink b11s-b">행동에 어떻게</text><text x="866" y="312" font-size="22" class="b11s-ink b11s-b">반응할지 (판단·실행)</text><text x="866" y="366" font-size="19" class="b11s-muted">☰를 누르면</text><text x="866" y="394" font-size="19" class="b11s-muted">메뉴를 열고 닫기</text><path d="M1000 420V452" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="40" y="462" width="1120" height="74" rx="12" class="b11s-box-br"/><text x="600" y="494" font-size="24" class="b11s-ink b11s-b" text-anchor="middle">브라우저 — 실행 환경</text><text x="600" y="524" font-size="19" class="b11s-muted" text-anchor="middle">세 파일을 읽고 합쳐 하나의 화면으로 보여 준다</text></svg>
