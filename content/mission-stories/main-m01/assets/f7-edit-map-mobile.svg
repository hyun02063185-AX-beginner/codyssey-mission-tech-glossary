dth="24" height="24" rx="4" class="b11s-sh"/><text x="46" y="475" font-size="16" class="b11s-on" text-anchor="middle">H</text><text x="70" y="476" font-size="16" class="b11s-mono b11s-ink b11s-b">index.html</text><text x="328" y="476" font-size="16" class="b11s-muted" text-anchor="end">내용</text><rect x="16" y="514" width="328" height="104" rx="12" class="b11s-box-c"/><circle cx="42" cy="544" r="14" class="b11s-sacc"/><text x="42" y="550" font-size="16" class="b11s-on" text-anchor="middle">2</text><text x="66" y="550" font-size="17" class="b11s-ink b11s-b">제목 색·크기를 바꾸고 싶다</text><circle cx="46" cy="588" r="13" class="b11s-sc"/><text x="46" y="593" font-size="16" class="b11s-on" text-anchor="middle">C</text><text x="70" y="594" font-size="16" class="b11s-mono b11s-ink b11s-b">css/style.css</text><text x="328" y="594" font-size="16" class="b11s-muted" text-anchor="end">모습</text><rect x="16" y="632" width="328" height="104" rx="12" class="b11s-box-j"/><circle cx="42" cy="662" r="14" class="b11s-sacc"/><text x="42" y="668" font-size="16" class="b11s-on" text-anchor="middle">3</text><text x="66" y="668" font-size="17" class="b11s-ink b11s-b">메뉴가 열리는 방식을 바꾸고 싶다</text><path d="M46 689L63 706L46 723L29 706Z" class="b11s-sj"/><text x="46" y="711" font-size="16" class="b11s-on" text-anchor="middle">J</text><text x="70" y="712" font-size="16" class="b11s-mono b11s-ink b11s-b">js/menu.js</text><text x="328" y="712" font-size="16" class="b11s-muted" text-anchor="end">동작</text><text x="16" y="772" font-size="16" class="b11s-ink">고친 뒤 새로고침 → 파일을 다시 읽는다</text><text x="16" y="804" font-size="16" class="b11s-muted">열린 메뉴의 모양은 CSS,</text><text x="16" y="830" font-size="16" class="b11s-muted">열리게 하는 것은 JavaScript</text></svg>
