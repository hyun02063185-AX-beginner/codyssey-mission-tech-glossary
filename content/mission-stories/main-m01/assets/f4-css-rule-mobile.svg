<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="css/style.css의 실제 규칙 중 한 줄 h1 { font-size: 1.75rem; }을 세 부분으로 나눈 그림. h1은 선택자로 누구를 고를지, font-size는 속성으로 무엇을 정할지, 1.75rem은 값으로 어떻게 할지를 적는다. 선택자는 DOM의 h1 요소를 고르기만 하고, 브라우저가 규칙을 계산해 제목의 글자 크기로 화면에 반영한다. CSS는 DOM의 내용과 구조를 바꾸지 않는다."><title>CSS 규칙 한 줄 읽기</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="360" height="900" class="b11s-bg"/><rect x="16" y="16" width="328" height="206" rx="12" class="b11s-box-c"/><circle cx="44" cy="48" r="16" class="b11s-sc"/><text x="44" y="54" font-size="17" class="b11s-on" text-anchor="middle">C</text><text x="70" y="54" font-size="16" class="b11s-muted">실제 규칙 한 줄</text><text x="32" y="112" font-size="18" class="b11s-mono b11s-ink" textLength="281" lengthAdjust="spacingAndGlyphs">h1 { font-size: 1.75rem; }</text><path d="M32 122V130H54V122" class="b11s-ln-acc"/><path d="M86 122V130H183V122" class="b11s-ln-acc"/><path d="M205 122V130H280V122" class="b11s-ln-acc"/><text x="28" y="164" font-size="16" class="b11s-ink">h1 = 선택자 · 누구를</text><text x="28" y="188" font-size="16" class="b11s-ink">font-size = 속성 · 무엇을</text><text x="28" y="212" font-size="16" class="b11s-ink">1.75rem = 값 · 어떻게</text><path d="M180 222V250" class="b11s-ln-acc" marker-end="url(#b11s-a-acc)"/><rect x="16" y="256" width="328" height="150" rx="10" class="b11s-pg"/><g class="b11s-deco"><text x="36" y="288" font-size="14" class="b11s-pg-ink">화면 속 h1 요소</text><text x="36" y="340" font-size="28" class="b11s-pg-ink b11s-b">안녕하세요,</text><text x="36" y="380" font-size="28" class="b11s-pg-ink b11s-b">김코디입니다</text></g><rect x="16" y="430" width="328" height="136" rx="12" class="b11s-box"/><circle cx="44" cy="464" r="15" class="b11s-sacc"/><text x="44" y="470" font-size="16" class="b11s-on" text-anchor="middle">1</text><text x="70" y="471" font-size="18" class="b11s-ink b11s-b">선택자는 고르기만</text><text x="32" y="514" font-size="16" class="b11s-muted">DOM의 h1을 고른다.</text><text x="32" y="542" font-size="16" class="b11s-muted">DOM은 그대로.</text><rect x="16" y="582" width="328" height="136" rx="12" class="b11s-box"/><circle cx="44" cy="616" r="15" class="b11s-sacc"/><text x="44" y="622" font-size="16" class="b11s-on" text-anchor="middle">2</text><text x="70" y="623" font-size="18" class="b11s-ink b11s-b">원하는 모습을 적는다</text><text x="32" y="666" font-size="16" class="b11s-muted">순서가 아니라 모습을 값으로.</text><rect x="16" y="734" width="328" height="136" rx="12" class="b11s-box"/><circle cx="44" cy="768" r="15" class="b11s-sacc"/><text x="44" y="774" font-size="16" class="b11s-on" text-anchor="middle">3</text><text x="70" y="775" font-size="18" class="b11s-ink b11s-b">브라우저가 계산해 그린다</text><text x="32" y="818" font-size="16" class="b11s-muted">요소마다 계산해 화면에 반영.</text></svg>
