<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="1 사용자가 ☰ 버튼을 누르면 click 이벤트가 생긴다. 2 미리 등록해 둔 JavaScript 함수(이벤트 핸들러)가 메뉴가 닫혀 있으면 열고, 열려 있으면 닫기로 판단한다. 3 DOM이 바뀐다: nav에 is-open이 붙고 버튼의 aria-expanded가 true가 된다. 4 브라우저가 바뀐 DOM에 맞는 CSS 규칙으로 다시 그려 메뉴가 보인다. HTML 파일은 그대로다. 다시 누르면 같은 과정으로 닫힌다. 교육용 단순화이며 자세한 6단계는 학습가이드 Ch4의 V04."><title>버튼 클릭에서 화면 변화까지</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="1200" height="430" class="b11s-bg"/><rect x="30" y="30" width="260" height="270" rx="12" class="b11s-box"/><circle cx="60" cy="64" r="17" class="b11s-sacc"/><text x="60" y="71" font-size="19" class="b11s-on" text-anchor="middle">1</text><text x="88" y="71" font-size="21" class="b11s-ink b11s-b">사용자</text><text x="52" y="136" font-size="20" class="b11s-ink">☰ 버튼을</text><text x="52" y="168" font-size="20" class="b11s-ink">누른다</text><text x="52" y="232" font-size="19" class="b11s-muted">click 이벤트</text><path d="M292 165H318" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="322" y="30" width="260" height="270" rx="12" class="b11s-box-j"/><circle cx="352" cy="64" r="17" class="b11s-sacc"/><text x="352" y="71" font-size="19" class="b11s-on" text-anchor="middle">2</text><path d="M544 241L565 262L544 283L523 262Z" class="b11s-sj"/><text x="544" y="269" font-size="19" class="b11s-on" text-anchor="middle">J</text><text x="380" y="71" font-size="21" class="b11s-ink b11s-b">JavaScript 처리</text><text x="344" y="136" font-size="20" class="b11s-ink">닫혀 있으면 → 연다</text><text x="344" y="168" font-size="20" class="b11s-ink">열려 있으면 → 닫는다</text><text x="344" y="232" font-size="19" class="b11s-muted">미리 등록한 함수</text><text x="344" y="260" font-size="19" class="b11s-muted">(이벤트 핸들러)</text><path d="M584 165H610" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="614" y="30" width="260" height="270" rx="12" class="b11s-box"/><circle cx="644" cy="64" r="17" class="b11s-sacc"/><text x="644" y="71" font-size="19" class="b11s-on" text-anchor="middle">3</text><text x="672" y="71" font-size="21" class="b11s-ink b11s-b">DOM이 바뀐다</text><text x="636" y="136" font-size="20" class="b11s-ink">nav에 is-open</text><text x="636" y="168" font-size="20" class="b11s-ink">aria-expanded=true</text><text x="636" y="232" font-size="19" class="b11s-muted">HTML 파일은 그대로</text><path d="M876 165H902" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="906" y="30" width="260" height="270" rx="12" class="b11s-box-br"/><circle cx="936" cy="64" r="17" class="b11s-sacc"/><text x="936" y="71" font-size="19" class="b11s-on" text-anchor="middle">4</text><text x="964" y="71" font-size="21" class="b11s-ink b11s-b">브라우저가 다시 그림</text><text x="928" y="136" font-size="20" class="b11s-ink">바뀐 DOM에 맞는</text><text x="928" y="168" font-size="20" class="b11s-ink">CSS 규칙으로 그림</text><text x="928" y="232" font-size="19" class="b11s-muted">→ 메뉴가 보인다</text><path d="M1034 300V330H160V306" class="b11s-dash" marker-end="url(#b11s-a-m)"/><text x="597" y="354" font-size="19" class="b11s-muted" text-anchor="middle">다시 누르면 같은 과정으로 닫힌다</text><text x="30" y="408" font-size="19" class="b11s-muted">입력(클릭) → 처리(판단) → 결과(화면 변화) · 교육용 단순화 — 자세한 6단계는 학습가이드 Ch4의 V04</text></svg>
