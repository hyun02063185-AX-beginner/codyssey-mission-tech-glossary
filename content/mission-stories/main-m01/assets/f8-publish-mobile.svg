<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="로컬에서 공개까지의 흐름. 내 컴퓨터의 세 파일을 GitHub 저장소에 올리고, GitHub Pages가 파일을 공개하며, 방문자는 공개 URL로 접속한다. 방문자의 브라우저가 파일을 받아 DOM·스타일·JavaScript로 화면을 만든다. 합치고 실행하는 곳은 Pages가 아니라 방문자의 브라우저다. 명령과 설정은 학습가이드 Ch8."><title>내 컴퓨터에서 공개 URL까지</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="360" height="760" class="b11s-bg"/><rect x="16" y="16" width="328" height="84" rx="12" class="b11s-box"/><text x="36" y="52" font-size="18" class="b11s-ink b11s-b">내 컴퓨터</text><text x="36" y="82" font-size="16" class="b11s-muted">세 파일 H · C · J</text><path d="M180 102V124" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="128" width="328" height="84" rx="12" class="b11s-box"/><text x="36" y="164" font-size="18" class="b11s-ink b11s-b">GitHub 저장소</text><text x="36" y="194" font-size="16" class="b11s-muted">파일을 올려 보관</text><path d="M180 214V236" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="240" width="328" height="84" rx="12" class="b11s-box"/><text x="36" y="276" font-size="18" class="b11s-ink b11s-b">GitHub Pages</text><text x="36" y="306" font-size="16" class="b11s-muted">파일을 공개</text><path d="M180 326V348" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="352" width="328" height="84" rx="12" class="b11s-box"/><text x="36" y="388" font-size="18" class="b11s-ink b11s-b">공개 URL</text><text x="36" y="418" font-size="16" class="b11s-muted">주소로 접속</text><path d="M180 438V460" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="464" width="328" height="84" rx="12" class="b11s-box-acc"/><text x="36" y="500" font-size="18" class="b11s-ink b11s-b">방문자 브라우저</text><text x="36" y="530" font-size="16" class="b11s-muted">파일을 받아 화면을 만든다</text><rect x="16" y="590" width="328" height="96" rx="12" class="b11s-box-acc"/><text x="32" y="626" font-size="18" class="b11s-ink b11s-b">합치고 실행하는 곳은</text><text x="32" y="656" font-size="18" class="b11s-ink b11s-b">방문자의 브라우저 (S4-1)</text><text x="16" y="718" font-size="16" class="b11s-muted">Pages는 파일을 공개할 뿐</text><text x="16" y="744" font-size="16" class="b11s-muted">명령·설정은 학습가이드 Ch8</text></svg>
