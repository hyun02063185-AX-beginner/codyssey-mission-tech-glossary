lass="b11s-box-j"/><path d="M504 287L525 308L504 329L483 308Z" class="b11s-sj"/><text x="504" y="315" font-size="19" class="b11s-on" text-anchor="middle">J</text><text x="534" y="302" font-size="20" class="b11s-mono b11s-ink b11s-b">js/menu.js</text><text x="534" y="332" font-size="19" class="b11s-muted">동작</text><rect x="850.0" y="20.0" width="300.0" height="360.0" rx="10" class="b11s-pg"/><g class="b11s-deco"><rect x="850.0" y="20.0" width="300.0" height="150.0" rx="10.0" class="b11s-pg-brand"/><text x="868.0" y="58.0" font-size="20.0" class="b11s-pg-white b11s-b">김코디</text><rect x="1046.0" y="34.0" width="88.0" height="36.0" rx="6.0" class="b11s-pg-white"/><text x="1090.0" y="58.0" font-size="16.0" class="b11s-pg-dark b11s-b" text-anchor="middle">☰ 메뉴</text><text x="876.0" y="100.0" font-size="16.0" class="b11s-pg-white b11s-b">소개</text><text x="876.0" y="126.0" font-size="16.0" class="b11s-pg-white b11s-b">프로젝트</text><text x="876.0" y="152.0" font-size="16.0" class="b11s-pg-white b11s-b">연락</text><circle cx="1000.0" cy="220.0" r="34.0" class="b11s-pg-soft"/><circle cx="1000.0" cy="214.0" r="16.0" class="b11s-pg-skin"/><text x="1000.0" y="292.0" font-size="24.0" class="b11s-pg-dark b11s-b" text-anchor="middle">안녕하세요,</text><text x="1000.0" y="324.0" font-size="24.0" class="b11s-pg-dark b11s-b" text-anchor="middle">김코디입니다</text><rect x="890.0" y="342.0" width="220.0" height="8.0" rx="4.0" class="b11s-pg-gray"/></g><circle cx="904.0" cy="284.0" r="15" class="b11s-sacc"/><text x="904.0" y="290.0" font-size="19" class="b11s-on" text-anchor="middle">1</text><circle cx="1100.0" cy="316.0" r="15" class="b11s-sacc"/><text x="1100.0" y="322.0" font-size="19" class="b11s-on" text-anchor="middle">2</text><circle cx="1026.0" cy="52.0" r="15" class="b11s-sacc"/><text x="1026.0" y="58.0" font-size="19" class="b11s-on" text-anchor="middle">3</text><text x="30" y="418" font-size="20" class="b11s-ink">고친 뒤에는 새로고침 → 브라우저가 파일을 다시 읽는다</text><text x="30" y="452" font-size="19" class="b11s-muted">열린 메뉴의 모양은 CSS, 열리게 하는 것은 JavaScript — 기능 하나에 세 파일이 함께 일하기도 한다</text></svg>
