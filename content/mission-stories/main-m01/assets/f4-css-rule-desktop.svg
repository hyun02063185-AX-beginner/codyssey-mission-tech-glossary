<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="css/style.css의 실제 규칙 중 한 줄 h1 { font-size: 1.75rem; }을 세 부분으로 나눈 그림. h1은 선택자로 누구를 고를지, font-size는 속성으로 무엇을 정할지, 1.75rem은 값으로 어떻게 할지를 적는다. 선택자는 DOM의 h1 요소를 고르기만 하고, 브라우저가 규칙을 계산해 제목의 글자 크기로 화면에 반영한다. CSS는 DOM의 내용과 구조를 바꾸지 않는다."><title>CSS 규칙 한 줄 읽기</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="1200" height="470" class="b11s-bg"/><rect x="30" y="20" width="720" height="250" rx="12" class="b11s-box-c"/><circle cx="66" cy="58" r="19" class="b11s-sc"/><text x="66" y="66" font-size="21" class="b11s-on" text-anchor="middle">C</text><text x="98" y="66" font-size="20" class="b11s-muted">css/style.css의 실제 규칙 (한 줄만)</text><text x="66" y="150" font-size="40" class="b11s-mono b11s-ink" textLength="624" lengthAdjust="spacingAndGlyphs">h1 { font-size: 1.75rem; }</text><path d="M66 168V178H114V168" class="b11s-ln-acc"/><text x="90.0" y="212" font-size="22" class="b11s-acc" text-anchor="middle">선택자</text><text x="90.0" y="244" font-size="20" class="b11s-ink" text-anchor="middle">누구를</text><path d="M186 168V178H402V168" class="b11s-ln-acc"/><text x="294.0" y="212" font-size="22" class="b11s-acc" text-anchor="middle">속성</text><text x="294.0" y="244" font-size="20" class="b11s-ink" text-anchor="middle">무엇을</text><path d="M450 168V178H618V168" class="b11s-ln-acc"/><text x="534.0" y="212" font-size="22" class="b11s-acc" text-anchor="middle">값</text><text x="534.0" y="244" font-size="20" class="b11s-ink" text-anchor="middle">어떻게</text><rect x="820" y="20" width="350" height="250" rx="10" class="b11s-pg"/><g class="b11s-deco"><text x="846" y="60" font-size="16" class="b11s-pg-ink">화면 속 h1 요소</text><text x="846" y="132" font-size="34" class="b11s-pg-ink b11s-b">안녕하세요,</text><text x="846" y="178" font-size="34" class="b11s-pg-ink b11s-b">김코디입니다</text></g><path d="M750 140H812" class="b11s-ln-acc" marker-end="url(#b11s-a-acc)"/><text x="995" y="240" font-size="19" class="b11s-pg-muted" text-anchor="middle">글자 크기 1.75rem</text><rect x="30" y="300" width="372" height="150" rx="12" class="b11s-box"/><circle cx="62" cy="336" r="16" class="b11s-sacc"/><text x="62" y="342" font-size="19" class="b11s-on" text-anchor="middle">1</text><text x="90" y="343" font-size="21" class="b11s-ink b11s-b">선택자는 고르기만</text><text x="54" y="390" font-size="19" class="b11s-muted">DOM의 h1 요소를 고른다.</text><text x="54" y="420" font-size="19" class="b11s-muted">DOM은 바꾸지 않는다.</text><rect x="414" y="300" width="372" height="150" rx="12" class="b11s-box"/><circle cx="446" cy="336" r="16" class="b11s-sacc"/><text x="446" y="342" font-size="19" class="b11s-on" text-anchor="middle">2</text><text x="474" y="343" font-size="21" class="b11s-ink b11s-b">원하는 모습을 적는다</text><text x="438" y="390" font-size="19" class="b11s-muted">그리는 순서는 적지 않는다.</text><text x="438" y="420" font-size="19" class="b11s-muted">모습만 값으로 적는다.</text><rect x="798" y="300" width="372" height="150" rx="12" class="b11s-box"/><circle cx="830" cy="336" r="16" class="b11s-sacc"/><text x="830" y="342" font-size="19" class="b11s-on" text-anchor="middle">3</text><text x="858" y="343" font-size="21" class="b11s-ink b11s-b">브라우저가 계산해 그린다</text><text x="822" y="390" font-size="19" class="b11s-muted">요소마다 값을 계산해</text><text x="822" y="420" font-size="19" class="b11s-muted">화면에 반영한다.</text></svg>
