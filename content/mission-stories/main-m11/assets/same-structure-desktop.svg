<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" data-state="all" data-states="all" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="B6-1 공부방은 학생과 수업의 다대다 관계를 연결 표 수강으로 풀었다. 블로그 예시처럼 일대다 관계는 연결 표 없이 회원과 게시글을 바로 잇는다. 공통점은 표로 나누고 선으로 잇는 것이며, 다대다(N) 관계는 연결 테이블로 표현할 수 있다."><title>주제가 달라도 같은 구조</title><style>.b61s-bg{fill:var(--presentation-bg,#111827)}.b61s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b61s-cell{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:1.5}.b61s-head{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:1.5}.b61s-ink{fill:var(--presentation-ink,#eef2f7)}.b61s-muted{fill:var(--presentation-muted,#bdc8d7)}.b61s-b{font-weight:700}.b61s-rel{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;fill:none}.b61s-ring{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5}.b61s-pk{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:1.5}.b61s-pkt{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b61s-fk{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:1.5}.b61s-fkt{fill:var(--presentation-app,#86dfb0);font-weight:700}.b61s-tag{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b61s-real{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:1.5}.b61s-realt{fill:var(--presentation-real,#edcf8e);font-weight:700}.b61s-acc{fill:var(--presentation-accent,#ffad86)}.b61s-mark{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:7 5}.b61s-ptr{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:9 6}.b61s-ptrhead{fill:var(--presentation-accent,#ffad86)}.b61s-num{fill:var(--presentation-accent,#ffad86)}.b61s-numt{fill:var(--presentation-bg,#111827);font-weight:700}.b61s-strike{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2}svg[data-state="all"] .b61s-hide-all{display:none}svg[data-state="all"] .b61s-dim-all{opacity:.3}svg[data-state="all"] .b61s-hi-all .b61s-box{stroke:var(--presentation-accent,#ffad86);stroke-width:4}svg[data-state="all"] .b61s-hi-all .b61s-rel{stroke:var(--presentation-accent,#ffad86);stroke-width:5}svg[data-state="all"] .b61s-hi-all .b61s-ring{stroke:var(--presentation-accent,#ffad86);stroke-width:4}svg[data-state="all"] .b61s-rhi-all .b61s-col{fill:var(--presentation-accent,#ffad86);font-weight:700}</style><rect width="1200" height="300" class="b61s-bg"/><rect x="10" y="10" width="380" height="280" rx="14" class="b61s-box"/><g class=""><rect x="24" y="24" width="352" height="40" rx="20.0" class="b61s-real"/><text x="40" y="50.84" font-size="19" text-anchor="start" class="b61s-ink">실제 사례 · B6-1 공부방</text></g><text x="200" y="278" font-size="19" text-anchor="middle" class="b61s-muted b61s-b">다대다(N:M) → 연결 표</text><rect x="50" y="86" width="110" height="52" rx="10" class="b61s-box"/><text x="105" y="119.56" font-size="21" text-anchor="middle" class="b61s-ink b61s-b">학생</text><g class="" ><path d="M105 138 L105 200" class="b61s-rel"/><path d="M96 148 L114 148" class="b61s-rel"/><path d="M96 156 L114 156" class="b61s-rel"/><path d="M105 180 L115 200" class="b61s-rel"/><path d="M105 180 L105 200" class="b61s-rel"/><path d="M105 180 L95 200" class="b61s-rel"/><circle cx="105" cy="169" r="6" class="b61s-ring"/><text x="85" y="159.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">1</text><text x="83" y="191.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">N</text></g><rect x="240" y="86" width="110" height="52" rx="10" class="b61s-box"/><text x="295" y="119.56" font-size="21" text-anchor="middle" class="b61s-ink b61s-b">수업</text><g class="" ><path d="M295 138 L295 200" class="b61s-rel"/><path d="M286 148 L304 148" class="b61s-rel"/><path d="M286 156 L304 156" class="b61s-rel"/><path d="M295 180 L305 200" class="b61s-rel"/><path d="M295 180 L295 200" class="b61s-rel"/><path d="M295 180 L285 200" class="b61s-rel"/><circle cx="295" cy="169" r="6" class="b61s-ring"/><text x="315" y="159.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">1</text><text x="317" y="191.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">N</text></g><rect x="60" y="200" width="280" height="52" rx="10" class="b61s-box"/><text x="200" y="233.56" font-size="21" text-anchor="middle" class="b61s-ink b61s-b">수강</text><rect x="410" y="10" width="380" height="280" rx="14" class="b61s-box"/><g class=""><rect x="424" y="24" width="352" height="40" rx="20.0" class="b61s-tag"/><text x="440" y="50.84" font-size="19" text-anchor="start" class="b61s-ink">예시 · 블로그</text></g><text x="600" y="278" font-size="19" text-anchor="middle" class="b61s-muted b61s-b">일대다(1:N) → 바로 연결</text><rect x="545" y="86" width="110" height="52" rx="10" class="b61s-box"/><text x="600" y="119.56" font-size="21" text-anchor="middle" class="b61s-ink b61s-b">회원</text><g class="" ><path d="M600 138 L600 200" class="b61s-rel"/><path d="M591 148 L609 148" class="b61s-rel"/><path d="M591 156 L609 156" class="b61s-rel"/><path d="M600 180 L610 200" class="b61s-rel"/><path d="M600 180 L600 200" class="b61s-rel"/><path d="M600 180 L590 200" class="b61s-rel"/><circle cx="600" cy="169" r="6" class="b61s-ring"/><text x="620" y="159.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">1</text><text x="622" y="191.2" font-size="20" text-anchor="middle" class="b61s-muted b61s-b">N</text></g><rect x="545" y="200" width="110" height="52" rx="10" class="b61s-box"/><text x="600" y="233.56" font-size="21" text-anchor="middle" class="b61s-ink b61s-b">게시글</text><rect x="810" y="10" width="380" height="280" rx="14" class="b61s-box"/><text x="836" y="62" font-size="21" text-anchor="start" class="b61s-acc b61s-b">공통점</text><text x="836" y="100" font-size="25" text-anchor="start" class="b61s-ink b61s-b">표로 나누고</text><text x="836" y="136" font-size="25" text-anchor="start" class="b61s-ink b61s-b">선으로 잇는다</text><path d="M836 172 L1164 172" class="b61s-rel"/><text x="836" y="214" font-size="22" text-anchor="start" class="b61s-ink">다대다(N) 관계는</text><text x="836" y="250" font-size="22" text-anchor="start" class="b61s-ink b61s-b">연결 테이블로 표현할 수 있다.</text></svg>
