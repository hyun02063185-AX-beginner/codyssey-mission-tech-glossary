<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1034" viewBox="0 0 360 1034" data-state="compare" data-states="compare" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="student 13~15번을 enrollment와 연결하면, 수강 기록이 없는 15번 문태양은 INNER JOIN 결과에서 사라지고 LEFT JOIN 결과에는 수업 칸이 NULL인 채로 남는다. 전체 학생으로는 INNER 26행, LEFT 27행이다."><title>INNER JOIN 과 LEFT JOIN 의 차이</title><style>.b61s-bg{fill:var(--presentation-bg,#111827)}.b61s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b61s-cell{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:1.5}.b61s-head{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:1.5}.b61s-ink{fill:var(--presentation-ink,#eef2f7)}.b61s-muted{fill:var(--presentation-muted,#bdc8d7)}.b61s-b{font-weight:700}.b61s-rel{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;fill:none}.b61s-ring{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5}.b61s-pk{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:1.5}.b61s-pkt{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b61s-fk{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:1.5}.b61s-fkt{fill:var(--presentation-app,#86dfb0);font-weight:700}.b61s-tag{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b61s-real{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:1.5}.b61s-realt{fill:var(--presentation-real,#edcf8e);font-weight:700}.b61s-acc{fill:var(--presentation-accent,#ffad86)}.b61s-mark{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:7 5}.b61s-ptr{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-