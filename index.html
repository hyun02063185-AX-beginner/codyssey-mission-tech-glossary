<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코디세이 기술용어 사전</title>
    <script>
      try {
        const themes = ['forest', 'indigo', 'paper', 'signal'];
        const saved = localStorage.getItem('codyssey-accent-theme');
        document.documentElement.dataset.accentTheme = themes.includes(saved) ? saved : 'forest';
      } catch { document.documentElement.dataset.accentTheme = 'forest'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
