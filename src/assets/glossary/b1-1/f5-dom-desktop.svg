<svg xmlns="http://www.w3.org/2000/svg" width="600" height="570" viewBox="0 0 600 570" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="index.html 파일에는 nav class가 site-nav, 버튼 aria-expanded가 false로 적혀 있고 클릭해도 그대로다. 브라우저가 해석해 만든 DOM도 처음에는 같다. ☰ 클릭 뒤 JavaScript가 바꾼 DOM에서는 nav에 is-open이 붙고 aria-expanded가 true가 된다. 새로고침하면 파일에서 DOM을 다시 만들어 메뉴는 닫힌 채 시작한다. 개발자 도구 Elements 탭에 보이는 것은 지금의 DOM이다."><title>파일은 그대로, DOM이 바뀐다</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="600" height="570" class="b11s-bg"/><rect x="20" y="16" width="560" height="120" rx="12" class="b11s-box-h"/><rect x="35" y="33" width="26" height="26" rx="4" class="b11s-sh"/><text x="48" y="51" font-size="18" class="b11s-on" text-anchor="middle">H</text><text x="72" y="53" font-size="21" class="b11s-ink b11s-b">index.html 파일</text><text x="564" y="53" font-size="18" class="b11s-muted" text-anchor="end">그대로</text><text x="40" y="90" font-size="18" class="b11s-mono b11s-ink">&lt;nav class=&quot;site-nav&quot;&gt;</text><text x="40" y="122" font-size="18" class="b11s-mono b11s-ink">&lt;button aria-expanded=&quot;false&quot;&gt;</text><path d="M240 138V182" class="b11s-dash" marker-end="url(#b11s-a-m)"/><text x="256" y="167" font-size="18" class="b11s-muted">브라우저가 해석</text><rect x="20" y="186" width="560" height="120" rx="12" class="b11s-box"/><text x="40" y="223" font-size="21" class="b11s-ink b11s-b">DOM · 처음</text><text x="564" y="223" font-size="18" class="b11s-muted" text-anchor="end">파일을 해석해 만듦</text><text x="40" y="260" font-size="18" class="b11s-mono b11s-ink">nav.site-nav</text><text x="40" y="292" font-size="18" class="b11s-mono b11s-ink">button  aria-expanded=&quot;false&quot;</text><path d="M240 308V352" class="b11s-ln-acc" marker-end="url(#b11s-a-acc)"/><text x="256" y="337" font-size="18" class="b11s-acc">☰ 클릭 → JavaScript가 바꿈</text><rect x="20" y="356" width="560" height="120" rx="12" class="b11s-box-acc"/><text x="40" y="393" font-size="21" class="b11s-ink b11s-b">DOM · ☰ 클릭 뒤</text><text x="564" y="393" font-size="18" class="b11s-muted" text-anchor="end">바뀜</text><rect x="30" y="408" width="540" height="30" rx="6" class="b11s-tag"/><text x="40" y="430" font-size="18" class="b11s-mono b11s-acc">nav.site-nav.is-open</text><rect x="30" y="440" width="540" height="30" rx="6" class="b11s-tag"/><text x="40" y="462" font-size="18" class="b11s-mono b11s-acc">button  aria-expanded=&quot;true&quot;</text><text x="20" y="516" font-size="18" class="b11s-ink">새로고침하면 파일에서 DOM을 다시 만든다 → 메뉴는 닫힌 채 시작</text><text x="20" y="548" font-size="18" class="b11s-muted">개발자 도구 Elements 탭에 보이는 것은 지금의 DOM</text></svg>
