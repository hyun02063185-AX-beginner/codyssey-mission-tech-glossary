<svg xmlns="http://www.w3.org/2000/svg" width="360" height="980" viewBox="0 0 360 980" data-state="main" data-states="main" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="1 사용자가 ☰ 버튼을 누르면 click 이벤트가 생긴다. 2 미리 등록해 둔 JavaScript 함수(이벤트 핸들러)가 메뉴가 닫혀 있으면 열고, 열려 있으면 닫기로 판단한다. 3 DOM이 바뀐다: nav에 is-open이 붙고 버튼의 aria-expanded가 true가 된다. 4 브라우저가 바뀐 DOM에 맞는 CSS 규칙으로 다시 그려 메뉴가 보인다. HTML 파일은 그대로다. 다시 누르면 같은 과정으로 닫힌다. 교육용 단순화이며 자세한 6단계는 학습가이드 Ch4의 V04."><title>버튼 클릭에서 화면 변화까지</title><style>.b11s-bg{fill:var(--presentation-bg,#111827)}.b11s-box{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-box-h{fill:var(--presentation-real-soft,#403622);stroke:var(--presentation-real,#edcf8e);stroke-width:2.5}.b11s-box-c{fill:var(--presentation-python-soft,#203957);stroke:var(--presentation-python,#9cc8ff);stroke-width:2.5}.b11s-box-j{fill:var(--presentation-app-soft,#183f32);stroke:var(--presentation-app,#86dfb0);stroke-width:2.5}.b11s-box-acc{fill:var(--presentation-accent-soft,#4b2c26);stroke:var(--presentation-accent,#ffad86);stroke-width:3}.b11s-box-br{fill:var(--presentation-chip,#293549);stroke:var(--presentation-line,#64748b);stroke-width:2}.b11s-tag{fill:var(--presentation-panel,#1d2736);stroke:var(--presentation-accent,#ffad86);stroke-width:2}.b11s-ink{fill:var(--presentation-ink,#eef2f7)}.b11s-muted{fill:var(--presentation-muted,#bdc8d7)}.b11s-b{font-weight:700}.b11s-mono{font-family:'SF Mono','Menlo','Consolas','D2Coding',monospace}.b11s-th{fill:var(--presentation-real,#edcf8e);font-weight:700}.b11s-tc{fill:var(--presentation-python,#9cc8ff);font-weight:700}.b11s-tj{fill:var(--presentation-app,#86dfb0);font-weight:700}.b11s-acc{fill:var(--presentation-accent,#ffad86);font-weight:700}.b11s-sh{fill:var(--presentation-real,#edcf8e)}.b11s-sc{fill:var(--presentation-python,#9cc8ff)}.b11s-sj{fill:var(--presentation-app,#86dfb0)}.b11s-sacc{fill:var(--presentation-accent,#ffad86)}.b11s-on{fill:var(--presentation-on-strong,#111827);font-weight:700}.b11s-ln{stroke:var(--presentation-ink,#eef2f7);stroke-width:2.5;fill:none}.b11s-ln-acc{stroke:var(--presentation-accent,#ffad86);stroke-width:3;fill:none}.b11s-dash{stroke:var(--presentation-muted,#bdc8d7);stroke-width:2.5;stroke-dasharray:9 7;fill:none}.b11s-dot{stroke:var(--presentation-muted,#bdc8d7);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;fill:none}.b11s-lead{stroke:var(--presentation-muted,#bdc8d7);stroke-width:1.8;fill:none}.b11s-mk{fill:var(--presentation-ink,#eef2f7)}.b11s-mk-acc{fill:var(--presentation-accent,#ffad86)}.b11s-mk-m{fill:var(--presentation-muted,#bdc8d7)}.b11s-region{fill:none;stroke:var(--presentation-accent,#ffad86);stroke-width:3;stroke-dasharray:10 6}.b11s-pg{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.b11s-pg-bar{fill:#e2e8f0}.b11s-pg-ink{fill:#111111}.b11s-pg-muted{fill:#52606d}.b11s-pg-link{fill:#0000ee}.b11s-pg-u{stroke:#0000ee;stroke-width:1.5}.b11s-pg-gray{fill:#c7cbd1}.b11s-pg-btn{fill:#efefef;stroke:#767676;stroke-width:1.5}.b11s-pg-brand{fill:#0b6e4f}.b11s-pg-white{fill:#ffffff}.b11s-pg-soft{fill:#e6f2ec}.b11s-pg-dark{fill:#1f2933}.b11s-pg-skin{fill:#f4d2b3}.b11s-pg-hair{fill:#3a2e26}svg[data-state="main"] [class*="b11s-in-"]:not(.b11s-in-main){display:none}</style><defs><marker id="b11s-a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk"/></marker><marker id="b11s-a-acc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-acc"/></marker><marker id="b11s-a-m" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" class="b11s-mk-m"/></marker><marker id="b11s-a-accs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M12 0L0 6L12 12Z" class="b11s-mk-acc"/></marker></defs><rect width="360" height="980" class="b11s-bg"/><rect x="16" y="16" width="328" height="180" rx="12" class="b11s-box"/><circle cx="44" cy="48" r="15" class="b11s-sacc"/><text x="44" y="54" font-size="16" class="b11s-on" text-anchor="middle">1</text><text x="70" y="55" font-size="19" class="b11s-ink b11s-b">사용자</text><text x="32" y="102" font-size="17" class="b11s-ink">☰ 버튼을</text><text x="32" y="130" font-size="17" class="b11s-ink">누른다</text><text x="32" y="176" font-size="16" class="b11s-muted">click 이벤트</text><path d="M180 198V226" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="230" width="328" height="180" rx="12" class="b11s-box-j"/><circle cx="44" cy="262" r="15" class="b11s-sacc"/><text x="44" y="268" font-size="16" class="b11s-on" text-anchor="middle">2</text><path d="M312 244L330 262L312 280L294 262Z" class="b11s-sj"/><text x="312" y="267" font-size="16" class="b11s-on" text-anchor="middle">J</text><text x="70" y="269" font-size="19" class="b11s-ink b11s-b">JavaScript 처리</text><text x="32" y="316" font-size="17" class="b11s-ink">닫혀 있으면 → 연다</text><text x="32" y="344" font-size="17" class="b11s-ink">열려 있으면 → 닫는다</text><text x="32" y="390" font-size="16" class="b11s-muted">미리 등록한 함수 (이벤트 핸들러)</text><path d="M180 412V440" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="444" width="328" height="180" rx="12" class="b11s-box"/><circle cx="44" cy="476" r="15" class="b11s-sacc"/><text x="44" y="482" font-size="16" class="b11s-on" text-anchor="middle">3</text><text x="70" y="483" font-size="19" class="b11s-ink b11s-b">DOM이 바뀐다</text><text x="32" y="530" font-size="17" class="b11s-ink">nav에 is-open</text><text x="32" y="558" font-size="17" class="b11s-ink">aria-expanded=true</text><text x="32" y="604" font-size="16" class="b11s-muted">HTML 파일은 그대로</text><path d="M180 626V654" class="b11s-ln" marker-end="url(#b11s-a)"/><rect x="16" y="658" width="328" height="180" rx="12" class="b11s-box-br"/><circle cx="44" cy="690" r="15" class="b11s-sacc"/><text x="44" y="696" font-size="16" class="b11s-on" text-anchor="middle">4</text><text x="70" y="697" font-size="19" class="b11s-ink b11s-b">브라우저가 다시 그림</text><text x="32" y="744" font-size="17" class="b11s-ink">바뀐 DOM에 맞는</text><text x="32" y="772" font-size="17" class="b11s-ink">CSS 규칙으로 그림</text><text x="32" y="818" font-size="16" class="b11s-muted">→ 메뉴가 보인다</text><text x="16" y="892" font-size="16" class="b11s-muted">다시 누르면 같은 과정으로 닫힌다</text><text x="16" y="924" font-size="16" class="b11s-muted">입력 → 처리(판단) → 결과(화면)</text><text x="16" y="956" font-size="16" class="b11s-muted">교육용 단순화 · 6단계는 가이드 Ch4</text></svg>
