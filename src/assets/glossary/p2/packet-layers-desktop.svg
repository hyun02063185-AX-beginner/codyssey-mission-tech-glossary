<svg xmlns="http://www.w3.org/2000/svg" class="gvc-packet-layers" width="760" height="884" viewBox="0 0 760 884" role="img" aria-labelledby="gvc-packet-layers-d-title gvc-packet-layers-d-desc">
<title id="gvc-packet-layers-d-title">웹 요청 하나를 보내려면 — IP·TCP·HTTP의 역할</title>
<desc id="gvc-packet-layers-d-desc">B3-1을 바탕으로 단순화한 IPv4·TCP·HTTP 80 사례다. IP 패킷 안에 TCP 세그먼트, 그 안에 HTTP 요청 데이터의 일부가 포함된다. IP 헤더는 출발지 198.51.100.25와 목적지 203.0.113.10, TCP 헤더는 출발지 포트 51514와 목적지 포트 80을 가진다. 두 IP는 문서용 주소로 실제 접속 주소가 아니다. HTTP 요청 일부 GET /는 홈페이지 요청의 의미다. IP는 주소와 전달, TCP는 포트와 신뢰성 있는 전송, HTTP는 웹 요청의 의미를 맡는다. 라우터는 목적지 IP와 라우팅 정보, 방화벽과 Security Group은 IP·프로토콜·포트 허용 규칙을 활용한다. NAT는 필요한 주소·포트를 변환하며 웹 서버는 전달받은 HTTP 요청을 읽는다. 이 목록은 역할 비교이고 장비 통과 순서가 아니다. 한 HTTP 요청은 여러 TCP 세그먼트·IP 패킷으로 나뉠 수 있고 연결용 TCP 패킷에는 HTTP 데이터가 없을 수 있다. TCP는 암호화나 HTTP 성공을 보장하지 않는다. HTTP/3는 QUIC을 사용한다. 링크 계층과 MAC 주소는 생략했다.</desc>
<style>.gvc-packet-layers{font-family:var(--font-body,'Malgun Gothic','Noto Sans KR',sans-serif)}.gvc-packet-layers .ink{fill:var(--text-primary,#18241f)}.gvc-packet-layers .muted{fill:var(--text-secondary,#52645a)}.gvc-packet-layers .bold{font-weight:700}.gvc-packet-layers .mono{font-family:var(--font-mono,Consolas,monospace)}.gvc-packet-layers .bg,.gvc-packet-layers .box{fill:var(--surface-raised,#fff)}.gvc-packet-layers .box{stroke:var(--border-strong,#b5c7bd);stroke-width:1.5}.gvc-packet-layers .soft{fill:var(--surface-soft,#eef5ef);stroke:var(--border-strong,#b5c7bd)}.gvc-packet-layers .accent{fill:var(--surface-soft,#eef5ef);stroke:var(--accent-primary,#1d4d42);stroke-width:2}</style>
<rect width="760" height="884" class="bg"/>
<text x="20" y="36" font-size="24" class="ink bold">웹 요청 하나를 보내려면 — IP·TCP·HTTP의 역할</text>
<text x="20" y="70" font-size="18" class="muted">B3-1 기반 · IPv4 / TCP / HTTP 80 사례</text>
<text x="20" y="106" font-size="19" class="ink bold">A · 안에 담기는 정보</text>
<rect x="20" y="124" width="720" height="362" rx="10" class="accent"/>
<text x="36" y="154" font-size="20" class="ink bold">IP 패킷 (IP packet)</text>
<text x="36" y="182" font-size="18" class="ink">IP: 주소를 따라 목적지로 전달</text>
<text x="36" y="214" font-size="17" class="ink bold">IP 헤더 · 주소 정보</text>
<text x="36" y="244" font-size="18" class="ink">출발지 IP 198.51.100.25</text>
<text x="392" y="244" font-size="18" class="ink">목적지 IP 203.0.113.10</text>
<rect x="36" y="272" width="688" height="194" rx="10" class="box"/>
<text x="52" y="302" font-size="20" class="ink bold">TCP 세그먼트 (TCP segment)</text>
<text x="52" y="330" font-size="18" class="ink">TCP: 포트 구분 · 신뢰성 있는 전송</text>
<text x="52" y="362" font-size="17" class="ink bold">TCP 헤더 · 포트 정보</text>
<text x="52" y="392" font-size="18" class="ink">출발지 포트 51514</text>
<text x="392" y="392" font-size="18" class="ink">목적지 포트 80</text>
<rect x="52" y="410" width="656" height="40" rx="10" class="soft"/>
<text x="68" y="436" font-size="18" class="ink">HTTP 요청 일부: GET /  → “홈페이지를 주세요”</text>
<text x="20" y="530" font-size="19" class="ink bold">B · 누가 무엇을 활용할까?</text>
<text x="20" y="558" font-size="18" class="muted">역할 비교 · 장비를 통과하는 순서 아님</text>
<rect x="20" y="576" width="352" height="86" rx="10" class="soft"/>
<text x="32" y="602" font-size="17" class="ink bold">라우터 (Router)</text>
<text x="32" y="628" font-size="17" class="ink">목적지 IP + 라우팅 정보 → 다음 경로</text>
<rect x="388" y="576" width="352" height="86" rx="10" class="soft"/>
<text x="400" y="602" font-size="17" class="ink bold">방화벽 · Security Group</text>
<text x="400" y="628" font-size="17" class="ink">IP·프로토콜·포트 등 허용 규칙</text>
<rect x="20" y="676" width="352" height="86" rx="10" class="soft"/>
<text x="32" y="702" font-size="17" class="ink bold">주소 변환 (NAT)</text>
<text x="32" y="728" font-size="17" class="ink">필요한 IP 주소·포트를 변환</text>
<rect x="388" y="676" width="352" height="86" rx="10" class="soft"/>
<text x="400" y="702" font-size="17" class="ink bold">웹 서버 (Web server)</text>
<text x="400" y="728" font-size="17" class="ink">전달받은 HTTP 요청을 읽고 응답</text>
<text x="20" y="804" font-size="17" class="muted">한 HTTP 요청은 여러 TCP 세그먼트·IP 패킷으로 나뉠 수 있습니다.</text>
<text x="20" y="830" font-size="17" class="muted">연결용 TCP 패킷에는 HTTP가 없을 수 있습니다.</text>
<text x="20" y="856" font-size="17" class="muted">두 IP는 문서용으로 실제 접속 주소가 아닙니다. 링크 계층·MAC 주소는 생략했습니다.</text>
</svg>
