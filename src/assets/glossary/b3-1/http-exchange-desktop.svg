<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="glossary-http-desktop-title glossary-http-desktop-desc" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><title id="glossary-http-desktop-title">HTTP: 브라우저 요청과 웹 서버 응답</title><desc id="glossary-http-desktop-desc">브라우저는 HTTP Request GET /index.html을 웹 서버에 보내고 웹 서버는 HTTP Response 200 OK와 페이지 내용을 돌려줍니다. 요청과 응답의 메시지 의미를 정하는 규칙이며 TCP의 전송 역할과 다릅니다.</desc><rect width="960" height="440" rx="14" fill="#f5f8fc"/><text x="480.0" y="37" text-anchor="middle" font-size="29" fill="#172d43" font-weight="600">HTTP · 웹에서 쓰는 요청·응답 규칙</text><rect x="35" y="135" width="215" height="170" rx="10" fill="#e5efff" stroke="#71869c" stroke-width="2"/><rect x="710" y="135" width="215" height="170" rx="10" fill="#e5f5ed" stroke="#71869c" stroke-width="2"/><text x="142" y="201" text-anchor="middle" font-size="29" fill="#172d43" font-weight="600">브라우저</text><text x="142" y="240" text-anchor="middle" font-size="21" fill="#172d43" font-weight="500">웹 클라이언트</text><text x="818" y="201" text-anchor="middle" font-size="29" fill="#172d43" font-weight="600">웹 서버</text><text x="818" y="240" text-anchor="middle" font-size="21" fill="#172d43" font-weight="500">요청 처리</text><text x="480" y="125" text-anchor="middle" font-size="24" fill="#245fa4" font-weight="600">HTTP Request · 요청</text><text x="480" y="160" text-anchor="middle" font-size="24" fill="#245fa4" font-weight="600">GET /index.html</text><path d="M270 183 L690 183" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M681 177 L690 183 L681 189" fill="none" stroke="#245fa4" stroke-width="3"/><text x="480" y="245" text-anchor="middle" font-size="24" fill="#276443" font-weight="600">HTTP Response · 응답</text><text x="480" y="281" text-anchor="middle" font-size="24" fill="#276443" font-weight="600">200 OK · 페이지 내용</text><path d="M690 307 L270 307" fill="none" stroke="#276443" stroke-width="3"/><path d="M279 301 L270 307 L279 313" fill="none" stroke="#276443" stroke-width="3"/><text x="480" y="365" text-anchor="middle" font-size="23" fill="#172d43" font-weight="600">HTTP는 메시지의 의미를, TCP는 그 아래의 전달을 맡습니다.</text><text x="480" y="404" text-anchor="middle" font-size="19" fill="#172d43" font-weight="500">예시: GET 요청 성공 시 200 OK · TCP 자체가 HTTP 성공을 보장하지는 않습니다.</text></svg>
