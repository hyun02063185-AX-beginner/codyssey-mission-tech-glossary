<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="glossary-tcp-desktop-title glossary-tcp-desktop-desc" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><title id="glossary-tcp-desktop-title">TCP: 순서·수신 확인·누락 재전송</title><desc id="glossary-tcp-desktop-desc">송신자가 100바이트씩 세 조각을 보냅니다. 101~200이 누락되면 수신자는 다음 바이트 101을 기다립니다. 재전송 뒤 1~300을 순서대로 전달하고 ACK301을 보냅니다. 상대 바이트 번호 예시이며 연결 설정은 생략합니다.</desc><rect width="960" height="740" rx="14" fill="#f5f8fc"/><text x="480.0" y="34" text-anchor="middle" font-size="27" fill="#172d43" font-weight="600">TCP · 빠진 데이터를 다시 받고 순서대로</text><rect x="75" y="58" width="70" height="46" rx="10" fill="#e5efff" stroke="#71869c" stroke-width="2"/><rect x="815" y="58" width="70" height="46" rx="10" fill="#e5f5ed" stroke="#71869c" stroke-width="2"/><text x="110" y="87" text-anchor="middle" font-size="20" fill="#172d43" font-weight="600">송신자</text><text x="850" y="87" text-anchor="middle" font-size="20" fill="#172d43" font-weight="600">수신자</text><path d="M110 112V650 M850 112V650" stroke="#a5b3c1" stroke-width="2" stroke-dasharray="5 5"/><text x="480.0" y="145" text-anchor="middle" font-size="23" fill="#245fa4" font-weight="600">① 데이터 1–100 →</text><path d="M110 160 L850 160" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M841 154 L850 160 L841 166" fill="none" stroke="#245fa4" stroke-width="3"/><text x="480.0" y="216" text-anchor="middle" font-size="23" fill="#276443" font-weight="600">ACK 101 · 다음은 101</text><path d="M850 231 L110 231" fill="none" stroke="#276443" stroke-width="3"/><path d="M119 225 L110 231 L119 237" fill="none" stroke="#276443" stroke-width="3"/><text x="480.0" y="287" text-anchor="middle" font-size="23" fill="#ae3434" font-weight="600">② 데이터 101–200 · 누락</text><path d="M110 302 L850 302" fill="none" stroke="#ae3434" stroke-width="3" stroke-dasharray="7 5"/><path d="M841 296 L850 302 L841 308" fill="none" stroke="#ae3434" stroke-width="3"/><circle cx="480.0" cy="302" r="13" fill="#fff"/><path d="M472.0 294L488.0 310M488.0 294L472.0 310" stroke="#ae3434" stroke-width="3"/><text x="480.0" y="358" text-anchor="middle" font-size="23" fill="#245fa4" font-weight="600">③ 데이터 201–300 · 보관</text><path d="M110 373 L850 373" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M841 367 L850 373 L841 379" fill="none" stroke="#245fa4" stroke-width="3"/><text x="480.0" y="429" text-anchor="middle" font-size="23" fill="#276443" font-weight="600">ACK 101 · 아직 101을 기다림</text><path d="M850 444 L110 444" fill="none" stroke="#276443" stroke-width="3"/><path d="M119 438 L110 444 L119 450" fill="none" stroke="#276443" stroke-width="3"/><text x="480.0" y="500" text-anchor="middle" font-size="23" fill="#a84b16" font-weight="600">② 데이터 101–200 · 재전송</text><path d="M110 515 L850 515" fill="none" stroke="#a84b16" stroke-width="3"/><path d="M841 509 L850 515 L841 521" fill="none" stroke="#a84b16" stroke-width="3"/><text x="480.0" y="571" text-anchor="middle" font-size="23" fill="#276443" font-weight="600">ACK 301 · 1–300 수신 확인</text><path d="M850 586 L110 586" fill="none" stroke="#276443" stroke-width="3"/><path d="M119 580 L110 586 L119 592" fill="none" stroke="#276443" stroke-width="3"/><rect x="40" y="660" width="880" height="62" rx="10" fill="#fff" stroke="#71869c" stroke-width="2"/><text x="480.0" y="686" text-anchor="middle" font-size="20" fill="#172d43" font-weight="600">순서대로 1–300 전달 · 시간초과 등으로 재전송 · ACK는 다음에 받을 바이트 번호</text><text x="480.0" y="711" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">상대 바이트 번호 예시 · 연결 설정·흐름/혼잡 제어는 생략</text></svg>
