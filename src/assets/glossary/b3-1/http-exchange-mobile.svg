<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="glossary-http-mobile-title glossary-http-mobile-desc" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><title id="glossary-http-mobile-title">HTTP: 브라우저 요청과 웹 서버 응답</title><desc id="glossary-http-mobile-desc">브라우저는 HTTP Request GET /index.html을 웹 서버에 보내고 웹 서버는 HTTP Response 200 OK와 페이지 내용을 돌려줍니다. 요청과 응답의 메시지 의미를 정하는 규칙이며 TCP의 전송 역할과 다릅니다.</desc><rect width="360" height="620" rx="14" fill="#f5f8fc"/><text x="180.0" y="37" text-anchor="middle" font-size="18" fill="#172d43" font-weight="600">HTTP · 웹에서 쓰는 요청·응답 규칙</text><rect x="70" y="80" width="220" height="100" rx="10" fill="#e5efff" stroke="#71869c" stroke-width="2"/><rect x="70" y="405" width="220" height="100" rx="10" fill="#e5f5ed" stroke="#71869c" stroke-width="2"/><text x="180" y="118" text-anchor="middle" font-size="23" fill="#172d43" font-weight="600">브라우저</text><text x="180" y="150" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">웹 클라이언트</text><text x="180" y="445" text-anchor="middle" font-size="23" fill="#172d43" font-weight="600">웹 서버</text><text x="180" y="478" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">요청 처리 · 페이지 응답</text><path d="M70 145H26V455H64" fill="none" stroke="#245fa4" stroke-width="3"/><path d="m55 449 9 6-9 6" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M290 455H334V130H296" fill="none" stroke="#276443" stroke-width="3"/><path d="m305 124-9 6 9 6" fill="none" stroke="#276443" stroke-width="3"/><text x="104" y="252" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">요청 ↓</text><text x="104" y="281" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">HTTP Request</text><text x="104" y="310" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">GET</text><text x="104" y="339" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">/index.html</text><text x="254" y="252" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">응답 ↑</text><text x="254" y="281" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">HTTP Response</text><text x="254" y="310" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">200 OK</text><text x="254" y="339" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">페이지 내용</text><text x="180" y="550" text-anchor="middle" font-size="18" fill="#172d43" font-weight="600">HTTP는 메시지의 의미를 정합니다.</text><text x="180" y="580" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">TCP의 전달 역할과 구별하세요.</text></svg>
