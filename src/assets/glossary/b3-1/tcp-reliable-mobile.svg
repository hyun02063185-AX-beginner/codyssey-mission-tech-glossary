<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" role="img" aria-labelledby="glossary-tcp-mobile-title glossary-tcp-mobile-desc" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><title id="glossary-tcp-mobile-title">TCP: 순서·수신 확인·누락 재전송</title><desc id="glossary-tcp-mobile-desc">송신자가 100바이트씩 세 조각을 보냅니다. 101~200이 누락되면 수신자는 다음 바이트 101을 기다립니다. 재전송 뒤 1~300을 순서대로 전달하고 ACK301을 보냅니다. 상대 바이트 번호 예시이며 연결 설정은 생략합니다.</desc><rect width="360" height="800" rx="14" fill="#f5f8fc"/><text x="180.0" y="34" text-anchor="middle" font-size="18" fill="#172d43" font-weight="600">TCP · 빠진 데이터를 다시 받고 순서대로</text><rect x="8" y="58" width="70" height="46" rx="10" fill="#e5efff" stroke="#71869c" stroke-width="2"/><rect x="282" y="58" width="70" height="46" rx="10" fill="#e5f5ed" stroke="#71869c" stroke-width="2"/><text x="43" y="87" text-anchor="middle" font-size="18" fill="#172d43" font-weight="600">송신자</text><text x="317" y="87" text-anchor="middle" font-size="18" fill="#172d43" font-weight="600">수신자</text><path d="M43 112V650 M317 112V650" stroke="#a5b3c1" stroke-width="2" stroke-dasharray="5 5"/><text x="180.0" y="145" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">① 데이터 1–100 →</text><path d="M43 160 L317 160" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M308 154 L317 160 L308 166" fill="none" stroke="#245fa4" stroke-width="3"/><text x="180.0" y="216" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">ACK 101 · 다음은 101</text><path d="M317 231 L43 231" fill="none" stroke="#276443" stroke-width="3"/><path d="M52 225 L43 231 L52 237" fill="none" stroke="#276443" stroke-width="3"/><text x="180.0" y="287" text-anchor="middle" font-size="18" fill="#ae3434" font-weight="600">② 데이터 101–200 · 누락</text><path d="M43 302 L317 302" fill="none" stroke="#ae3434" stroke-width="3" stroke-dasharray="7 5"/><path d="M308 296 L317 302 L308 308" fill="none" stroke="#ae3434" stroke-width="3"/><circle cx="180.0" cy="302" r="13" fill="#fff"/><path d="M172.0 294L188.0 310M188.0 294L172.0 310" stroke="#ae3434" stroke-width="3"/><text x="180.0" y="358" text-anchor="middle" font-size="18" fill="#245fa4" font-weight="600">③ 데이터 201–300 · 보관</text><path d="M43 373 L317 373" fill="none" stroke="#245fa4" stroke-width="3"/><path d="M308 367 L317 373 L308 379" fill="none" stroke="#245fa4" stroke-width="3"/><text x="180.0" y="429" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">ACK 101 · 아직 101을 기다림</text><path d="M317 444 L43 444" fill="none" stroke="#276443" stroke-width="3"/><path d="M52 438 L43 444 L52 450" fill="none" stroke="#276443" stroke-width="3"/><text x="180.0" y="500" text-anchor="middle" font-size="18" fill="#a84b16" font-weight="600">② 데이터 101–200 · 재전송</text><path d="M43 515 L317 515" fill="none" stroke="#a84b16" stroke-width="3"/><path d="M308 509 L317 515 L308 521" fill="none" stroke="#a84b16" stroke-width="3"/><text x="180.0" y="571" text-anchor="middle" font-size="18" fill="#276443" font-weight="600">ACK 301 · 1–300 수신 확인</text><path d="M317 586 L43 586" fill="none" stroke="#276443" stroke-width="3"/><path d="M52 580 L43 586 L52 592" fill="none" stroke="#276443" stroke-width="3"/><rect x="16" y="660" width="328" height="118" rx="10" fill="#fff" stroke="#71869c" stroke-width="2"/><text x="180.0" y="684" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">수신자는 1–300을 순서대로 전달</text><text x="180.0" y="709" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">시간초과 등으로 누락을 감지해 재전송</text><text x="180.0" y="734" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">ACK = 다음에 받을 바이트 번호</text><text x="180.0" y="759" text-anchor="middle" font-size="18" fill="#172d43" font-weight="500">상대 번호 예시 · 연결 설정은 생략</text></svg>
