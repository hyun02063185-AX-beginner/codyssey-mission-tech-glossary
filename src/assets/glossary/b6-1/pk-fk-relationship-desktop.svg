<svg xmlns="http://www.w3.org/2000/svg" class="gvb6" viewBox="0 0 520 446" width="520" height="446" role="img" aria-labelledby="gvb6-pkfk-d-title gvb6-pkfk-d-desc">
<title id="gvb6-pkfk-d-title">PK와 FK: 값으로 정확히 가리키기</title>
<desc id="gvb6-pkfk-d-desc">B6-1 사례 데이터 일부로 그린 그림이다. 왼쪽은 자식 표 enrollment(수강), 오른쪽은 부모 표 student(학생)다. student의 id 열이 PK(기본 키)로, 값 1은 김민준, 2는 이서연을 하나로 구별한다. enrollment의 student_id 열이 FK(외래 키)다. enrollment 1번과 2번 행의 student_id는 1이라 김민준 행을 가리키고, 3번 행의 student_id는 2라 이서연 행을 가리킨다. 점선 화살표는 FK 값이 PK 값을 가리키는 관계이며 실행 순서가 아니다. 김민준 한 명을 수강 기록 두 행이 가리키므로 1:N 관계다. 아래에는 교육용 예시로 student_id가 99인 새 행을 넣으려는 경우를 그렸다. student 표에 99번이 없으므로 FK 제약이 입력을 거부한다. FK는 값을 복사해 오는 기능이 아니라 다른 표의 행을 가리키는 열이다. FK는 보통 PK를, 경우에 따라 UNIQUE 키를 가리킨다.</desc>
<style>
.gvb6{font-family:var(--font-body,'Pretendard VF','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',system-ui,sans-serif)}
.gvb6 .bg{fill:var(--surface-raised,#fff)}
.gvb6 .t{fill:var(--text-primary,#18241f)}
.gvb6 .s{fill:var(--text-secondary,#52645a)}
.gvb6 .b{font-weight:700}
.gvb6 .m{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace)}
.gvb6 .box{fill:var(--surface-raised,#fff);stroke:var(--border-strong,#b5c7bd);stroke-width:1.5}
.gvb6 .head{fill:var(--surface-soft,#eef5ef)}
.gvb6 .note{fill:var(--surface-soft,#eef5ef);stroke:var(--border-default,#d5ddd7);stroke-width:1}
.gvb6 .rule{stroke:var(--border-default,#d5ddd7);stroke-width:1}
.gvb6 .ln{fill:none;stroke:var(--text-primary,#18241f);stroke-width:1.6}
.gvb6 .ref{fill:none;stroke:#8a4b00;stroke-width:1.8;stroke-dasharray:6 4}
.gvb6 .refbad{fill:none;stroke:#9b2c22;stroke-width:1.8;stroke-dasharray:3 4}
.gvb6 .hit{fill:none;stroke:#8a4b00;stroke-width:2.2}
.gvb6 .gone{fill:none;stroke:#9b2c22;stroke-width:2;stroke-dasharray:5 4}
.gvb6 .kept{fill:none;stroke:#1a6b43;stroke-width:2.2;stroke-dasharray:5 4}
.gvb6 .pk{fill:#173e35} .gvb6 .fk{fill:#8a4b00} .gvb6 .on{fill:#fff}
.gvb6 .bad{fill:#9b2c22} .gvb6 .ok{fill:#1a6b43} .gvb6 .fkt{fill:#8a4b00}
</style>
<defs><marker id="gvb6-pkfk-d-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#8a4b00"/></marker></defs>
<rect class="bg" width="520" height="446"/>
<text x="16" y="30" font-size="18" class="t b">PK와 FK: 값으로 정확히 가리키기</text>
<text x="16" y="52" font-size="13" class="s">B6-1 사례 데이터 일부 · enrollment의 course_id 등 열 생략</text>
<text x="12" y="90" font-size="14" class="t b">enrollment (자식 표)</text>
<text x="348" y="90" font-size="14" class="t b">student (부모 표)</text>
<rect x="12" y="100" width="196" height="114" rx="8" class="box"/>
<rect x="12.75" y="100.75" width="194.5" height="29.25" rx="7" class="head"/>
<line x1="12" y1="130" x2="208" y2="130" class="rule"/>
<text x="22" y="120" font-size="14" class="t b m">id</text>
<rect x="45" y="107" width="26" height="18" rx="5" class="pk"/>
<text x="58" y="121" font-size="12" class="on b" text-anchor="middle">PK</text>
<text x="78" y="120" font-size="14" class="t b m">student_id</text>
<rect x="168" y="107" width="26" height="18" rx="5" class="fk"/>
<text x="181" y="121" font-size="12" class="on b" text-anchor="middle">FK</text>
<text x="22" y="149" font-size="14" class="t m">1</text>
<rect x="71" y="133" width="134" height="22" rx="5" class="hit"/>
<text x="78" y="149" font-size="14" class="t m">1</text>
<line x1="12" y1="158" x2="208" y2="158" class="rule"/>
<text x="22" y="177" font-size="14" class="t m">2</text>
<rect x="71" y="161" width="134" height="22" rx="5" class="hit"/>
<text x="78" y="177" font-size="14" class="t m">1</text>
<line x1="12" y1="186" x2="208" y2="186" class="rule"/>
<text x="22" y="205" font-size="14" class="t m">3</text>
<rect x="71" y="189" width="134" height="22" rx="5" class="hit"/>
<text x="78" y="205" font-size="14" class="t m">2</text>
<rect x="348" y="100" width="160" height="86" rx="8" class="box"/>
<rect x="348.75" y="100.75" width="158.5" height="29.25" rx="7" class="head"/>
<line x1="348" y1="130" x2="508" y2="130" class="rule"/>
<text x="358" y="120" font-size="14" class="t b m">id</text>
<rect x="381" y="107" width="26" height="18" rx="5" class="pk"/>
<text x="394" y="121" font-size="12" class="on b" text-anchor="middle">PK</text>
<text x="414" y="120" font-size="14" class="t b m">name</text>
<rect x="351" y="133" width="50" height="22" rx="5" class="hit"/>
<text x="358" y="149" font-size="14" class="t m">1</text>
<text x="414" y="149" font-size="14" class="t">김민준</text>
<line x1="348" y1="158" x2="508" y2="158" class="rule"/>
<rect x="351" y="161" width="50" height="22" rx="5" class="hit"/>
<text x="358" y="177" font-size="14" class="t m">2</text>
<text x="414" y="177" font-size="14" class="t">이서연</text>
<path d="M208 144.0 C277.0 144.0 277.0 141.5 346 141.5" class="ref" marker-end="url(#gvb6-pkfk-d-arr)"/>
<path d="M208 172.0 C277.0 172.0 277.0 146.5 346 146.5" class="ref" marker-end="url(#gvb6-pkfk-d-arr)"/>
<path d="M208 200.0 C277.0 200.0 277.0 172.0 346 172.0" class="ref" marker-end="url(#gvb6-pkfk-d-arr)"/>
<text x="348" y="208" font-size="13" class="s">김민준(1)을 두 행이</text>
<text x="348" y="226" font-size="13" class="s">가리킴 → 1:N</text>
<text x="212" y="72" font-size="13" class="fkt b">점선 화살표 = 가리킴 (실행 순서 아님)</text>
<rect x="12" y="240" width="196" height="28" rx="6" class="gone"/>
<text x="22" y="259" font-size="14" class="t m">4</text>
<text x="78" y="259" font-size="14" class="bad b m">99</text>
<path d="M208 254 L322 254" class="refbad"/>
<text x="334" y="260" font-size="18" class="bad b" text-anchor="middle">✕</text>
<text x="12" y="290" font-size="13" class="bad b">교육용 예시: student_id 99인 행을 새로 넣으면?</text>
<text x="12" y="310" font-size="13" class="t">student에 99번이 없으므로 FK 제약이 입력을 거부한다</text>
<rect x="14" y="338" width="26" height="18" rx="5" class="pk"/>
<text x="27" y="352" font-size="12" class="on b" text-anchor="middle">PK</text>
<text x="50" y="351" font-size="14" class="t b">기본 키: 표 안에서 행 하나를 구별하는 값</text>
<text x="50" y="371" font-size="13" class="s">같은 값이 두 번 나올 수 없고, 비워 둘 수 없다</text>
<rect x="14" y="388" width="26" height="18" rx="5" class="fk"/>
<text x="27" y="402" font-size="12" class="on b" text-anchor="middle">FK</text>
<text x="50" y="401" font-size="14" class="t b">외래 키: 다른 표의 키 값을 담아 그 행을 가리키는 열</text>
<text x="50" y="421" font-size="13" class="s">값을 복사해 오는 기능이 아니다 · 보통 PK, 경우에 따라 UNIQUE 키를 가리킨다</text>
</svg>
