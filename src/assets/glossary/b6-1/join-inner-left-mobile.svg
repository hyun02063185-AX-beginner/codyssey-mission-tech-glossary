<line x1="8" y1="398" x2="312" y2="398" class="rule"/>
<text x="18" y="388" font-size="14" class="t b m">id</text>
<text x="70" y="388" font-size="14" class="t b m">student_id</text>
<text x="200" y="388" font-size="14" class="t b m">course_id</text>
<text x="18" y="417" font-size="14" class="t m">1</text>
<text x="70" y="417" font-size="14" class="t m">1</text>
<text x="200" y="417" font-size="14" class="t m">1</text>
<line x1="8" y1="426" x2="312" y2="426" class="rule"/>
<text x="18" y="445" font-size="14" class="t m">2</text>
<text x="70" y="445" font-size="14" class="t m">1</text>
<text x="200" y="445" font-size="14" class="t m">2</text>
<line x1="8" y1="454" x2="312" y2="454" class="rule"/>
<text x="18" y="473" font-size="14" class="t m">3</text>
<text x="70" y="473" font-size="14" class="t m">2</text>
