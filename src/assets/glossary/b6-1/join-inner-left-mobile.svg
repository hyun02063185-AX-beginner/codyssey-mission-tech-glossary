<svg xmlns="http://www.w3.org/2000/svg" class="gvb6" viewBox="0 0 320 1204" width="320" height="1204" role="img" aria-labelledby="gvb6-join-m-title gvb6-join-m-desc">
<title id="gvb6-join-m-title">INNER JOIN과 LEFT JOIN: 같은 데이터, 다른 결과</title>
<desc id="gvb6-join-m-desc">B6-1 사례 데이터 중 학생 3명과 그 수강 기록으로 그린 그림이다. 연결 조건은 student.id = enrollment.student_id다. 왼쪽 표 student에는 열 id와 name만 보였고 1 김민준, 2 이서연, 15 문태양이 있다. 오른쪽 표 enrollment에는 id 1부터 4까지 네 행이 있고, 김민준(1)의 수강이 course_id 1과 2, 이서연(2)의 수강이 course_id 1과 3이다. 문태양(15)과 짝이 맞는 행은 없다. student 표 바깥에 설명용 집계로 짝 수를 적었다. 김민준 2건, 이서연 2건, 문태양 0건이며 이 값은 student 표의 열이 아니다. INNER JOIN 결과는 4행이다. 김민준 1, 김민준 2, 이서연 1, 이서연 3. 짝이 두 개인 학생은 결과에 두 번 나온다. 문태양은 짝이 없어 결과에서 빠진다. LEFT JOIN 결과는 5행이다. INNER JOIN의 4행에 더해 문태양이 남고, 짝이 없는 오른쪽 열 course_id는 NULL이 된다. 왼쪽 3행이 INNER 4행, LEFT 5행이 되듯 결과 행 수는 원본 행 수와 다를 수 있다. JOIN은 조회 결과만 만들며 원래 표는 바뀌지 않는다.</desc>
<style>
